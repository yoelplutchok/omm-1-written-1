<title>Cardio-Pulm 1 Questions</title>
<meta name="robots" content="noindex">
<style>
/* Same paper, type and subject colours as the Cardio-Pulm 1 flashcards. Home = lessons grouped by subject;
   lesson = its numbered sections; study = one section (or lesson) of three-choice questions running down the page,
   numbered from 1 in each section, with the card's More + Pictures dropdowns under each answer. */
:root{
  --bg:#faf8f4; --panel:#ffffff; --ink:#1d1b16; --mut:#6f6a5e; --line:#e3ddd0; --soft:#f1ece1; --chip:#ece7db;
  --phys:#2f6b8f; --hist:#8a4b2a; --bio:#4a3b7a; --anat:#2f6b45; --acc:#2f6b8f;
  --hy:#fdf7dc; --hyb:#cfa92f; --hyt:#6b5410; --cp2:#8a8170;
  --serif:Charter,"Iowan Old Style","Source Serif Pro",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151a; --panel:#1b1e25; --ink:#e9e6df; --mut:#9b968b; --line:#2c313a; --soft:#232730; --chip:#262b35;
  --phys:#7fb8d8; --hist:#d39168; --bio:#a99ad8; --anat:#74b58d; --acc:#7fb8d8;
  --hy:#2c2714; --hyb:#8d7629; --hyt:#e8d394; --cp2:#8f887a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151a; --panel:#1b1e25; --ink:#e9e6df; --mut:#9b968b; --line:#2c313a; --soft:#232730; --chip:#262b35;
  --phys:#7fb8d8; --hist:#d39168; --bio:#a99ad8; --anat:#74b58d; --acc:#7fb8d8;
  --hy:#2c2714; --hyb:#8d7629; --hyt:#e8d394; --cp2:#8f887a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.6 var(--serif);margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:18px}
button{font:500 14px/1 var(--sans);color:inherit;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--line)}
button:focus-visible,summary:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select{font:500 14px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:600 18px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font:12.5px var(--sans)}
#themeBtn{margin-left:auto;padding:5px 10px;font-size:12.5px}
nav.subj{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav.subj button.on{color:var(--bg)}
nav.subj button.on[data-k=all]{background:var(--acc)} nav.subj button.on[data-k=phys]{background:var(--phys)}
nav.subj button.on[data-k=hist]{background:var(--hist)} nav.subj button.on[data-k=bio]{background:var(--bio)}
nav.subj button.on[data-k=anat]{background:var(--anat)}

.phys{--c:var(--phys)} .hist{--c:var(--hist)} .bio{--c:var(--bio)} .anat{--c:var(--anat)}

/* home */
#home{padding-block:22px 60px}
.intro{color:var(--mut);font:14px/1.55 var(--sans);margin:0 0 22px;max-width:62ch}
.sect{margin-bottom:30px}
.sect h2{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin:0 0 10px}
.sect h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sect h2 .ct{color:var(--mut);font-weight:500;letter-spacing:.04em}
.sect h2 button{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;padding:5px 11px}
.lessons{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px 10px 10px 4px;padding:13px 16px;font:inherit;color:inherit}
.lrow:hover{border-color:var(--c)}
.lrow .lt{font:600 17px/1.3 var(--serif);min-width:0;text-wrap:balance}
.lrow .lm{font:12px/1.4 var(--sans);color:var(--mut);grid-column:1}
.lrow .lc{grid-row:1/3;grid-column:2;text-align:right;font:500 12px/1.3 var(--sans);color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow .lc b{display:block;font:600 18px/1.1 var(--sans);color:var(--ink)}
.lrow .lp{grid-column:1/-1;height:3px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:6px}
.lrow .lp i{display:block;height:100%;background:var(--c)}
.cp2tag{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--cp2);border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin-left:6px;vertical-align:2px}

/* study */
#study{padding-block:16px 120px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.top .back{padding:6px 11px}
.top select{flex:1 1 180px;min-width:0}
.top button[aria-pressed="true"]{background:var(--c);color:var(--bg)}
.ltitle{font:600 12px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--c);margin:0 0 2px}
.posrow{display:flex;align-items:center;gap:12px;font:500 12.5px var(--sans);color:var(--mut);font-variant-numeric:tabular-nums;margin-bottom:18px}
.bar{flex:1;height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .2s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 26px 22px}
@media (max-width:560px){.card{padding:20px 18px}.wrap{padding-inline:16px}}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.eyebrow .tp{color:var(--c)}
.hyb{font:600 10px/1 var(--sans);letter-spacing:.07em;color:var(--hyt);background:var(--hy);border:1px solid var(--hyb);border-radius:999px;padding:3px 7px}
.q{font:600 clamp(20px,4.6vw,24px)/1.35 var(--serif);margin:0 0 20px;text-wrap:balance;letter-spacing:-.01em}
.flip{width:100%;padding:16px;border:1.5px dashed var(--line);background:transparent;border-radius:10px;font:600 15px var(--sans);color:var(--c)}
.flip span{font:500 12px var(--sans);color:var(--mut);margin-left:8px}
.ans{background:var(--soft);border-left:4px solid var(--c);border-radius:0 10px 10px 0;padding:14px 18px;font:650 clamp(18px,4.2vw,21px)/1.45 var(--sans);color:var(--ink)}
.ans sub,.ans sup{font-size:.7em}
.drops{display:grid;gap:8px;margin-top:14px}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
summary{cursor:pointer;padding:10px 14px;font:600 13.5px var(--sans);color:var(--mut);list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary .n{font-weight:500;opacity:.8}
.more{padding:0 16px 14px;font-size:15.5px;line-height:1.6}
.more p{margin:0 0 10px}.more p:last-child{margin-bottom:0}
.more ul,.more ol{margin:0 0 10px;padding-left:20px}.more li{margin:3px 0}
.more .tw{overflow-x:auto}
.more table{border-collapse:collapse;font:14px/1.45 var(--sans);margin:4px 0 8px;min-width:100%}
.more th,.more td{text-align:left;vertical-align:top;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
.more th{font-weight:600}
.pics{display:grid;gap:14px;padding:0 14px 14px}
.pics figure{margin:0;min-width:0}
.pics img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.pics figcaption{font:11.5px/1.45 var(--sans);color:var(--mut);margin-top:6px;text-align:center}
.star{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:600 15px/1 var(--sans);color:var(--mut);letter-spacing:0;text-transform:none}
.star[aria-pressed="true"]{color:var(--hyb);border-color:var(--hyb);background:var(--hy)}
.lrow .ls{color:var(--hyb);font-weight:600;margin-left:6px}
.starbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--hyb);border-radius:4px 10px 10px 4px;padding:12px 16px;margin:0 0 26px;font:14px var(--sans)}
.starbar b{font-weight:600}.starbar .sync{color:var(--mut);font-size:12px}
.starbar button{margin-left:auto;background:var(--hy);border-color:var(--hyb);color:var(--hyt);font-weight:600}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.lhead h2{font:600 22px/1.25 var(--serif);margin:6px 0 2px;flex-basis:100%;text-wrap:balance}
.lhead .lm{font:13px var(--sans);color:var(--mut);flex-basis:100%}
.lacts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.lacts .go{background:var(--c);color:var(--bg);font-weight:600}
.lacts .rs{background:var(--hy);border-color:var(--hyb);color:var(--hyt);font-weight:600}
.trow{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px 10px 10px 4px}
.trow:hover{border-color:var(--c)}
.trow .tm{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;background:transparent;border:0;border-radius:0;padding:12px 14px;font:inherit;color:inherit}
.trow .tn{grid-row:1/3;font:600 13px/1 var(--sans);color:var(--c);font-variant-numeric:tabular-nums;min-width:1.4em}
.trow .tt{font:600 16px/1.3 var(--serif);min-width:0}
.trow .tc{grid-row:1/3;grid-column:3;font:500 12px/1.3 var(--sans);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.trow .tp2{grid-column:2;height:3px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:6px}
.trow .tp2 i{display:block;height:100%;background:var(--c)}
.trow .tr{flex:none;align-self:center;margin:0 10px 0 0;padding:6px 11px;font-size:13px;font-weight:600;background:var(--hy);border:1px solid var(--hyb);color:var(--hyt)}
.empty{color:var(--mut);font:14px var(--sans);text-align:center;padding:30px 10px}
.endcard{text-align:center;padding:34px 20px}
.endcard p{color:var(--mut);font:14px var(--sans);margin:6px 0 18px}
.endcard h3{font:600 22px var(--serif);margin:0}
.endcard .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.endcard .go{background:var(--c);color:var(--bg)}
nav.foot{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
nav.foot .in{max-width:780px;margin:0 auto;display:flex;gap:8px}
nav.foot button{flex:1;border-radius:10px;padding:12px 8px;font-size:15px}
nav.foot .nx{background:var(--c);color:var(--bg);font-weight:600}
.keys{font:12px var(--sans);color:var(--mut);text-align:center;margin-top:12px}
@media (max-width:560px){.keys{display:none}}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
#lb img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
#lb button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:#222;color:#fff;border-color:#555}
@media (prefers-reduced-motion:reduce){.bar i,summary::before{transition:none}}

/* ---- multiple choice additions (same tokens as above, plus right/wrong colours) ---- */
:root{ --ok:#2e7148; --okbg:#e7f2ea; --bad:#a8382c; --badbg:#f8e6e2; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --ok:#7cc79a; --okbg:#1a2b21; --bad:#ef8c80; --badbg:#35201e; }}
:root[data-theme="dark"]{ --ok:#7cc79a; --okbg:#1a2b21; --bad:#ef8c80; --badbg:#35201e; }

.lrow .lm b,.trow .tc b{color:var(--ink);font-weight:600}
.reviewbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.starbar .reviewbar button{margin-left:0}
.starbar .miss{background:var(--badbg);border-color:var(--bad);color:var(--bad)}

/* study list: questions flow down the page, numbered from 1 in each section */
.qlist{display:grid;gap:14px}
.lsep{font:600 22px/1.25 var(--serif);margin:26px 0 0;text-wrap:balance}
.lsep small{display:block;font:600 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.ssep{display:flex;align-items:baseline;gap:10px;margin:18px 0 0;padding:10px 14px;background:var(--soft);border-left:3px solid var(--c);border-radius:4px 10px 10px 4px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.ssep .sn{font:600 13px/1 var(--sans);color:var(--c);font-variant-numeric:tabular-nums}
.ssep h3{flex:1;min-width:0;font:600 17px/1.3 var(--serif);margin:0;text-wrap:balance}
.ssep .sc{font:500 12px/1.3 var(--sans);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.card.mc{padding:20px 22px 18px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
@media (max-width:560px){.card.mc{padding:18px 16px 16px}}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;background:var(--c);color:var(--bg);font:700 13px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:0}
.card.mc .q{font-size:clamp(18px,4.3vw,21px);margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font:500 16px/1.45 var(--sans);color:var(--ink)}
.opt sub,.opt sup{font-size:.7em}
.opt .ol{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font:600 13px/1 var(--sans);color:var(--mut);margin-top:-1px}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .mk{display:none;align-self:center;font:700 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.mc:not(.done) .opt:hover{border-color:var(--c)}
.mc:not(.done) .opt:active{background:var(--soft)}
.mc.done .opt{cursor:default}
.mc.done .opt.is-ans{border-color:var(--ok);background:var(--okbg)}
.mc.done .opt.is-ans .ol{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.mc.done .opt.is-ans .mk{display:inline;color:var(--ok)}
.mc.done .opt.picked:not(.is-ans){border-color:var(--bad);background:var(--badbg)}
.mc.done .opt.picked:not(.is-ans) .ol{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.mc.done .opt.picked:not(.is-ans) .mk{display:inline;color:var(--bad)}
.mc.done .opt:not(.is-ans):not(.picked){opacity:.72}
.res{display:none;margin-top:12px}
.mc.done .res{display:block}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 14.5px var(--sans);margin:0}
.verdict.right{color:var(--ok)} .verdict.wrong{color:var(--bad)}
.verdict button{margin-left:auto;font-size:12.5px;padding:5px 11px}
.res .drops{margin-top:10px}
.mc.peek:not(.done) .opt.is-ans{border-color:var(--ok);background:var(--okbg)}
.mc.peek:not(.done) .opt.is-ans .ol{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.mc.peek:not(.done) .opt.is-ans .mk{display:inline;color:var(--ok)}
.mc.peek:not(.done) .res{display:block}
.mc.peek:not(.done) .verdict{display:none}
.top button.miss[aria-pressed="true"]{background:var(--bad);color:var(--panel)}
.posrow b{color:var(--ink);font-weight:600}
.endcard .rs{background:var(--hy);border-color:var(--hyb);color:var(--hyt);font-weight:600}
.endcard .score{font:600 34px/1.1 var(--sans);color:var(--c);margin:10px 0 0;font-variant-numeric:tabular-nums}
.armed{background:var(--bad)!important;color:var(--panel)!important}
.lp i,.tp2 i{transition:width .2s}
@media (prefers-reduced-motion:reduce){.lp i,.tp2 i{transition:none}}
body.studying nav.subj{display:none}
@media (max-width:560px){.mc.done .opt .mk,.mc.peek .opt .mk{display:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="hrow"><h1>Cardio-Pulm 1 &middot; Multiple choice</h1><span class="sub" id="hsub"></span><button id="themeBtn" type="button" aria-label="Switch light or dark">◐ Theme</button></div>
    <nav class="subj" id="subj"></nav>
  </div>
</header>

<main>
  <section id="home" class="wrap"></section>
  <section id="study" class="wrap" hidden></section>
</main>

<script>
const DATA = __DATA__;
</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem('cp1mc.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem('cp1mc.'+k,JSON.stringify(v))}catch(e){}}};
const SUBJ = [['all','All'],['phys','Physiology'],['hist','Histology'],['bio','Biochemistry'],['anat','Anatomy']];
const SN = Object.fromEntries(SUBJ);
const LET = 'ABC';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const strip = s => String(s).replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,' ');

// ---- data helpers
const QS = {};                     // id -> {q, l, j (section index), i (number within section, from 1)}
DATA.lessons.forEach(l => l.secs.forEach((s,j) => s.qs.forEach((q,i) => { QS[q.id] = {q, l, j, i:i+1}; })));
const total = Object.keys(QS).length;
const lessonQs = l => l.secs.flatMap(s => s.qs);
const byN = n => DATA.lessons.find(l => l.n === n);

// ---- per-viewer state (this browser)
let ans = store.get('ans3', {});                    // id -> picked option index (0-2)
let stars = new Set(store.get('stars', []));
let filt = store.get('filt', 'all');
const saveAns = () => store.set('ans3', ans);
const saveStars = () => store.set('stars', [...stars]);
const isRight = id => ans[id] !== undefined && ans[id] === QS[id].q.k;
const isWrong = id => ans[id] !== undefined && ans[id] !== QS[id].q.k;
function stat(qs){ let a=0,c=0; for (const q of qs){ if (ans[q.id]!==undefined){ a++; if (ans[q.id]===q.k) c++; } } return {t:qs.length,a,c}; }
const pct = (c,a) => a ? Math.round(c/a*100)+'%' : '';

// ---- views
let view = null;   // {type:'home'} | {type:'lesson', n} | {type:'study', kind:'sec'|'lesson'|'subj'|'starred'|'missed', n, j, k}
let only = '';     // '' | 'missed' | 'star'  (filter inside a study list)
let peek = false;  // show every answer without picking

function renderNav(){
  $('#subj').innerHTML = SUBJ.map(([k,t])=>`<button type="button" data-k="${k}" class="${k===filt?'on':''}">${t}</button>`).join('');
  $('#subj').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{filt=b.dataset.k;store.set('filt',filt);showHome();}));
}
function headSub(){
  const s = stat(Object.values(QS).map(x=>x.q));
  $('#hsub').textContent = `${DATA.lessons.length} lessons · ${total.toLocaleString()} questions` + (s.a ? ` · ${s.a.toLocaleString()} answered, ${pct(s.c,s.a)} right` : '');
}
function setHash(h){ history.replaceState(null,'',h?('#'+h):(location.pathname+location.search)); }
function showPane(study){ $('#home').hidden = study; $('#study').hidden = !study; document.body.classList.toggle('studying', study); }

function showHome(keep){
  view = {type:'home'}; renderNav(); showPane(false); setHash(''); headSub();
  const inF = l => filt==='all' || l.key===filt;
  const allQ = DATA.lessons.filter(inF).flatMap(lessonQs);
  const nst = allQ.filter(q=>stars.has(q.id)).length, nmiss = allQ.filter(q=>isWrong(q.id)).length;
  let h = filt==='all' ? `<p class="intro">Every card from the Cardio-Pulm 1 flashcards as a multiple-choice question with three choices, in the same lessons and sections. Open a lesson, then study it one section at a time; the questions in a section run down one page. Tap a choice to check it. Lessons tagged CP2 are not on the Oct 19 exam.</p>` : '';
  h += `<div class="starbar"><span>★ <b>${nst}</b> starred · ✗ <b>${nmiss}</b> missed${filt!=='all'?' in '+SN[filt]:''}</span><span class="sync">saved in this browser</span><span class="reviewbar">${nmiss?`<button type="button" class="miss" id="studyMissed">Redo missed →</button>`:''}${nst?`<button type="button" id="studyStars">Study starred →</button>`:''}</span></div>`;
  for (const [k,t] of SUBJ.slice(1)){
    if (filt!=='all' && filt!==k) continue;
    const ls = DATA.lessons.filter(l=>l.key===k), n = ls.reduce((a,l)=>a+lessonQs(l).length,0);
    h += `<div class="sect ${k}"><h2><span class="dot"></span>${t}<span class="ct">${ls.length} lessons · ${n} questions</span><button type="button" data-sub="${k}">Study all ${t.toLowerCase()}</button></h2><div class="lessons">`;
    for (const l of ls){
      const s = stat(lessonQs(l)), ns = lessonQs(l).filter(q=>stars.has(q.id)).length;
      h += `<button type="button" class="lrow ${k}" data-n="${l.n}"><span class="lt">${l.t}${l.cp2?'<span class="cp2tag">CP2</span>':''}</span>
        <span class="lm">${l.sub} · ${l.secs.length} sections${s.a?` · <b>${s.a}</b> done, <b>${pct(s.c,s.a)}</b> right`:''}${ns?`<span class="ls">★ ${ns}</span>`:''}</span><span class="lc"><b>${s.t}</b>questions</span>
        <span class="lp"><i style="width:${s.a/s.t*100}%"></i></span></button>`;
    }
    h += `</div></div>`;
  }
  $('#home').innerHTML = h;
  $('#home').querySelectorAll('.lrow').forEach(b=>b.addEventListener('click',()=>showLesson(+b.dataset.n)));
  $('#home').querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click',()=>study({kind:'subj',k:b.dataset.sub})));
  const sb=$('#studyStars'); if (sb) sb.addEventListener('click',()=>study({kind:'starred',k:filt}));
  const mb=$('#studyMissed'); if (mb) mb.addEventListener('click',()=>study({kind:'missed',k:filt}));
  if (!keep) window.scrollTo(0,0);
}

function showLesson(n, keep){
  const l = byN(n); if (!l) return showHome();
  view = {type:'lesson', n}; renderNav(); showPane(false); setHash('L'+n); headSub();
  const s = stat(lessonQs(l)), ns = lessonQs(l).filter(q=>stars.has(q.id)).length, nm = lessonQs(l).filter(q=>isWrong(q.id)).length;
  let h = `<div class="${l.key}"><div class="top"><button type="button" class="back" id="tolessons">← Lessons</button></div>
    <div class="lhead"><p class="ltitle" style="margin:0">${SN[l.key]}${l.cp2?' · CP2':''}</p><h2>${l.t}</h2><span class="lm">${l.sub} · ${l.secs.length} sections · ${s.t} questions${s.a?` · ${s.a} done, ${pct(s.c,s.a)} right`:''}</span></div>
    <div class="lacts"><button type="button" class="go" id="wholeL">Study whole lesson in order →</button>${nm?`<button type="button" class="rs" id="missL">✗ Redo ${nm} missed</button>`:''}${ns?`<button type="button" class="rs" id="starsL">★ Review ${ns} starred</button>`:''}</div>
    <div class="lessons">`;
  l.secs.forEach((sec,j)=>{
    const st = stat(sec.qs), sst = sec.qs.filter(q=>stars.has(q.id)).length;
    h += `<div class="trow"><button type="button" class="tm" data-j="${j}"><span class="tn">${j+1}</span><span class="tt">${sec.t}</span><span class="tc">${st.a?`<b>${st.a}</b>/${st.t} · ${pct(st.c,st.a)}`:`${st.t} questions`}</span><span class="tp2"><i style="width:${st.a/st.t*100}%"></i></span></button>${sst?`<button type="button" class="tr" data-r="${j}" aria-label="Review ${sst} starred in ${esc(strip(sec.t))}">★ ${sst}</button>`:''}</div>`;
  });
  h += `</div></div>`;
  $('#home').innerHTML = h;
  $('#tolessons').addEventListener('click',()=>showHome());
  $('#wholeL').addEventListener('click',()=>study({kind:'lesson',n}));
  const ml=$('#missL'); if (ml) ml.addEventListener('click',()=>study({kind:'lesson',n},'missed'));
  const sl=$('#starsL'); if (sl) sl.addEventListener('click',()=>study({kind:'lesson',n},'star'));
  $('#home').querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>study({kind:'sec',n,j:+b.dataset.j})));
  $('#home').querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>study({kind:'sec',n,j:+b.dataset.r},'star')));
  if (!keep) window.scrollTo(0,0);
}

// groups for a study list: [{l, j, qs}]
function groups(v){
  const all = [];
  const add = (l,j) => all.push({l, j, qs:l.secs[j].qs});
  if (v.kind==='sec') add(byN(v.n), v.j);
  else if (v.kind==='lesson') byN(v.n).secs.forEach((_,j)=>add(byN(v.n),j));
  else DATA.lessons.filter(l=>v.k==='all'||l.key===v.k).forEach(l=>l.secs.forEach((_,j)=>add(l,j)));
  return all;
}
function keepQ(v, q){
  if (v.kind==='starred' || only==='star') { if (!stars.has(q.id)) return false; }
  if (v.kind==='missed' || only==='missed') { if (!isWrong(q.id)) return false; }
  return true;
}
let frozen = null;   // ids shown in a filtered list stay put while you answer them

function study(v, o){
  only = o || ''; peek = false;
  view = Object.assign({type:'study'}, v);
  frozen = null;
  renderStudy(true);
}
function scopeTitle(v){
  if (v.kind==='sec'){ const l=byN(v.n); return {kicker:`${l.t} · Section ${v.j+1} of ${l.secs.length}`, title:l.secs[v.j].t, key:l.key}; }
  if (v.kind==='lesson'){ const l=byN(v.n); return {kicker:`${SN[l.key]} · ${l.sub}`, title:l.t, key:l.key}; }
  const k = v.k, nm = k==='all' ? 'All subjects' : SN[k];
  if (v.kind==='starred') return {kicker:nm, title:'Starred questions', key:k==='all'?'phys':k};
  if (v.kind==='missed') return {kicker:nm, title:'Questions you missed', key:k==='all'?'phys':k};
  return {kicker:'All lessons', title:SN[k], key:k};
}
function backLabel(){ return (view.kind==='sec'||view.kind==='lesson') ? '← Sections' : '← Lessons'; }
function goBack(){ if (view.kind==='sec'||view.kind==='lesson') showLesson(view.n); else showHome(); }

function qHTML(q, i, l){
  const fs = (q.figs||[]).map(f=>({src:f, cap:DATA.figs[f]||''}));
  return `<article class="card mc ${l.key}${ans[q.id]!==undefined?' done':''}${peek?' peek':''}" id="q${q.id}" data-id="${q.id}">
    <div class="eyebrow"><span class="qn">${i}</span>${q.hy?'<span class="hyb">High yield</span>':''}${l.cp2?'<span class="cp2tag" style="margin:0">CP2</span>':''}<button type="button" class="star" data-star aria-pressed="${stars.has(q.id)}" aria-label="${stars.has(q.id)?'Unstar':'Star'} this question">${stars.has(q.id)?'★':'☆'}</button></div>
    <h3 class="q">${q.q}</h3>
    <div class="opts">${q.o.map((o,x)=>`<button type="button" class="opt${x===q.k?' is-ans':''}${ans[q.id]===x?' picked':''}" data-x="${x}"><span class="ol">${LET[x]}</span><span class="ot">${o}</span><span class="mk">${x===q.k?'Answer':'Your pick'}</span></button>`).join('')}</div>
    <div class="res"><p class="verdict ${ans[q.id]===undefined?'':ans[q.id]===q.k?'right':'wrong'}">${ans[q.id]===undefined?'':ans[q.id]===q.k?'✓ Correct':`✗ Not quite · the answer is ${LET[q.k]}`}<button type="button" data-retry>Try again</button></p>
    ${(q.more||fs.length)?`<div class="drops">${q.more?`<details><summary>More</summary><div class="more">${q.more.replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>')}</div></details>`:''}${fs.length?`<details class="picD"><summary>Pictures <span class="n">(${fs.length})</span></summary><div class="pics">${
      fs.map(f=>`<figure><img data-src="${esc(f.src)}" alt="${esc(strip(f.cap))}">${f.cap?`<figcaption>${f.cap}</figcaption>`:''}</figure>`).join('')}</div></details>`:''}</div>`:''}
    </div></article>`;
}

function renderStudy(scrollToOpen){
  const v = view, s = $('#study'), T = scopeTitle(v);
  s.className = 'wrap '+T.key;
  let gs = groups(v);
  if (frozen) gs = gs.map(g=>({...g, qs:g.qs.filter(q=>frozen.has(q.id))}));
  else { gs = gs.map(g=>({...g, qs:g.qs.filter(q=>keepQ(v,q))})); if (only||v.kind==='starred'||v.kind==='missed') frozen = new Set(gs.flatMap(g=>g.qs.map(q=>q.id))); }
  gs = gs.filter(g=>g.qs.length);
  const shown = gs.flatMap(g=>g.qs), st = stat(shown);
  setHash(v.kind==='sec'?`L${v.n}-${v.j+1}`:v.kind==='lesson'?`L${v.n}-all`:v.kind==='subj'?v.k:v.kind);

  const multiSec = gs.length>1 || v.kind!=='sec';
  let jump = '';
  if (v.kind==='sec'){ const l=byN(v.n); jump = `<select id="section" aria-label="Choose section">${l.secs.map((x,j)=>`<option value="${j}" ${j===v.j?'selected':''}>${j+1}. ${strip(x.t)}</option>`).join('')}</select>`; }
  else if (gs.length>1) jump = `<select id="jump" aria-label="Jump to section"><option value="">Jump to section…</option>${gs.map(g=>`<option value="${g.l.n}-${g.j}">${v.kind==='lesson'?'':strip(g.l.t)+' › '}${g.j+1}. ${strip(g.l.secs[g.j].t)}</option>`).join('')}</select>`;
  else jump = '<span style="flex:1"></span>';
  const canFilter = v.kind!=='starred' && v.kind!=='missed';

  let h = `<div class="top"><button type="button" class="back" id="backBtn">${backLabel()}</button>${jump}
    ${canFilter?`<button type="button" class="miss" id="onlyMiss" aria-pressed="${only==='missed'}">✗ Missed</button><button type="button" id="onlyStar" aria-pressed="${only==='star'}">★ only</button>`:''}
    <button type="button" id="peekBtn" aria-pressed="${peek}">Show answers</button></div>
    <p class="ltitle">${T.kicker}${only==='missed'?' · missed only':only==='star'?' · starred only':''}</p>
    <div class="lhead" style="margin:0 0 4px"><h2 style="margin:0">${T.title}</h2></div>
    <div class="posrow"><span id="pos"><b>${st.a}</b> / ${st.t} answered${st.a?` · <b>${st.c}</b> right (${pct(st.c,st.a)})`:''}</span><div class="bar"><i id="posbar" style="width:${st.t?st.a/st.t*100:0}%"></i></div></div>`;

  if (!shown.length){
    h += `<div class="card empty">${only==='star'||v.kind==='starred'?'No starred questions here yet. Tap ☆ on any question to star it.':only==='missed'||v.kind==='missed'?'Nothing missed here. Nice.':'No questions.'}</div>`;
  } else {
    h += `<div class="qlist">`;
    let lastL = null;
    for (const g of gs){
      if (v.kind!=='sec' && v.kind!=='lesson' && g.l!==lastL){ h += `<h2 class="lsep ${g.l.key}"><small>${SN[g.l.key]} · ${g.l.sub}</small>${g.l.t}</h2>`; lastL = g.l; }
      if (multiSec){ const gst = stat(g.qs); h += `<div class="ssep ${g.l.key}" id="S${g.l.n}-${g.j}"><span class="sn">${g.j+1}</span><h3>${g.l.secs[g.j].t}</h3><span class="sc" data-sc="${g.l.n}-${g.j}">${gst.a}/${gst.t}</span></div>`; }
      for (const q of g.qs) h += qHTML(q, QS[q.id].i, g.l);
    }
    h += `</div>`;
    h += endCard(v, st);
  }
  s.innerHTML = h;
  showPane(true); headSub();
  wireStudy();
  if (scrollToOpen){
    const first = s.querySelector('.mc:not(.done)');
    if (first && st.a && !only && v.kind!=='missed') first.scrollIntoView({block:'start'}); else window.scrollTo(0,0);
  }
}
function nextOf(v){
  if (v.kind==='sec'){ const l=byN(v.n); if (v.j+1<l.secs.length) return {label:`Next section: ${strip(l.secs[v.j+1].t)} →`, go:()=>study({kind:'sec',n:v.n,j:v.j+1}), key:l.key};
    const nl = DATA.lessons[DATA.lessons.indexOf(l)+1]; if (nl) return {label:`Next lesson: ${strip(nl.t)} →`, go:()=>showLesson(nl.n), key:nl.key}; }
  if (v.kind==='lesson'){ const l=byN(v.n), nl = DATA.lessons[DATA.lessons.indexOf(l)+1]; if (nl) return {label:`Next lesson: ${strip(nl.t)} →`, go:()=>showLesson(nl.n), key:nl.key}; }
  return null;
}
function endCard(v, st){
  const nx = nextOf(v), what = v.kind==='sec'?'section':v.kind==='lesson'?'lesson':'list';
  const left = st.t - st.a;
  return `<div class="card endcard" id="endcard"><h3>${left?`${left} question${left===1?'':'s'} left in this ${what}`:`End of ${what}`}</h3>
    <p class="score" id="endscore">${st.a?pct(st.c,st.a):'–'}</p><p>${st.c} of ${st.t} right</p><div class="row">
    <button type="button" id="redoMiss" ${st.a>st.c?'':'hidden'}>✗ Redo the ${st.a-st.c} missed</button>
    <button type="button" id="clearScope">Clear this ${what} &amp; start over</button>
    <button type="button" id="toList">${v.kind==='sec'||v.kind==='lesson'?'All sections':'All lessons'}</button>
    ${nx?`<button type="button" class="go ${nx.key}" id="nextBtn">${nx.label}</button>`:''}</div></div>`;
}
function scopeIds(){ return [...document.querySelectorAll('#study .mc')].map(e=>e.dataset.id); }
function refreshCounts(){
  const ids = scopeIds(), qs = ids.map(id=>QS[id].q), st = stat(qs);
  const p = $('#pos'); if (p) p.innerHTML = `<b>${st.a}</b> / ${st.t} answered${st.a?` · <b>${st.c}</b> right (${pct(st.c,st.a)})`:''}`;
  const b = $('#posbar'); if (b) b.style.width = (st.t?st.a/st.t*100:0)+'%';
  document.querySelectorAll('[data-sc]').forEach(el=>{
    const [n,j] = el.dataset.sc.split('-').map(Number), gq = qs.filter(q=>QS[q.id].l.n===n && QS[q.id].j===j), s2 = stat(gq);
    el.textContent = `${s2.a}/${s2.t}`;
  });
  const ec = $('#endcard'); if (ec){
    const left = st.t-st.a, what = view.kind==='sec'?'section':view.kind==='lesson'?'lesson':'list';
    ec.querySelector('h3').textContent = left?`${left} question${left===1?'':'s'} left in this ${what}`:`End of ${what}`;
    $('#endscore').textContent = st.a?pct(st.c,st.a):'–';
    $('#endscore').nextElementSibling.textContent = `${st.c} of ${st.t} right`;
    const rm = $('#redoMiss'); rm.hidden = !(st.a>st.c); rm.textContent = `✗ Redo the ${st.a-st.c} missed`;
  }
  headSub();
}
function repaintQ(el){
  const id = el.dataset.id, q = QS[id].q, p = ans[id];
  el.classList.toggle('done', p!==undefined);
  el.querySelectorAll('.opt').forEach(b=>b.classList.toggle('picked', p===+b.dataset.x));
  const vd = el.querySelector('.verdict'), rb = vd.querySelector('button');
  vd.className = 'verdict '+(p===undefined?'':p===q.k?'right':'wrong');
  vd.firstChild && vd.firstChild.nodeType===3 ? vd.firstChild.textContent = (p===undefined?'':p===q.k?'✓ Correct':`✗ Not quite · the answer is ${LET[q.k]}`) : vd.insertBefore(document.createTextNode(p===q.k?'✓ Correct':`✗ Not quite · the answer is ${LET[q.k]}`), rb);
}
function armed(btn, run){
  if (btn.classList.contains('armed')){ clearTimeout(btn._t); btn.classList.remove('armed'); run(); return; }
  const old = btn.innerHTML; btn.classList.add('armed'); btn.textContent = 'Tap again to clear';
  btn._t = setTimeout(()=>{ btn.classList.remove('armed'); btn.innerHTML = old; }, 3500);
}
function wireStudy(){
  $('#backBtn').addEventListener('click', goBack);
  const sc = $('#section'); if (sc) sc.addEventListener('change',()=>study({kind:'sec',n:view.n,j:+sc.value}, only));
  const jp = $('#jump'); if (jp) jp.addEventListener('change',()=>{ const el=document.getElementById('S'+jp.value); if (el) el.scrollIntoView({block:'start'}); jp.value=''; });
  const om = $('#onlyMiss'); if (om) om.addEventListener('click',()=>{ only = only==='missed'?'':'missed'; frozen=null; renderStudy(false); window.scrollTo(0,0); });
  const os = $('#onlyStar'); if (os) os.addEventListener('click',()=>{ only = only==='star'?'':'star'; frozen=null; renderStudy(false); window.scrollTo(0,0); });
  $('#peekBtn').addEventListener('click',e=>{ peek=!peek; e.currentTarget.setAttribute('aria-pressed',peek); document.querySelectorAll('#study .mc').forEach(el=>el.classList.toggle('peek',peek)); });
  const rm = $('#redoMiss'); if (rm) rm.addEventListener('click',()=>{ const ids = scopeIds().filter(isWrong); ids.forEach(id=>delete ans[id]); saveAns(); only=''; frozen=new Set(ids); peek=false; renderStudy(false); window.scrollTo(0,0); });
  const cs = $('#clearScope'); if (cs) cs.addEventListener('click',()=>armed(cs,()=>{ scopeIds().forEach(id=>delete ans[id]); saveAns(); renderStudy(false); window.scrollTo(0,0); }));
  const tl = $('#toList'); if (tl) tl.addEventListener('click', goBack);
  const nb = $('#nextBtn'); if (nb){ const nx = nextOf(view); nb.addEventListener('click',()=>{ nx.go(); window.scrollTo(0,0); }); }
}
// one listener for every question on the page
$('#study').addEventListener('click', e=>{
  const card = e.target.closest('.mc'); if (!card) return;
  const id = card.dataset.id;
  const opt = e.target.closest('.opt');
  if (opt){ if (ans[id]!==undefined) return; ans[id] = +opt.dataset.x; saveAns(); repaintQ(card); refreshCounts(); return; }
  const st = e.target.closest('[data-star]');
  if (st){ stars.has(id)?stars.delete(id):stars.add(id); saveStars(); const on=stars.has(id); st.setAttribute('aria-pressed',on); st.textContent=on?'★':'☆'; st.setAttribute('aria-label',(on?'Unstar':'Star')+' this question'); return; }
  if (e.target.closest('[data-retry]')){ delete ans[id]; saveAns(); repaintQ(card); refreshCounts(); return; }
  const img = e.target.closest('.pics img'); if (img) openLB(img.src);
});
$('#study').addEventListener('toggle', e=>{
  const d = e.target; if (!d.classList || !d.classList.contains('picD') || !d.open) return;
  d.querySelectorAll('img[data-src]').forEach(im=>{ im.src = im.dataset.src; im.removeAttribute('data-src'); });
}, true);

function openLB(src){
  if (!src) return;
  const lb=document.createElement('div'); lb.id='lb';
  lb.innerHTML=`<img src="${esc(src)}" alt=""><button type="button" aria-label="Close picture">Close</button>`;
  lb.addEventListener('click',()=>lb.remove()); document.body.appendChild(lb);
}
document.addEventListener('keydown',e=>{
  const lb=$('#lb'); if (lb){ if(e.key==='Escape'){e.preventDefault();lb.remove();} return; }
  if (e.key==='Escape' && view && view.type==='study' && e.target.tagName!=='SELECT') goBack();
  else if (e.key==='Escape' && view && view.type==='lesson') showHome();
});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('theme',r.dataset.theme);});
{const th=store.get('theme',null); if(th) document.documentElement.dataset.theme=th;}

// deep links: #L<n> lesson, #L<n>-<section>, #L<n>-all, #phys etc., #starred, #missed
{const h = location.hash.slice(1), m = h.match(/^L(\d+)(?:-(all|\d+))?$/);
 renderNav();
 if (m && byN(+m[1])){ const n=+m[1], l=byN(n); if (m[2]==='all') study({kind:'lesson',n}); else if (m[2] && +m[2]>=1 && +m[2]<=l.secs.length) study({kind:'sec',n,j:+m[2]-1}); else showLesson(n); }
 else if (['phys','hist','bio','anat'].includes(h)) study({kind:'subj',k:h});
 else if (h==='starred') study({kind:'starred',k:'all'});
 else if (h==='missed') study({kind:'missed',k:'all'});
 else showHome();}
})();
</script>
