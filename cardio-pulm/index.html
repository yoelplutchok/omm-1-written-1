t every interalveolar septum","Only in the walls of the alveolar sacs"],"k":0},{"id":"28-8","q":"What do the elastic fibres around alveoli do?","o":["Stop alveoli stretching on inspiration and hold them open on expiration","Lower surface tension so alveoli do not collapse at end-expiration","Let alveoli stretch on inspiration and recoil passively on expiration"],"k":2}]},{"t":"Pneumocytes","qs":[{"id":"28-9","q":"Describe the type I pneumocyte.","o":["Columnar, ciliated, joined by desmosomes only","Squamous, thick, with no junctions between cells","Squamous, extremely thin, joined by occluding (tight) junctions"],"k":2,"more":"<p>On a slide you see only a flat, dark nucleus against the wall.<\/p>","figs":["img/28_alveoli_2.webp"]},{"id":"28-10","q":"What is the role of type I pneumocytes?","o":["Line almost the entire alveolar surface; gas crosses them","Line almost the entire alveolar surface; phagocytose dust","Divide to replace damaged alveolar cells; gas cannot cross them"],"k":0,"figs":["img/28_alveoli_4.webp"]},{"id":"28-11","q":"What are the other names for the type II pneumocyte?","o":["Dust cell; heart failure cell","Septal cell; great alveolar cell","Club cell; Clara cell"],"k":1},{"id":"28-12","q":"Describe the type II pneumocyte on a slide.","o":["Large free cell in the alveolar lumen; brown or black granules","Cuboidal, rounded, bulging into the alveolus, often where septa meet; pale vesicular cytoplasm","Squamous, flat, hugging the wall; dark nucleus with no visible cytoplasm"],"k":1,"figs":["img/28_alveoli_2.webp"]},{"id":"28-13","q":"On TEM, what organelle identifies a type II pneumocyte, and what does it store?","o":["Lamellar bodies (granules of stacked membranes) → store surfactant","Weibel-Palade bodies (rod-shaped granules) → store von Willebrand factor","Lamellar bodies (granules of stacked membranes) → store elastase"],"k":0,"figs":["img/28_alveoli_3.webp"]},{"id":"28-14","q":"What happens to type II pneumocytes after alveolar damage?","o":["They divide to replace only type II cells; type I cells come from club cells","They are replaced by type I cells (stem cell of the lining)","They divide to replace both type I and type II cells (stem cell of the lining)"],"k":2}]},{"t":"Surfactant","qs":[{"id":"28-15","q":"What is the physical structure of surfactant?","o":["Film of triglycerides and cholesterol over a thick layer of mucus","Film of water over a thin layer of phospholipids","Film of phospholipids and lipoproteins over a thin layer of water"],"k":2},{"id":"28-16","q":"What are the components of surfactant?","o":["Dipalmitoylphosphatidylcholine (DPPC)<br>Triglycerides<br>Club cell secretory protein","Dipalmitoylphosphatidylcholine (DPPC)<br>Mucin<br>Surfactant proteins A, B, C, D","Dipalmitoylphosphatidylcholine (DPPC)<br>Cholesterol<br>Surfactant proteins A, B, C, D"],"k":2,"figs":["img/28_alveoli_3.webp"]},{"id":"28-17","q":"How does surfactant work, and what does it achieve?","o":["Raises surface tension → alveoli recoil at end-expiration, empty with less force → less work of breathing","Lowers surface tension → alveoli don't collapse at end-expiration, inflate with less force → less work of breathing","Raises compliance by adding elastin → alveoli stretch further on inspiration → more work of breathing"],"k":1},{"id":"28-18","q":"Type II pneumocytes share surfactant production and other functions with which airway cell?","o":["Club cells","Basal cells","Brush cells"],"k":0}]},{"t":"Alveolar macrophages","qs":[{"id":"28-19","q":"What are alveolar macrophages also called, where do they come from, and where do they sit?","o":["Septal cells — from type II pneumocytes; in the alveolar wall","Heart failure cells — from fibroblasts; in the pleura","Dust cells — from blood monocytes; in the alveoli or septa"],"k":2,"figs":["img/28_alveoli_2.webp","img/28_alveoli_4.webp"]},{"id":"28-20","q":"What do alveolar macrophages phagocytose?","o":["Inhaled particles and red cells that escape the capillaries","Surfactant and dead type I cells only","Inhaled particles and elastin fibres from the septa"],"k":0},{"id":"28-21","q":"How do alveolar macrophages leave the lung?","o":["Mucociliary clearance or the lymphatics","Pores of Kohn or the pulmonary veins","Pulmonary veins or the pleural space"],"k":0},{"id":"28-22","q":"What are heart failure cells?","o":["Type II pneumocytes full of brown haemosiderin from red cells leaking into congested alveoli in congestive heart failure","Alveolar macrophages full of brown haemosiderin from red cells leaking into congested alveoli in congestive heart failure","Alveolar macrophages full of brown lipofuscin from dead cardiac myocytes in congestive heart failure"],"k":1},{"id":"28-23","q":"What is anthracosis, and where do the cells collect?","o":["Carbon-laden macrophages (coal miners, city dwellers, smokers) — in connective tissue beside lymphatics, lymphoid tissue along bronchi, at the hilum","Carbon-laden type II pneumocytes (coal miners, city dwellers, smokers) — in the alveolar lining, along capillaries","Iron-laden macrophages (heart failure, congested lungs) — in alveolar lumens only, never at the hilum"],"k":0,"more":"<p>Large black-pigmented cells in alveoli and septa are macrophages.<\/p>"}]},{"t":"Septum and blood–air barrier","qs":[{"id":"28-24","q":"What does the interalveolar septum contain?","o":["Type I and II cells on both faces<br>No capillaries (gas diffuses from the bronchial arteries)<br>Connective tissue: fibroblasts, elastic and reticular fibres, macrophages","Ciliated and goblet cells on both faces<br>Dense capillary plexus (red cells, leukocytes)<br>Connective tissue: fibroblasts, elastic and reticular fibres, macrophages","Type I and II cells on both faces<br>Dense capillary plexus (red cells, leukocytes)<br>Connective tissue: fibroblasts, elastic and reticular fibres, macrophages"],"k":2,"figs":["img/28_alveoli_4.webp","img/28_alveoli_2.webp"]},{"id":"28-25","q":"What is the difference between the interalveolar septum and the blood–air barrier?","o":["Septum: the wall of the alveolar duct<br>Barrier: the wall of the alveolar sac","Septum: the whole partition between two alveoli<br>Barrier: just the shortest path gas takes across it","Septum: just the shortest path gas takes across it<br>Barrier: the whole partition between two alveoli"],"k":1},{"id":"28-26","q":"List the layers of the blood–air barrier, air to blood.","o":["Surfactant (counted by some sources) → type I cell → fused basal laminae → capillary endothelium","Surfactant (counted by some sources) → type II cell → fused basal laminae → capillary endothelium","Capillary endothelium → fused basal laminae → type I cell → surfactant (counted by some sources)"],"k":0,"figs":["img/28_alveoli_4.webp"]},{"id":"28-27","q":"What kind of capillary endothelium forms the blood–air barrier?","o":["Thin, continuous","Fenestrated, with diaphragms","Discontinuous (sinusoidal)"],"k":0},{"id":"28-28","q":"On TEM, what is a <b>thin portion<\/b> of the alveolar septum?","o":["Where the two basal laminae fuse — gas exchange happens here","Where the two basal laminae fuse — no gas exchange happens here","Where type II cells bulge into the alveolus — gas exchange happens here"],"k":0,"figs":["img/28_alveoli_5.webp"]},{"id":"28-29","q":"On TEM, what is a <b>thick portion<\/b> of the alveolar septum?","o":["Where type II cells overlie lamellar bodies in the alveolar lumen","Where connective-tissue cells (fibroblasts) and fibres sit between epithelium and endothelium","Where smooth muscle and cartilage sit between epithelium and endothelium"],"k":1,"figs":["img/28_alveoli_5.webp"]}]},{"t":"Pores of Kohn and pleura","qs":[{"id":"28-30","q":"What are the pores of Kohn?","o":["Small openings between terminal bronchioles and alveolar ducts","Small holes through the alveolar septa connecting neighbouring alveoli","Small holes through the capillary endothelium connecting alveoli to blood"],"k":1,"figs":["img/28_alveoli_4.webp"]},{"id":"28-31","q":"What do the pores of Kohn do?","o":["Let macrophages leave the lung; drain fluid into the lymphatics when an alveolus floods","Let gas cross into the blood; bypass the blood–air barrier when it is thickened","Equalize air pressure; let air arrive from the side when an alveolus's airway is blocked"],"k":2},{"id":"28-32","q":"How do the pores of Kohn help lobar pneumonia spread?","o":["Let fluid and bacteria pass from alveolus to alveolus","Let bacteria pass from the pleura into the alveoli","Let fluid and bacteria pass from alveolus to capillary"],"k":0},{"id":"28-33","q":"What is the pleura made of?","o":["Mesothelium (simple squamous) on thin connective tissue — visceral on lung, parietal on chest wall","Ciliated columnar epithelium on thin connective tissue — visceral on lung, parietal on chest wall","Endothelium (simple squamous) on thick hyaline cartilage — parietal on lung, visceral on chest wall"],"k":0}]},{"t":"Alveolar disease","qs":[{"id":"28-34","q":"What causes hyaline membrane disease, and in whom?","o":["Surfactant excess from overactive type II cells — premature infants","Surfactant deficiency from immature type II cells — premature infants","Surfactant deficiency from destroyed type I cells — elderly smokers"],"k":1,"more":"<p>It is the respiratory distress syndrome of premature infants.<\/p>"},{"id":"28-35","q":"What happens to the lungs without surfactant in hyaline membrane disease?","o":["Airways constrict (bronchospasm) → wheezing","Alveoli collapse (atelectasis) → hypoxia","Alveoli over-inflate (emphysema) → hypercapnia"],"k":1},{"id":"28-36","q":"What does hyaline membrane disease look like in section?","o":["Many open alveoli; septa thickened by granulomas around lentils","Many collapsed alveoli; open airspaces lined by pink hyaline membranes","Many over-inflated alveoli; thin septa lined by black pigmented macrophages"],"k":1,"figs":["img/28_alveoli_6.webp"]},{"id":"28-37","q":"What are hyaline membranes made of?","o":["Dead type II cell debris + fibrin","Elastin fragments + haemosiderin","Dead type I cell debris + collagen"],"k":0,"figs":["img/28_alveoli_6.webp"]},{"id":"28-38","q":"What is emphysema?","o":["Thickening of alveolar walls with excess elasticity — a form of chronic obstructive pulmonary disease (COPD)","Destruction of alveolar walls with loss of elasticity — a form of chronic obstructive pulmonary disease (COPD)","Inflammation of the bronchi with mucus hypersecretion — a form of restrictive lung disease"],"k":1},{"id":"28-39","q":"How does smoking cause emphysema?","o":["Excess antitrypsin activity → elastase from macrophages builds elastin","Loss of elastase activity → antitrypsin from macrophages destroys elastin","Loss of antitrypsin activity → elastase from macrophages destroys elastin"],"k":2},{"id":"28-40","q":"What does emphysema do to the alveoli, and what are the consequences?","o":["Few large alveoli → many smaller, stiff spaces → more surface for exchange, more recoil to push air out","Many small alveoli → fewer, larger, floppy spaces → less surface for exchange, less recoil to push air out","Many small alveoli → fewer, larger, floppy spaces → more surface for exchange, more recoil to push air out"],"k":1},{"id":"28-41","q":"What is pulse aspiration pneumonia?","o":["Non-infectious granulomatous pneumonitis from inhaled legumes (e.g. lentils); images as small, poorly defined nodules","Infectious bacterial pneumonia from inhaled legumes (e.g. lentils); images as a single large lobar consolidation","Non-infectious granulomatous pneumonitis from inhaled coal dust (e.g. anthracite); images as large, well-defined masses"],"k":0}]},{"t":"Naming it on a slide","qs":[{"id":"28-42","q":"On a slide, how do you name the parts of the respiratory portion?","o":["Terminal bronchiole: complete cuboidal-and-muscle wall, no alveoli<br>Respiratory bronchiole: same lining broken by alveolar openings<br>Alveolar duct: only a row of alveolar mouths with muscle knobs<br>Alveolar sac: the cluster at the end","Terminal bronchiole: complete cuboidal-and-muscle wall, no alveoli<br>Respiratory bronchiole: only a row of alveolar mouths with muscle knobs<br>Alveolar duct: same lining broken by alveolar openings<br>Alveolar sac: the cluster at the end","Terminal bronchiole: same lining broken by alveolar openings<br>Respiratory bronchiole: complete cuboidal-and-muscle wall, no alveoli<br>Alveolar duct: only a row of alveolar mouths with muscle knobs<br>Alveolar sac: the cluster at the end"],"k":0,"figs":["img/28_alveoli_1.webp"]},{"id":"28-43","q":"At high power, how do you tell type I, type II and macrophage apart?","o":["Flat dark nucleus hugging the wall → type II<br>Plump rounded cell bulging into lumen → type I<br>Large free cell with brown or black granules → macrophage","Flat dark nucleus hugging the wall → type I<br>Plump rounded cell bulging into lumen → type II<br>Large free cell with brown or black granules → macrophage","Flat dark nucleus hugging the wall → type I<br>Plump rounded cell bulging into lumen → macrophage<br>Large free cell with brown or black granules → type II"],"k":1,"more":"<p>On TEM, lamellar bodies mean type II.<\/p>","figs":["img/28_alveoli_2.webp"]}]}]},{"n":11,"key":"hist","t":"Blood: what is actually in it","sub":"H11 Part A","cp2":true,"secs":[{"t":"Blood as a tissue","qs":[{"id":"11-0","q":"What tissue type is blood classified as?","o":["Connective tissue","Lymphoid tissue","Epithelial tissue"],"k":0},{"id":"11-1","q":"Why is blood counted as a connective tissue?","o":["Cells suspended without any extracellular matrix — the plasma is purely intracellular","Cells joined by tight junctions lining a fluid space — like an epithelium","Cells suspended in an extracellular matrix — the matrix just happens to be liquid"],"k":2}]},{"t":"Spun blood: three layers","qs":[{"id":"11-2","q":"Spin anticoagulated blood: what three layers form, bottom to top?","o":["Plasma<br>Buffy coat (white cells + platelets)<br>Red cells","Red cells<br>Plasma<br>Buffy coat (white cells + platelets)","Red cells<br>Buffy coat (white cells + platelets)<br>Plasma"],"k":2,"figs":["img/11_blood_1.jpg"]},{"id":"11-3","q":"About what percentage of blood volume is red cells, and what is that figure called?","o":["~45% — the haematocrit","~55% — the haematocrit","~30% — the haematocrit"],"k":0,"figs":["img/11_blood_1.jpg"]},{"id":"11-4","q":"How much of spun blood's volume is plasma?","o":["Just over half","About a quarter","Just under half"],"k":0,"figs":["img/11_blood_1.jpg"]},{"id":"11-5","q":"What is the buffy coat, and how much of the blood volume does it make up?","o":["Thin pale layer of white cells and platelets, below the red cells; ~10%","Thin red layer of reticulocytes, between red cells and plasma; &lt;1%","Thin pale layer of white cells and platelets, between red cells and plasma; &lt;1%"],"k":2,"figs":["img/11_blood_1.jpg"]}]},{"t":"Plasma versus serum","qs":[{"id":"11-6","q":"What is the one difference between plasma and serum?","o":["Serum has red cells; plasma does not","Plasma has clotting factors; serum does not","Serum has clotting factors; plasma does not"],"k":1,"more":"<p>The lesson flags this as asked constantly.<\/p>"},{"id":"11-7","q":"How do you obtain serum from blood?","o":["Let it clot → albumin is consumed → leftover fluid = serum","Add heparin → fibrinogen is consumed → leftover fluid = serum","Let it clot → fibrinogen is consumed → leftover fluid = serum"],"k":2},{"id":"11-8","q":"How do you obtain plasma from blood?","o":["Let it clot → spin → the fluid = plasma","Prevent clotting → spin → the fluid = plasma","Let it clot → remove fibrin → the fluid = plasma"],"k":1}]},{"t":"The red cell","qs":[{"id":"11-9","q":"Which organelles does a mature red cell contain?","o":["None — no nucleus, no mitochondria; just a bag of haemoglobin","Nucleus and ribosomes — no mitochondria; mostly haemoglobin","Nucleus only — no mitochondria; mostly haemoglobin"],"k":0,"figs":["img/11_blood_1.jpg"]},{"id":"11-10","q":"What shape is a red cell?","o":["Flat elongated oval","Biconvex sphere","Biconcave disc"],"k":2,"figs":["img/11_blood_1.jpg"]},{"id":"11-11","q":"What two advantages does the red cell's biconcave-disc shape give?","o":["Extra surface area for gas exchange<br>Deforms to squeeze through capillaries narrower than itself","Smaller surface area to reduce water loss<br>Deforms to squeeze through capillaries narrower than itself","Extra surface area for gas exchange<br>Stiffness that keeps it out of narrow capillaries"],"k":0},{"id":"11-12","q":"Why is it fitting that a red cell has no mitochondria?","o":["It cannot use the oxygen it carries — right for a courier","It needs all its oxygen for its own aerobic metabolism","Mitochondria would make it too large to deform"],"k":0},{"id":"11-13","q":"How long does a red cell live?","o":["About 30 days","About 240 days","About 120 days"],"k":2,"more":"<p>The summary box at the bottom of the figure also gives the 120-day life span.<\/p>","figs":["img/11_blood_6.jpg"]}]},{"t":"White cells by frequency","qs":[{"id":"11-14","q":"Rank the white blood cells from most to least common in normal adult blood.","o":["Lymphocyte → neutrophil → monocyte → eosinophil → basophil","Neutrophil → lymphocyte → eosinophil → monocyte → basophil","Neutrophil → lymphocyte → monocyte → eosinophil → basophil"],"k":2,"more":"<table><tr><th>Neutrophil<\/th><td>~60%<\/td><\/tr><tr><th>Lymphocyte<\/th><td>~30%<\/td><\/tr><tr><th>Monocyte<\/th><td>~5%<\/td><\/tr><tr><th>Eosinophil<\/th><td>~3%<\/td><\/tr><tr><th>Basophil<\/th><td>&lt;1%<\/td><\/tr><\/table><p>The order itself is testable; the clickers use it.<\/p>","figs":["img/11_blood_1.jpg"],"hy":true},{"id":"11-15","q":"Which is the most common white blood cell, and roughly what share?","o":["Neutrophil, ~30%","Neutrophil, ~60%","Lymphocyte, ~60%"],"k":1,"figs":["img/11_blood_1.jpg","img/11_blood_2.jpg"],"hy":true},{"id":"11-16","q":"Which is the rarest white blood cell?","o":["Monocyte (&lt;1%)","Eosinophil (&lt;1%)","Basophil (&lt;1%)"],"k":2,"figs":["img/11_blood_1.jpg","img/11_blood_4.jpg"],"hy":true}]},{"t":"Neutrophils and lymphocytes","qs":[{"id":"11-17","q":"What does a neutrophil's nucleus look like?","o":["Multilobed","Bilobed","Kidney-shaped"],"k":0,"more":"<p>Its granules are pale.<\/p>","figs":["img/11_blood_2.jpg"]},{"id":"11-18","q":"What is the neutrophil's main job?","o":["First responder to bacteria","First responder to parasites","Release of histamine in allergy"],"k":0,"figs":["img/11_blood_2.jpg"]},{"id":"11-19","q":"Which white cell is second most common, and roughly what share?","o":["Lymphocyte, ~5%","Lymphocyte, ~30%","Eosinophil, ~10%"],"k":1,"figs":["img/11_blood_5.jpg"]},{"id":"11-20","q":"What does a lymphocyte look like on a smear?","o":["Large round nucleus, almost no cytoplasm","Multilobed nucleus, pale granular cytoplasm","Bilobed nucleus, bright red-orange granules"],"k":0,"figs":["img/11_blood_5.jpg"]},{"id":"11-21","q":"What is the lymphocyte's role?","o":["Phagocytosis of bacteria","Adaptive immunity","Innate immunity"],"k":1,"figs":["img/11_blood_5.jpg"]}]},{"t":"Monocytes, eosinophils, basophils","qs":[{"id":"11-22","q":"Which is the largest white blood cell?","o":["Monocyte","Lymphocyte","Neutrophil"],"k":0,"figs":["img/11_blood_6.jpg"]},{"id":"11-23","q":"What shape is a monocyte's nucleus, and what share of white cells are monocytes?","o":["Multilobed; ~5%","Kidney-shaped; ~5%","Kidney-shaped; ~30%"],"k":1,"figs":["img/11_blood_6.jpg"]},{"id":"11-24","q":"What does a monocyte become once it enters tissue?","o":["Mast cell","Plasma cell","Macrophage"],"k":2,"figs":["img/11_blood_6.jpg"]},{"id":"11-25","q":"What does an eosinophil look like on a smear?","o":["Multilobed nucleus; fine, pale pink granules","Bilobed nucleus; large, bright red-orange granules","Kidney-shaped nucleus; large, bright red-orange granules"],"k":1,"figs":["img/11_blood_3.jpg"]},{"id":"11-26","q":"What share of white cells are eosinophils, and what do they fight?","o":["~30%; parasites and allergy","~3%; parasites and allergy","~1%; viruses and tumours"],"k":1,"figs":["img/11_blood_3.jpg"]},{"id":"11-27","q":"What does a basophil look like on a smear?","o":["Dark granules that obscure the nucleus","Pale granules with a multilobed nucleus","Kidney-shaped nucleus with no visible granules"],"k":0,"more":"<p>Basophils look dark and are sparse.<\/p>","figs":["img/11_blood_4.jpg"]},{"id":"11-28","q":"What mediator is the basophil known for?","o":["Myeloperoxidase","Interleukin-1","Histamine"],"k":2,"figs":["img/11_blood_4.jpg"]}]},{"t":"Platelets","qs":[{"id":"11-29","q":"Are platelets cells?","o":["No — fragments shed from a monocyte, with no nucleus","Yes — mature megakaryocytes with a condensed nucleus","No — fragments shed from a megakaryocyte, with no nucleus"],"k":2,"figs":["img/11_blood_1.jpg","img/12_hemato_1.jpg"]},{"id":"11-30","q":"What do platelets do?","o":["Make antibodies","Engulf bacteria","Plug damaged vessels"],"k":2,"figs":["img/11_blood_1.jpg"]},{"id":"11-31","q":"Why do platelets appear as small specks on a smear?","o":["They are red cells that have lost their haemoglobin","No nucleus — they are fragments, not cells with structure","Dense nucleus fills them — they are tiny cells"],"k":1}]}]},{"n":12,"key":"hist","t":"Where blood cells come from","sub":"H11 Part B","cp2":true,"secs":[{"t":"The stem cell and two lines","qs":[{"id":"12-0","q":"Which single cell do all blood cells descend from?","o":["Haematopoietic stem cell","Common myeloid progenitor","Lymphoid progenitor cell"],"k":0,"figs":["img/12_hemato_1.jpg"]},{"id":"12-1","q":"What two things can the haematopoietic stem cell do?","o":["Renew itself<br>Commit to a lineage","Renew itself<br>Mature directly into red cells only","Divide without limit<br>Return to an uncommitted state"],"k":0,"figs":["img/12_hemato_1.jpg"]},{"id":"12-2","q":"Which cells does the myeloid line produce?","o":["Red cells<br>Granulocytes<br>NK cells<br>Platelets","Red cells<br>Platelets<br>T cells<br>B cells","Red cells<br>Platelets<br>Granulocytes<br>Monocytes"],"k":2,"figs":["img/12_hemato_1.jpg"]},{"id":"12-3","q":"Which cells does the lymphoid line produce?","o":["B cells<br>NK cells<br>Mast cells","T cells<br>B cells<br>Monocytes","T cells<br>B cells<br>NK cells"],"k":2,"figs":["img/12_hemato_1.jpg"]}]},{"t":"Where blood is made, by age","qs":[{"id":"12-4","q":"In the fetus, where is blood made, in order?","o":["Yolk sac → liver and spleen → (increasingly) bone marrow","Liver and spleen → yolk sac → (increasingly) bone marrow","Yolk sac → bone marrow → (increasingly) liver and spleen"],"k":0,"more":"<p>The lesson notes the age pattern gets asked directly.<\/p>"},{"id":"12-5","q":"After birth, where is blood made?","o":["Bone marrow and liver equally","Bone marrow, entirely","Liver and spleen, entirely"],"k":1},{"id":"12-6","q":"In a child, how much of the marrow is red and active?","o":["Essentially all of it","Only the axial skeleton","Essentially none of it"],"k":0},{"id":"12-7","q":"What happens to red marrow with age?","o":["Replaced by fat (yellow marrow); red marrow retreats to the axial skeleton","Expands into the long bones; yellow marrow retreats to the axial skeleton","Replaced by fat (yellow marrow); red marrow retreats to the skull and limbs"],"k":0},{"id":"12-8","q":"Where does red marrow remain in an adult?","o":["Vertebrae<br>Sternum<br>Ribs<br>Pelvis<br>Ends of long bones","Skull<br>Shafts of long bones<br>Hands<br>Feet<br>Patella","Vertebrae<br>Sternum<br>Ribs<br>Shafts of long bones<br>Phalanges"],"k":0},{"id":"12-9","q":"Why is an adult bone marrow biopsy taken from the iliac crest?","o":["One of the few adult sites with plenty of red marrow","It has the thinnest cortex of any bone in the body","It is the only adult site with yellow marrow"],"k":0},{"id":"12-10","q":"Why can a child's marrow be sampled far more widely than an adult's?","o":["A child's marrow is essentially all yellow","A child's bones lack cortical bone","A child's marrow is essentially all red"],"k":2}]},{"t":"Maturation: two rules","qs":[{"id":"12-11","q":"What two changes happen in parallel as blood cells mature in the marrow?","o":["Cell gets smaller<br>Nucleus condenses and shrinks","Cell gets larger<br>Nucleus condenses and shrinks","Cell gets smaller<br>Nucleus enlarges and loosens"],"k":0,"figs":["img/12_hemato_1.jpg"]},{"id":"12-12","q":"Why does the nucleus-to-cytoplasm ratio fall as marrow cells mature?","o":["Nucleus shrinks while cytoplasm accumulates","Cytoplasm shrinks faster than the nucleus","Nucleus and cytoplasm both enlarge equally"],"k":0,"figs":["img/12_hemato_1.jpg"]}]},{"t":"Red cell line","qs":[{"id":"12-13","q":"How does cytoplasm colour change as a red cell precursor matures?","o":["Deep blue → muddy intermediate → pink-orange","Deep blue → pale grey → bright red","Pink-orange → muddy intermediate → deep blue"],"k":0,"figs":["img/12_hemato_1.jpg"]},{"id":"12-14","q":"Why is early red cell precursor cytoplasm deep blue, and late cytoplasm pink-orange?","o":["Blue = full of granules<br>Pink-orange = full of iron stores","Blue = full of haemoglobin<br>Pink-orange = many ribosomes making protein","Blue = many ribosomes making protein<br>Pink-orange = full of haemoglobin"],"k":2,"figs":["img/12_hemato_1.jpg"]},{"id":"12-15","q":"What happens to the nucleus in the red cell line?","o":["Condenses → extruded","Enlarges → divides into many nuclei","Segments into lobes → retained"],"k":0,"figs":["img/12_hemato_1.jpg"]},{"id":"12-16","q":"What is a reticulocyte?","o":["The cell left once the nucleus is extruded, with a few remaining ribosomes → becomes a mature red cell","The cell just before the nucleus is extruded, with abundant ribosomes → becomes a normoblast","An immature granulocyte with a horseshoe-shaped nucleus → becomes a neutrophil"],"k":0,"figs":["img/12_hemato_1.jpg"]}]},{"t":"Granulocyte line","qs":[{"id":"12-17","q":"How does nuclear shape change as a granulocyte matures?","o":["Segmented into lobes → horseshoe (band cell) → indented → round","Round → horseshoe (band cell) → indented → segmented into lobes","Round → indented → horseshoe (band cell) → segmented into lobes"],"k":2,"figs":["img/12_hemato_1.jpg"]},{"id":"12-18","q":"What is a band cell?","o":["Immature granulocyte with a horseshoe-shaped nucleus","Mature granulocyte with a segmented, multilobed nucleus","Immature granulocyte with a round, central nucleus"],"k":0,"figs":["img/12_hemato_1.jpg"]},{"id":"12-19","q":"What is a \"left shift\"?","o":["A rise in band cells in the blood","A rise in reticulocytes in the blood","A fall in band cells in the blood"],"k":0},{"id":"12-20","q":"What does a left shift mean, and what usually causes it?","o":["Marrow failing to make new cells — usually aplastic anaemia","Marrow pushing out immature cells to meet demand — usually infection","Marrow releasing extra red cells to meet demand — usually bleeding"],"k":1}]}]},{"n":15,"key":"hist","t":"Lymphoid tissue","sub":"H14","cp2":true,"secs":[{"t":"What the lymphatic system does","qs":[{"id":"15-0","q":"What two jobs does the lymphatic system do?","o":["Drains tissue fluid back to the bloodstream<br>Haematopoiesis — makes red cells in lymph nodes","Carries oxygen to the tissues<br>Immune function — filters that fluid through immune tissue","Drains tissue fluid back to the bloodstream<br>Immune function — filters that fluid through immune tissue"],"k":2,"figs":["img/15_lymph_1.jpg"]},{"id":"15-1","q":"Where does the fluid that lymphatics collect come from?","o":["Fluid drawn back out of veins into the tissues","Fluid leaked from capillaries into the tissues with every pass","Fluid secreted by the lymph nodes themselves"],"k":1}]},{"t":"Lymphatic capillaries","qs":[{"id":"15-2","q":"How are lymphatic capillaries built, compared with blood capillaries?","o":["Blind-ended tubes; thicker-walled and far less permeable","Continuous loops; thinner-walled and far more permeable","Blind-ended tubes; thinner-walled and far more permeable"],"k":2,"figs":["img/15_lymph_1.jpg"]},{"id":"15-3","q":"How do lymphatic capillaries keep flow one-way?","o":["Overlapping endothelial cells act as one-way flaps — fluid pushes out, cannot push in","Overlapping endothelial cells act as one-way flaps — fluid pushes in, cannot push out","Tight junctions seal the endothelium — fluid enters only by transcytosis"],"k":1,"figs":["img/15_lymph_1.jpg"]}]},{"t":"Primary vs secondary organs","qs":[{"id":"15-4","q":"What separates primary from secondary lymphoid organs?","o":["Primary: lymphocytes made and matured<br>Secondary: lymphocytes do their work","Primary: lymphocytes meet antigen<br>Secondary: lymphocytes are made","Primary: lymphocytes do their work<br>Secondary: lymphocytes made and matured"],"k":0,"figs":["img/15_lymph_1.jpg"]},{"id":"15-5","q":"Name the primary lymphoid organs.","o":["Thymus<br>Lymph nodes","Bone marrow<br>Thymus","Bone marrow<br>Spleen"],"k":1,"figs":["img/15_lymph_1.jpg"]},{"id":"15-6","q":"What lymphoid role does the bone marrow play?","o":["Only B cells originate there; B cells mature there","All lymphocytes originate there; T cells mature there","All lymphocytes originate there; B cells mature there"],"k":2,"figs":["img/15_lymph_1.jpg"]},{"id":"15-7","q":"Where do T cells mature?","o":["Spleen","Bone marrow","Thymus"],"k":2,"figs":["img/15_lymph_1.jpg","img/15_lymph_2.jpg"]},{"id":"15-8","q":"Do lymphocytes in primary lymphoid organs meet antigen?","o":["Yes — they are selected by meeting foreign antigen there","Only B cells — T cells meet antigen first in the thymus","No — they become competent there before meeting any antigen"],"k":2},{"id":"15-9","q":"Name the secondary lymphoid organs.","o":["Lymph nodes<br>Thymus<br>Tonsils<br>Gut-associated lymphoid tissue","Lymph nodes<br>Spleen<br>Bone marrow<br>Gut-associated lymphoid tissue","Lymph nodes<br>Spleen<br>Tonsils<br>Gut-associated lymphoid tissue"],"k":2,"more":"<p>Where mature lymphocytes encounter antigen and respond.<\/p>","figs":["img/15_lymph_1.jpg"]}]},{"t":"Lymph node","qs":[{"id":"15-10","q":"How does lymph enter and leave a lymph node?","o":["Several afferent vessels (convex surface) in → single efferent vessel out at the hilum","Single afferent vessel (hilum) in → several efferent vessels out at the convex surface","Several afferent vessels (hilum) in → single efferent vessel out at the convex surface"],"k":0},{"id":"15-11","q":"Why does a lymph node have several vessels in and only one out?","o":["Slows flow → lets red cells settle out of the lymph","Slows flow → gives immune cells time to sample the lymph","Raises pressure → pushes lymph through the capsule"],"k":1},{"id":"15-12","q":"What does the cortex of a lymph node contain?","o":["Macrophages in sinuses only","T cells in follicles","B cells in follicles"],"k":2},{"id":"15-13","q":"What does a pale germinal centre in a lymph-node follicle mean?","o":["The follicle is undergoing necrosis","The follicle is actively responding","The follicle is resting (primary)"],"k":1},{"id":"15-14","q":"What is the paracortex of a lymph node?","o":["B cell zone, just deeper than the cortex","T cell zone, just deeper than the cortex","T cell zone, just beneath the capsule"],"k":1},{"id":"15-15","q":"What happens in the medulla of a lymph node?","o":["B cells mature","Cells enter","Cells exit"],"k":2},{"id":"15-16","q":"What is the organising idea of B versus T cell zones in lymphoid tissue?","o":["B cells in cortical follicles; T cells in the paracortex between","B cells in the medulla; T cells in cortical follicles","T cells in cortical follicles; B cells in the paracortex between"],"k":0,"more":"<p>The same split appears in the spleen, as white pulp.<\/p>"}]},{"t":"Spleen","qs":[{"id":"15-17","q":"What does the spleen filter?","o":["Both blood and lymph","Blood (not lymph)","Lymph (not blood)"],"k":1},{"id":"15-18","q":"What is splenic white pulp, and its function?","o":["Blood and macrophages — removes worn-out red cells","Lymphoid tissue around arterioles — makes red cells","Lymphoid tissue around arterioles — immune function"],"k":2},{"id":"15-19","q":"What is splenic red pulp, and its job?","o":["Blood and macrophages — makes new red cells","Blood and macrophages — removes worn-out red cells","Blood and megakaryocytes — produces platelets"],"k":1}]},{"t":"Thymus","qs":[{"id":"15-20","q":"How does the thymus change with age?","o":["Small in childhood → grows progressively larger and more active after puberty","Large and active in childhood → replaced by fibrous tissue soon after birth","Large and active in childhood → progressively replaced by fat after puberty"],"k":2,"figs":["img/15_lymph_2.jpg"]},{"id":"15-21","q":"What is a Hassall corpuscle, and where is it found?","o":["Whorl of flattened epithelial cells in the thymic cortex — found nowhere else","Whorl of flattened epithelial cells in the thymic medulla — found nowhere else","Pale germinal centre in a follicle — found in all secondary lymphoid organs"],"k":1,"figs":["img/15_lymph_3.jpg"]}]},{"t":"Which organ am I looking at?","qs":[{"id":"15-22","q":"Slide: a capsule, follicles around the outside, sinuses draining towards a hilum. Which organ?","o":["Lymph node (filters lymph)","Tonsil (samples the mouth)","Thymus (trains T cells)"],"k":0,"more":"<p>The three lymphoid organs are routinely asked as image questions.<\/p>","hy":true},{"id":"15-23","q":"Slide: islands of lymphocytes around small arteries in a sea of blood-filled tissue. Which organ?","o":["Spleen — red pulp in white pulp (filters lymph)","Thymus — cortex around medulla (trains T cells)","Spleen — white pulp in red pulp (filters blood)"],"k":2,"hy":true},{"id":"15-24","q":"Slide: lobules with dark cortex and pale medulla, whorled bodies in the medulla, no follicles. Which organ?","o":["Spleen","Thymus","Tonsil"],"k":1,"figs":["img/15_lymph_2.jpg","img/15_lymph_3.jpg"],"hy":true},{"id":"15-25","q":"On a lymphoid slide, what do follicles with germinal centres tell you?","o":["Thymus or bone marrow — making new lymphocytes","Lymph node or spleen — reacting to something","Lymph node or spleen — resting, unstimulated"],"k":1,"hy":true},{"id":"15-26","q":"Why does the thymus have no follicles?","o":["It trains B cells, which never form follicles","It trains T cells; it is not where they respond to antigen","It responds to antigen too quickly for follicles to form"],"k":1,"figs":["img/15_lymph_2.jpg"],"hy":true}]}]},{"n":29,"key":"bio","t":"Amino acids and how proteins fold","sub":"Primers 7–8","cp2":false,"secs":[{"t":"Amino acid structure","qs":[{"id":"29-0","q":"How many amino acids are commonly built into proteins?","o":["21 (of more than 500 in nature)","20 (of more than 300 in nature)","18 (of more than 300 in nature)"],"k":1},{"id":"29-1","q":"What four things are attached to an amino acid's α-carbon?","o":["Amino group<br>Carboxyl group<br>Hydrogen<br>Side chain (R group)","Amino group<br>Hydroxyl group<br>Hydrogen<br>Side chain (R group)","Imino group<br>Carboxyl group<br>Methyl group<br>Side chain (R group)"],"k":0},{"id":"29-2","q":"Which amino acid has an α-carbon that is not chiral?","o":["Proline","Glycine","Alanine"],"k":1},{"id":"29-3","q":"Which stereoisomer of amino acids do mammalian proteins use?","o":["L form","Racemic mix of D and L forms","D form"],"k":0},{"id":"29-4","q":"What sets an amino acid's class?","o":["Its side chain: hydrophobic ones hide from water, hydrophilic ones face it","Its carboxyl group: acidic ones face water, basic ones hide from it","Its α-amino group: charged ones face water, neutral ones hide from it"],"k":0}]},{"t":"Side-chain classes","qs":[{"id":"29-5","q":"Which amino acids are hydrophobic and aliphatic?","o":["Gly (G), Ala (A), Ser (S), Val (V), Leu (L), Ile (I), Met (M)","Gly (G), Ala (A), Cys (C), Val (V), Leu (L), Ile (I), Met (M)","Gly (G), Ala (A), Cys (C), Val (V), Leu (L), Ile (I), Phe (F)"],"k":1,"more":"<table><tr><th>Hydrophobic, aliphatic<\/th><td>G A C V L I M<\/td><\/tr><tr><th>Hydrophobic, aromatic<\/th><td>F Y W<\/td><\/tr><tr><th>Imino<\/th><td>P<\/td><\/tr><tr><th>Polar, uncharged<\/th><td>S T N Q<\/td><\/tr><tr><th>Acidic<\/th><td>D E<\/td><\/tr><tr><th>Basic<\/th><td>K R H<\/td><\/tr><\/table>"},{"id":"29-6","q":"Which amino acids are hydrophobic and aromatic?","o":["Phe (F), Tyr (Y), Pro (P)","Phe (F), His (H), Trp (W)","Phe (F), Tyr (Y), Trp (W)"],"k":2},{"id":"29-7","q":"Is tyrosine hydrophobic or hydrophilic?","o":["Mainly hydrophobic — though its OH can hydrogen-bond","Strongly hydrophilic — its OH carries a charge at pH 7.4","Purely hydrophobic — its OH cannot hydrogen-bond"],"k":0},{"id":"29-8","q":"Which amino acid is the imino acid, and what does its structure do?","o":["Proline (P) — rigid ring; sits in bends","Proline (P) — flexible chain; sits in helix centres","Glycine (G) — tiny side chain; sits in helices"],"k":0},{"id":"29-9","q":"Which amino acids are polar and uncharged?","o":["Ser (S), Thr (T), Asp (D), Glu (E)","Ser (S), Thr (T), Asn (N), Gln (Q)","Ser (S), Cys (C), Asn (N), His (H)"],"k":1,"more":"<p>They form hydrogen bonds.<\/p>"},{"id":"29-10","q":"Which amino acids are acidic, and what is their charge at pH 7.4?","o":["Asp (D), Glu (E) — negative","Asp (D), Glu (E) — positive","Asn (N), Gln (Q) — negative"],"k":0},{"id":"29-11","q":"Which amino acids are basic, and what is their charge at pH 7.4?","o":["Lys (K), Arg (R), Asn (N) — positive","Lys (K), Arg (R), His (H) — positive","Lys (K), Arg (R), His (H) — negative"],"k":1},{"id":"29-12","q":"What is histidine's charge at pH 7.4?","o":["Fully positive — strongly basic","Mostly negative — weakly acidic","Mostly uncharged — only weakly basic"],"k":2},{"id":"29-13","q":"Which two amino acids sit on the border between hydrophobic and polar uncharged?","o":["Serine and threonine","Glycine and proline","Cysteine and tyrosine"],"k":2,"more":"<p>Many charts call them polar uncharged.<\/p>"},{"id":"29-14","q":"Name the seven amino acids whose side chains can ionise.","o":["Asp, Glu, Arg, His, Lys, Asn, Gln","Asp, Glu, Arg, His, Lys, Ser, Thr","Asp, Glu, Arg, His, Lys, Cys, Tyr"],"k":2},{"id":"29-15","q":"Where do a soluble protein and a membrane protein put their nonpolar residues?","o":["Soluble: turned outward to the water<br>Membrane: buried inside the protein","Soluble: buried inside<br>Membrane: buried inside, away from the lipid","Soluble: buried inside<br>Membrane: turned outward into the lipid bilayer"],"k":2},{"id":"29-16","q":"How does a G-protein-coupled receptor cross the membrane?","o":["A single α-helix of mostly hydrophobic residues","Seven α-helices of mostly hydrophobic residues","Seven β-strands forming a hydrophobic β-barrel"],"k":1},{"id":"29-17","q":"What sequence feature signals a membrane-spanning segment?","o":["A helix of ~7 residues rich in valine, leucine and isoleucine","A helix of ~20 residues rich in valine, leucine and isoleucine","A helix of ~20 residues rich in aspartate, glutamate and lysine"],"k":1}]},{"t":"Charge and isoelectric point","qs":[{"id":"29-18","q":"What are the approximate pK<sub>a<\/sub>s of an amino acid's α-carboxyl and α-amino groups?","o":["α-carboxyl ~2.2<br>α-amino ~9.4","α-carboxyl ~4.2<br>α-amino ~7.4","α-carboxyl ~9.4<br>α-amino ~2.2"],"k":0},{"id":"29-19","q":"At pH 7.4, what form are the α-carboxyl and α-amino groups in?","o":["COOH and NH<sub>3<\/sub><sup>+<\/sup>","COOH and NH<sub>2<\/sub>","COO<sup>−<\/sup> and NH<sub>3<\/sub><sup>+<\/sup>"],"k":2},{"id":"29-20","q":"What is a zwitterion?","o":["Molecule with equal positive and negative charges, net charge zero","Molecule with more positive than negative charges, net charge positive","Molecule carrying two negative charges and one positive, net charge negative"],"k":0,"more":"<p>An amino acid with an uncharged side chain is a zwitterion at pH 7.4.<\/p>"},{"id":"29-21","q":"What is the isoelectric point (pI)?","o":["The pH at which net charge is maximal","The pH at which net charge is zero","The pH at which the side chain becomes charged"],"k":1},{"id":"29-22","q":"What is an amino acid's net charge below its pI, and above it?","o":["Below pI: net positive<br>Above pI: net negative","Below pI: net negative<br>Above pI: net positive","Below pI: net zero<br>Above pI: net negative"],"k":0},{"id":"29-23","q":"How do you calculate the pI of an amino acid with only two ionisable groups?","o":["Take the higher of the two pK<sub>a<\/sub>s","Add the two pK<sub>a<\/sub>s","Average the two pK<sub>a<\/sub>s"],"k":2},{"id":"29-24","q":"What is the pI of alanine (pK<sub>a<\/sub>s 2.3 and 9.1)?","o":["6.8","3.4","5.7"],"k":2},{"id":"29-25","q":"How do you calculate the pI of an amino acid with an ionisable side chain?","o":["Average the two nearest pK<sub>a<\/sub>s","Use the side-chain pK<sub>a<\/sub> alone","Average the two farthest pK<sub>a<\/sub>s"],"k":0},{"id":"29-26","q":"What is the pI of aspartate (pK<sub>a<\/sub>s 2.0, 4.0, 9.5)?","o":["6.75 = (4.0 + 9.5) / 2","5.75 = (2.0 + 9.5) / 2","3.0 = (2.0 + 4.0) / 2"],"k":2},{"id":"29-27","q":"What is the pI of arginine (pK<sub>a<\/sub>s 2.1, 9.0, 12.5)?","o":["7.30 = (2.1 + 12.5) / 2","5.55 = (2.1 + 9.0) / 2","10.75 = (9.0 + 12.5) / 2"],"k":2}]},{"t":"The peptide bond","qs":[{"id":"29-28","q":"What is a peptide bond?","o":["Amide link: α-amino group of one amino acid + side chain of the next","Ester link: α-carboxyl of one amino acid + side-chain hydroxyl of the next","Amide link: α-carboxyl of one amino acid + α-amino group of the next"],"k":2,"figs":["img/29_protein_1.webp"]},{"id":"29-29","q":"What is released when a peptide bond forms, and what is needed to break it?","o":["Forming releases ATP (condensation)<br>Breaking takes ATP back (phosphorolysis)","Forming releases water (condensation)<br>Breaking takes water back (hydrolysis)","Forming releases CO<sub>2<\/sub> (decarboxylation)<br>Breaking takes water back (hydrolysis)"],"k":1},{"id":"29-30","q":"Why can't the peptide bond rotate?","o":["Partial double-bond character","Steric clash between side chains","Full triple-bond character"],"k":0},{"id":"29-31","q":"What is the peptide unit?","o":["Cα and R group of one residue + N–H and R group of the next, lying in one plane","Cα and C=O of one residue + N–H and Cα of the next, freely rotating","Cα and C=O of one residue + N–H and Cα of the next, lying flat in one plane"],"k":2,"more":"<p>The R groups are <b>trans<\/b>.<\/p>"},{"id":"29-32","q":"Are the R groups across a peptide bond cis or trans?","o":["Trans","Randomly cis or trans","Cis"],"k":0},{"id":"29-33","q":"Around which bonds can a polypeptide chain bend, and what are the angles called?","o":["N–Cα (Φ, phi)<br>Cα–C (Ψ, psi)","N–Cα (Ψ, psi)<br>Cα–C (Φ, phi)","C–N peptide bond (Φ, phi)<br>Cα–C (Ψ, psi)"],"k":0},{"id":"29-34","q":"In which direction is a peptide sequence written and read?","o":["C-terminus (left) → N-terminus (right)","N-terminus (left) → C-terminus (right)","N-terminus (right) → C-terminus (left)"],"k":1,"more":"<p>Tyr-Gly-Gly-Phe-Leu is tyrosylglycylglycylphenylalanylleucine.<\/p>"}]},{"t":"Four levels of structure","qs":[{"id":"29-35","q":"What is primary structure, and what holds it?","o":["The amino acid sequence — hydrogen bonds","The amino acid sequence — disulfide bonds","The amino acid sequence — peptide bonds"],"k":2,"figs":["img/29_protein_1.webp"]},{"id":"29-36","q":"What is secondary structure, and what holds it?","o":["Local folding of the backbone — peptide bonds between neighbouring residues","Local folding of the backbone — hydrogen bonds between side-chain R groups","Local folding of the backbone — hydrogen bonds between backbone C=O and N–H"],"k":2,"figs":["img/29_protein_1.webp","img/29_protein_2.webp"]},{"id":"29-37","q":"What is tertiary structure, and what holds it?","o":["Whole fold of one chain — side-chain interactions (non-covalent and covalent)","Local folding of the backbone — side-chain interactions (covalent only)","Arrangement of several chains — side-chain interactions (non-covalent and covalent)"],"k":0,"figs":["img/29_protein_1.webp","img/29_protein_3.webp"]},{"id":"29-38","q":"What is quaternary structure, and what holds it?","o":["Arrangement of several chains — non-covalent forces","Whole fold of one chain — non-covalent forces","Arrangement of several chains — peptide bonds"],"k":0,"figs":["img/29_protein_1.webp"]}]},{"t":"Helix, sheet and sequence","qs":[{"id":"29-39","q":"What handedness and how many residues per turn does an α-helix have?","o":["Right-handed; 3.6 residues per turn","Left-handed; 3.6 residues per turn","Right-handed; 4.6 residues per turn"],"k":0,"figs":["img/29_protein_2.webp"]},{"id":"29-40","q":"How long is an average α-helix?","o":["~12 residues (range 5–45)","~4 residues (range 2–10)","~20 residues (range 10–60)"],"k":0},{"id":"29-41","q":"How are the hydrogen bonds arranged in an α-helix?","o":["Each side chain bonds the backbone four residues along; bonds run inside, parallel to the axis","Each C=O bonds the N–H on a neighbouring chain; bonds run outside, perpendicular to the axis","Each C=O bonds the N–H four residues along the same chain; bonds run inside, parallel to the axis"],"k":2,"figs":["img/29_protein_2.webp"]},{"id":"29-42","q":"Which way do the R groups point in an α-helix?","o":["Outward","Along the helix axis","Inward"],"k":0,"figs":["img/29_protein_1.webp"]},{"id":"29-43","q":"Where do the hydrogen bonds run in a β-sheet?","o":["Between neighbouring helices","Between side chains of the same strand","Between neighbouring strands"],"k":2,"figs":["img/29_protein_2.webp"]},{"id":"29-44","q":"What two orientations can β-sheet strands have?","o":["Coiled (wound together)<br>Antiparallel (opposite directions)","Parallel (same direction)<br>Antiparallel (opposite directions)","Left-handed (same direction)<br>Right-handed (opposite directions)"],"k":1,"figs":["img/29_protein_2.webp"]},{"id":"29-45","q":"Where do the R groups sit in a β-sheet?","o":["All on one face of the sheet","Above and below the sheet","Pointing into the centre of the sheet"],"k":1},{"id":"29-46","q":"What are irregular stretches of a polypeptide called?","o":["Random coil","Disordered domain","β-turn"],"k":0},{"id":"29-47","q":"Which small amino acid favours the α-helix?","o":["Glycine","Alanine","Proline"],"k":1},{"id":"29-48","q":"Which amino acid is the helix breaker, and why?","o":["Glycine — its large ring blocks hydrogen bonding","Proline — its rigid ring kinks the chain","Proline — its charged side chain repels the chain"],"k":1},{"id":"29-49","q":"Which amino acids are common in β-sheets, and why?","o":["Gly, Ala, Ser (small R groups) — sheets pack strands tightly","Trp, Tyr, Phe (large rings) — sheets leave room for bulky side chains","Asp, Glu (charged) — sheets need ionic bonds between strands"],"k":1},{"id":"29-50","q":"What is a β-turn, and which amino acids usually build it?","o":["A tight U-turn — cysteine (disulfide) and methionine (start residue)","A tight U-turn — tryptophan (large ring) and tyrosine (OH group)","A tight U-turn — glycine (smallest R group) and proline (the kink)"],"k":2},{"id":"29-51","q":"Switching between β-sheet and α-helix rearranges which bonds?","o":["Disulfide bonds, not hydrogen bonds — the sequence is unchanged","Hydrogen bonds, not peptide bonds — the sequence is unchanged","Peptide bonds, not hydrogen bonds — the sequence is altered"],"k":1,"more":"<p>That switch is what goes wrong in the misfolding diseases.<\/p>","figs":["img/29_protein_2.webp"]}]},{"t":"Tertiary and quaternary detail","qs":[{"id":"29-52","q":"What are domains, and give an all-α and a β-barrel example.","o":["Packed secondary elements within a tertiary fold<br>All-α: myoglobin and haemoglobin chains<br>β-barrel: green fluorescent protein","Separate polypeptide chains within a quaternary assembly<br>All-α: myoglobin and haemoglobin chains<br>β-barrel: green fluorescent protein","Packed secondary elements within a tertiary fold<br>All-α: green fluorescent protein<br>β-barrel: myoglobin and haemoglobin chains"],"k":0},{"id":"29-53","q":"Name the five interactions that hold a tertiary fold.","o":["Hydrophobic interactions<br>Phosphodiester bonds<br>Ionic bonds<br>Disulfide bonds<br>Metal ions","Hydrophobic interactions<br>Hydrogen bonds<br>Ionic bonds<br>Peptide bonds<br>Glycosidic bonds","Hydrophobic interactions<br>Hydrogen bonds<br>Ionic bonds<br>Disulfide bonds<br>Metal ions"],"k":2,"figs":["img/29_protein_3.webp"]},{"id":"29-54","q":"What is an example of an ionic bond in a folded protein?","o":["Electrostatic attraction, e.g. aspartate with lysine","Electrostatic attraction, e.g. leucine with valine","Electrostatic attraction, e.g. lysine with arginine"],"k":0,"figs":["img/29_protein_3.webp"]},{"id":"29-55","q":"Which tertiary bond is covalent, between which residues, and in which named protein?","o":["Disulfide bond — between methionines; e.g. insulin","Disulfide bond — between cysteines; e.g. insulin","Disulfide bond — between serines; e.g. myoglobin"],"k":1,"figs":["img/29_protein_3.webp"]},{"id":"29-56","q":"Give two examples of metal ions holding a protein fold.","o":["Zinc in zinc fingers of steroid-hormone receptors<br>Copper site of plastocyanin","Magnesium in zinc fingers of steroid-hormone receptors<br>Iron site of plastocyanin","Iron in zinc fingers of steroid-hormone receptors<br>Copper site of haemoglobin"],"k":0},{"id":"29-57","q":"Give two examples of quaternary structure.","o":["Myoglobin: 2α + 2β<br>Insulin: hexamer around zinc","Haemoglobin: 2α + 2β<br>Insulin: hexamer around zinc","Haemoglobin: 2α + 2γ<br>Insulin: dimer around copper"],"k":1,"more":"<p>Subunits may be identical or different.<\/p>","figs":["img/29_protein_1.webp"]},{"id":"29-58","q":"How can quaternary subunits behave relative to each other?","o":["Only independently, never cooperatively","Independently, or cooperatively (as in haemoglobin)","Independently, or cooperatively (as in myoglobin)"],"k":1}]},{"t":"Folding and chaperones","qs":[{"id":"29-59","q":"What determines a protein's tertiary structure?","o":["Chaperones — they set the final fold","Disulfide bonds — they fix the fold first","Its primary sequence — a chain folds itself"],"k":2},{"id":"29-60","q":"What is the driving force of protein folding?","o":["Hydrogen bonding — polar side chains gather in the core away from water","Hydrophobic effect — nonpolar side chains gather on the surface toward water","Hydrophobic effect — nonpolar side chains gather in the core away from water"],"k":2,"more":"<p>Entropy-driven; the protein settles at its lowest free energy.<\/p>"},{"id":"29-61","q":"At what energy state does a folded protein settle?","o":["Highest free energy","Highest entropy of the chain","Lowest free energy"],"k":2},{"id":"29-62","q":"What are chaperones, and what do they use?","o":["Ubiquitin ligases that tag misfolded proteins — use ATP","Heat shock proteins (Hsp) that help folding — use ATP","Heat shock proteins (Hsp) that help folding — use GTP"],"k":1},{"id":"29-63","q":"What does Hsp70 do?","o":["Cuts exposed hydrophobic stretches that would clump","Encloses the folding chain and acts as a template","Binds exposed hydrophobic stretches that would clump"],"k":2},{"id":"29-64","q":"What does Hsp60 do?","o":["Encloses the folding chain and acts as a template","Encloses the misfolded chain and degrades it","Binds exposed hydrophobic stretches that would clump"],"k":0}]},{"t":"Misfolding, amyloid, prions","qs":[{"id":"29-65","q":"What two things can make a protein misfold?","o":["Glycosylation<br>A folding fault","Phosphorylation<br>Ubiquitination","A mutation<br>A folding fault"],"k":2},{"id":"29-66","q":"What usually happens to a misfolded protein?","o":["Secreted (exocytosis)","Stored (amyloid plaque)","Degraded (ubiquitin–proteasome)"],"k":2},{"id":"29-67","q":"What structure do amyloid-forming proteins adopt, and what do they form?","o":["β-sheet → insoluble amyloid fibrils","β-sheet → soluble amyloid oligomers only","α-helix → insoluble amyloid fibrils"],"k":0},{"id":"29-68","q":"Which protein forms amyloid in Alzheimer disease?","o":["Amyloid β (Aβ)","TDP-43","α-Synuclein"],"k":0},{"id":"29-69","q":"Which protein forms amyloid in Parkinson disease?","o":["Huntingtin","α-Synuclein","Amyloid β (Aβ)"],"k":1},{"id":"29-70","q":"Which protein forms amyloid in amyotrophic lateral sclerosis (ALS)?","o":["α-Synuclein","TDP-43","Amyloid β (Aβ)"],"k":1},{"id":"29-71","q":"Which class of amyloid disease includes Huntington disease?","o":["Polyglutamine diseases","Prion diseases","Synucleinopathies"],"k":0},{"id":"29-72","q":"How is Aβ made in Alzheimer disease?","o":["Amyloid precursor protein (APP) cut by α- and β-secretase → Aβ (40/42) → aggregates into tangles","Amyloid precursor protein (APP) cut by α- and γ-secretase → Aβ (40/42) → aggregates into plaques","Amyloid precursor protein (APP) cut by β- and γ-secretase → Aβ (40/42) → aggregates into plaques"],"k":2},{"id":"29-73","q":"What does α-secretase do to amyloid precursor protein?","o":["The pathological cut — produces Aβ","The usual cut — produces Aβ","The usual cut — prevents Aβ forming"],"k":2},{"id":"29-74","q":"Which gene is linked to sporadic Alzheimer disease?","o":["<i>SNCA<\/i>","<i>APP<\/i>","<i>APOE<\/i>"],"k":2},{"id":"29-75","q":"How does PrP<sup>Sc<\/sup> differ from normal PrP<sup>C<\/sup>?","o":["Same sequence, extra disulfide bonds","Different sequence, same conformation","Same sequence, different conformation"],"k":2},{"id":"29-76","q":"What two properties make PrP<sup>Sc<\/sup> dangerous?","o":["Forms protease-resistant fibrils<br>Carries its own nucleic acid genome","Forms protease-resistant fibrils<br>Templates more PrP<sup>C<\/sup> into PrP<sup>Sc<\/sup>","Forms soluble α-helical monomers<br>Templates more PrP<sup>Sc<\/sup> back into PrP<sup>C<\/sup>"],"k":1},{"id":"29-77","q":"What are the three origins of prion disease, with examples?","o":["Acquired (most)<br>Inherited: familial Creutzfeldt–Jakob disease (X-linked)<br>Sporadic: mad cow disease, cadaveric growth hormone, kuru","Sporadic (most)<br>Inherited: familial Creutzfeldt–Jakob disease (autosomal dominant)<br>Acquired: mad cow disease, cadaveric growth hormone, kuru","Inherited (most)<br>Sporadic: familial Creutzfeldt–Jakob disease (autosomal recessive)<br>Acquired: mad cow disease, cadaveric growth hormone, kuru"],"k":1},{"id":"29-78","q":"Name the prion disease in humans, sheep, cattle and deer.","o":["Humans: Creutzfeldt–Jakob disease<br>Sheep: chronic wasting disease<br>Cattle: bovine spongiform encephalopathy<br>Deer: scrapie","Humans: Creutzfeldt–Jakob disease<br>Sheep: scrapie<br>Cattle: chronic wasting disease<br>Deer: bovine spongiform encephalopathy","Humans: Creutzfeldt–Jakob disease<br>Sheep: scrapie<br>Cattle: bovine spongiform encephalopathy<br>Deer: chronic wasting disease"],"k":2}]},{"t":"Fibrous vs globular proteins","qs":[{"id":"29-79","q":"Fibrous vs globular proteins: shape and role?","o":["Fibrous: long, narrow, structural<br>Globular: rounded, functional (catalysis, transport)","Fibrous: rounded, functional (catalysis, transport)<br>Globular: long, narrow, structural","Fibrous: long, narrow, functional (catalysis, transport)<br>Globular: rounded, structural"],"k":0,"more":"<table><tr><th><\/th><th>Fibrous<\/th><th>Globular<\/th><\/tr><tr><td>Shape, role<\/td><td>Long, narrow; structural<\/td><td>Rounded; functional<\/td><\/tr><tr><td>In water<\/td><td>Generally insoluble<\/td><td>Generally soluble<\/td><\/tr><tr><td>Sequence<\/td><td>Repetitive<\/td><td>Irregular<\/td><\/tr><tr><td>Heat, pH<\/td><td>Less sensitive<\/td><td>More sensitive<\/td><\/tr><\/table>"},{"id":"29-80","q":"Fibrous vs globular proteins: solubility in water?","o":["Fibrous: generally soluble<br>Globular: generally soluble","Fibrous: generally soluble<br>Globular: generally insoluble","Fibrous: generally insoluble<br>Globular: generally soluble"],"k":2},{"id":"29-81","q":"Fibrous vs globular proteins: sequence?","o":["Fibrous: repetitive<br>Globular: repetitive","Fibrous: irregular<br>Globular: repetitive","Fibrous: repetitive<br>Globular: irregular"],"k":2},{"id":"29-82","q":"Fibrous vs globular proteins: sensitivity to heat and pH?","o":["Fibrous: equally sensitive<br>Globular: equally sensitive","Fibrous: more sensitive<br>Globular: less sensitive","Fibrous: less sensitive<br>Globular: more sensitive"],"k":2},{"id":"29-83","q":"Give examples of fibrous proteins.","o":["Collagen, insulin, elastin, actin, myosin, catalase","Collagen, keratin, elastin, actin, myosin, fibrin","Myoglobin, keratin, albumin, actin, myosin, fibrin"],"k":1},{"id":"29-84","q":"Give examples of globular proteins.","o":["Haemoglobin, insulin, catalase, immunoglobulins","Keratin, insulin, catalase, immunoglobulins","Haemoglobin, insulin, collagen, immunoglobulins"],"k":0}]}]},{"n":20,"key":"bio","t":"Haemoglobin: the oxygen carrier","sub":"Lecture 22","cp2":false,"secs":[{"t":"Myoglobin vs haemoglobin","qs":[{"id":"20-0","q":"Myoglobin and haemoglobin differ at which level of protein structure?","o":["Quaternary","Tertiary","Secondary"],"k":0,"more":"<p>Both bind O<sub>2<\/sub> with haem at the centre and have similar primary, secondary and tertiary structure; the quaternary difference drives everything else.<\/p>"},{"id":"20-1","q":"What is myoglobin's structure?","o":["Dimer — two chains, two haems, two O<sub>2<\/sub>","Monomer — one chain, one haem, one O<sub>2<\/sub>","Monomer — one chain, four haems, four O<sub>2<\/sub>"],"k":1},{"id":"20-2","q":"What is haemoglobin's structure?","o":["Tetramer — four chains (2α + 2γ in adults), four haems, four O<sub>2<\/sub>","Tetramer — four chains (2α + 2β in adults), four haems, four O<sub>2<\/sub>","Tetramer — four chains (4α in adults), four haems, four O<sub>2<\/sub>"],"k":1},{"id":"20-3","q":"Where is myoglobin found, and what does it do?","o":["Cardiac and skeletal muscle — stores O<sub>2<\/sub> for the muscle's own ATP production during contraction","Cardiac and skeletal muscle — transports CO<sub>2<\/sub> out of the muscle to the capillaries","Red blood cells — carries O<sub>2<\/sub> from the lungs to the muscles during contraction"],"k":0},{"id":"20-4","q":"What are the approximate molecular masses of myoglobin and haemoglobin?","o":["Myoglobin ~64 kDa<br>Haemoglobin ~17 kDa","Myoglobin ~17 kDa<br>Haemoglobin ~64 kDa","Myoglobin ~17 kDa<br>Haemoglobin ~34 kDa"],"k":1},{"id":"20-5","q":"What share of the red cell's dry weight is haemoglobin?","o":["About 96%","About 33%","About 66%"],"k":0},{"id":"20-6","q":"What is haemoglobin's job?","o":["Carry O<sub>2<\/sub> from lungs to tissues","Carry CO<sub>2<\/sub> from lungs to tissues","Carry O<sub>2<\/sub> from tissues to lungs"],"k":0}]},{"t":"Oxygen curve and P50","qs":[{"id":"20-7","q":"What is cooperativity in haemoglobin?","o":["One subunit binds CO<sub>2<\/sub> → changes shape → next subunit binds O<sub>2<\/sub> more easily","One subunit binds O<sub>2<\/sub> → changes shape → next subunit binds more easily","One subunit binds O<sub>2<\/sub> → changes shape → next subunit binds less easily"],"k":1},{"id":"20-8","q":"What shape is each oxygen-binding curve: haemoglobin vs myoglobin?","o":["Haemoglobin: sigmoid (S-shaped)<br>Myoglobin: sigmoid (S-shaped)","Haemoglobin: hyperbola<br>Myoglobin: sigmoid (S-shaped)","Haemoglobin: sigmoid (S-shaped)<br>Myoglobin: hyperbola"],"k":2,"figs":["img/20_hb_2.webp","img/20_hb_1.png"]},{"id":"20-9","q":"Why does haemoglobin's curve have to be sigmoid?","o":["Holds O<sub>2<\/sub> tightly at all PO<sub>2<\/sub> values so none is lost before reaching the tissues","Loads fully in the lungs (high PO<sub>2<\/sub>) and unloads readily in the tissues (lower PO<sub>2<\/sub>)","Loads fully in the tissues (high PO<sub>2<\/sub>) and unloads readily in the lungs (lower PO<sub>2<\/sub>)"],"k":1,"figs":["img/20_hb_2.webp"]},{"id":"20-10","q":"Why would a hyperbolic carrier like myoglobin be a poor O<sub>2<\/sub> transporter?","o":["It binds O<sub>2<\/sub> only above 100 mm Hg and so stays empty in the blood","It releases O<sub>2<\/sub> too readily in the lungs and never fills — right for a transporter, wrong for a store","It grips O<sub>2<\/sub> just as tightly in the tissues and won't let go — right for a store, wrong for a transporter"],"k":2,"figs":["img/20_hb_2.webp"]},{"id":"20-11","q":"How does the flat top of the haemoglobin curve protect loading, in numbers?","o":["Alveolar PO<sub>2<\/sub> 104 → 60 mm Hg drops saturation ~97% → 50%","Alveolar PO<sub>2<\/sub> 104 → 60 mm Hg drops saturation only ~97% → 89%","Alveolar PO<sub>2<\/sub> 104 → 40 mm Hg drops saturation only ~97% → 95%"],"k":1,"more":"<p>As on a mountain.<\/p>","figs":["img/20_hb_1.png"]},{"id":"20-12","q":"What is the P<sub>50<\/sub>?","o":["The PO<sub>2<\/sub> at which half the haem iron is oxidised","The PO<sub>2<\/sub> at which all the binding sites are full","The PO<sub>2<\/sub> at which half the binding sites are full"],"k":2,"figs":["img/20_hb_1.png"]},{"id":"20-13","q":"What are the P<sub>50<\/sub>s of myoglobin and haemoglobin?","o":["Myoglobin ~1 mm Hg<br>Haemoglobin ~50 mm Hg","Myoglobin ~1 mm Hg<br>Haemoglobin ~26 mm Hg","Myoglobin ~26 mm Hg<br>Haemoglobin ~1 mm Hg"],"k":1,"figs":["img/20_hb_2.webp"]},{"id":"20-14","q":"Where is haemoglobin's curve steepest, and why does it matter?","o":["At very low PO<sub>2<\/sub> near zero → only severe hypoxia releases O<sub>2<\/sub>","Across tissue PO<sub>2<\/sub> → a small fall in PO<sub>2<\/sub> releases a lot of O<sub>2<\/sub>","Across alveolar PO<sub>2<\/sub> → a small fall in PO<sub>2<\/sub> loads a lot more O<sub>2<\/sub>"],"k":1,"more":"<p>In the lungs haemoglobin is fully saturated.<\/p>","figs":["img/20_hb_2.webp"]},{"id":"20-15","q":"In muscle, which way does O<sub>2<\/sub> pass between haemoglobin and myoglobin, and why?","o":["Haemoglobin → myoglobin — myoglobin has a sigmoid curve and a higher P<sub>50<\/sub>","Myoglobin → haemoglobin — haemoglobin has the higher affinity at tissue PO<sub>2<\/sub>","Haemoglobin → myoglobin — myoglobin stays almost full at tissue PO<sub>2<\/sub>; suits its storage role"],"k":2,"figs":["img/20_hb_2.webp"]}]},{"t":"Shifting the curve","qs":[{"id":"20-16","q":"What is deoxyhaemoglobin's state, and its O<sub>2<\/sub> affinity?","o":["R (relaxed) — low affinity","T (taut) — high affinity","T (taut) — low affinity"],"k":2},{"id":"20-17","q":"What is oxyhaemoglobin's state, and its O<sub>2<\/sub> affinity?","o":["T (taut) — high affinity","R (relaxed) — low affinity","R (relaxed) — high affinity"],"k":2},{"id":"20-18","q":"How does every modifier change haemoglobin's grip on O<sub>2<\/sub>?","o":["By changing the oxidation state of haem iron","By tipping the T ⇌ R equilibrium","By altering the number of globin chains"],"k":1},{"id":"20-19","q":"Which two molecules favour the R state, and which way do they shift the curve?","o":["O<sub>2<\/sub> and 2,3-BPG → shift left (lower P<sub>50<\/sub>)","O<sub>2<\/sub> and carbon monoxide → shift right (higher P<sub>50<\/sub>)","O<sub>2<\/sub> and carbon monoxide → shift left (lower P<sub>50<\/sub>)"],"k":2,"more":"<p>O<sub>2<\/sub> favouring R is the cooperativity itself.<\/p>","figs":["img/20_hb_3.webp"],"hy":true},{"id":"20-20","q":"Which three things favour the T state, and which way do they shift the curve?","o":["OH<sup>−<\/sup>, O<sub>2<\/sub>, 2,3-bisphosphoglycerate (2,3-BPG) → shift right (higher P<sub>50<\/sub>)","H<sup>+<\/sup>, CO<sub>2<\/sub>, 2,3-bisphosphoglycerate (2,3-BPG) → shift right (higher P<sub>50<\/sub>)","H<sup>+<\/sup>, CO, 2,3-bisphosphoglycerate (2,3-BPG) → shift right (higher P<sub>50<\/sub>)"],"k":1,"more":"<p>The lesson flags the shift directions as standard, tested material.<\/p>","figs":["img/20_hb_3.webp"],"hy":true},{"id":"20-21","q":"Which three features of hard-working tissue make haemoglobin release O<sub>2<\/sub> more readily?","o":["Acidic<br>Warm<br>High CO<sub>2<\/sub>","Acidic<br>Cool<br>High CO<sub>2<\/sub>","Acidic<br>Warm<br>Low CO<sub>2<\/sub>"],"k":0,"figs":["img/20_hb_3.webp"]},{"id":"20-22","q":"What is the Bohr effect?","o":["O<sub>2<\/sub> binding lowering haemoglobin's CO<sub>2<\/sub> affinity","Acid and CO<sub>2<\/sub> lowering haemoglobin's O<sub>2<\/sub> affinity","Acid and CO<sub>2<\/sub> raising haemoglobin's O<sub>2<\/sub> affinity"],"k":1,"more":"<p>Heat acts separately, in the same direction.<\/p>","figs":["img/20_hb_3.webp"]},{"id":"20-23","q":"Why is the Bohr effect self-targeting?","o":["Kidneys release erythropoietin when tissue O<sub>2<\/sub> is low","Tissue signals its own need with its own metabolic waste","Red cells sense tissue PO<sub>2<\/sub> directly via the haem iron"],"k":1},{"id":"20-24","q":"How does carbonic anhydrase drive the Bohr effect?","o":["CO<sub>2<\/sub> → carbonic acid → H<sup>+<\/sup> binds haem iron → stabilises R","CO<sub>2<\/sub> → carbonic acid → H<sup>+<\/sup> binds ionisable groups on haemoglobin → stabilises R","CO<sub>2<\/sub> → carbonic acid → H<sup>+<\/sup> binds ionisable groups on haemoglobin → stabilises T"],"k":2},{"id":"20-25","q":"What is carbaminohaemoglobin?","o":["CO<sub>2<\/sub> bound to the β-chain pocket used by 2,3-BPG — stabilises R","CO bound to the terminal amino groups of the globin chains — stabilises R","CO<sub>2<\/sub> bound to the terminal amino groups of the globin chains — stabilises T"],"k":2,"more":"<p>Hb–NH<sub>2<\/sub> + CO<sub>2<\/sub> ⇌ Hb–NH–COO<sup>−<\/sup> + H<sup>+<\/sup><\/p>"},{"id":"20-26","q":"What happens to the Bohr-effect chemistry in the lungs?","o":["Runs backwards: CO<sub>2<\/sub> breathed out → H<sup>+<\/sup> binds → O<sub>2<\/sub> unloads","Runs backwards: CO<sub>2<\/sub> breathed out → H<sup>+<\/sup> leaves → O<sub>2<\/sub> loads","Runs the same way: CO<sub>2<\/sub> taken up → H<sup>+<\/sup> binds → O<sub>2<\/sub> unloads"],"k":1}]},{"t":"2,3-BPG and altitude","qs":[{"id":"20-27","q":"Where does 2,3-BPG come from?","o":["The liver makes it from a glycolytic intermediate — and releases it into the plasma for red cells to take up","Red cells make it from a Krebs-cycle intermediate — at a fixed rate they cannot change","Red cells make it from a glycolytic intermediate — and can change how fast they make or break it down"],"k":2,"more":"<p>It acts like the Bohr effect but over a longer timescale.<\/p>"},{"id":"20-28","q":"Where does 2,3-BPG bind haemoglobin, and with what effect?","o":["Positively charged pocket between the two α chains of <i>deoxy<\/i>haemoglobin → stabilises T, lowers affinity","Positively charged pocket between the two β chains of <i>deoxy<\/i>haemoglobin → stabilises T, lowers affinity","Negatively charged pocket between the two β chains of <i>oxy<\/i>haemoglobin → stabilises R, raises affinity"],"k":1,"figs":["img/20_hb_3.webp"]},{"id":"20-29","q":"When does 2,3-BPG rise?","o":["Chronic hypoxia (altitude, anaemia, chronic lung disease)<br>Exercise","Chronic hyperventilation (alkalosis, anxiety, pregnancy)<br>Sleep","Polycythaemia (high haematocrit, dehydration)<br>Cold exposure"],"k":0},{"id":"20-30","q":"At sea level, what saturations does haemoglobin load to and unload to, and how much is delivered?","o":["Loads 100% → leaves tissues 75% → 25% delivered","Loads 100% → leaves tissues 40% → 60% delivered","Loads 100% → leaves tissues 60% → 40% delivered"],"k":2},{"id":"20-31","q":"At altitude before adaptation, how much O<sub>2<\/sub> does haemoglobin deliver?","o":["Loads 90% → leaves 40% → 50% delivered","Loads 80% → leaves 60% → 20% delivered","Loads 90% → leaves 60% → 30% delivered"],"k":2},{"id":"20-32","q":"After altitude adaptation (more 2,3-BPG), how much O<sub>2<\/sub> does haemoglobin deliver?","o":["Loads 80% → unloads to 60% → 20% delivered","Loads 80% → unloads to 40% → 40% delivered","Loads 90% → unloads to 40% → 50% delivered"],"k":1},{"id":"20-33","q":"Why does a right shift help at altitude?","o":["A large loss in unloading is offset by better loading","A small gain in loading buys a bigger gain in unloading","A small loss in loa aemia most common?","o":["Asian, Mediterranean, Middle Eastern, Hispanic, West Indian","African American, sub-Saharan African, Caribbean, Brazilian, Saudi","Southeast Asian, West Indian, Mediterranean, African"],"k":0},{"id":"20-72","q":"β-thalassaemia minor: genotype and presentation?","o":["β<sup>0<\/sup>/β<sup>0<\/sup> — mild microcytic anaemia","β<sup>+<\/sup>/β<sup>+<\/sup> — no anaemia; silent carrier","β<sup>+<\/sup>/β or β<sup>0<\/sup>/β — mild microcytic anaemia"],"k":2},{"id":"20-73","q":"β-thalassaemia intermedia: genotype and presentation?","o":["β<sup>+<\/sup>/β<sup>+<\/sup> or β<sup>+<\/sup>/β<sup>0<\/sup> — macrocytic anaemia; no transfusions","β<sup>+<\/sup>/β<sup>+<\/sup> or β<sup>+<\/sup>/β<sup>0<\/sup> — microcytic anaemia; occasional transfusions","β<sup>+<\/sup>/β or β<sup>0<\/sup>/β — microcytic anaemia; occasional transfusions"],"k":1},{"id":"20-74","q":"β-thalassaemia major (Cooley anaemia): genotype and presentation?","o":["β<sup>0<\/sup>/β<sup>0<\/sup> — severe anaemia, splenomegaly, bone deformities; regular transfusions","β<sup>+<\/sup>/β<sup>0<\/sup> — severe anaemia, splenomegaly, bone deformities; regular transfusions","β<sup>0<\/sup>/β — severe anaemia, splenomegaly, bone deformities; occasional transfusions"],"k":0},{"id":"20-75","q":"How many α-globin genes are there, and what sets α-thalassaemia severity?","o":["Four (two on each chromosome 11) — severity tracks how many are lost","Two (one on each chromosome 16) — severity tracks which one is lost","Four (two on each chromosome 16) — severity tracks how many are lost"],"k":2},{"id":"20-76","q":"α-thalassaemia: one gene lost?","o":["HbH disease — variable anaemia","α-thalassaemia trait — mild anaemia","Silent carrier — no symptoms"],"k":2},{"id":"20-77","q":"α-thalassaemia: two genes lost?","o":["HbH disease — variable anaemia","α-thalassaemia major — severe anaemia","α-thalassaemia trait — mild anaemia"],"k":2},{"id":"20-78","q":"α-thalassaemia: three genes lost?","o":["Hb Bart di block large arteries → stroke, gangrene, painless limb ischaemia","Sickled cells haemolyse in the spleen → sudden fall in haemoglobin, splenomegaly, shock"],"k":0},{"id":"20-85","q":"Why do sickle cell patients have chronic anaemia and sometimes jaundice?","o":["Sickled cells are rigid → removed by the kidney and lost in urine","Sickled cells cannot leave the marrow → too few are released","Sickled cells are fragile → haemolyse and are removed by the spleen"],"k":2,"more":"<p>Jaundice may show as scleral icterus.<\/p>"},{"id":"20-86","q":"How is sickle cell disease inherited, and how common is it in African Americans?","o":["Autosomal dominant; ~1 in 500","Autosomal recessive; ~1 in 50","Autosomal recessive; ~1 in 500"],"k":2}]},{"t":"Sickle cell: triggers and a case","qs":[{"id":"20-87","q":"By what four routes do triggers provoke sickling?","o":["Push HbS to the R state<br>Concentrate HbS in the cell<br>Thin the blood<br>Add oxidative stress","Push HbS to the T state<br>Concentrate HbS in the cell<br>Thin the blood<br>Add reductive stress","Push HbS to the T state<br>Concentrate HbS in the cell<br>Thicken the blood<br>Add oxidative stress"],"k":2},{"id":"20-88","q":"Name the triggers of sickling.","o":["Hypoxia (strenuous exercise, altitude, illness)<br>Alkalosis<br>Overhydration<br>Extreme heat or cold<br>Alcohol, smoking<br>Infection, stress","Hypoxia (strenuous exercise, altitude, illness)<br>Acidosis<br>Dehydration<br>Extreme heat or cold<br>Alcohol, smoking<br>Infection, stress","Hypoxia (strenuous exercise, altitude, illness)<br>Acidosis<br>Overhydration<br>Mild warmth<br>Hydroxyurea, folate<br>Infection, stress"],"k":1},{"id":"20-89","q":"A woman with sickle cell disease flies to Denver, drinks heavily, and has severe back, abdominal and limb pain. Diagnosis?","o":["Acute alcoholic pancreatitis","Acute vaso-occlusive pain episode","Acute splenic sequestration crisis"],"k":1,"more":"<p>She also had dehydration, tachypnoea and pale nail beds; haemoglobin 9 g/dL.<\/p>"},{"id":"20-90","q":"How does altitude (Denver, ~5,300 ft) provoke sickling?","o":["PO<sub>2<\/sub> falls ~50–60% → all HbS in the deoxy state","PCO<sub>2<\/sub> rises ~17–20% → more HbS in the oxy state","PO<sub>2<\/sub> falls ~17–20% → more HbS in the deoxy state"],"k":2},{"id":"20-91","q":"How does heavy drinking provoke sickling?","o":["Alcohol is an antidiuretic → fluid overload → red cells swell (HbS diluted) + blood thins and speeds → cells lyse and release HbS","Alcohol is a diuretic → dehydration → red cells swell (HbS diluted) + blood thins and speeds → cells stick and block capillaries","Alcohol is a diuretic → dehydration → red cells shrink (HbS concentrated) + blood thickens and slows → cells stick and block capillaries"],"k":2},{"id":"20-92","q":"The Denver sickle cell patient's anion gap is 147 − (110 + 16), with HCO<sub>3<\/sub><sup>−<\/sup> 16. What is the gap, and what acid–base disorder is it?","o":["11 → normal-anion-gap metabolic acidosis","21 → high-anion-gap metabolic acidosis","31 → high-anion-gap metabolic acidosis"],"k":1,"more":"<p>pH 7.36, PCO<sub>2<\/sub> 29. Cause: alcohol-driven lactic acid, which itself favours deoxy-HbS.<\/p>"},{"id":"20-93","q":"Why was the sickle cell patient in Denver breathing fast (PCO<sub>2<\/sub> 29)?","o":["Respiratory compensation for her metabolic alkalosis","Respiratory compensation for her metabolic acidosis","Primary respiratory alkalosis from anxiety and pain"],"k":1},{"id":"20-94","q":"What is the acute care for a vaso-occlusive pain episode?","o":["IV opioids and saline<br>Hyperbaric O<sub>2<\/sub> for all patients<br>Thrombolysis to dissolve clots, if admitted","IV opioids and diuretics<br>O<sub>2<\/sub> if saturation &lt;95%<br>Warfarin to dissolve clots, if admitted","IV opioids and saline<br>O<sub>2<\/sub> if saturation &lt;95%<br>Heparin to prevent clots, if admitted"],"k":2},{"id":"20-95","q":"What long-term advice prevents sickle crises?","o":["Avoid alcohol and smoking<br>Stay well hydrated<br>Avoid vigorous exercise<br>Take care at altitude","Avoid fluids and salt<br>Stay well rested<br>Take regular vigorous exercise<br>Move to high altitude","Avoid dairy and iron<br>Stay well hydrated<br>Avoid vigorous exercise<br>Take daily aspirin"],"k":0}]},{"t":"Sickle cell treatment; HbC","qs":[{"id":"20-96","q":"What are the basic treatments for sickle cell disease?","o":["Diuretics<br>Analgesics<br>Erythropoietin injections","Hydration<br>Analgesics<br>Packed red-cell transfusion","Fluid restriction<br>Anticoagulants<br>Iron supplements"],"k":1},{"id":"20-97","q":"How does hydroxyurea help in sickle cell disease?","o":["Raises HbF","Raises HbS","Lowers HbF"],"k":0},{"id":"20-98","q":"What is crizanlizumab and what does it do?","o":["Antibody against E-selectin (2019) — cuts vaso-occlusive crises","Antibody against P-selectin (2019) — cuts vaso-occlusive crises","Small molecule blocking HbS polymerisation (2019) — cuts haemolysis"],"k":1},{"id":"20-99","q":"What does L-glutamine (Endari, 2017) do in sickle cell disease?","o":["Blocks HbS polymerisation","Blocks P-selectin adhesion","Reduces oxidative stress"],"k":2},{"id":"20-100","q":"How does Casgevy work?","o":["Lentiviral vector to add an anti-sickling HbA gene (2023; given with a stem-cell transplant)","CRISPR/Cas9 gene editing to raise HbF (2023; given with a stem-cell transplant)","CRISPR/Cas9 gene editing to correct the E6V mutation directly (2023; no transplant needed)"],"k":1},{"id":"20-101","q":"How does Lyfgenia work?","o":["CRISPR/Cas9 → raises HbF by editing BCL11A (2023; with a stem-cell transplant)","Adenoviral vector → makes anti-sickling HbA<sub>2<\/sub> (α<sub>2<\/sub>δ<sub>2<\/sub>) (2023; with a stem-cell transplant)","Lentiviral vector → makes anti-sickling HbA (HbA<sup>T87Q<\/sup>) (2023; with a stem-cell transplant)"],"k":2},{"id":"20-102","q":"What was voxelotor, and what happened to it?","o":["Raised HbF — approved, then withdrawn in 2024","Blocked HbS polymerisation — never approved, trials stopped in 2019","Blocked HbS polymerisation — approved, then withdrawn in 2024"],"k":2},{"id":"20-103","q":"What does chronic transfusion target in sickle cell disease, and at what cost?","o":["Keeps HbS &lt;50% → prevents stroke; cost: iron overload","Keeps HbS &lt;80% → prevents stroke; cost: iron deficiency","Keeps HbF &gt;50% → prevents pain crises; cost: iron overload"],"k":0},{"id":"20-104","q":"What is the HbC mutation?","o":["Glutamate → valine at position 6 of the β chain (E6V)","Glutamate → lysine at position 6 of the β chain (E6K)","Glutamate → lysine at position 6 of the α chain (E6K)"],"k":1,"more":"<p>Sometimes printed \"E6L\", but L is leucine.<\/p>"},{"id":"20-105","q":"What does HbC do inside red cells?","o":["Less soluble → forms crystals → cells less deformable","More soluble → stays dissolved → cells more deformable","Less soluble → polymerises into fibres → cells sickle"],"k":0},{"id":"20-106","q":"What disease do HbC homozygotes and carriers have?","o":["Homozygotes: hydrops fetalis<br>Carriers: mild microcytic anaemia","Homozygotes: severe haemolytic anaemia with frequent pain crises<br>Carriers: mild anaemia","Homozygotes: mild chronic haemolytic anaemia, no pain crises<br>Carriers: silent"],"k":2},{"id":"20-107","q":"What is HbSC disease?","o":["Compound heterozygote (one HbS + one HbC allele) — same kind of disease as sickle cell, milder","Compound heterozygote (one HbS + one HbC allele) — silent carrier state, no disease","Compound heterozygote (one HbS + one β-thalassaemia allele) — same kind of disease as sickle cell, milder"],"k":0}]}]},{"n":21,"key":"bio","t":"Acid-base: four disorders, one framework","sub":"Lecture 23 and Primer 09","cp2":false,"secs":[{"t":"pH and acids","qs":[{"id":"21-0","q":"Within what range is blood pH held?","o":["7.35–7.45","7.40–7.50","7.25–7.35"],"k":0},{"id":"21-1","q":"What is the main defender of blood pH?","o":["The bicarbonate buffer system","The phosphate buffer system","The haemoglobin buffer system"],"k":0},{"id":"21-2","q":"Why is the bicarbonate buffer called an <b>open<\/b> buffer system?","o":["Its pK<sub>a<\/sub> sits exactly at blood pH, so it is never saturated","Both ends are controlled: kidneys → CO<sub>2<\/sub>; lungs → HCO<sub>3<\/sub><sup>&minus;<\/sup>","Both ends are controlled: lungs → CO<sub>2<\/sub>; kidneys → HCO<sub>3<\/sub><sup>&minus;<\/sup>"],"k":2},{"id":"21-3","q":"What is the definition of pH?","o":["pH = &minus;log[H<sup>+<\/sup>]","pH = &minus;ln[H<sup>+<\/sup>]","pH = log[H<sup>+<\/sup>]"],"k":0},{"id":"21-4","q":"How much does [H<sup>+<\/sup>] change for a one-unit change in pH, and which way?","o":["Twofold; lower pH = more H<sup>+<\/sup>","Tenfold; lower pH = less H<sup>+<\/sup>","Tenfold; lower pH = more H<sup>+<\/sup>"],"k":2},{"id":"21-5","q":"Why is neutral pH 7?","o":["In pure water [H<sup>+<\/sup>] = [OH<sup>&minus;<\/sup>] = 10<sup>7<\/sup> M","In pure water [H<sup>+<\/sup>] = [OH<sup>&minus;<\/sup>] = 10<sup>&minus;14<\/sup> M","In pure water [H<sup>+<\/sup>] = [OH<sup>&minus;<\/sup>] = 10<sup>&minus;7<\/sup> M"],"k":2,"more":"<p>Their product is 10<sup>&minus;14<\/sup>.<\/p>"},{"id":"21-6","q":"How does [H<sup>+<\/sup>] at blood pH 7.1 compare with [H<sup>+<\/sup>] at pH 7.4?","o":["About half as much","About twice as much","About ten times as much"],"k":1,"more":"<p>Because pH is a log scale, blood&rsquo;s narrow pH window still covers large changes in H<sup>+<\/sup>.<\/p>"},{"id":"21-7","q":"What is an acid (proton definition)?","o":["A proton acceptor: HA + H<sup>+<\/sup> → H<sub>2<\/sub>A<sup>+<\/sup>","An electron donor: HA → H + A","A proton donor: HA → H<sup>+<\/sup> + A<sup>&minus;<\/sup>"],"k":2,"more":"<p>A<sup>&minus;<\/sup> is the acid&rsquo;s <b>conjugate base<\/b>.<\/p>"},{"id":"21-8","q":"What is a base (proton definition)?","o":["A proton donor: BH<sup>+<\/sup> → B + H<sup>+<\/sup>","An electron acceptor: B + e<sup>&minus;<\/sup> → B<sup>&minus;<\/sup>","A proton acceptor: B + H<sup>+<\/sup>
