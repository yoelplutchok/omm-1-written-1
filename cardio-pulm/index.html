of the AV node?","o":["20–30 per minute","60–100 per minute","40–60 per minute"],"k":2},{"id":"4-79","q":"What is the intrinsic rate of the bundle of His?","o":["About 20 per minute","About 40 per minute","About 60 per minute"],"k":1},{"id":"4-80","q":"What is the intrinsic rate of the Purkinje fibres?","o":["40–60 per minute","60–100 per minute","20–30 per minute"],"k":2}]},{"t":"EKG waves and intervals","qs":[{"id":"4-81","q":"What does the EKG record?","o":["The whole heart&rsquo;s electrical activity from the skin: the sum, not one cell&rsquo;s action potential","The heart&rsquo;s mechanical contraction from the skin: pressure, not voltage","A single ventricular cell&rsquo;s action potential from the skin: one cell, not the sum"],"k":0},{"id":"4-82","q":"What is the difference between an EKG interval and a segment?","o":["Interval includes a wave<br>Segment is the flat stretch between waves","Interval is the flat stretch between waves<br>Segment includes a wave","Interval is measured in mV<br>Segment is measured in seconds"],"k":0,"figs":["img/04_electrics_5.webp"]},{"id":"4-83","q":"What does the P wave represent?","o":["SA-node depolarisation","Atrial repolarisation","Atrial depolarisation"],"k":2,"figs":["img/04_electrics_5.webp"],"hy":true},{"id":"4-84","q":"Why is there no EKG wave for atrial repolarisation?","o":["Atria do not repolarise","It is buried in the QRS","It is buried in the T wave"],"k":1,"hy":true},{"id":"4-85","q":"What does the PR interval span and contain?","o":["Start of P → end of QRS: atrial depolarisation + ventricular depolarisation (mostly the QRS)","Start of P → start of T: atrial and ventricular depolarisation (mostly the plateau)","Start of P → start of QRS: atrial depolarisation + AV nodal delay (mostly the delay)"],"k":2,"figs":["img/04_electrics_5.webp"],"hy":true},{"id":"4-86","q":"What is the normal PR interval?","o":["0.20–0.30 s","0.12–0.20 s","0.06–0.10 s"],"k":1,"hy":true},{"id":"4-87","q":"What does the PR segment (end of P to start of QRS) represent?","o":["Atrial depolarisation","Ventricular depolarisation","The AV-node delay itself"],"k":2,"figs":["img/04_electrics_5.webp"]},{"id":"4-88","q":"What does the QRS complex represent?","o":["Atrial depolarisation","Ventricular repolarisation","Ventricular depolarisation"],"k":2,"figs":["img/04_electrics_5.webp"],"hy":true},{"id":"4-89","q":"What is the normal QRS duration?","o":["Under 0.20 s","Under 0.44 s","Under 0.12 s"],"k":2,"hy":true},{"id":"4-90","q":"Why is the QRS narrow normally but wide in some rhythms?","o":["Narrow: one bundle branch conducts<br>Wide: both bundle branches conduct","Narrow: travels down the Purkinje system<br>Wide: spreads muscle-to-muscle instead","Narrow: spreads muscle-to-muscle<br>Wide: travels down the Purkinje system instead"],"k":1,"hy":true},{"id":"4-91","q":"What is the J point?","o":["Where the P wave ends and the PR segment begins","Where the ST segment ends and the T wave begins","Where the QRS ends and the ST segment begins"],"k":2,"figs":["img/04_electrics_5.webp"]},{"id":"4-92","q":"What does the ST segment represent?","o":["Whole atrium depolarised at once: the atrial plateau","Whole ventricle repolarised at once: phase 4","Whole ventricle depolarised at once: the plateau"],"k":2,"more":"<p>Flat normally; shifts with ischaemia.<\/p>","figs":["img/04_electrics_5.webp"],"hy":true},{"id":"4-93","q":"What does the T wave represent?","o":["Atrial repolarisation","Ventricular repolarisation","Ventricular depolarisation"],"k":1,"figs":["img/04_electrics_5.webp"],"hy":true},{"id":"4-94","q":"What is the small wave that sometimes follows the T wave?","o":["Q wave","U wave","J wave"],"k":1,"figs":["img/04_electrics_5.webp"]},{"id":"4-95","q":"What does the QT interval span and contain?","o":["Start of P → end of QRS: atrial depolarisation and the AV delay","Start of QRS → end of T: the entire ventricular action potential","Start of T → next P: ventricular repolarisation and diastole"],"k":1,"more":"<p>Long QT means a long, unstable plateau.<\/p>","figs":["img/04_electrics_5.webp"],"hy":true},{"id":"4-96","q":"Which EKG interval do AV-node problems change?","o":["PR interval (it contains the AV node)","QT interval (it contains the AV node)","QRS duration (it contains the AV node)"],"k":0,"hy":true},{"id":"4-97","q":"What do bundle-branch problems do to the EKG?","o":["Lengthen the PR interval (it contains the bundle branches)","Remove the P waves (they contain the bundle branches)","Widen the QRS (it contains the ventricular spread)"],"k":2,"hy":true},{"id":"4-98","q":"Which EKG interval do plateau and potassium problems stretch?","o":["QT interval (it contains repolarisation)","PR interval (it contains repolarisation)","QRS duration (it contains repolarisation)"],"k":0,"hy":true},{"id":"4-99","q":"What do rate and rhythm on an EKG strip come from?","o":["Rate: spacing (further apart = slower)<br>Rhythm: regularity, and whether every P is followed by a QRS","Rate: height of the R waves (taller = faster)<br>Rhythm: width of each QRS","Rate: regularity of the R waves<br>Rhythm: spacing (further apart = slower)"],"k":0},{"id":"4-100","q":"How do you get heart rate from large boxes between two R waves?","o":["1500 ÷ number of large boxes","300 × number of large boxes","300 ÷ number of large boxes"],"k":2},{"id":"4-101","q":"What heart rates go with 1, 2, 3, 4, 5 and 6 large boxes between R waves?","o":["300, 150, 100, 75, 60, 50 (then 43, 37)","300, 200, 150, 100, 75, 60 (then 50, 43)","300, 150, 75, 60, 50, 43 (then 37, 33)"],"k":0},{"id":"4-102","q":"How long is one large EKG box at standard paper speed?","o":["0.2 s","1.0 s","0.5 s"],"k":0},{"id":"4-103","q":"What is heart rate in terms of the R-to-R interval?","o":["Rate = 60 × R-to-R interval (s)","Rate = 300 ÷ R-to-R interval (s)","Rate = 60 ÷ R-to-R interval (s)"],"k":2}]},{"t":"Rhythm strips","qs":[{"id":"4-104","q":"What are the EKG features of sinus bradycardia?","o":["Under 60/min, irregular, no P waves before the QRS, no PR interval, QRS under 0.12 s","Under 60/min, regular, identical P before every QRS, PR 0.12–0.20 s, QRS under 0.12 s","Over 100/min, regular, identical P before every QRS, PR 0.12–0.20 s, QRS under 0.12 s"],"k":1,"more":"<p>A normal rhythm that is simply slow.<\/p>","figs":["img/04_electrics_6.webp"]},{"id":"4-105","q":"In atrial fibrillation, where is the defect?","o":["Internodal pathways (SA node and internodal pathways stop working in an orderly way)","Purkinje fibres (the ventricular network stops working in an orderly way)","Bundle branches (the left and right bundles stop conducting in an orderly way)"],"k":0},{"id":"4-106","q":"Who is the classic atrial fibrillation patient?","o":["Long-standing hypertension with a cardiomyopathy","Child with Wolff-Parkinson-White syndrome","Young athlete with a high resting vagal tone"],"k":0},{"id":"4-107","q":"How fast do the atria fire in atrial fibrillation?","o":["150–250 per minute","220–300 per minute","350–650 per minute"],"k":2},{"id":"4-108","q":"What are the EKG features of atrial fibrillation?","o":["Regular sawtooth P waves, fixed PR interval, narrow QRS at regular intervals","No P waves (fibrillatory baseline), no PR interval, narrow QRS at irregular intervals","No P waves (fibrillatory baseline), no PR interval, wide QRS at regular intervals"],"k":1,"more":"<p>The ventricular rate can be slow or rapid.<\/p>","figs":["img/04_electrics_7.webp"]},{"id":"4-109","q":"In atrial fibrillation with a rapid rate (over 100), where do the drugs act and which drugs?","o":["AV node: beta-blockers, calcium channel blockers, digoxin","Purkinje fibres: lidocaine, flecainide, mexiletine","SA node: atropine, epinephrine, isoproterenol"],"k":0,"more":"<p>All slow AV conduction, so fewer atrial impulses reach the ventricles.<\/p>"},{"id":"4-110","q":"What is the fastest way to convert atrial fibrillation to sinus rhythm?","o":["Intravenous atropine","Electrical cardioversion (a shock)","Carotid sinus massage"],"k":1},{"id":"4-111","q":"What are the atrial waves of atrial flutter, and at what rate?","o":["Regular sawtooth flutter waves, 220–430 per minute","Irregular fibrillatory waves, 350–650 per minute","Regular sawtooth flutter waves, 60–100 per minute"],"k":0,"figs":["img/04_electrics_8.webp"]},{"id":"4-112","q":"What are the ventricular rate and QRS in atrial flutter?","o":["Equal to the atrial rate, regular; narrow QRS","Under 60/min, always irregular; wide QRS","Under 300/min, regular or variable; narrow QRS"],"k":2,"figs":["img/04_electrics_8.webp"]},{"id":"4-113","q":"How is atrial flutter slowed?","o":["At the AV node, by beta-1 blockade","At the AV node, by alpha-1 blockade","At the SA node, by muscarinic blockade"],"k":0},{"id":"4-114","q":"What are the EKG features of ventricular tachycardia?","o":["Slow, regular, wide complexes, more P waves than QRS","Fast, irregular, narrow complexes, no visible P waves","Fast, regular, wide complexes, no visible P waves"],"k":2,"figs":["img/04_electrics_9.webp"]},{"id":"4-115","q":"Why are the complexes wide in ventricular tachycardia?","o":["Beat starts in the ventricle and travels down the Purkinje system faster than normal","Beat starts in the atria and is delayed in the AV node before reaching the ventricle","Beat starts in the ventricle (Purkinje fibres) and spreads slowly muscle cell to muscle cell, outside the fast pathway"],"k":2,"figs":["img/04_electrics_9.webp"]},{"id":"4-116","q":"What are the EKG features of ventricular fibrillation?","o":["Fast, regular rate: sawtooth waves, narrow QRS between them","No countable rate: flat line, no electrical activity at all","No countable rate: chaotic waves, no recognisable QRS"],"k":2,"more":"<p>The ventricles quiver and pump nothing.<\/p>","figs":["img/04_electrics_10.webp"]}]},{"t":"Where conduction breaks","qs":[{"id":"4-117","q":"If the AV delay is long but every beat still gets through, what does the EKG show?","o":["Prolonged QT interval","Prolonged PR interval","Widened QRS complex"],"k":1},{"id":"4-118","q":"If some atrial beats fail to get through the AV node, what does the EKG show?","o":["Wide QRS complexes with no P waves","Sawtooth waves between narrow QRS complexes","P waves without a following QRS"],"k":2},{"id":"4-119","q":"If no atrial beats get through the AV node, what happens?","o":["Ventricles stop completely, since no other cell can pace them (asystole)","Atria slow to match the ventricles; both beat together at 40–60/min","Atria and ventricles beat independently; ventricle falls back on a latent pacemaker (slow but alive)"],"k":2},{"id":"4-120","q":"What is re-entry?","o":["A region recovers excitability before the wave has finished → wave re-enters tissue it passed → self-sustaining loop","A region stays refractory after the wave has finished → wave is blocked → beat is dropped","A latent pacemaker fires faster than the SA node → takes over the rhythm"],"k":0,"more":"<p>The basis of the fast, disorganised rhythms.<\/p>"},{"id":"4-121","q":"What defends against re-entry, and what does that mean for anti-arrhythmic drugs?","o":["A long refractory period; drugs that lengthen refractoriness are anti-arrhythmic","A short refractory period; drugs that shorten refractoriness are anti-arrhythmic","A fast conduction velocity; drugs that slow conduction are pro-arrhythmic"],"k":0}]}]},{"n":5,"key":"phys","t":"The heart as a pump","sub":"Lecture 22","cp2":false,"secs":[{"t":"The three determinants","qs":[{"id":"5-0","q":"What three things determine stroke volume?","o":["Preload<br>Afterload<br>Heart rate","Preload<br>Compliance<br>Contractility","Preload<br>Afterload<br>Contractility"],"k":2,"more":"<p>Every drug and disease in this block acts on one of them. Expect to be given a change and asked which of the three moved.<\/p>","hy":true},{"id":"5-1","q":"What is preload?","o":["What the ventricle pushes against: aortic pressure","How full the ventricle is before it contracts: end-diastolic volume (the stretch)","How full the ventricle is after it contracts: end-systolic volume"],"k":1,"hy":true},{"id":"5-2","q":"What largely sets preload?","o":["Aortic pressure","Venous return","Heart rate"],"k":1},{"id":"5-3","q":"What is afterload?","o":["What the ventricle pushes against: venous pressure (central venous pressure for the left ventricle)","What the ventricle pushes against: arterial pressure (aortic pressure for the left ventricle)","What the ventricle pushes against: atrial pressure (left atrial pressure for the left ventricle)"],"k":1,"hy":true},{"id":"5-4","q":"What is contractility?","o":["How hard the muscle squeezes at any given stretch","How much the muscle is stretched before it contracts","How quickly the muscle relaxes after each beat"],"k":0,"hy":true},{"id":"5-5","q":"What sets contractility?","o":["Sympathetic drive and calcium handling","Venous return and end-diastolic volume","Aortic pressure and vascular resistance"],"k":0}]},{"t":"Frank-Starling mechanism","qs":[{"id":"5-6","q":"What is the Frank-Starling mechanism?","o":["The more you fill the ventricle, the harder it contracts (bigger end-diastolic volume → bigger stroke volume)","The more you fill the ventricle, the weaker it contracts (bigger end-diastolic volume → smaller stroke volume)","The higher the aortic pressure, the harder it contracts (bigger afterload → bigger stroke volume)"],"k":0,"more":"<p>Automatic: no nerves or hormones involved.<\/p>","hy":true},{"id":"5-7","q":"What is the calcium part of the Frank-Starling mechanism?","o":["Stretched cell releases less calcium from its internal store per beat, but troponin binds calcium more readily","Stretched cell releases more calcium from its internal store per beat, and troponin binds calcium more readily","Stretched cell releases more calcium from its internal store per beat, and tropomyosin binds calcium more readily"],"k":1},{"id":"5-8","q":"Why is the Frank-Starling mechanism so useful?","o":["Keeps arterial pressure constant regardless of venous return","Keeps the outputs of the two sides of the heart matched automatically","Lets sympathetic nerves raise contractility without extra filling"],"k":1,"more":"<p>If the right ventricle sends more blood to the lungs, more returns to the left, stretching it more, so it ejects more.<\/p>"},{"id":"5-9","q":"At what sarcomere length is tension greatest?","o":["About 2.2 µm (best actin–myosin overlap)","About 1.6 µm (best actin–myosin overlap)","About 3.0 µm (best actin–myosin overlap)"],"k":0},{"id":"5-10","q":"Why does tension fall when the sarcomere is shorter or longer than 2.2 µm?","o":["Shorter: they overlap less<br>Longer: filaments crowd into each other","Shorter: filaments crowd into each other<br>Longer: they overlap less","Shorter: filaments crowd into each other<br>Longer: they overlap more"],"k":1},{"id":"5-11","q":"Where does the normal ventricle work relative to the optimal sarcomere length, and so what does extra filling do?","o":["Above it: extra filling stretches sarcomeres further from 2.2 µm → weaker next beat","Below it: extra filling shortens sarcomeres away from 2.2 µm → weaker next beat","Below it: extra filling stretches sarcomeres toward 2.2 µm → stronger next beat"],"k":2},{"id":"5-12","q":"What happens to stroke volume when a dilated, failing ventricle is overstretched?","o":["Stays the same (sarcomere length is fixed)","Falls (sarcomeres pushed past the optimum)","Rises (sarcomeres pushed toward the optimum)"],"k":1},{"id":"5-13","q":"What is the passive (diastolic) ventricular pressure–volume curve?","o":["Pressure from just stretching the relaxed ventricle as it fills","Pressure in the aorta during diastole as the valve stays shut","Pressure from atrial contraction as the ventricle empties"],"k":0,"figs":["img/05_pump_1.webp"]},{"id":"5-14","q":"What is the active (systolic) ventricular pressure–volume curve?","o":["Pressure the ventricle can develop when it contracts from each filling volume","Pressure in the atrium as the ventricle contracts against a closed valve","Pressure the ventricle develops at a fixed volume regardless of filling"],"k":0,"more":"<p>It climbs steeply with end-diastolic volume; that climb is the Frank-Starling mechanism.<\/p>","figs":["img/05_pump_1.webp"]}]},{"t":"Contractility versus preload","qs":[{"id":"5-15","q":"What is the difference between preload and contractility?","o":["Preload: what the muscle pushes against<br>Contractility: how stretched the muscle is","Preload: how forcefully it contracts at that stretch<br>Contractility: how stretched the muscle is","Preload: how stretched the muscle is<br>Contractility: how forcefully it contracts at that stretch"],"k":2,"hy":true},{"id":"5-16","q":"What does sympathetic stimulation do to stroke volume at the same filling volume?","o":["Raises it (raises contractility)","No change (only filling changes it)","Lowers it (lowers contractility)"],"k":0,"hy":true},{"id":"5-17","q":"How does digoxin change contractility?","o":["Raises it, by raising intracellular calcium","Raises it, by raising intracellular sodium efflux","No change; it only slows the heart rate"],"k":0},{"id":"5-18","q":"On a Frank-Starling graph, what does extra filling do?","o":["Shifts the <b>whole curve<\/b> down","Shifts the <b>whole curve<\/b> up","Moves the heart <b>along<\/b> one curve"],"k":2,"figs":["img/05_pump_2.png"],"hy":true},{"id":"5-19","q":"On a Frank-Starling graph, what does a change in contractility do?","o":["Moves the heart <b>off<\/b> the curve","Changes only the <b>x-axis<\/b> value","Shifts the <b>whole curve<\/b>"],"k":2,"figs":["img/05_pump_2.png"],"hy":true},{"id":"5-20","q":"What shifts the Frank-Starling curve up?","o":["Intravenous fluids<br>Venoconstriction<br>Raised venous return","Dobutamine<br>Digoxin<br>Sympathetic stimulation","Dobutamine<br>Verapamil<br>Parasympathetic stimulation"],"k":1,"figs":["img/05_pump_2.png"]},{"id":"5-21","q":"What shifts the Frank-Starling curve down?","o":["Systolic dysfunction (the weak ventricle of congestive heart failure, CHF)","Sympathetic stimulation (the strong ventricle of exercise)","Digoxin (the stimulated ventricle of congestive heart failure, CHF)"],"k":0,"figs":["img/05_pump_2.png"]}]},{"t":"Excitation-contraction coupling","qs":[{"id":"5-22","q":"How are cardiac muscle cells shaped and joined?","o":["Short and branched, joined end to end by intercalated discs","Long and unbranched, joined side by side by tight junctions","Long and multinucleate, joined end to end by tendons"],"k":0},{"id":"5-23","q":"What do desmosomes do in the intercalated disc?","o":["Hold neighbouring cells together","Anchor actin filaments to the Z line","Seal the space between cells against leakage"],"k":0},{"id":"5-24","q":"What do gap junctions do in the intercalated disc?","o":["Store calcium for release during the plateau","Anchor the myofibrils to the cell membrane","Pass the action potential straight from one cell to the next"],"k":2},{"id":"5-25","q":"What is the sequence of cardiac excitation-contraction coupling?","o":["Action potential → calcium enters during plateau → calcium-induced calcium release from the sarcoplasmic reticulum (SR) → calcium binds troponin C → cross-bridge cycling → tension","Action potential → calcium enters during plateau → calcium-induced calcium release from the SR → calcium binds tropomyosin → cross-bridge cycling → tension","Action potential → sodium enters during plateau → sodium-induced calcium release from the SR → calcium binds troponin C → cross-bridge cycling → tension"],"k":0,"figs":["img/05_pump_3.png"],"hy":true},{"id":"5-26","q":"What is the trigger step of cardiac excitation-contraction coupling?","o":["Action potential runs down T tubules → opens T-type calcium channels → small calcium entry during the upstroke","Action potential runs down T tubules → opens L-type calcium channels → small calcium entry during the plateau","Action potential runs along the SR → opens L-type sodium channels → small sodium entry during the plateau"],"k":1,"figs":["img/05_pump_3.png"],"hy":true},{"id":"5-27","q":"Which drugs act on the L-type calcium channels of the trigger step, and how?","o":["Calcium channel blockers open them further<br>Beta agonists block them","Calcium channel blockers block them<br>Beta agonists open them further","Calcium channel blockers block them<br>Beta blockers open them further"],"k":1},{"id":"5-28","q":"Is the calcium entering during the plateau enough to contract the cell?","o":["Yes: the SR store is used only in skeletal muscle","Yes: it alone binds troponin and drives contraction","No: its job is to trigger release of a much larger internal store"],"k":2,"more":"<p>Calcium amplifying calcium.<\/p>","hy":true},{"id":"5-29","q":"What is calcium-induced calcium release?","o":["Trigger calcium opens the L-type channels of the sarcolemma, releasing extracellular calcium","Trigger calcium opens the IP<sub>3<\/sub> receptors of the mitochondria, releasing stored calcium","Trigger calcium opens the ryanodine receptors of the SR, releasing stored calcium"],"k":2,"figs":["img/05_pump_3.png"],"hy":true},{"id":"5-30","q":"What is a calcium spark?","o":["One local SR calcium release; sparks add up to the cell-wide calcium signal","One local calcium entry through an L-type channel; it alone contracts the cell","One local SR calcium uptake by SERCA; sparks add up to relaxation"],"k":0},{"id":"5-31","q":"What does released calcium bind to cause contraction, and what follows?","o":["Troponin C → tropomyosin moves aside → actin and myosin engage","Tropomyosin → troponin C moves aside → actin and myosin engage","Troponin I → tropomyosin covers actin → actin and myosin engage"],"k":0,"figs":["img/05_pump_3.png"],"hy":true},{"id":"5-32","q":"When does cardiac relaxation start?","o":["When the L-type channels open","When calcium comes off troponin","When the action potential begins"],"k":1},{"id":"5-33","q":"What clears calcium after a beat?","o":["SERCA (SR Ca<sup>2+<\/sup>-ATPase): pumps it into the SR<br>Na<sup>+<\/sup>/Ca<sup>2+<\/sup> exchanger: moves it out of the cell","Ryanodine receptor: pumps it into the SR<br>Na<sup>+<\/sup>/Ca<sup>2+<\/sup> exchanger: moves it out of the cell","SERCA (SR Ca<sup>2+<\/sup>-ATPase): moves it out of the cell<br>Na<sup>+<\/sup>/Ca<sup>2+<\/sup> exchanger: pumps it into the SR"],"k":0,"more":"<p>The Na<sup>+<\/sup>/K<sup>+<\/sup>-ATPase maintains the sodium gradient that drives the exchanger.<\/p>","hy":true},{"id":"5-34","q":"Is cardiac relaxation passive or active?","o":["Passive: elastic recoil alone","Active: driven by sodium entry","Active: costs ATP"],"k":2,"more":"<p>Nothing relaxes passively.<\/p>"},{"id":"5-35","q":"How long is the cardiac muscle refractory period, and why does that matter?","o":["About 25 ms, much shorter than the contraction, so the cell can be re-excited during contraction","About 250 ms, nearly as long as the contraction, so the cell can&rsquo;t be re-excited until it is relaxing","About 250 ms, much shorter than the contraction, so tetanic contraction is possible"],"k":1},{"id":"5-36","q":"What does the force of a cardiac beat track?","o":["How much sodium enters during the upstroke","How much calcium reaches troponin","How much ATP the cell holds"],"k":1,"more":"<p>Anything that raises it raises contractility; anything that lowers it lowers contractility.<\/p>","hy":true},{"id":"5-37","q":"What lowers contractility by lowering the calcium reaching troponin?","o":["Hypercalcaemia<br>Alkalosis","Ischaemia<br>Acidosis","Increased preload<br>Tachycardia"],"k":1}]},{"t":"Autonomic effects on contractility","qs":[{"id":"5-38","q":"What is the sympathetic signalling chain that raises contractility?","o":["Norepinephrine/epinephrine → β<sub>1<\/sub> → G<sub>s<\/sub> → adenylyl cyclase → cAMP → protein kinase A (PKA)","Norepinephrine/epinephrine → α<sub>1<\/sub> → G<sub>q<\/sub> → phospholipase C → IP<sub>3<\/sub> → protein kinase C (PKC)","Norepinephrine/epinephrine → β<sub>1<\/sub> → G<sub>i<\/sub> → adenylyl cyclase → cAMP → protein kinase A (PKA)"],"k":0,"figs":["img/05_pump_4.webp"]},{"id":"5-39","q":"Which four targets does protein kinase A phosphorylate in cardiac muscle?","o":["L-type calcium channels<br>Na<sup>+<\/sup>/Ca<sup>2+<\/sup> exchanger<br>Phospholamban<br>Myosin heavy chain","L-type calcium channels<br>Ryanodine receptors<br>Phospholamban<br>Troponin I","L-type calcium channels<br>Ryanodine receptors<br>Phospholamban<br>Tropomyosin"],"k":1,"figs":["img/05_pump_4.webp"]},{"id":"5-40","q":"What does PKA phosphorylation of L-type calcium channels achieve?","o":["More sodium enters, so the upstroke is faster","Less trigger calcium enters, so relaxation is faster","More trigger calcium enters, so more is released"],"k":2},{"id":"5-41","q":"What does phospholamban normally do?","o":["Opens ryanodine receptors","Activates SERCA","Brakes SERCA"],"k":2},{"id":"5-42","q":"What does phosphorylating phospholamban achieve?","o":["Removes the brake on SERCA → faster SR calcium reuptake (quicker relaxation) + more stored (stronger next beat)","Removes the brake on ryanodine receptors → more SR calcium release (stronger beat) + slower relaxation","Strengthens the brake on SERCA → slower SR calcium reuptake (slower relaxation) + less stored (weaker next beat)"],"k":0,"figs":["img/05_pump_4.webp"]},{"id":"5-43","q":"What does phosphorylating troponin I achieve?","o":["Troponin holds on to calcium longer → stronger contraction","Tropomyosin covers actin longer → slower relaxation","Troponin lets go of calcium sooner → faster relaxation"],"k":2,"figs":["img/05_pump_4.webp"]},{"id":"5-44","q":"What three changes in the contraction result from sympathetic stimulation?","o":["Faster rate of tension development<br>Higher peak tension<br>Faster rate of relaxation","Faster rate of tension development<br>Higher peak tension<br>Slower rate of relaxation","Slower rate of tension development<br>Higher peak tension<br>Faster rate of relaxation"],"k":0},{"id":"5-45","q":"Why does quicker relaxation help the heart?","o":["Shortens diastole, raising end-diastolic volume","Lengthens each contraction, ejecting more blood","Shortens each contraction, leaving more time to fill"],"k":2},{"id":"5-46","q":"What is the parasympathetic signalling chain that lowers contractility?","o":["Acetylcholine → M<sub>2<\/sub> → G<sub>i<\/sub> inhibits adenylyl cyclase → less cAMP","Acetylcholine → M<sub>3<\/sub> → G<sub>q<\/sub> activates phospholipase C → more IP<sub>3<\/sub>","Norepinephrine → α<sub>2<\/sub> → G<sub>i<\/sub> inhibits adenylyl cyclase → less cAMP"],"k":0,"figs":["img/05_pump_4.webp"]},{"id":"5-47","q":"What is the parasympathetic effect on contractility, and where?","o":["Negative inotropy in the ventricles: slower tension development, lower peak tension","Positive inotropy in the atria: faster tension development, higher peak tension","Negative inotropy in the atria: slower tension development, lower peak tension"],"k":2},{"id":"5-48","q":"Why are the ventricles barely affected by parasympathetic stimulation?","o":["Ventricular muscle gets little vagal innervation","Acetylcholine is broken down before it reaches the ventricles","Ventricular muscle lacks muscarinic receptors entirely"],"k":0}]},{"t":"Heart rate and contractility","qs":[{"id":"5-49","q":"What is the positive staircase (Bowditch, treppe) effect?","o":["Faster heart rate → tension climbs beat by beat to a stronger new plateau","Slower heart rate → tension climbs beat by beat to a stronger new plateau","Faster heart rate → tension falls beat by beat to a weaker new plateau"],"k":0,"figs":["img/05_pump_5.webp"]},{"id":"5-50","q":"Why does a faster heart beat more strongly?","o":["More beats/min → less calcium enters per minute → SR releases it faster each beat","More beats/min → more sodium enters per minute → stronger upstroke each beat","More beats/min → more calcium enters per minute → SR stores more → more to release each beat"],"k":2},{"id":"5-51","q":"What is postextrasystolic potentiation?","o":["The pause after an extrasystole is shorter than normal","The beat after an extrasystole is weaker than normal","The beat after an extrasystole is stronger than normal"],"k":2,"figs":["img/05_pump_5.webp"]},{"id":"5-52","q":"Why is the beat after an extrasystole stronger?","o":["The extra beat empties the SR, so less calcium is buffered","The extra beat brings in extra calcium that the SR stores","The extra beat triggers a burst of sympathetic norepinephrine"],"k":1},{"id":"5-53","q":"How strong is the extrasystole itself?","o":["Stronger than normal","Weaker than normal","Same as normal"],"k":1,"figs":["img/05_pump_5.webp"]}]},{"t":"Digoxin","qs":[{"id":"5-54","q":"What drug class is digoxin, and which drugs share it?","o":["Phosphodiesterase inhibitors, with milrinone and amrinone","Beta-adrenergic agonists, with dobutamine and isoproterenol","Cardiac glycosides, with digitoxin and ouabain"],"k":2},{"id":"5-55","q":"Where do most cardiac glycosides come from, and since when?","o":["Foxglove (<i>Digitalis purpurea<\/i>, <i>D. lanata<\/i>); in use since 1785","Foxglove (<i>Digitalis purpurea<\/i>, <i>D. lanata<\/i>); in use since 1950","Cinchona bark (<i>Cinchona officinalis<\/i>); in use since 1785"],"k":0},{"id":"5-56","q":"What does digoxin block?","o":["The sodium-potassium pump (Na<sup>+<\/sup>/K<sup>+<\/sup>-ATPase)","The sodium-calcium exchanger (NCX)","The SR calcium pump (SERCA)"],"k":0,"hy":true},{"id":"5-57","q":"How does digoxin raise contractility?","o":["Exchanger blocked → sodium in high → Na<sup>+<\/sup>/K<sup>+<\/sup>-ATPase stalls → calcium in high → stronger contraction","Pump blocked → sodium in high → Na<sup>+<\/sup>/Ca<sup>2+<\/sup> exchanger stalls → calcium in high → stronger contraction","Pump blocked → sodium in low → Na<sup>+<\/sup>/Ca<sup>2+<\/sup> exchanger speeds up → calcium in high → stronger contraction"],"k":1,"more":"<p>Any question about this drug is a question about one of those four links.<\/p>","hy":true},{"id":"5-58","q":"Why does high intracellular sodium stall the Na<sup>+<\/sup>/Ca<sup>2+<\/sup> exchanger?","o":["The exchanger needs a steep sodium gradient to drive calcium in","The exchanger needs a steep sodium gradient to drive calcium out","Sodium binds the exchanger's calcium site and blocks it directly"],"k":1,"more":"<p>Calcium then builds up in the cell and the SR, and more reaches troponin.<\/p>","hy":true},{"id":"5-59","q":"What are the uses of digoxin?","o":["Speed heart rate in bradycardias (sinus bradycardia, heart block, sick sinus)<br>CHF as first-line therapy before an ACE inhibitor or beta-blocker","Slow heart rate in rapid atrial arrhythmias (atrial fibrillation, flutter, SVT)<br>CHF still symptomatic after an ACE inhibitor, beta-blocker and spironolactone","Slow heart rate in rapid atrial arrhythmias (atrial fibrillation, flutter, SVT)<br>Acute angina unresponsive to nitrates, beta-blocker and aspirin"],"k":1,"more":"<p>SVT = supraventricular tachycardia; ACE = angiotensin-converting enzyme.<\/p>"},{"id":"5-60","q":"What are the toxic effects of digoxin?","o":["Arrhythmias<br>Nausea, vomiting, diarrhea<br>Seizures<br>Visual disturbances","Hypotension<br>Nausea, vomiting, diarrhea<br>Tinnitus<br>Hypokalaemia","Bradycardia only<br>Constipation<br>Hearing loss<br>Hyperglycaemia"],"k":0},{"id":"5-61","q":"Why does low potassium cause digoxin toxicity?","o":["Digoxin binds the pump at its Na<sup>+<\/sup> site; less K<sup>+<\/sup> → more Na<sup>+<\/sup> competing → more digoxin binds","Digoxin binds the pump at its K<sup>+<\/sup> site; less K<sup>+<\/sup> competing → less digoxin binds","Digoxin binds the pump at its K<sup>+<\/sup> site; less K<sup>+<\/sup> competing → more digoxin binds"],"k":2,"hy":true},{"id":"5-62","q":"Why does digoxin toxicity cause high potassium?","o":["Kidneys blocked → K<sup>+<\/sup> not excreted in urine → builds up in plasma","Exchanger blocked → K<sup>+<\/sup> not swapped for Ca<sup>2+<\/sup> → builds up in plasma","Pump blocked → K<sup>+<\/sup> not pumped back into cells → builds up in plasma"],"k":2,"hy":true}]},{"t":"Afterload and cardiac output","qs":[{"id":"5-63","q":"What does a higher afterload do to ejection?","o":["The harder the ventricle has to push, the less it ejects","The harder the ventricle has to push, the more it ejects","The harder the ventricle has to push, the more it fills"],"k":0},{"id":"5-64","q":"What happens to a ventricle facing high afterload over time, and give two causes?","o":["It thickens<br>Causes: severe hypotension, leaky mitral valve","It thickens<br>Causes: severe hypertension, tight aortic valve","It dilates<br>Causes: severe hypertension, tight aortic valve"],"k":1},{"id":"5-65","q":"What is stroke volume (SV), and its formula?","o":["Amount ejected per beat: SV = EDV + ESV","Amount ejected per beat: SV = EDV ÷ ESV","Amount ejected per beat: SV = EDV − ESV"],"k":2,"more":"<p>EDV = end-diastolic volume; ESV = end-systolic volume.<\/p>"},{"id":"5-66","q":"What is ejection fraction (EF), and its formula?","o":["Fraction of the filled volume ejected: EF = SV ÷ EDV","Fraction of the filled volume ejected: EF = SV ÷ ESV","Fraction of the filled volume ejected: EF = EDV ÷ SV"],"k":0},{"id":"5-67","q":"What is the normal ejection fraction?","o":["About 55–70%","About 80–95%","About 35–45%"],"k":0,"more":"<p>The standard measure of how well the pump is working.<\/p>"},{"id":"5-68","q":"What is the formula for cardiac output (CO)?","o":["CO = SV × HR (heart rate)","CO = SV ÷ HR (heart rate)","CO = EF × HR (heart rate)"],"k":0},{"id":"5-69","q":"A left ventricle fills to 120 mL and empties to 50 mL: what are SV and EF?","o":["SV = 70 mL; EF ≈ 58%","SV = 70 mL; EF ≈ 42%","SV = 50 mL; EF ≈ 42%"],"k":0},{"id":"5-70","q":"In the steady state, what does cardiac output equal, and why?","o":["Venous return plus pulmonary flow: the two ventricles' outputs add","Heart rate alone: stroke volume stays fixed in the steady state","Venous return: the ventricle can only eject what comes back to it"],"k":2},{"id":"5-71","q":"What sets heart rate?","o":["Autonomic nerves, hormones, and the atrial reflex","Autonomic nerves, hormones, and aortic pressure","Venous return, filling time, and afterload"],"k":0,"more":"<p>Atrial reflex: venous return stretching the atria speeds the heart.<\/p>"},{"id":"5-72","q":"What sets end-diastolic volume (EDV)?","o":["Sympathetic drive and calcium handling","Heart rate and arterial pressure","Venous return and filling time (preload)"],"k":2},{"id":"5-73","q":"What sets end-systolic volume (ESV)?","o":["Contractility (autonomic nerves, hormones) and afterload (vasoconstriction or vasodilation)","Venous return and filling time (preload)","Contractility (venous return, filling time) and preload (vasoconstriction or vasodilation)"],"k":0}]}]},{"n":6,"key":"phys","t":"Pressure-volume loops","sub":"Lecture 23","cp2":false,"secs":[{"t":"Reading the loop","qs":[{"id":"6-0","q":"What does a pressure&ndash;volume (PV) loop show?","o":["One heartbeat: time on the x-axis, ventricular pressure on the y-axis","One heartbeat: ventricular pressure on the x-axis, volume on the y-axis","One heartbeat: ventricular volume on the x-axis, pressure on the y-axis"],"k":2,"figs":["img/06_pvloop_1.png"]},{"id":"6-1","q":"Which direction does time run around a pressure&ndash;volume loop?","o":["Anticlockwise","From top to bottom, then back up","Clockwise"],"k":0},{"id":"6-2","q":"Which four things can you read off a pressure&ndash;volume loop at once?","o":["Preload<br>Afterload<br>Contractility<br>Stroke volume","Preload<br>Compliance<br>Contractility<br>Heart rate","Preload<br>Afterload<br>Contractility<br>Cardiac output"],"k":0},{"id":"6-3","q":"Name the four phases of the pressure&ndash;volume loop in order, starting with filling.","o":["Filling &rarr; isovolumetric contraction &rarr; ejection &rarr; isovolumetric relaxation","Filling &rarr; isovolumetric relaxation &rarr; ejection &rarr; isovolumetric contraction","Filling &rarr; ejection &rarr; isovolumetric contraction &rarr; isovolumetric relaxation"],"k":0,"figs":["img/06_pvloop_1.png","img/06_pvloop_2.webp"]}]},{"t":"Filling and contraction","qs":[{"id":"6-4","q":"During ventricular filling, which valve is open, and what happens on the pressure&ndash;volume loop?","o":["Aortic valve open; volume rises along the bottom at low pressure","Mitral valve open; volume rises along the bottom at low pressure","Mitral valve open; pressure rises straight up at constant volume"],"k":1},{"id":"6-5","q":"What event ends ventricular filling (the bottom-right corner of the pressure&ndash;volume loop)?","o":["End-diastole: ventricle starts to contract &rarr; aortic valve opens","End-diastole: ventricle starts to contract &rarr; mitral valve closes","End-systole: ventricle starts to relax &rarr; aortic valve closes"],"k":1,"figs":["img/06_pvloop_2.webp"]},{"id":"6-6","q":"What is the normal end-diastolic volume (EDV), and which determinant does it represent?","o":["About 70 mL; the preload","About 50 mL; the preload","About 120 mL; the preload"],"k":2},{"id":"6-7","q":"During isovolumetric contraction, what are the valves doing and what happens to pressure and volume?","o":["Both valves shut; pressure rises straight up, volume unchanged","Both valves shut; pressure drops straight down, volume unchanged","Mitral valve open, aortic shut; volume rises, pressure unchanged"],"k":0,"more":"<p>The ventricle squeezes but nothing can leave. This is the vertical right-hand side of the loop.<\/p>"},{"id":"6-8","q":"What ends isovolumetric contraction, and at about what pressure?","o":["Left ventricular pressure exceeds aortic pressure (about 120 mm Hg) &rarr; aortic valve opens","Aortic pressure exceeds left ventricular pressure (about 80 mm Hg) &rarr; aortic valve closes","Left ventricular pressure exceeds aortic pressure (about 80 mm Hg) &rarr; aortic valve opens"],"k":2,"figs":["img/06_pvloop_2.webp"]}]},{"t":"Ejection and relaxation","qs":[{"id":"6-9","q":"During ejection, what happens on the pressure&ndash;volume loop?","o":["Both valves shut; pressure rises straight up","Aortic valve open; volume falls as blood leaves","Mitral valve open; volume rises as blood enters"],"k":1},{"id":"6-10","q":"What ends ejection, and at about what pressure?","o":["End-systole (about 120 mm Hg): aortic pressure exceeds ventricular pressure &rarr; aortic valve closes","End-systole (about 120 mm Hg): atrial pressure exceeds ventricular pressure &rarr; mitral valve opens","End-diastole (about 80 mm Hg): ventricular pressure exceeds aortic pressure &rarr; aortic valve opens"],"k":0,"figs":["img/06_pvloop_2.webp"]},{"id":"6-11","q":"What is the normal end-systolic volume (ESV)?","o":["About 50 mL","About 20 mL","About 70 mL"],"k":0},{"id":"6-12","q":"During isovolumetric relaxation, what are the valves doing and what happens to pressure and volume?","o":["Mitral valve open; pressure drops as volume rises","Both valves shut; pressure rises straight up at constant volume","Both valves shut; pressure drops straight down at constant volume"],"k":2},{"id":"6-13","q":"What ends isovolumetric relaxation and starts filling again?","o":["Left atrial pressure falls below ventricular pressure &rarr; mitral valve closes","Ventricular pressure rises above left atrial pressure &rarr; mitral valve opens","Ventricular pressure falls below left atrial pressure &rarr; mitral valve opens"],"k":2,"figs":["img/06_pvloop_2.webp"]},{"id":"6-14","q":"On an unfamiliar pressure&ndash;volume loop, what do the two vertical sides (no volume change) tell you?","o":["Only the mitral valve is open","Both valves are open","Both valves are closed"],"k":2,"more":"<p>Whenever volume is not changing, both valves are shut: the quickest way to orient yourself on a loop.<\/p>"}]},{"t":"Stroke volume and ejection fraction","qs":[{"id":"6-15","q":"Which dimension of the pressure&ndash;volume loop is the stroke volume?","o":["The left-hand edge (end-systolic volume)","The width (end-diastolic &minus; end-systolic volume)","The height (systolic &minus; diastolic pressure)"],"k":1,"more":"<p>Anything that makes the loop wider has increased stroke volume.<\/p>","figs":["img/06_pvloop_2.webp"]},{"id":"6-16","q":"Calculate the stroke volume when end-diastolic volume is 120 mL and end-systolic volume is 50 mL.","o":["50 &divide; 120 = 42 mL","120 &minus; 50 = 60 mL","120 &minus; 50 = 70 mL"],"k":2,"more":"<p>Costanzo&rsquo;s loop uses 140 and 70 mL: the stroke volume is the same 70 mL.<\/p>","figs":["img/06_pvloop_1.png"]},{"id":"6-17","q":"How is ejection fraction (EF) defined?","o":["Stroke volume &divide; end-diastolic volume","Stroke volume &divide; end-systolic volume","End-diastolic volume &divide; stroke volume"],"k":0,"more":"<p>Stroke volume as a proportion of the volume the beat started with. A normal heart ejects rather more than half of what it filled with.<\/p>"},{"id":"6-18","q":"Calculate the ejection fraction for a stroke volume of 70 mL and an end-diastolic volume of 120 mL. What is normal?","o":["70/120 = 58%<br>Normal 55&ndash;70%","70/120 = 58%<br>Normal 35&ndash;50%","50/120 = 42%<br>Normal 55&ndash;70%"],"k":0},{"id":"6-19","q":"With a stroke volume of 70 mL at 70&ndash;80 beats per minute, what is the cardiac output?","o":["1,050&ndash;1,200 mL/min","8,400&ndash;9,600 mL/min","4,900&ndash;5,600 mL/min"],"k":2}]},{"t":"Preload, afterload, contractility","qs":[{"id":"6-20","q":"How does increased <b>preload<\/b> change the pressure&ndash;volume loop?","o":["Right-hand edge moves left (less filling) &rarr; narrower loop","Left-hand edge moves left (empties further) &rarr; wider loop","Right-hand edge moves right (more filling) &rarr; wider loop"],"k":2,"figs":["img/06_pvloop_3.png"],"hy":true},{"id":"6-21","q":"How does increased <b>afterload<\/b> change the pressure&ndash;volume loop, and why?","o":["Shorter and wider: lower pressure needed before ejecting &rarr; more ejected","Taller and narrower: higher pressure needed before ejecting &rarr; less ejected","Taller and wider: higher pressure needed before ejecting &rarr; more ejected"],"k":1,"figs":["img/06_pvloop_3.png"],"hy":true},{"id":"6-22","q":"How does increased <b>contractility<\/b> change the pressure&ndash;volume loop?","o":["Right-hand edge moves right (more filling) &rarr; wider loop","Left-hand edge moves right (empties less) &rarr; narrower loop","Left-hand edge moves left (empties further) &rarr; wider loop"],"k":2,"figs":["img/06_pvloop_3.png"],"hy":true},{"id":"6-23","q":"Which line on the pressure&ndash;volume loop reflects contractility, and how is it read?","o":["End-systolic pressure&ndash;volume relationship (ESPVR), through the top-left corner; flatter = stronger ventricle","End-diastolic pressure&ndash;volume relationship (EDPVR), through the bottom-right corner; steeper = stronger ventricle","End-systolic pressure&ndash;volume relationship (ESPVR), through the top-left corner; steeper = stronger ventricle"],"k":2},{"id":"6-24","q":"What is the physical rule of thumb for how preload, afterload and contractility change the loop?","o":["More filling &rarr; wider<br>Harder to push against &rarr; narrower<br>Stronger squeeze &rarr; empties further","More filling &rarr; empties further<br>Harder to push against &rarr; wider<br>Stronger squeeze &rarr; narrower","More filling &rarr; taller<br>Harder to push against &rarr; shorter<br>Stronger squeeze &rarr; fills further"],"k":0},{"id":"6-25","q":"A loop is wider than normal. How do you tell whether preload or contractility caused it?","o":["Position: shifted right = contractility (emptied better); shifted left = preload (filled more)","Position: shifted left = contractility (emptied better); shifted right = preload (filled more)","Height: taller = contractility (squeezed harder); shorter = preload (filled more)"],"k":1,"figs":["img/06_pvloop_3.png"],"hy":true}]},{"t":"Stroke work and oxygen cost","qs":[{"id":"6-26","q":"What is the formula for left ventricular stroke work?","o":["Stroke volume &times; heart rate","Stroke volume &times; aortic pressure","Cardiac output &times; aortic pressure"],"k":1},{"id":"6-27","q":"Which part of the pressure&ndash;volume loop represents the work done on the blood that beat?","o":["The slope of the ESPVR line","The area under the filling curve","The area enclosed by the loop"],"k":2},{"id":"6-28","q":"If blood pressure stays the same, how does more preload change cardiac work?","o":["More preload &rarr; less stroke volume &rarr; less output &rarr; less work","More preload &rarr; higher afterload &rarr; smaller stroke volume &rarr; more work","More preload &rarr; more stroke volume &rarr; more output &rarr; more work"],"k":2},{"id":"6-29","q":"Trace the chain from more cardiac work to clinical harm.","o":["More work &rarr; more myocardial O<sub>2<\/sub> consumption &rarr; more ischemia &rarr; more arrhythmia and death","More work &rarr; more myocardial O<sub>2<\/sub> consumption &rarr; more hypertrophy &rarr; less arrhythmia and death","More work &rarr; less myocardial O<sub>2<\/sub> consumption &rarr; more coronary flow &rarr; more arrhythmia and death"],"k":0},{"id":"6-30","q":"Which costs more O<sub>2<\/sub>: pressure work or volume work?","o":["Volume work","They cost the same O<sub>2<\/sub>","Pressure work"],"k":2,"more":"<p>Ejecting the same 70 mL against a higher pressure is the expensive kind of work, like a small heavy box being harder to carry than a big empty one.<\/p>"},{"id":"6-31","q":"Why is increased afterload &ldquo;more work for less reward&rdquo;?","o":["Shorter loop (less pressure work) with a smaller stroke volume","Taller loop (more pressure work) with a larger stroke volume","Taller loop (more pressure work) with a smaller stroke volume"],"k":2},{"id":"6-32","q":"Why is angina the number-one symptom of aortic stenosis?","o":["Ventricle must generate very high pressures &rarr; O<sub>2<\/sub> demand outruns supply","Ventricle must eject a very large volume &rarr; O<sub>2<\/sub> demand outruns supply","Valve leaks in diastole &rarr; coronaries fill in systole instead"],"k":0,"more":"<p>Aortic stenosis is the extreme case of pressure (afterload) work.<\/p>"},{"id":"6-33","q":"Why does afterload reduction (vasodilation) help in congestive heart failure (CHF)?","o":["Less work &rarr; less O<sub>2<\/sub> consumed","More work &rarr; more coronary flow","Less preload &rarr; more contractility"],"k":0,"more":"<p>The same reasoning explains why high blood pressure harms.<\/p>"},{"id":"6-34","q":"Which drug class lowers afterload and lowers mortality in congestive heart failure?","o":["Angiotensin-converting enzyme (ACE) inhibitors","Beta-1 agonists (dobutamine)","Cardiac glycosides (digoxin)"],"k":0},{"id":"6-35","q":"Does digoxin lower afterload or mortality in congestive heart failure?","o":["Mortality only; it lowers heart work","Afterload only; it dilates arterioles","Neither; it raises contractility"],"k":2}]},{"t":"Law of Laplace","qs":[{"id":"6-36","q":"State the law of Laplace for ventricular wall tension.","o":["T = P &times; r<br>T = (P &times; r) &divide; wall thickness","T = P &times; r<br>T = (P &times; r) &times; wall thickness","T = P &divide; r<br>T = (P &divide; r) &times; wall thickness"],"k":0,"more":"<p>T = wall tension, P = pressure, r = radius.<\/p>"},{"id":"6-37","q":"Why does a dilated ventricle have more wall tension at the same pressure?","o":["Smaller radius; tension rises as radius falls","Larger radius; tension falls with radius","Larger radius; tension rises with radius"],"k":2},{"id":"6-38","q":"How does lowering ventricular pressure affect a dilated ventricle?","o":["Lowers wall tension &rarr; hypertrophy more likely","Raises wall tension &rarr; further dilation more likely","Lowers wall tension &rarr; further dilation less likely"],"k":2},{"id":"6-39","q":"What happens to wall tension when wall thickness doubles?","o":["It quadruples","It halves","It doubles"],"k":1},{"id":"6-40","q":"Why does a ventricle pumping against high pressure hypertrophy?","o":["A thicker wall raises wall tension","A thicker wall lowers wall tension","A thicker wall enlarges the radius"],"k":1},{"id":"6-41","q":"How does Costanzo write the law of Laplace for a sphere?","o":["P = HT/2r (H = wall thickness)","P = 2Tr/H (H = wall thickness)","P = 2HT/r (H = wall thickness)"],"k":2,"more":"<p>Same relationships as T = P &times; r &divide; thickness, plus a factor of 2.<\/p>"}]},{"t":"Fick principle","qs":[{"id":"6-42","q":"State the Fick principle for cardiac output (CO).","o":["CO = ([O<sub>2<\/sub>]<sub>pulmonary vein<\/sub> &minus; [O<sub>2<\/sub>]<sub>pulmonary artery<\/sub>) &divide; O<sub>2<\/sub> consumption","CO = O<sub>2<\/sub> consumption &divide; ([O<sub>2<\/sub>]<sub>pulmonary artery<\/sub> &minus; [O<sub>2<\/sub>]<sub>pulmonary vein<\/sub>)","CO = O<sub>2<\/sub> consumption &divide; ([O<sub>2<\/sub>]<sub>pulmonary vein<\/sub> &minus; [O<sub>2<\/sub>]<sub>pulmonary artery<\/sub>)"],"k":2},{"id":"6-43","q":"In the Fick calculation, which blood has the lowest O<sub>2<\/sub> saturation, and why?","o":["Pulmonary artery blood: it is mixed venous blood","Left atrial blood: it receives the bronchial veins","Pulmonary vein blood: it has just left the lungs"],"k":0},{"id":"6-44","q":"In the Fick calculation, which blood has the highest O<sub>2<\/sub> saturation?","o":["Pulmonary artery blood","Pulmonary vein blood","Coronary sinus blood"],"k":1},{"id":"6-45","q":"Which blood has even lower O<sub>2<\/sub> than pulmonary artery blood?","o":["Aortic blood (leaves the left ventricle)","Superior vena cava blood (drains the brain)","Coronary sinus blood (drains the heart muscle)"],"k":2},{"id":"6-46","q":"How much O<sub>2<\/sub> does each gram of hemoglobin carry?","o":["20 mL O<sub>2<\/sub>","0.003 mL O<sub>2<\/sub>","1.34 mL O<sub>2<\/sub>"],"k":2},{"id":"6-47","q":"What is the O<sub>2<\/sub> content of fully saturated blood with 15 g hemoglobin per 100 mL?","o":["About 5 mL O<sub>2<\/sub> per 100 mL","About 20 mL O<sub>2<\/sub> per 100 mL","About 15 mL O<sub>2<\/sub> per 100 mL"],"k":1,"more":"<p>Fully saturated = all four binding sites filled.<\/p>"},{"id":"6-48","q":"What are the saturation and O<sub>2<\/sub> content of venous blood?","o":["About 75% (three of four sites); about 5 mL O<sub>2<\/sub> per 100 mL","About 98% (four of four sites); about 20 mL O<sub>2<\/sub> per 100 mL","About 75% (three of four sites); about 15 mL O<sub>2<\/sub> per 100 mL"],"k":2},{"id":"6-49","q":"Calculate cardiac output: O<sub>2<\/sub> consumption 250 mL/min, arterial 20 and venous 15 mL O<sub>2<\/sub> per 100 mL.","o":["250 &divide; (0.20 &minus; 0.15) = 5,000 mL/min","250 &divide; (0.20 &minus; 0.15) = 500 mL/min","250 &times; (0.20 &minus; 0.15) = 12.5 mL/min"],"k":0}]},{"t":"Cardiac cycle and heart sounds","qs":[{"id":"6-50","q":"What is the Wiggers diagram?","o":["The cardiac cycle against time: pressures, ventricular volume, heart sounds, venous pulse and ECG stacked","The cardiac cycle against volume: pressures, flows, heart sounds, venous pulse and ECG overlaid","The cardiac output plotted against right atrial pressure, with the venous return curve overlaid"],"k":0,"more":"<p>The same beat as the pressure&ndash;volume loop, drawn against time instead of volume. ECG = electrocardiogram.<\/p>","figs":["img/06_pvloop_4.webp"]},{"id":"6-51","q":"On the Wiggers diagram, what do you use as the clock?","o":["The electrocardiogram (ECG): P wave (atria depolarize) &rarr; QRS (ventricles)","The venous pulse: a wave (ventricles contract) &rarr; v wave (atria)","The aortic pressure trace: dicrotic notch (atria) &rarr; upstroke (ventricles)"],"k":0},{"id":"6-52","q":"List the seven phases of the cardiac cycle in order.","o":["Atrial systole &rarr; isovolumetric contraction &rarr; rapid ejection &rarr; reduced ejection &rarr; rapid filling &rarr; isovolumetric relaxation &rarr; reduced filling (diastasis)","Atrial systole &rarr; isovolumetric contraction &rarr; rapid ejection &rarr; reduced ejection &rarr; isovolumetric relaxation &rarr; rapid filling &rarr; reduced filling (diastasis)","Atrial systole &rarr; rapid ejection &rarr; isovolumetric contraction &rarr; reduced ejection &rarr; isovolumetric relaxation &rarr; rapid filling &rarr; reduced filling (diastasis)"],"k":1,"more":"<table><tr><th>Phase<\/th><th>Valves/sounds<\/th><th>Markers<\/th><\/tr><tr><td>Atrial systole<\/td><td>S4 if stiff ventricle<\/td><td>After P; a wave<\/td><\/tr><tr><td>Isovol. contraction<\/td><td>AV valves close: S1<\/td><td>With QRS; c wave<\/td><\/tr><tr><td>Rapid, reduced ejection<\/td><td>Aortic valve opens<\/td><td>Volume falls; T wave in reduced<\/td><\/tr><tr><td>Isovol. relaxation<\/td><td>Semilunar close: S2; dicrotic notch<\/td><td>After T<\/td><\/tr><tr><td>Rapid filling<\/td><td>Mitral opens; S3<\/td><td>v wave peaks<\/td><\/tr><tr><td>Diastasis<\/td><td>&mdash;<\/td><td>Longest; shortens first<\/td><\/tr><\/table>","figs":["img/06_pvloop_4.webp"]},{"id":"6-53","q":"Atrial systole: which heart sound (if present) and which venous pulse wave?","o":["S4 (if the ventricle is stiff); v wave (after the T wave)","S4 (if the ventricle is stiff); a wave (after the P wave)","S3 (if the ventricle is overloaded); a wave (after the P wave)"],"k":1,"figs":["img/06_pvloop_4.webp"]},{"id":"6-54","q":"Isovolumetric contraction: which valves close, which sound, and which markers?","o":["Atrioventricular (AV) valves close &rarr; S1; starts with the QRS; c wave","Atrioventricular (AV) valves open &rarr; S1; starts with the P wave; a wave","Atrioventricular (AV) valves close &rarr; S2; starts with the T wave; v wave"],"k":0,"figs":["img/06_pvloop_4.webp"]},{"id":"6-55","q":"During ejection, which valve opens, and where does the T wave fall?","o":["Mitral valve opens; T wave during rapid ejection","Aortic valve opens; T wave during isovolumetric contraction","Aortic valve opens; T wave during reduced ejection"],"k":2,"more":"<p>Ventricular volume falls through rapid, then reduced, ejection.<\/p>"},{"id":"6-56","q":"Isovolumetric relaxation: which valves close, which sound, and what aortic pressure marker?","o":["Semilunar valves open &rarr; S2; dicrotic notch on the aortic trace (with the P wave)","Atrioventricular valves close &rarr; S1; dicrotic notch on the aortic trace (before the QRS)","Semilunar valves close &rarr; S2; dicrotic notch on the aortic trace (after the T wave)"],"k":2,"figs":["img/06_pvloop_4.webp"]},{"id":"6-57","q":"Rapid filling: which valve opens, which sound (if present), and which venous wave peaks?","o":["Mitral valve opens; S3; v wave peaks as the mitral valve opens","Mitral valve opens; S2; a wave peaks as the mitral valve opens","Aortic valve opens; S1; a wave peaks as the aortic valve opens"],"k":0,"figs":["img/06_pvloop_4.webp"]},{"id":"6-58","q":"Which phase of the cardiac cycle is longest and is the first to shorten when heart rate rises?","o":["Rapid ejection","Isovolumetric contraction","Reduced filling (diastasis)"],"k":2},{"id":"6-59","q":"What does S3 represent, and what does it mean in an adult?","o":["Atrial systole into a stiff ventricle; benign sign of hypertrophy (pressure overload)","Rapid ventricular filling; pathologic sign of congestive heart failure (volume overload)","Rapid ventricular ejection; pathologic sign of aortic stenosis (pressure overload)"],"k":1,"more":"<p>It usually means more treatment is needed.<\/p>"},{"id":"6-60","q":"What does S4 represent?","o":["Closure of the atrioventricular valves at the start of systole","Rapid passive filling of a dilated, volume-overloaded ventricle","Atrial systole pushing blood into a stiff, non-compliant ventricle"],"k":2},{"id":"6-61","q":"What does S4 point to, and does it need extra therapy?","o":["Normal finding in a young athlete; no extra therapy by itself","Left ventricular hypertrophy or hypertension; no extra therapy by itself","Congestive heart failure or volume overload; needs extra diuretic therapy"],"k":1}]},{"t":"Valve lesions on the loop","qs":[{"id":"6-62","q":"How does aortic stenosis change the pressure&ndash;volume loop, and why?","o":["Tall and narrower: much higher pressure needed to eject through a narrow opening","Wide and shifted right: much larger volume returned through a leaking valve","Short and wider: much lower pressure needed to eject through a narrow opening"],"k":0,"more":"<p>A pure afterload problem.<\/p>","hy":true},{"id":"6-63","q":"How does aortic regurgitation change the pressure&ndash;volume loop?","o":["Small and shifted left","Wide and shifted right","Narrow and shifted left"],"k":1,"more":"<p>Blood flows back into the ventricle during diastole on top of normal filling, so the ventricle takes a very large volume and ejects a very large stroke volume.<\/p>","hy":true},{"id":"6-64","q":"Why is there no true isovolumetric relaxation in aortic regurgitation?","o":["The mitral valve is leaking throughout","The aortic valve is stuck shut throughout","The aortic valve is leaking throughout"],"k":2,"hy":true},{"id":"6-65","q":"How does mitral stenosis change the pressure&ndash;volume loop?","o":["Small and shifted left: reduced preload, reduced stroke volume","Small and shifted right: increased preload, reduced stroke volume","Tall and narrower: increased afterload, reduced stroke volume"],"k":0,"more":"<p>Filling is obstructed, so the ventricle cannot take a normal volume.<\/p>","hy":true},{"id":"6-66","q":"Why is there no true isovolumetric contraction in mitral regurgitation?","o":["Blood escapes back into the atrium as soon as the ventricle squeezes &rarr; volume falls immediately","Blood leaks back from the aorta as soon as the ventricle relaxes &rarr; volume rises immediately","Blood escapes into the aorta before the aortic valve opens &rarr; pressure falls immediately"],"k":0,"hy":true},{"id":"6-67","q":"Why does a leaking valve destroy a vertical side of the pressure&ndash;volume loop?","o":["The vertical sides exist only because all four valves are shut","The vertical sides exist only because all four valves are open","The vertical sides exist only because the ventricle is relaxing"],"k":0,"hy":true},{"id":"6-68","q":"A pressure&ndash;volume loop has lost its vertical <b>contraction<\/b> side. Which valve is incompetent?","o":["Aortic valve","Pulmonary valve","Mitral valve"],"k":2,"hy":true},{"id":"6-69","q":"A pressure&ndash;volume loop has lost its vertical <b>relaxation<\/b> side. Which valve is incompetent?","o":["Mitral valve","Tricuspid valve","Aortic valve"],"k":2,"hy":true}]}]},{"n":7,"key":"phys","t":"Cardiac output and venous return","sub":"Lecture 24","cp2":false,"secs":[{"t":"The shared variable","qs":[{"id":"7-0","q":"Which variable do the cardiac function curve and the vascular function curve share on their x-axis?","o":["Mean arterial pressure (effectively the heart&rsquo;s afterload)","Total peripheral resistance (effectively the heart&rsquo;s afterload)","Right atrial pressure (effectively the heart&rsquo;s filling pressure)"],"k":2,"figs":["img/07_co_1.png"]},{"id":"7-1","q":"Trace the chain from venous return to cardiac output.","o":["Venous return &rarr; right atrial pressure &rarr; left ventricular filling (end-diastolic volume) &rarr; heart rate &rarr; &times; stroke volume = venous return","Venous return &rarr; left ventricular filling (end-diastolic volume) &rarr; right atrial pressure &rarr; stroke volume &rarr; &times; heart rate = cardiac output","Venous return &rarr; right atrial pressure &rarr; left ventricular filling (end-diastolic volume) &rarr; stroke volume &rarr; &times; heart rate = cardiac output"],"k":2},{"id":"7-2","q":"In the steady state, how does venous return relate to cardiac output?","o":["Cardiac output always exceeds venous return","Venous return is about half cardiac output","They are equal"],"k":2,"more":"<p>The heart can only eject what comes back.<\/p>"}]},{"t":"The two curves","qs":[{"id":"7-3","q":"What does the cardiac function curve show?","o":["The more filled the heart (higher right atrial pressure), the less blood returns to it: the venous return curve as a graph","The more filled the heart (higher right atrial pressure), the more it pumps: Frank-Starling as a graph","The more filled the heart (higher right atrial pressure), the less it pumps: overstretch as a graph"],"k":1,"figs":["img/07_co_1.png"]},{"id":"7-4","q":"At about what right atrial pressure does the cardiac function curve level off, and at what maximum output?","o":["About 0 mm Hg; about 5 L/min","About 4 mm Hg; about 9 L/min","About 7 mm Hg; about 5 L/min"],"k":1,"figs":["img/07_co_1.png"]},{"id":"7-5","q":"What happens when right atrial pressure rises beyond the cardiac function curve&rsquo;s plateau?","o":["No added output; it only pushes back against venous return","Output keeps rising in proportion; it also boosts venous return","Output falls at once to zero; the heart stops in diastole"],"k":0},{"id":"7-6","q":"What does the vascular function curve show, and which way does it slope?","o":["Higher right atrial pressure &rarr; less venous return; slopes downward","Higher right atrial pressure &rarr; more venous return; slopes upward","Higher mean arterial pressure &rarr; less venous return; slopes downward"],"k":0,"more":"<p>A high back-pressure in the right atrium opposes venous return.<\/p>","figs":["img/07_co_1.png"]},{"id":"7-7","q":"Why does the vascular function curve go flat at its left end?","o":["Right atrial pressure below zero &rarr; veins collapse &rarr; no further gain","Right atrial pressure equals mean systemic filling pressure &rarr; flow stops","Right atrial pressure below zero &rarr; arterioles constrict &rarr; no further gain"],"k":0},{"id":"7-8","q":"What does the crossing point of the cardiac and vascular function curves represent?","o":["The point at which right atrial pressure is zero and flow is maximal","The operating point: the heart pumps exactly what the body returns","The mean systemic filling pressure: the pressure with the heart stopped"],"k":1,"figs":["img/07_co_1.png"],"hy":true}]},{"t":"Mean systemic filling pressure","qs":[{"id":"7-9","q":"What is the mean systemic filling pressure?","o":["The average arterial pressure over one cardiac cycle with the heart beating normally","The pressure in the circulation with the heart stopped and pressure equalised everywhere","The pressure in the veins with the heart beating at its maximum output"],"k":1,"more":"<p>Blood is still under pressure because the vessels are elastic and stretched around it.<\/p>","hy":true},{"id":"7-10","q":"What does mean systemic filling pressure do for venous return?","o":["Opposes blood returning towards the heart","Drives blood back towards the heart","Sets the afterload the ventricle pumps against"],"k":1,"hy":true},{"id":"7-11","q":"Where is mean systemic filling pressure on the vascular function curve?","o":["The left-hand plateau","The x-axis intercept","The y-axis intercept"],"k":1,"figs":["img/07_co_1.png"]},{"id":"7-12","q":"What are the only two things that change mean systemic filling pressure?","o":["Blood volume<br>Arteriolar resistance (how tightly the arterioles constrict)","Blood volume<br>Venous tone (how tightly the veins hold the blood)","Heart rate<br>Contractility (how hard the ventricle squeezes)"],"k":1,"hy":true},{"id":"7-13","q":"How do transfusion, haemorrhage, venoconstriction and venodilatation change mean systemic filling pressure?","o":["Transfusion &uarr;<br>Haemorrhage &darr;<br>Venoconstriction &uarr;<br>Venodilatation &darr;","Transfusion &darr;<br>Haemorrhage &uarr;<br>Venoconstriction &uarr;<br>Venodilatation &darr;","Transfusion &uarr;<br>Haemorrhage &darr;<br>Venoconstriction &darr;<br>Venodilatation &uarr;"],"k":0,"hy":true},{"id":"7-14","q":"Do heart rate and contractility change mean systemic filling pressure?","o":["Yes; both raise it by pumping more blood into the veins","No; it is a property of the vasculature, not the pump","Yes; heart rate raises it but contractility does not"],"k":1,"hy":true}]},{"t":"Moving the cardiac curve","qs":[{"id":"7-15","q":"Which kind of change moves the cardiac function curve?","o":["A change in the heart&rsquo;s strength (contractility)","A change in right atrial pressure","A change in blood volume"],"k":0,"more":"<p>The vascular curve stays put.<\/p>","hy":true},{"id":"7-16","q":"More contractility (e.g. sympathetic drive): what happens to the curves and the new operating point?","o":["Cardiac curve shifts up &rarr; higher cardiac output, higher right atrial pressure","Vascular curve shifts right &rarr; higher cardiac output, higher right atrial pressure","Cardiac curve shifts up &rarr; higher cardiac output, lower right atrial pressure"],"k":2,"more":"<p>The stronger heart empties the atrium better.<\/p>","figs":["img/07_co_2.png"],"hy":true},{"id":"7-17","q":"Heart failure or a negative inotrope: what happens to the curves and the new operating point?","o":["Cardiac curve drops &rarr; lower cardiac output, higher right atrial pressure","Cardiac curve drops &rarr; lower cardiac output, lower right atrial pressure","Cardiac curve shifts up &rarr; higher cardiac output, higher right atrial pressure"],"k":0,"figs":["img/07_co_2.png"],"hy":true}]},{"t":"Moving the vascular curve","qs":[{"id":"7-18","q":"Which kind of change moves the vascular function curve?","o":["Blood volume or venous tone","Contractility or heart rate","Heart rate or blood volume"],"k":0,"hy":true},{"id":"7-19","q":"Which way do transfusion, haemorrhage and venoconstriction shift the vascular function curve?","o":["Transfusion/fluid overload &rarr; left<br>Haemorrhage &rarr; right<br>Venoconstriction &rarr; right","Transfusion/fluid overload &rarr; up<br>Haemorrhage &rarr; down<br>Venoconstriction &rarr; no shift","Transfusion/fluid overload &rarr; right<br>Haemorrhage &rarr; left<br>Venoconstriction &rarr; right"],"k":2,"figs":["img/07_co_3.png"],"hy":true},{"id":"7-20","q":"Why does venoconstriction shift the vascular function curve to the right?","o":["Squeezing the arterioles raises the afterload on the heart","Constricting veins raises their compliance so they hold more blood","Squeezing the venous reservoir pushes blood towards the heart"],"k":2},{"id":"7-21","q":"More blood volume or venoconstriction: what is the new operating point?","o":["Lower cardiac output and higher right atrial pressure","Higher cardiac output and higher right atrial pressure","Higher cardiac output and lower right atrial pressure"],"k":1,"figs":["img/07_co_3.png"],"hy":true},{"id":"7-22","q":"Haemorrhage or venodilation: what is the new operating point?","o":["Lower cardiac output and lower right atrial pressure","Higher cardiac output and lower right atrial pressure","Lower cardiac output and higher right atrial pressure"],"k":0,"figs":["img/07_co_3.png"],"hy":true}]},{"t":"Stressed and unstressed volume","qs":[{"id":"7-23","q":"What is the unstressed volume?","o":["Blood that stretches the vessels and produces no pressure; mostly capillary","Blood held in the heart chambers at the end of systole; mostly ventricular","Blood that only fills the vessels and produces no pressure; mostly venous"],"k":2,"more":"<p>Like the water that fills the pipes before any comes out of the tap.<\/p>","figs":["img/07_co_4.webp"]},{"id":"7-24","q":"Roughly how large is the unstressed volume?","o":["About the first 4 L of blood","About the first 7 L of blood","About the first 1 L of blood"],"k":0,"figs":["img/07_co_4.webp"]},{"id":"7-25","q":"What proportion of blood volume do the veins hold?","o":["About 60%","About 15%","About 85%"],"k":0},{"id":"7-26","q":"What is the stressed volume?","o":["Volume below the unstressed volume; mostly venous; it produces no pressure","Volume above the unstressed volume; mostly arterial; it produces blood pressure","Volume above the unstressed volume; mostly venous; it produces no pressure"],"k":1,"figs":["img/07_co_4.webp"]},{"id":"7-27","q":"How does venoconstriction raise blood pressure?","o":["Raises venous compliance &rarr; shifts blood into the unstressed volume","Raises arteriolar resistance &rarr; shifts blood into the unstressed volume","Lowers venous compliance &rarr; shifts blood into the stressed volume"],"k":2},{"id":"7-28","q":"What does venodilation do to unstressed volume, stressed volume and venous return?","o":["Blood leaves the veins &rarr; unstressed volume &darr; &rarr; stressed volume and venous return &uarr;","Blood pools in veins &rarr; unstressed volume &uarr; &rarr; stressed volume and venous return &darr;","Blood pools in veins &rarr; unstressed volume &uarr; &rarr; stressed volume and venous return &uarr;"],"k":1},{"id":"7-29","q":"Name the venodilators.","o":["Nitrates (nitroglycerin, amyl nitrite)<br>Morphine<br>Phenylephrine<br>Sildenafil<br>Prostacyclin","Nitrates (nitroglycerin, amyl nitrite)<br>Norepinephrine<br>Furosemide<br>Metoprolol<br>Prostacyclin","Nitrates (nitroglycerin, amyl nitrite)<br>Morphine<br>Furosemide<br>Sildenafil<br>Prostacyclin"],"k":2,"more":"<p>Sildenafil boosts the nitric oxide pathway.<\/p>"}]},{"t":"Venous pooling in the clinic","qs":[{"id":"7-30","q":"What are the features of acute pulmonary edema?","o":["Sudden chest pain<br>Rales<br>Cyanosis<br>Pericardial rub","Sudden breathlessness<br>Rales<br>Edema<br>S3 gallop","Sudden breathlessness<br>Wheeze<br>Clubbing<br>S4 gallop"],"k":1},{"id":"7-31","q":"In acute pulmonary edema, what do a venodilator and a diuretic each do?","o":["Venodilator parks blood in the unstressed volume; diuretic removes it","Venodilator moves blood into the stressed volume; diuretic adds to it","Venodilator removes blood; diuretic parks it in the unstressed volume"],"k":0,"more":"<p>The goal is to move volume out of the lungs fast.<\/p>"},{"id":"7-32","q":"Which drug works fastest in acute pulmonary edema and raises unstressed volume the most?","o":["Metoprolol","Hydralazine","Nitroglycerin"],"k":2,"more":"<p>It raises unstressed volume more than an arteriolar dilator (hydralazine), an angiotensin-converting enzyme (ACE) inhibitor, an angiotensin receptor blocker (ARB) or a &beta;-blocker.<\/p>"},{"id":"7-33","q":"Why does a recruit standing still at attention for an hour become lightheaded and tachycardic?","o":["No leg-muscle pump &rarr; blood pools in leg veins &rarr; venous return and output fall &rarr; reflex tachycardia","No leg-muscle pump &rarr; blood pools in leg arteries &rarr; total peripheral resistance rises &rarr; reflex bradycardia","Leg muscles contract continuously &rarr; venous return rises &rarr; output rises &rarr; reflex tachycardia"],"k":0}]},{"t":"Total peripheral resistance","qs":[{"id":"7-34","q":"What does raising arteriolar resistance do to cardiac output and venous return?","o":["Lowers both: less blood gets round the circuit per minute","Neither changes: resistance affects only blood pressure","Raises both: more pressure drives blood round the circuit per minute"],"k":0},{"id":"7-35","q":"Which variable moves <b>both<\/b> the cardiac and vascular function curves, and what mainly sets it?","o":["Total peripheral resistance (TPR); set mainly by the arterioles","Contractility; set mainly by sympathetic beta-1 stimulation","Mean systemic filling pressure; set mainly by the veins"],"k":0,"figs":["img/07_co_5.webp"]},{"id":"7-36","q":"How does higher total peripheral resistance affect the cardiac function curve?","o":["Raises preload &rarr; raises the cardiac curve","Raises afterload &rarr; lowers the cardiac curve","Lowers afterload &rarr; raises the cardiac curve"],"k":1,"figs":["img/07_co_5.webp"]},{"id":"7-37","q":"How does higher total peripheral resistance affect the vascular function curve?","o":["Rotates it down around an unchanged x-axis intercept (mean systemic filling pressure)","Rotates it up around an unchanged x-axis intercept (mean systemic filling pressure)","Shifts it right in parallel, raising the x-axis intercept (mean systemic filling pressure)"],"k":0,"figs":["img/07_co_5.webp"]},{"id":"7-38","q":"What does lower total peripheral resistance do to the curves and cardiac output?","o":["Only the vascular curve moves up &rarr; unchanged cardiac output","Both curves move down &rarr; lower cardiac output","Both curves move up &rarr; higher cardiac output"],"k":2,"figs":["img/07_co_5.webp"]}]},{"t":"Drugs on the curves","qs":[{"id":"7-39","q":"What does a diuretic do to the curves and the operating point?","o":["Less blood volume &rarr; return curve shifts right &rarr; higher output, higher right atrial pressure","Less blood volume &rarr; return curve shifts left &rarr; lower output, lower right atrial pressure","Less blood volume &rarr; cardiac curve drops &rarr; lower output, higher right atrial pressure"],"k":1,"more":"<table><tr><th>Diuretic<\/th><td>Volume &darr; &rarr; return curve left &rarr; output &darr;, right atrial pressure &darr;<\/td><\/tr><tr><th>ACE inhibitor, ARB<\/th><td>TPR &darr; &rarr; both curves up &rarr; output &uarr;<\/td><\/tr><tr><th>Digoxin, dobutamine<\/th><td>Positive inotropes &rarr; cardiac curve up &rarr; output &uarr;, right atrial pressure &darr;<\/td><\/tr><\/table>"},{"id":"7-40","q":"What do ACE inhibitors and ARBs do to the curves and cardiac output?","o":["Lower TPR (arteriolar dilation) &rarr; both curves move up &rarr; higher output","Lower blood volume &rarr; return curve shifts left &rarr; lower output","Raise TPR (arteriolar constriction) &rarr; both curves move down &rarr; lower output"],"k":0},{"id":"7-41","q":"What do digoxin and dobutamine do to the curves and the operating point?","o":["Negative inotropes &rarr; cardiac curve drops &rarr; lower output, higher right atrial pressure","Positive inotropes &rarr; return curve shifts right &rarr; higher output, higher right atrial pressure","Positive inotropes &rarr; cardiac curve shifts up &rarr; higher output, lower right atrial pressure"],"k":2,"figs":["img/07_co_2.png"]},{"id":"7-42","q":"In congestive heart failure, why can the &beta;<sub>1<\/sub>-blocker metoprolol raise cardiac output despite slowing the heart?","o":["Larger stroke volume more than offsets the slower rate","Smaller stroke volume lowers the oxygen cost of each beat","Faster heart rate more than offsets the smaller stroke volume"],"k":0,"more":"<p>Part of the reason: a slower heart has longer diastoles to fill.<\/p>"}]},{"t":"Measuring cardiac output","qs":[{"id":"7-43","q":"What is the conservation logic behind measuring cardiac output from oxygen (Fick)?","o":["Cardiac output = O<sub>2<\/sub> consumed per minute &times; arteriovenous O<sub>2<\/sub> content difference","Cardiac output = O<sub>2<\/sub> consumed per minute &divide; arteriovenous O<sub>2<\/sub> content difference","Cardiac output = arteriovenous O<sub>2<\/sub> content difference &divide; O<sub>2<\/sub> consumed per minute"],"k":1,"more":"<p>All the oxygen consumed must have been carried there by blood, so dividing the consumption by how much each unit of blood gave up gives how much blood went round per minute.<\/p>"},{"id":"7-44","q":"What does a wide arteriovenous O<sub>2<\/sub> difference indicate?","o":["Low cardiac output","High cardiac output","Low O<sub>2<\/sub> consumption"],"k":0,"more":"<p>Tissues extracting more O<sub>2<\/sub> per unit of blood, for the same O<sub>2<\/sub> consumption, means less blood flowed.<\/p>"}]}]},{"n":8,"key":"phys","t":"Keeping blood pressure steady","sub":"Lecture 25","cp2":false,"secs":[{"t":"Mean arterial pressure","qs":[{"id":"8-0","q":"Which pressure does the body defend minute to minute?","o":["Systolic pressure","Mean arterial pressure (MAP)","Central venous pressure (CVP)"],"k":1},{"id":"8-1","q":"What are the body&rsquo;s fast and slow systems for holding blood pressure steady?","o":["Fast: baroreceptor reflex (hours)<br>Slow: renin-angiotensin-aldosterone (weeks to months)","Fast: baroreceptor reflex (seconds)<br>Slow: renin-angiotensin-aldosterone (hours to days)","Fast: renin-angiotensin-aldosterone (seconds)<br>Slow: baroreceptor reflex (hours to days)"],"k":1},{"id":"8-2","q":"Give the equation for mean arterial pressure in terms of cardiac output and resistance.","o":["MAP = cardiac output (CO) &divide; total peripheral resistance (TPR)","MAP = cardiac output (CO) &times; total peripheral resistance (TPR)","MAP = stroke volume (SV) &times; total peripheral resistance (TPR)"],"k":1},{"id":"8-3","q":"Give the equation for mean arterial pressure from systolic and diastolic pressure.","o":["MAP = diastolic + &frac13; pulse pressure (systolic &minus; diastolic)","MAP = diastolic + &frac12; pulse pressure (systolic &minus; diastolic)","MAP = systolic + &frac13; pulse pressure (systolic &minus; diastolic)"],"k":0},{"id":"8-4","q":"Why does doubling cardiac output not double mean arterial pressure?","o":["Heart rate falls whenever CO rises, so CO can never truly double","CO and TPR are independent: TPR is fixed by vessel anatomy and cannot change","CO and TPR are not independent: when one changes, the other tends to move the opposite way"],"k":2},{"id":"8-5","q":"How does a saline bolus raise pressure in a hypotensive septic patient?","o":["&darr; Venous return &rarr; &uarr; heart rate &rarr; &uarr; MAP","&uarr; Venous return &rarr; &darr; cardiac output &rarr; &uarr; TPR","&uarr; Venous return &rarr; &uarr; cardiac output &rarr; &uarr; MAP"],"k":2,"more":"<p>Volume acts through the cardiac output term.<\/p>"}]},{"t":"Baroreceptor pathway","qs":[{"id":"8-6","q":"Where are the arterial baroreceptors?","o":["Carotid body<br>Aortic body","Carotid sinus<br>Right atrium","Carotid sinus<br>Aortic arch"],"k":2,"more":"<p>They watch the pressure in the vessels feeding the brain.<\/p>","figs":["img/08_bp_1.png"],"hy":true},{"id":"8-7","q":"What is the carotid sinus?","o":["The small chemoreceptor nodule at the carotid bifurcation","The dilated bulb at the origin of the external carotid","The dilated bulb at the carotid bifurcation"],"k":2},{"id":"8-8","q":"How does baroreceptor firing change with arterial pressure?","o":["Pressure &uarr; &rarr; more stretch &rarr; more firing<br>Pressure &darr; &rarr; less firing","Pressure &uarr; &rarr; more stretch &rarr; less firing<br>Pressure &darr; &rarr; more firing","Pressure &uarr; &rarr; less stretch &rarr; more firing<br>Pressure &darr; &rarr; less firing"],"k":0,"hy":true},{"id":"8-9","q":"Which nerves carry carotid sinus baroreceptor signals to the medulla?","o":["Carotid sinus nerve (Hering&rsquo;s nerve) &rarr; glossopharyngeal nerve (CN IX)","Carotid sinus nerve (Hering&rsquo;s nerve) &rarr; vagus nerve (CN X)","Carotid sinus nerve (Hering&rsquo;s nerve) &rarr; hypoglossal nerve (CN XII)"],"k":0,"figs":["img/08_bp_1.png"],"hy":true},{"id":"8-10","q":"Which nerve carries aortic arch baroreceptor signals?","o":["Vagus nerve (CN X)","Phrenic nerve (C3&ndash;C5)","Accessory nerve (CN XI)"],"k":0,"figs":["img/08_bp_1.png"],"hy":true},{"id":"8-11","q":"Which medullary nucleus receives baroreceptor input?","o":["Nucleus of the solitary tract (nucleus tractus solitarius)","Dorsal motor nucleus of the vagus","Rostral ventrolateral medulla"],"k":0,"more":"<p>It reads the firing rate and responds.<\/p>","figs":["img/08_bp_1.png"],"hy":true},{"id":"8-12","q":"Besides baroreceptor input, what does the nucleus tractus solitarius receive from the facial nerve (CN VII)?","o":["Touch","Smell","Taste"],"k":2},{"id":"8-13","q":"Name the three medullary centres of the baroreceptor reflex and their outflow.","o":["Cardiac decelerator (cardioinhibitory) &rarr; vagus to heart<br>Cardiac accelerator &rarr; sympathetic<br>Vasoconstrictor (C1) &rarr; sympathetic","Cardiac decelerator (cardioinhibitory) &rarr; sympathetic<br>Cardiac accelerator &rarr; vagus to heart<br>Vasoconstrictor (C1) &rarr; sympathetic","Cardiac decelerator (cardioinhibitory) &rarr; vagus to heart<br>Cardiac accelerator &rarr; sympathetic<br>Vasoconstrictor (C1) &rarr; vagus to vessels"],"k":0,"figs":["img/08_bp_1.png"]}]},{"t":"Baroreceptor reflex responses","qs":[{"id
