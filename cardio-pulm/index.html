":"8-14","q":"When arterial pressure falls, how does the medulla change autonomic outflow?","o":["Receptors fire more &rarr; &uarr; sympathetic outflow, vagal tone withdrawn","Receptors fire less &rarr; &uarr; vagal tone, sympathetic outflow unchanged","Receptors fire less &rarr; &uarr; sympathetic outflow, vagal tone withdrawn"],"k":2,"hy":true},{"id":"8-15","q":"Name the four effector responses to a fall in arterial pressure, with their receptors.","o":["Heart rate &uarr; (&beta;<sub>1<\/sub>)<br>Contractility &uarr; (&alpha;<sub>1<\/sub>)<br>Arterioles and veins constrict (&beta;<sub>2<\/sub>)<br>Renin &uarr; (&alpha;<sub>1<\/sub>)","Heart rate &uarr; (&beta;<sub>2<\/sub>)<br>Contractility &uarr; (&beta;<sub>1<\/sub>)<br>Arterioles and veins constrict (&alpha;<sub>2<\/sub>)<br>Renin &uarr; (&beta;<sub>1<\/sub>)","Heart rate &uarr; (&beta;<sub>1<\/sub>)<br>Contractility &uarr; (&beta;<sub>1<\/sub>)<br>Arterioles and veins constrict (&alpha;<sub>1<\/sub>)<br>Renin &uarr; (&beta;<sub>1<\/sub>)"],"k":2,"hy":true},{"id":"8-16","q":"What does the baroreceptor reflex do when arterial pressure rises?","o":["Receptors fire more &rarr; &uarr; vagal, &darr; sympathetic &rarr; heart rate and contractility &darr;; arterioles and veins dilate","Receptors fire more &rarr; &darr; vagal, &uarr; sympathetic &rarr; heart rate and contractility &uarr;; arterioles and veins constrict","Receptors fire less &rarr; &uarr; vagal, &darr; sympathetic &rarr; heart rate and contractility &darr;; arterioles and veins dilate"],"k":0,"figs":["img/08_bp_1.png"],"hy":true},{"id":"8-17","q":"What do baroreceptors actually sense?","o":["Stretch, not pressure directly; change more than absolute level","Pressure directly, not stretch; absolute level more than change","Flow velocity, not stretch; absolute level more than change"],"k":0},{"id":"8-18","q":"What happens to baroreceptors in chronic hypertension?","o":["They degenerate and stop firing altogether","They reset to defend a new, lower pressure","They reset to defend the new, higher pressure"],"k":2,"more":"<p>Because they respond to change more than to absolute level, they adapt.<\/p>"}]},{"t":"Baroreflex in action","qs":[{"id":"8-19","q":"Why does standing up not normally make you faint?","o":["Blood pools in legs &rarr; venous return and pressure dip &rarr; baroreceptors fire the sympathetic response within a beat or two","Blood shifts to the chest &rarr; venous return and pressure dip &rarr; chemoreceptors fire the sympathetic response within minutes","Blood pools in legs &rarr; venous return and pressure dip &rarr; renin-angiotensin-aldosterone restores pressure within a beat or two"],"k":0},{"id":"8-20","q":"What causes orthostatic hypotension?","o":["An overactive baroreflex arc: excess sympathetic tone, or a drug boosting the vessels&rsquo; ability to respond","An overactive vagal arc: carotid sinus hypersensitivity, or a drug blocking the heart&rsquo;s vagal response","A broken baroreflex arc: autonomic neuropathy, or a drug blocking the vessels&rsquo; ability to respond"],"k":2},{"id":"8-21","q":"What is the Valsalva manoeuvre?","o":["Breathing in hard against a closed glottis, as when gasping","Breathing out hard through an open glottis, as when coughing","Breathing out hard against a closed glottis, as when bearing down"],"k":2},{"id":"8-22","q":"Trace the Valsalva manoeuvre from intrathoracic pressure to heart rate.","o":["&uarr; Intrathoracic pressure &rarr; great veins compressed &rarr; venous return &darr; &rarr; cardiac output and arterial pressure &darr; &rarr; carotid baroreceptors &rarr; tachycardia","&uarr; Intrathoracic pressure &rarr; great veins compressed &rarr; venous return &darr; &rarr; cardiac output and arterial pressure &uarr; &rarr; carotid baroreceptors &rarr; tachycardia","&darr; Intrathoracic pressure &rarr; great veins compressed &rarr; venous return &darr; &rarr; cardiac output and arterial pressure &darr; &rarr; aortic chemoreceptors &rarr; bradycardia"],"k":0},{"id":"8-23","q":"What does the Valsalva manoeuvre do to most murmurs?","o":["Makes them quieter (less blood moving through the heart)","Makes them louder (more blood moving through the heart)","Makes them louder (higher intrathoracic pressure)"],"k":0},{"id":"8-24","q":"How does carotid sinus massage slow the heart?","o":["Stretches the sinus (mimics a pressure rise) &rarr; &uarr; CN IX firing &rarr; reflex vagal slowing","Stretches the sinus (mimics a pressure rise) &rarr; &uarr; CN X firing &rarr; reflex sympathetic slowing","Compresses the sinus (mimics a pressure fall) &rarr; &darr; CN IX firing &rarr; reflex vagal slowing"],"k":0},{"id":"8-25","q":"Carotid sinus massage is a first treatment for which arrhythmia?","o":["Ventricular fibrillation","Supraventricular tachycardia","Ventricular tachycardia"],"k":1}]},{"t":"Renin-angiotensin-aldosterone cascade","qs":[{"id":"8-26","q":"How does the renin-angiotensin-aldosterone system (RAAS) mainly raise blood pressure?","o":["By controlling volume (over hours to days)","By controlling contractility (over minutes)","By controlling heart rate (over seconds)"],"k":0,"hy":true},{"id":"8-27","q":"Which cells release renin?","o":["Zona glomerulosa cells","Juxtaglomerular cells","Proximal tubule cells"],"k":1,"hy":true},{"id":"8-28","q":"What are the three triggers for renin release?","o":["Low renal perfusion (less afferent arteriole stretch)<br>High Na<sup>+<\/sup> reaching the macula densa<br>&beta;<sub>1<\/sub> sympathetic stimulation","High renal perfusion (more afferent arteriole stretch)<br>Low Na<sup>+<\/sup> reaching the macula densa<br>&beta;<sub>1<\/sub> sympathetic stimulation","Low renal perfusion (less afferent arteriole stretch)<br>Low Na<sup>+<\/sup> reaching the macula densa<br>&beta;<sub>1<\/sub> sympathetic stimulation"],"k":2,"hy":true},{"id":"8-29","q":"What does renin do?","o":["Converts angiotensin I &rarr; angiotensin II","Converts angiotensinogen &rarr; angiotensin II","Converts angiotensinogen &rarr; angiotensin I"],"k":2,"more":"<p>Renin is an enzyme.<\/p>","figs":["img/08_bp_2.png"],"hy":true},{"id":"8-30","q":"Where is angiotensinogen made?","o":["The kidney","The liver","The lungs"],"k":1},{"id":"8-31","q":"How active is angiotensin I by itself?","o":["Does almost nothing","Directly stimulates aldosterone release","Directly triggers thirst and ADH release"],"k":0},{"id":"8-32","q":"What converts angiotensin I to angiotensin II, and where mainly?","o":["Angiotensin-converting enzyme (ACE), mainly in the lungs","Aminopeptidase, mainly in the adrenal cortex","Angiotensin-converting enzyme (ACE), mainly in the liver"],"k":0,"figs":["img/08_bp_2.png"],"hy":true},{"id":"8-33","q":"What does aldosterone do, and why is it the slow arm?","o":["Kidney retains K<sup>+<\/sup> and therefore water; slow because it works through cAMP cascades (minutes)","Kidney retains Na<sup>+<\/sup> and therefore water; slow because it works by making new proteins (hours to days)","Kidney excretes Na<sup>+<\/sup> and therefore water; slow because it must travel to the brain first (hours to days)"],"k":1,"hy":true},{"id":"8-34","q":"Put the renin-angiotensin-aldosterone cascade in order, from low pressure to restored pressure.","o":["&darr; Renal perfusion &rarr; renin: angiotensinogen &rarr; angiotensin I &rarr; (ACE) angiotensin II &rarr; vasoconstriction + aldosterone &rarr; Na<sup>+<\/sup> and water retained &rarr; &uarr; volume &rarr; &uarr; pressure","&darr; Renal perfusion &rarr; ACE: angiotensinogen &rarr; angiotensin I &rarr; (renin) angiotensin II &rarr; vasoconstriction + aldosterone &rarr; Na<sup>+<\/sup> and water retained &rarr; &uarr; volume &rarr; &uarr; pressure","&darr; Renal perfusion &rarr; renin: angiotensin I &rarr; angiotensinogen &rarr; (ACE) angiotensin II &rarr; vasoconstriction + aldosterone &rarr; Na<sup>+<\/sup> and water retained &rarr; &uarr; volume &rarr; &uarr; pressure"],"k":0,"figs":["img/08_bp_2.png"],"hy":true}]},{"t":"Angiotensin II actions","qs":[{"id": into the lumen","Na<sup>+<\/sup>/H<sup>+<\/sup> exchanger: H<sup>+<\/sup> into the cell, Na<sup>+<\/sup> into the lumen"],"k":1,"figs":["img/08_bp_2.png"]},{"id":"8-40","q":"In the proximal tubule, what happens to the H<sup>+<\/sup> secreted by the Na<sup>+<\/sup>/H<sup>+<\/sup> exchanger?","o":["H<sup>+<\/sup> + filtered HCO<sub>3<\/sub><sup>&minus;<\/sup> &rarr; CO<sub>2<\/sub> + water &rarr; CO<sub>2<\/sub> exhaled &rarr; H<sup>+<\/sup> + HCO<sub>3<\/sub><sup>&minus;<\/sup> &rarr; HCO<sub>3<\/sub><sup>&minus;<\/sup> into urine","H<sup>+<\/sup> + filtered Cl<sup>&minus;<\/sup> &rarr; HCl &rarr; excreted in urine &rarr; Cl<sup>&minus;<\/sup> lost &rarr; HCO<sub>3<\/sub><sup>&minus;<\/sup> into blood","H<sup>+<\/sup> + filtered HCO<sub>3<\/sub><sup>&minus;<\/sup> &rarr; CO<sub>2<\/sub> + water &rarr; CO<sub>2<\/sub> enters cell &rarr; H<sup>+<\/sup> + HCO<sub>3<\/sub><sup>&minus;<\/sup> &rarr; HCO<sub>3<\/sub><sup>&minus;<\/sup> into blood"],"k":2},{"id":"8-41","q":"What is the net effect of angiotensin II on the proximal tubule?","o":["Na<sup>+<\/sup> and HCO<sub>3<\/sub><sup>&minus;<\/sup> reabsorbed; no net change in H<sup>+<\/sup>","K<sup>+<\/sup> and HCO<sub>3<\/sub><sup>&minus;<\/sup> reabsorbed; net H<sup>+<\/sup> gain","Na<sup>+<\/sup> reabsorbed and HCO<sub>3<\/sub><sup>&minus;<\/sup> excreted; net H<sup>+<\/sup> gain"],"k":0},{"id":"8-42","q":"What is contraction alkalosis, and why does it happen?","o":["Low volume &rarr; low angiotensin II &rarr; bicarbonate excreted &rarr; metabolic acidosis","Low volume &rarr; high angiotensin II &rarr; bicarbonate retained &rarr; metabolic alkalosis","High volume &rarr; high angiotensin II &rarr; bicarbonate retained &rarr; metabolic alkalosis"],"k":1,"more":"<p>Classic case: a marathon runner who has sweated all day in the sun turns up with a metabolic alkalosis.<\/p>"}]},{"t":"RAAS drugs and timescales","qs":[{"id":"8-43","q":"Which drug blocks renin?","o":["Losartan","Lisinopril","Aliskiren"],"k":2,"figs":["img/08_bp_3.webp"]},{"id":"8-44","q":"Where in the cascade do ACE inhibitors act?","o":["Block binding of angiotensin II &rarr; AT<sub>1<\/sub> receptor","Block conversion of angiotensin I &rarr; angiotensin II","Block conversion of angiotensinogen &rarr; angiotensin I"],"k":1,"figs":["img/08_bp_3.webp"]},{"id":"8-45","q":"Where do angiotensin receptor blockers (ARBs, &ldquo;-sartans&rdquo;) act?","o":["Block renin at its active site","Block angiotensin II at its receptor","Block aldosterone at its receptor"],"k":1,"figs":["img/08_bp_3.webp"]},{"id":"8-46","q":"Which drugs block aldosterone?","o":["Spironolactone<br>Eplerenone","Aliskiren<br>Captopril","Furosemide<br>Hydrochlorothiazide"],"k":0,"figs":["img/08_bp_3.webp"]},{"id":"8-47","q":"Which renin-angiotensin-aldosterone blockers lower mortality in congestive heart failure?","o":["ACE inhibitors<br>ARBs<br>Aldosterone blockers<br>(not renin inhibition)","Renin inhibitors only<br>ARBs only<br>Aldosterone blockers only<br>(not ACE inhibition)","ACE inhibitors<br>ARBs<br>Renin inhibitors<br>(not aldosterone blockade)"],"k":0},{"id":"8-48","q":"How do the baroreceptor reflex and RAAS differ in timescale and mechanism?","o":["Baroreceptors: seconds, change volume<br>RAAS: days, change tone","Baroreceptors: days, change volume<br>RAAS: seconds, change tone","Baroreceptors: seconds, change tone<br>RAAS: days, change volume"],"k":2},{"id":"8-49","q":"In the first minutes of heavy bleeding, what keeps the brain perfused?","o":["Aldosterone-driven sodium retention (RAAS)","Reflex vasoconstriction (baroreceptor reflex)","Antidiuretic hormone-driven water retention"],"k":1,"more":"<p>The hormones build up too slowly to be the answer.<\/p>"}]},{"t":"Chemoreceptors","qs":[{"id":"8-50","q":"How do chemoreceptors differ from baroreceptors in what they watch?","o":["Chemoreceptors watch temperature; baroreceptors watch blood chemistry","Chemoreceptors watch blood chemistry; baroreceptors watch pressure","Chemoreceptors watch pressure; baroreceptors watch blood chemistry"],"k":1,"hy":true},{"id":"8-51","q":"Where are the peripheral chemoreceptors?","o":["Medulla, on its ventral surface (in cerebrospinal fluid)","Carotid bodies and near the aortic arch (in the bloodstream)","Carotid sinus and aortic arch wall (in the vessel wall)"],"k":1},{"id":"8-52","q":"What do peripheral chemoreceptors respond to?","o":["Rise in O<sub>2<\/sub>; also falling CO<sub>2<\/sub> and rising pH","Fall in O<sub>2<\/sub> content only, not CO<sub>2<\/sub> or pH","Fall in O<sub>2<\/sub>; also rising CO<sub>2<\/sub> and falling pH"],"k":2},{"id":"8-53","q":"Why are peripheral chemoreceptors a late warning rather than a fine control?","o":["They only fire strongly once O<sub>2<\/sub> has fallen a good way","They fire strongly even at normal O<sub>2<\/sub> and saturate early","They sit in the brainstem, behind the blood–brain barrier"],"k":0},{"id":"8-54","q":"Where are the central chemoreceptors, and what bathes them?","o":["Hypothalamus; blood (not cerebrospinal fluid)","Brainstem; cerebrospinal fluid (not blood)","Aortic arch; interstitial fluid (not blood)"],"k":1},{"id":"8-55","q":"What do central chemoreceptors respond to?","o":["H<sup>+<\/sup> in blood: strictly the arterial pH, which crosses into cerebrospinal fluid directly","CO<sub>2<\/sub>: strictly the pH change it causes after crossing into cerebrospinal fluid","Stretch: strictly the cerebrospinal fluid pressure rise caused by CO<sub>2<\/sub>"],"k":1,"more":"<p>They are much less sensitive to O<sub>2<\/sub>.<\/p>"},{"id":"8-56","q":"Which chemoreceptors are the dominant minute-to-minute controllers of breathing?","o":["Central chemoreceptors","Peripheral chemoreceptors","Aortic body chemoreceptors"],"k":0},{"id":"8-57","q":"Which chemoreceptors mediate hypoxic drive?","o":["Central chemoreceptors only","Central chemoreceptors mainly","Peripheral chemoreceptors only"],"k":2,"more":"<p>Central = the CO<sub>2<\/sub> sensor that barely sees O<sub>2<\/sub>; peripheral = the O<sub>2<\/sub> sensor that can also see CO<sub>2<\/sub>.<\/p>","hy":true}]},{"t":"Two more reflexes","qs":[{"id":"8-58","q":"What vital-sign combination is the signature of raised intracranial pressure?","o":["High blood pressure with a slow pulse","Low blood pressure with a fast pulse","High blood pressure with a fast pulse"],"k":0,"more":"<p>The one place where hypertension and bradycardia belong together.<\/p>"},{"id":"8-59","q":"Why does raised intracranial pressure cause hypertension with bradycardia?","o":["Compressed cerebral vessels &rarr; brain ischemia &rarr; sympathetic surge &rarr; high arterial pressure &rarr; baroreceptors slow the heart","Dilated cerebral vessels &rarr; brain hyperaemia &rarr; sympathetic surge &rarr; high arterial pressure &rarr; chemoreceptors slow the heart","Compressed cerebral vessels &rarr; brain ischemia &rarr; sympathetic surge &rarr; high heart rate &rarr; baroreceptors raise arterial pressure"],"k":0},{"id":"8-60","q":"Where are the low-pressure stretch receptors, and what do they report?","o":["Carotid bodies and aortic bodies; O<sub>2<\/sub>, not filling","Atria and great veins; filling, not arterial pressure","Ventricles and aorta; contractility, not filling"],"k":1},{"id":"8-61","q":"What do the atria do when stretched by a volume load?","o":["Release renin &rarr; salt and water loss + vessel relaxation","Release a peptide &rarr; salt and water retention + vessel constriction","Release a peptide &rarr; salt and water loss + vessel relaxation"],"k":2},{"id":"8-62","q":"How does the atrial stretch response relate to the renin-angiotensin-aldosterone system?","o":["Opposes it: RAAS dumps volume when pressure falls; atrial peptide retains volume when filling rises","Opposes it: RAAS retains volume when pressure falls; atrial peptide dumps volume when filling rises","Activates it: atrial peptide triggers renin release when filling rises"],"k":1}]}]},{"n":9,"key":"phys","t":"Capillaries and why tissue swells","sub":"Lecture 26","cp2":false,"secs":[{"t":"Exchange across the wall","qs":[{"id":"9-0","q":"Why are capillaries ideal for exchange?","o":["Thick muscular wall + few in number → small surface area and very fast flow","One cell thick + enormously numerous → huge surface area and very slow flow","One cell thick + few in number → small surface area and very fast flow"],"k":1,"more":"<p>Capillaries are where the circulation justifies itself: everything else exists to get blood here.<\/p>"},{"id":"9-1","q":"What property of a substance decides how it crosses the capillary wall?","o":["Whether it carries a charge","Whether it binds plasma proteins","Whether it dissolves in lipid"],"k":2},{"id":"9-2","q":"How do oxygen and carbon dioxide cross the capillary wall?","o":["Diffuse straight through the endothelial cells (water-soluble) — slow","Pass between the endothelial cells through water-filled clefts — slow","Diffuse straight through the endothelial cells (lipid-soluble) — fast"],"k":2},{"id":"9-3","q":"What sets the rate at which oxygen and carbon dioxide diffuse across capillaries?","o":["Partial-pressure difference<br>Surface area of open capillaries","Capillary hydrostatic pressure<br>Surface area of open capillaries","Size of the intercellular clefts<br>Plasma protein concentration"],"k":0},{"id":"9-4","q":"How do water-soluble substances (water, ions, glucose, amino acids) cross the capillary wall?","o":["Between the cells, through water-filled clefts — more slowly","Bound to albumin, through the endothelial cells — slowly","Straight through the endothelial cell membranes — fast"],"k":0,"more":"<p>They cannot cross cell membranes, so they must go between the endothelial cells.<\/p>"}]},{"t":"The four Starling pressures","qs":[{"id":"9-5","q":"How many pressures govern fluid movement across the capillary wall, and how do they split?","o":["Two: one favours filtration, one favours reabsorption","Four: two favour filtration, two favour reabsorption","Four: three favour filtration, one favours reabsorption"],"k":1,"more":"<p>Only two really matter day to day: capillary hydrostatic and plasma oncotic pressure.<\/p>"},{"id":"9-6","q":"What is capillary hydrostatic pressure, and which way does it move fluid?","o":["Blood pressure inside the capillary → pushes fluid <b>out<\/b>","Blood pressure inside the capillary → draws fluid back <b>in<\/b>","Pull of plasma proteins in the capillary → pushes fluid <b>out<\/b>"],"k":0},{"id":"9-7","q":"What is plasma oncotic pressure, and which way does it move fluid?","o":["Pull of plasma proteins (mainly fibrinogen) → draws fluid <b>out<\/b>","Pull of plasma proteins (mainly albumin) → pushes fluid <b>out<\/b>","Pull of plasma proteins (mainly albumin) → draws fluid back <b>in<\/b>"],"k":2,"more":"<p>The proteins are too big to leak out, so they stay in the capillary and pull.<\/p>"},{"id":"9-8","q":"Which way does interstitial hydrostatic pressure move fluid across the capillary wall?","o":["Pushes it <b>out<\/b> of the capillary","Has no effect on fluid movement","Pushes it back <b>into<\/b> the capillary"],"k":2,"hy":true},{"id":"9-9","q":"Which way does interstitial oncotic pressure move fluid across the capillary wall?","o":["Has no effect on fluid movement","Pulls it <b>out<\/b> of the capillary","Pulls it <b>into<\/b> the capillary"],"k":1,"hy":true},{"id":"9-10","q":"Name the two Starling pressures that favour filtration.","o":["Capillary hydrostatic (P<sub>c<\/sub>)<br>Interstitial oncotic (π<sub>i<\/sub>)","Interstitial hydrostatic (P<sub>i<\/sub>)<br>Interstitial oncotic (π<sub>i<\/sub>)","Plasma oncotic (π<sub>c<\/sub>)<br>Interstitial hydrostatic (P<sub>i<\/sub>)"],"k":0,"figs":["img/09_cap_1.png"],"hy":true},{"id":"9-11","q":"Name the two Starling pressures that favour reabsorption.","o":["Plasma (capillary) oncotic (π<sub>c<\/sub>)<br>Interstitial oncotic (π<sub>i<\/sub>)","Plasma (capillary) oncotic (π<sub>c<\/sub>)<br>Interstitial hydrostatic (P<sub>i<\/sub>)","Capillary hydrostatic (P<sub>c<\/sub>)<br>Interstitial hydrostatic (P<sub>i<\/sub>)"],"k":1,"figs":["img/09_cap_1.png"],"hy":true},{"id":"9-12","q":"What happens to fluid at the arterial end of a capillary, and why?","o":["Filters out into the tissue — oncotic pressure wins","Filters out into the tissue — hydrostatic pressure wins","Is reabsorbed into the capillary — oncotic pressure wins"],"k":1},{"id":"9-13","q":"What happens to fluid at the venous end of a capillary, and why?","o":["Most filters out — hydrostatic pressure has risen, oncotic pressure has fallen","Most is reabsorbed — hydrostatic pressure has fallen, oncotic pressure has not","Most is reabsorbed — oncotic pressure has fallen, hydrostatic pressure has not"],"k":1,"more":"<p>Hydrostatic pressure falls along the length of the capillary while oncotic pressure barely changes, so the arteriolar end usually filters and the venular end usually reabsorbs.<\/p>"},{"id":"9-14","q":"What happens to the small fluid surplus left in the tissue after each capillary pass?","o":["Veins collect it → return it to the heart directly","It stays in the tissue → reabsorbed by the next capillary pass","Lymphatics collect it → return it to the circulation"],"k":2}]},{"t":"The Starling equation","qs":[{"id":"9-15","q":"Write the Starling equation for fluid movement across a capillary.","o":["J<sub>v<\/sub> = K<sub>f<\/sub> [(P<sub>c<\/sub> − P<sub>i<\/sub>) − (π<sub>c<\/sub> − π<sub>i<\/sub>)]","J<sub>v<\/sub> = K<sub>f<\/sub> [(P<sub>c<\/sub> + P<sub>i<\/sub>) − (π<sub>c<\/sub> + π<sub>i<\/sub>)]","J<sub>v<\/sub> = K<sub>f<\/sub> [(P<sub>c<\/sub> − π<sub>c<\/sub>) − (P<sub>i<\/sub> − π<sub>i<\/sub>)]"],"k":0,"more":"<p>J<sub>v<\/sub> = fluid movement; K<sub>f<\/sub> = filtration coefficient; P<sub>c<\/sub>/P<sub>i<\/sub> = capillary/interstitial hydrostatic; π<sub>c<\/sub>/π<sub>i<\/sub> = capillary/interstitial oncotic pressure.<\/p>","hy":true},{"id":"9-16","q":"In the Starling equation, what is K<sub>f<\/sub>?","o":["Reflection coefficient — how completely the wall holds back protein","Filtration coefficient (hydraulic conductance) — how leaky the wall is","Filtration fraction — the share of plasma that filters out"],"k":1,"more":"<p>Same driving pressure, leakier capillary → more fluid moves.<\/p>"},{"id":"9-17","q":"In the Starling equation, what are P<sub>c<\/sub> and P<sub>i<\/sub>?","o":["Capillary and interstitial <b>oncotic<\/b> pressure","Capillary and interstitial <b>hydrostatic<\/b> pressure","Capillary and lymphatic <b>hydrostatic<\/b> pressure"],"k":1,"more":"<p>The printed key under Costanzo fig 4.34 calls P<sub>i<\/sub> oncotic — that is a mistake.<\/p>","figs":["img/09_cap_1.png"]},{"id":"9-18","q":"In the Starling equation, what are π<sub>c<\/sub> and π<sub>i<\/sub>?","o":["Plasma and interstitial <b>crystalloid osmotic<\/b> pressure","Capillary (plasma) and interstitial <b>oncotic<\/b> pressure","Capillary and interstitial <b>hydrostatic<\/b> pressure"],"k":1},{"id":"9-19","q":"In the Starling equation, what does a positive vs a negative result mean?","o":["Positive → filtration<br>Negative → reabsorption","Positive → filtration<br>Negative → lymph flow","Positive → reabsorption<br>Negative → filtration"],"k":0,"hy":true},{"id":"9-20","q":"Net Starling pressure if P<sub>c<\/sub> 30, P<sub>i<\/sub> 1, π<sub>c<\/sub> 26, π<sub>i<\/sub> 3 mmHg?","o":["(30 − 3) − (26 − 1) = <b>+2 mmHg<\/b> → net filtration","(30 − 1) − (26 − 3) = <b>+6 mmHg<\/b> → net filtration","(30 − 1) − (26 + 3) = <b>0 mmHg<\/b> → no net movement"],"k":1,"more":"<p>Net pressure = (out-pushers) − (in-pullers). Decide which way each pressure points before adding.<\/p>","figs":["img/09_cap_1.png"],"hy":true},{"id":"9-21","q":"Net Starling pressure is +6 mmHg and K<sub>f<\/sub> is 0.5 mL/min per mmHg. How much fluid filters?","o":["6.5 mL/min","12 mL/min","3 mL/min"],"k":2,"hy":true},{"id":"9-22","q":"Write the net driving force (NDF) form of the Starling equation.","o":["NDF = (P<sub>c<\/sub> − P<sub>i<\/sub>) − σ(π<sub>c<\/sub> − π<sub>i<\/sub>)","NDF = σ(P<sub>c<\/sub> − P<sub>i<\/sub>) − (π<sub>c<\/sub> − π<sub>i<\/sub>)","NDF = (P<sub>c<\/sub> − P<sub>i<\/sub>) + σ(π<sub>c<\/sub> − π<sub>i<\/sub>)"],"k":0},{"id":"9-23","q":"What is σ, the reflection coefficient?","o":["The fraction of plasma filtered across the wall","How leaky the capillary wall is to water","How completely the capillary wall holds protein back"],"k":2},{"id":"9-24","q":"What does a reflection coefficient (σ) of 1 mean?","o":["Protein cannot cross → exerts its full oncotic pull","Protein crosses freely → exerts no oncotic pull","Protein crosses partly → exerts half its oncotic pull"],"k":0}]},{"t":"Pressure along the capillary","qs":[{"id":"9-25","q":"How does capillary hydrostatic pressure change along a typical capillary?","o":["~35 mmHg (arteriolar end) → ~15 mmHg (venular end)","~15 mmHg (arteriolar end) → ~35 mmHg (venular end)","~90 mmHg (arteriolar end) → ~35 mmHg (venular end)"],"k":0,"figs":["img/09_cap_2.webp"]},{"id":"9-26","q":"What is plasma oncotic pressure along a typical capillary?","o":["Falls from 35 to 15 mmHg","Stays near 5 mmHg","Stays near 25 mmHg"],"k":2,"figs":["img/09_cap_2.webp"]},{"id":"9-27","q":"On the idealised profile (hydrostatic 35 → 15 mmHg, oncotic 25 mmHg), what is the net fluid change?","o":["Net filtration — loss from plasma exceeds gain back","None — loss from plasma = gain back to plasma","Net filtration of about 20 mmHg at every point"],"k":1,"more":"<p>The real balance leaves a small surplus, which becomes lymph.<\/p>","figs":["img/09_cap_2.webp"]}]},{"t":"Lymphatics","qs":[{"id":"9-28","q":"Where do lymphatic capillaries lie?","o":["Only around the large veins, away from capillaries","Inside the walls of the blood capillaries","In the interstitium, beside the blood capillaries"],"k":2},{"id":"9-29","q":"What do the one-way flap valves of lymphatic capillaries let in?","o":["Interstitial fluid <b>and protein<\/b> — in, but not back out","Interstitial fluid only — protein kept <b>out<\/b>","Blood cells <b>and protein<\/b> — in and back out freely"],"k":0},{"id":"9-30","q":"Where does lymph re-enter the circulation?","o":["Lymphatics drain → directly into tissue capillaries","Lymphatics merge → thoracic duct → large arteries","Lymphatics merge → thoracic duct → large veins"],"k":2},{"id":"9-31","q":"What propels lymph along the lymphatic vessels?","o":["The vessels' own smooth muscle<br>Surrounding skeletal muscle squeezing them","Capillary hydrostatic pressure alone<br>Arterial pulsation","The heart pumping it directly<br>Gravity draining it downward"],"k":0}]},{"t":"Oedema","qs":[{"id":"9-32","q":"What is oedema, in terms of Starling forces?","o":["The capillary balance tipping outward — lymphatics carry the whole surplus","The capillary balance tipping inward — lymphatics carry away too much fluid","The capillary balance tipping outward — surplus outgrows what lymphatics can carry"],"k":2},{"id":"9-33","q":"Name the four mechanisms of oedema.","o":["Hydrostatic pressure too high<br>Oncotic pressure too low<br>Capillary too leaky<br>Lymphatics blocked","Hydrostatic pressure too low<br>Oncotic pressure too high<br>Capillary too leaky<br>Lymphatics blocked","Hydrostatic pressure too high<br>Oncotic pressure too high<br>Capillary too tight<br>Lymphatics overactive"],"k":0,"more":"<p>Any oedema question is asking which one. Four different terms, one equation.<\/p>"},{"id":"9-34","q":"Causes of oedema from capillary hydrostatic pressure too high?","o":["Heart failure<br>Venous obstruction<br>Arteriolar constriction<br>Extracellular fluid volume depletion<br>Lying flat (blood drains from leg veins)","Heart failure<br>Venous obstruction<br>Arteriolar dilation<br>Extracellular fluid volume expansion<br>Standing (blood pools in leg veins)","Liver failure<br>Nephrotic syndrome<br>Arteriolar dilation<br>Malnutrition<br>Standing (blood pools in leg veins)"],"k":1},{"id":"9-35","q":"Causes of oedema from plasma oncotic pressure too low?","o":["Liver failure<br>Heart failure<br>Dehydration","Heart failure<br>Venous obstruction<br>Standing","Liver failure<br>Nephrotic syndrome<br>Malnutrition"],"k":2,"more":"<p>All mean not enough albumin.<\/p>"},{"id":"9-36","q":"Urine protein loss that defines nephrotic syndrome?","o":["More than 0.5 g/day","More than 150 mg/day","More than 3.5 g/day"],"k":2},{"id":"9-37","q":"How do inflammation and burns cause oedema?","o":["Plasma oncotic pressure too low → albumin lost in urine","Lymphatics blocked → interstitial protein cannot drain","Capillary too leaky → protein escapes, dragging water with it"],"k":2,"more":"<p>Inflammation hits two terms at once: it raises permeability <i>and<\/i> lets protein leak out.<\/p>"},{"id":"9-38","q":"Causes of oedema from blocked lymphatics?","o":["Heart failure (classic)<br>Venous thrombosis (clot in deep vein)","Liver cirrhosis (classic)<br>Kwashiorkor (protein malnutrition)","Lymph node removal or irradiation (classic)<br>Filariasis (parasitic infection of the nodes)"],"k":2},{"id":"9-39","q":"Which Starling pressure does lymphatic obstruction change?","o":["Plasma oncotic pressure — it falls","None — pressures stay normal; the drain is removed","Capillary hydrostatic pressure — it rises"],"k":1}]},{"t":"Chemoreceptors","qs":[{"id":"9-40","q":"What role do chemoreceptors play in blood-pressure control?","o":["Backup/emergency system to the baroreceptors","Long-term blood-pressure setting through the kidney","Detector of atrial stretch and blood volume"],"k":0,"more":"<p>They matter little for ordinary pressure control, but when pressure falls far enough that tissues are short of oxygen, they fire hard and drive a powerful sympathetic response.<\/p>"},{"id":"9-41","q":"What do the peripheral chemoreceptors monitor?","o":["Osmolality<br>Carbon dioxide<br>pH","Oxygen<br>Glucose<br>Temperature","Oxygen<br>Carbon dioxide<br>pH"],"k":2},{"id":"9-42","q":"Where are the peripheral chemoreceptors?","o":["Carotid body (glomus caroticum), on the ventral medulla<br>Aortic bodies, in the right atrium","Carotid body (glomus caroticum), at the subclavian origin<br>Pulmonary bodies, on the pulmonary trunk","Carotid body (glomus caroticum), at the carotid bifurcation<br>Aortic bodies, on the arch"],"k":2,"more":"<p>They sit right beside the baroreceptor areas (carotid sinus, aortic arch).<\/p>","figs":["img/09_cap_3.webp"]},{"id":"9-43","q":"What nerves carry peripheral chemoreceptor signals, and to where?","o":["Cranial nerves X and XI → dorsal motor nucleus of the vagus (medulla)","Cranial nerves V and VII → nucleus ambiguus (medulla)","Cranial nerves IX and X → nucleus tractus solitarius (medulla)"],"k":2,"more":"<p>The same route as the baroreceptors.<\/p>"},{"id":"9-44","q":"What is the main stimulus for the peripheral chemoreceptors?","o":["Hypoxia","Hypercapnia","Acidosis"],"k":0,"more":"<p>High carbon dioxide or low pH makes them more sensitive to hypoxia.<\/p>"},{"id":"9-45","q":"What three responses follow hypoxia sensed by the peripheral chemoreceptors?","o":["Arteriolar vasoconstriction<br>Transient fall in heart rate<br>Hyperventilation","Arteriolar vasodilation<br>Transient rise in heart rate<br>Hypoventilation","Arteriolar vasoconstriction<br>Sustained fall in heart rate<br>Hypoventilation"],"k":0},{"id":"9-46","q":"Why is the heart-rate fall from peripheral chemoreceptor stimulation only transient?","o":["The baroreceptors override it within seconds","The adrenal medulla releases adrenaline directly","The extra breathing itself speeds the heart back up"],"k":2},{"id":"9-47","q":"What do the central chemoreceptors in the medulla respond to?","o":["Falling carbon dioxide and falling pH","Rising carbon dioxide and falling pH","Rising blood pressure and rising osmolality"],"k":1,"more":"<p>They are much less sensitive to hypoxia.<\/p>"},{"id":"9-48","q":"Classic trigger and response of the central chemoreceptors?","o":["Brain short of blood → local CO<sub>2<\/sub> rises → big sympathetic rise + peripheral vasoconstriction → blood shunted to brain","Brain short of blood → local CO<sub>2<\/sub> falls → sympathetic fall + peripheral vasodilation → blood pressure falls","Brain short of blood → local O<sub>2<\/sub> rises → big vagal rise + peripheral vasodilation → blood shunted to limbs"],"k":0},{"id":"9-49","q":"What is the Cushing reflex?","o":["Raised intracranial pressure → hypertension with bradycardia","Raised intracranial pressure → hypotension with tachycardia","Lowered intracranial pressure → hypertension with tachycardia"],"k":0,"more":"<p>The central chemoreceptor response when the cause of brain ischaemia is raised intracranial pressure.<\/p>"},{"id":"9-50","q":"Why can 100% oxygen make a carbon-dioxide-retaining COPD patient worse?","o":["Removes the hypoxic drive → breathing falls off","Raises the hypercapnic drive → breathing becomes too fast","Causes oxygen toxicity → alveoli collapse"],"k":0,"more":"<p>Example: chronic obstructive pulmonary disease (COPD) with pH 7.22, PCO<sub>2<\/sub> 70 mmHg, PO<sub>2<\/sub> 55 mmHg — the patient depends on hypoxic drive to keep breathing.<\/p>"}]},{"t":"ADH (vasopressin)","qs":[{"id":"9-51","q":"Two triggers for antidiuretic hormone (ADH, vasopressin) release?","o":["Osmolality rises<br>Pressure or volume falls","Osmolality rises<br>Pressure or volume rises","Osmolality falls<br>Pressure or volume rises"],"k":0},{"id":"9-52","q":"How much must osmolality rise to release ADH, and what receptor/effect follows?","o":["~1% → <b>V2<\/b> (kidney): water reabsorption","~10% → <b>V2<\/b> (kidney): water reabsorption","~1% → <b>V1<\/b> (kidney): sodium reabsorption"],"k":0,"more":"<table><tr><th>Trigger<\/th><th>Change<\/th><th>Receptor, effect<\/th><\/tr><tr><td>Osmolality ↑<\/td><td>~1%<\/td><td>V2: water reabsorption<\/td><\/tr><tr><td>Pressure/volume ↓<\/td><td>~10%<\/td><td>V1: vasoconstriction<\/td><\/tr><\/table>"},{"id":"9-53","q":"How much must pressure or volume fall to release ADH, and what receptor/effect follows?","o":["~10% → <b>V1<\/b> (vascular smooth muscle): vasoconstriction","~10% → <b>V2<\/b> (vascular smooth muscle): vasodilation","~25% → <b>V1<\/b> (kidney): water reabsorption"],"k":0},{"id":"9-54","q":"Which ADH trigger is more sensitive?","o":["Osmolality — by far","Both equally sensitive","Pressure/volume — by far"],"k":0},{"id":"9-55","q":"Why is vasopressin helpful in septic shock unresponsive to several litres of saline?","o":["V1 action constricts arterioles directly","V1 action raises heart rate and contractility","V2 action retains water to restore volume"],"k":0}]},{"t":"Low-pressure baroreceptors, ANP","qs":[{"id":"9-56","q":"Where are the cardiopulmonary (low-pressure) baroreceptors?","o":["Veins, atria, pulmonary artery","Carotid body, aortic bodies","Arterioles, left ventricle, aorta"],"k":0,"more":"<p>Where most of the blood volume sits.<\/p>"},{"id":"9-57","q":"What do the cardiopulmonary (low-pressure) baroreceptors sense?","o":["Arterial pressure, not volume","Fullness (volume), not arterial pressure","Oxygen and carbon dioxide levels"],"k":1},{"id":"9-58","q":"Four responses of the low-pressure baroreceptors to a rise in volume?","o":["↑ Atrial natriuretic peptide (ANP)<br>↓ ADH (hypothalamus inhibited)<br>Renal vasodilation → kidney excretes the extra volume<br>↑ Heart rate (Bainbridge reflex)","↑ Atrial natriuretic peptide (ANP)<br>↑ ADH (hypothalamus stimulated)<br>Renal vasodilation → kidney excretes the extra volume<br>↓ Heart rate (Bainbridge reflex)","↑ Atrial natriuretic peptide (ANP)<br>↓ ADH (hypothalamus inhibited)<br>Renal vasoconstriction → kidney retains the extra volume<br>↑ Heart rate (Cushing reflex)"],"k":0},{"id":"9-59","q":"What is the Bainbridge reflex?","o":["↑ Venous filling → ↑ heart rate, passing the extra venous volume forward","↑ Arterial pressure → ↑ heart rate, passing the extra volume forward","↑ Venous filling → ↓ heart rate, letting the ventricles fill longer"],"k":0,"more":"<p>Contrast: a rise in <i>arterial<\/i> pressure slows the heart, but a rise in <i>venous<\/i> filling speeds it.<\/p>"},{"id":"9-60","q":"What does atrial natriuretic peptide (ANP) do?","o":["Relaxes vascular smooth muscle → ↓ TPR<br>Kidney loses salt and water","Relaxes vascular smooth muscle → ↓ TPR<br>Kidney retains salt and water","Constricts vascular smooth muscle → ↑ TPR<br>Kidney loses salt and water"],"k":0,"more":"<p>It empties the volume side.<\/p>"},{"id":"9-61","q":"What is BNP, and what is it used for clinically?","o":["Brain natriuretic peptide (mainly from the hypothalamus) — blood test showing unexplained headache is raised intracranial pressure","B-type natriuretic peptide (mainly from stretched ventricles) — blood test showing unexplained breathlessness is congestive heart failure","B-type natriuretic peptide (mainly from stretched atria) — blood test showing unexplained chest pain is myocardial infarction"],"k":1}]}]},{"n":10,"key":"phys","t":"Special circulations, and the body under stress","sub":"Lectures 27–29","cp2":false,"secs":[{"t":"Flow control, autoregulation","qs":[{"id":"10-0","q":"What share of resting cardiac output goes to skeletal muscle, gut and kidneys?","o":["About a third each","About a tenth each","About a quarter each"],"k":2},{"id":"10-1","q":"What share of resting cardiac output goes to the brain, heart and skin?","o":["Brain ~15%<br>Heart ~5%<br>Skin ~5%","Brain ~5%<br>Heart ~15%<br>Skin ~5%","Brain ~25%<br>Heart ~5%<br>Skin ~15%"],"k":0},{"id":"10-2","q":"How does exercise shift the shares of cardiac output?","o":["More to muscle and gut; less to brain","More to muscle; less to gut and skin","More to gut; less to muscle and skin"],"k":1},{"id":"10-3","q":"Which structures receive <i>all<\/i> of the cardiac output every minute?","o":["The right heart chambers only","Each heart chamber and the lungs","The left ventricle and the brain"],"k":1},{"id":"10-4","q":"Two directions from which organ blood flow is controlled?","o":["Local: endothelial shear stress only<br>Neural and hormonal: parasympathetic nerves + circulating vasoactive substances","Local: sympathetic nerves act on its arterioles<br>Neural and hormonal: tissue metabolites + circulating vasoactive substances","Local: tissue metabolites act on its arterioles<br>Neural and hormonal: sympathetic nerves + circulating vasoactive substances"],"k":2},{"id":"10-5","q":"What is autoregulation?","o":["An organ keeping its own blood flow nearly constant despite changing arterial pressure, by adjusting its arterioles","An organ keeping its own perfusion pressure nearly constant despite changing flow, by adjusting its venules","The brainstem keeping arterial pressure nearly constant despite changing organ flow, via sympathetic nerves"],"k":0},{"id":"10-6","q":"Two mechanisms of autoregulation?","o":["Neural<br>Metabolic","Myogenic<br>Metabolic","Hormonal<br>Myogenic"],"k":1},{"id":"10-7","q":"What is the myogenic mechanism?","o":["A stretched arteriole constricts by itself — no nerve involved","A stretched arteriole constricts via local sympathetic reflex","A stretched arteriole dilates by itself — no nerve involved"],"k":0},{"id":"10-8","q":"What is the metabolic mechanism of autoregulation?","o":["Local waste products (angiotensin II, O<sub>2<\/sub>, Na<sup>+<\/sup>) dilate arterioles when flow falls short of need","Local waste products (adenosine, CO<sub>2<\/sub>, K<sup>+<\/sup>) dilate arterioles when flow falls short of need","Local waste products (adenosine, CO<sub>2<\/sub>, K<sup>+<\/sup>) constrict arterioles when flow exceeds need"],"k":1},{"id":"10-9","q":"Where is autoregulation strongest, and where weakest?","o":["Strongest: heart, brain, kidney<br>Weakest: skin, bone","Strongest: skin, skeletal muscle<br>Weakest: brain, kidney","Strongest: skin, bone<br>Weakest: heart, brain, kidney"],"k":0,"hy":true},{"id":"10-10","q":"State the law of Laplace for a vessel wall.","o":["Tension = radius ÷ pressure","Tension = pressure ÷ radius","Tension = pressure × radius"],"k":2},{"id":"10-11","q":"How does the law of Laplace explain the myogenic response?","o":["Pressure ↑ → arteriole narrows → wall tension steady; extra resistance holds flow constant","Pressure ↑ → venule narrows → wall tension steady; extra capacitance holds flow constant","Pressure ↑ → arteriole widens → wall tension falls; less resistance holds flow constant"],"k":0,"more":"<p>When pressure falls, the arteriole widens.<\/p>"}]},{"t":"Hyperaemia and metabolites","qs":[{"id":"10-12","q":"What is active hyperaemia?","o":["Flow rising <i>while<\/i> demand rises (e.g. exercising muscle)","Flow rising <i>before<\/i> demand rises (e.g. anticipatory sympathetic drive)","Flow falling <i>while<\/i> demand rises (e.g. exercising muscle)"],"k":0},{"id":"10-13","q":"What is reactive hyperaemia?","o":["Flow rising <i>afterwards<\/i> (after exertion or a brief blockage) to repay the oxygen debt","Flow falling <i>afterwards<\/i> (after exertion or a brief blockage) to limit reperfusion injury","Flow rising <i>beforehand<\/i> (before exertion) in anticipation of oxygen debt"],"k":0,"more":"<p>The coronary bed is the classic example.<\/p>"},{"id":"10-14","q":"Name the dilating metabolites produced by working tissue.","o":["Lactate<br>H<sup>+<\/sup><br>CO<sub>2<\/sub><br>K<sup>+<\/sup><br>Adenosine<br>Inorganic phosphate","Lactate<br>H<sup>+<\/sup><br>O<sub>2<\/sub><br>Na<sup>+<\/sup><br>Adenosine<br>Inorganic phosphate","Lactate<br>H<sup>+<\/sup><br>CO<sub>2<\/sub><br>K<sup>+<\/sup><br>Angiotensin II<br>Endothelin"],"k":0,"more":"<p>Work makes tissue hypoxic, and hypoxia generates lactate and acid; work also releases CO<sub>2<\/sub>, potassium, adenosine and phosphate. All dilate most vascular beds.<\/p>"},{"id":"10-15","q":"How is adenosine produced in working tissue?","o":["Hypoxic tissue synthesises it from inosine and ribose","Endothelium secretes it in response to shear stress","Hypoxic tissue breaks down ATP (and cAMP)"],"k":2},{"id":"10-16","q":"Why does a small rise in ATP turnover cause a big proportional rise in adenosine?","o":["Cells hold ~10× more ATP than adenosine","Cells hold ~1000× more ATP than adenosine","Cells hold ~1000× more adenosine than ATP"],"k":1},{"id":"10-17","q":"What is an adenosine thallium (nuclear) stress test?","o":["Adenosine dilates coronaries strongly, standing in for exercise → detects ischaemia in a patient who cannot exercise","Adenosine constricts coronaries strongly, mimicking a blockage → detects collaterals in a patient who cannot exercise","Adenosine dilates coronaries strongly, standing in for thallium → measures ejection fraction in a patient at rest"],"k":0},{"id":"10-18","q":"How does a raised extracellular K<sup>+<\/sup> dilate vessels?","o":["Depolarizes vascular smooth muscle → inactivates Na<sup>+<\/sup> channels → relaxes","Depolarizes vascular smooth muscle → opens Ca<sup>2+<\/sup> channels → contracts","Hyperpolarizes vascular smooth muscle → cannot depolarize to contract → relaxes"],"k":2,"more":"<p>Potassium leaks out of contracting muscle.<\/p>"},{"id":"10-19","q":"Where does phosphate come from in working muscle, and what does it do?","o":["Piles up as ATP is spent → constricts skin vessels","Taken up as creatine phosphate is rebuilt → dilates coronary vessels","Piles up as ATP is spent → dilates skeletal-muscle vessels"],"k":2}]},{"t":"Coronary and cerebral beds","qs":[{"id":"10-20","q":"What mainly controls coronary blood flow?","o":["Myogenic stretch (almost entirely mechanical) — not metabolites","Sympathetic nerves (almost entirely neural) — not metabolites","Local metabolites (almost entirely metabolic) — not nerves"],"k":2,"figs":["img/10_special_1.webp"],"hy":true},{"id":"10-21","q":"Strongest coronary vasodilators?","o":["Hypoxia<br>Potassium","Lactate<br>Histamine","Hypoxia<br>Adenosine"],"k":2,"figs":["img/10_special_1.webp"],"hy":true},{"id":"10-22","q":"Why can the heart get more oxygen only by getting more flow?","o":["Its haemoglobin cannot release more oxygen in the coronary bed","It extracts only about a quarter of the oxygen offered at rest","It already extracts nearly all the oxygen offered at rest"],"k":2},{"id":"10-23","q":"When does the left coronary artery fill, and why?","o":["Throughout the cycle equally — coronary flow is not affected by contraction","Systole — in diastole the relaxed muscle collapses its own vessels","Diastole — in systole the contracting muscle squeezes its own vessels shut"],"k":2,"figs":["img/10_special_1.webp"],"hy":true},{"id":"10-24","q":"Where is the blood with the lowest oxygen saturation in the body?","o":["Coronary sinus","Hepatic vein","Pulmonary artery"],"k":0,"more":"<p>Because the heart extracts so much oxygen.<\/p>"},{"id":"10-25","q":"What is cerebral blood flow most sensitive to?","o":["K<sup>+<\/sup> (plus tight autoregulation)","CO<sub>2<\/sub> (plus tight autoregulation)","O<sub>2<\/sub> (plus tight autoregulation)"],"k":1,"more":"<p>Oxygen matters much less until it is very low.<\/p>","figs":["img/10_special_1.webp"]},{"id":"10-26","q":"Effect of raised vs lowered arterial CO<sub>2<\/sub> on cerebral vessels?","o":["↑ CO<sub>2<\/sub> → constrict, flow ↓<br>Hyperventilation (↓ CO<sub>2<\/sub>) → dilate, flow ↑","↑ CO<sub>2<\/sub> → dilate, flow ↑<br>Hyperventilation (↓ CO<sub>2<\/sub>) → constrict, flow ↓","↑ CO<sub>2<\/sub> → dilate, flow ↑<br>Hyperventilation (↓ CO<sub>2<\/sub>) → dilate, flow ↑"],"k":1},{"id":"10-27","q":"Effect of acid (H<sup>+<\/sup>) on cerebral vessels?","o":["Dilates them","Constricts them","Has no effect on them"],"k":0},{"id":"10-28","q":"Why is a patient with brain herniation from a haematoma hyperventilated?","o":["Low CO<sub>2<\/sub> constricts cerebral vessels → intracranial pressure falls quickly","Low O<sub>2<\/sub> constricts cerebral vessels → intracranial pressure falls quickly","High CO<sub>2<\/sub> dilates cerebral vessels → brain perfusion rises quickly"],"k":0,"more":"<p>A holding measure while drainage is arranged.<\/p>"},{"id":"10-29","q":"Why does rising intracranial pressure reduce cerebral blood flow?","o":["Rigid skull: intracranial pressure directly opposes the pressure driving blood in","Compliant skull: rising pressure stretches vessels and lowers their resistance","Rising pressure triggers reflex cerebral vasoconstriction via sympathetic nerves"],"k":0,"figs":["img/10_special_1.webp"]}]},{"t":"Lung, skin, muscle, kidney","qs":[{"id":"10-30","q":"Effect of low alveolar oxygen on pulmonary vessels?","o":["<b>Constriction<\/b> (hypoxia dilates everywhere else)","<b>Dilation<\/b> (hypoxia constricts everywhere else)","<b>Constriction<\/b> (hypoxia constricts everywhere else)"],"k":0,"more":"<p>The pulmonary exception is the single most tested item in this lesson.<\/p>","figs":["img/10_special_1.webp"],"hy":true},{"id":"10-31","q":"Why is hypoxic pulmonary vasoconstriction useful?","o":["Raises pulmonary pressure → opens more apical capillaries","Diverts blood from badly ventilated areas → well ventilated ones","Diverts blood from well ventilated areas → badly ventilated ones"],"k":1},{"id":"10-32","q":"What happens with widespread lung hypoxia, as in emphysema?","o":["Widespread vasoconstriction → pulmonary hypertension","Widespread vasodilation → pulmonary hypotension","Widespread vasoconstriction → systemic hypertension"],"k":0},{"id":"10-33","q":"What treatment lowers mortality in hypoxic pulmonary hypertension from emphysema?","o":["Beta-2 agonists","Home oxygen","Diuretics"],"k":1},{"id":"10-34","q":"What is skin blood flow controlled for?","o":["Oxygen delivery, not temperature — the body's buffer","Temperature, not the skin's own needs — the body's radiator","Blood pressure, not temperature — the body's reservoir"],"k":1,"more":"<p>Blood is shunted to the surface to lose heat and away to conserve it, so skin flow swings over an enormous range.<\/p>","figs":["img/10_special_1.webp"]},{"id":"10-35","q":"Through which receptor does sympathetic tone control skin vessels?","o":["Alpha-1 (entirely)","Alpha-2 (entirely)","Beta-2 (entirely)"],"k":0},{"id":"10-36","q":"Why is skin the first bed clamped down when blood pressure falls?","o":["Almost purely sympathetically driven → cold, pale skin of a bleeding patient","Almost purely metabolically driven → cold, pale skin of a bleeding patient","Strongest metabolic autoregulation → warm, flushed skin of a bleeding patient"],"k":0},{"id":"10-37","q":"What controls skeletal-muscle blood flow at rest?","o":["Central sympathetic control: alpha-1 constriction","Myogenic tone alone: no sympathetic input","Circulating epinephrine: beta-2 dilation"],"k":0,"figs":["img/10_special_1.webp"]},{"id":"10-38","q":"What controls skeletal-muscle blood flow during running?","o":["Autoregulation: adenosine (most), O<sub>2<\/sub> + circulating norepinephrine's alpha-1 constriction","Autoregulation: lactate (most), K<sup>+<\/sup>, adenosine + circulating epinephrine's beta-2 dilation","Central sympathetic control: alpha-1 constriction (most) + norepinephrine"],"k":1,"figs":["img/10_special_1.webp"]},{"id":"10-39","q":"How is renal blood flow autoregulated?","o":["Myogenic response + tubuloglomerular feedback","Metabolic response + hypoxic vasoconstriction","Myogenic response + sympathetic baroreflex"],"k":0,"figs":["img/10_special_1.webp"]}]},{"t":"Neural and chemical control","qs":[{"id":"10-40","q":"Which vascular beds have dense sympathetic supply, and which have very little?","o":["Dense: coronary, cerebral<br>Very little: skin, skeletal muscle","Dense: skin, skeletal muscle<br>Very little: coronary, pulmonary, cerebral","Dense: skin, pulmonary<br>Very little: coronary, skeletal muscle"],"k":1},{"id":"10-41","q":"Effect of histamine and bradykinin on the microcirculation?","o":["Constrict arterioles, dilate venules → capillary pressure ↓ → fluid reabsorbed","Constrict arterioles and venules → capillary pressure ↑ → fluid leaks out","Dilate arterioles, constrict venules → capillary pressure ↑ → fluid leaks out"],"k":2},{"id":"10-42","q":"Vascular effect of serotonin?","o":["Dilates","No vascular effect","Constricts"],"k":2},{"id":"10-43","q":"Vascular effect of prostaglandins?","o":["Variable, mostly constrict; thromboxane dilates pulmonary vessels","Variable, mostly dilate; prostacyclin dilates pulmonary vessels","Uniformly constrict; prostacyclin constricts pulmonary vessels"],"k":1},{"id":"10-44","q":"Major vascular difference between epinephrine and norepinephrine?","o":["Beta-2: norepinephrine adds beta-2 dilation of muscle vessels; epinephrine (little beta-2) constricts via alpha-1","Beta-1: epinephrine adds beta-1 dilation of skin vessels; norepinephrine constricts via alpha-2","Beta-2: epinephrine adds beta-2 dilation of muscle vessels; norepinephrine (little beta-2) constricts via alpha-1"],"k":2},{"id":"10-45","q":"Where are epinephrine and norepinephrine made?","o":["Epinephrine: only adrenal cortex<br>Norepinephrine: adrenal cortex, sympathetic nerve endings, brain","Norepinephrine: only adrenal medulla<br>Epinephrine: adrenal medulla, sympathetic nerve endings, brain","Epinephrine: only adrenal medulla<br>Norepinephrine: adrenal medulla, sympathetic nerve endings, brain"],"k":2}]},{"t":"Temperature regulation","qs":[{"id":"10-46","q":"Where is the body's thermostat, and how does it work?","o":["Pituitary, by negative feedback; thyroid is its main tool","Hypothalamus, by positive feedback; brown fat is its main tool","Hypothalamus, by negative feedback; skin is its main tool"],"k":2},{"id":"10-47","q":"Responses to warming vs cooling?","o":["Warming → skin vasodilation + sweating<br>Cooling → skin vasoconstriction + shivering","Warming → skin vasoconstriction + sweating<br>Cooling → skin vasodilation + shivering","Warming → skin vasodilation + shivering<br>Cooling → skin vasoconstriction + sweating"],"k":0},{"id":"10-48","q":"Normal core body temperature?","o":["36 °C (96.8 °F); more exactly 36.2 ± 0.4 °C","37 °C (98.6 °F); more exactly 36.8 ± 0.4 °C","38 °C (100.4 °F); more exactly 37.8 ± 0.4 °C"],"k":1,"more":"<p>Wunderlich's norm from a million readings. Normal range about 35.6–38.5 °C.<\/p>"},{"id":"10-49","q":"When in the day is body temperature lowest and highest?","o":["Lowest ~midnight<br>Highest ~noon","Lowest ~6 am<br>Highest ~6 pm","Lowest ~6 pm<br>Highest ~6 am"],"k":1},{"id":"10-50","q":"How do rectal temperature readings differ?","o":["About 0.6 °C (1 °F) lower","About 1.5 °C (3 °F) higher","About 0.6 °C (1 °F) higher"],"k":2},{"id":"10-51","q":"How does body temperature relate to ovulation?","o":["Warmer before ovulation than after","Cooler before ovulation than after","Coolest in the week after ovulation"],"k":1},{"id":"10-52","q":"Three ways the body makes heat?","o":["Cortisol<br>Sympathetic system<br>Vasodilation","Thyroid hormone<br>Parasympathetic system<br>Shivering","Thyroid hormone<br>Sympathetic system<br>Shivering"],"k":2},{"id":"10-53","q":"How does thyroid hormone generate heat?","o":["T4 → rT3 (more active) → speeds Ca<sup>2+<\/sup>-ATPase → ↑ oxygen consumption and metabolic rate","T4 → T3 (more active) → speeds Na<sup>+<\/sup>/K<sup>+<\/sup>-ATPase → ↑ oxygen consumption and metabolic rate","T3 → T4 (more active) → speeds Na<sup>+<\/sup>/K<sup>+<\/sup>-ATPase → ↑ oxygen consumption and metabolic rate"],"k":1},{"id":"10-54","q":"Temperature intolerance in hypothyroidism vs hyperthyroidism?","o":["Hypothyroid: cannot tolerate cold<br>Hyperthyroid: cannot tolerate cold","Hypothyroid: cannot tolerate heat<br>Hyperthyroid: cannot tolerate cold","Hypothyroid: cannot tolerate cold<br>Hyperthyroid: cannot tolerate heat"],"k":2},{"id":"10-55","q":"What switches on sympathetic heat production, and which hormones join it?","o":["Cold, indirectly via thyroid; with insulin, prolactin, ADH","Fever, directly; with aldosterone, insulin, oxytocin","Cold, directly; with cortisol, growth hormone, glucagon"],"k":2},{"id":"10-56","q":"How do catecholamines generate and keep heat?","o":["Burn brown fat (alpha-2 receptors); beta-1 skin vasodilation keeps heat in","Burn brown fat (beta-1 receptors); alpha-1 skin vasoconstriction keeps heat in","Burn white fat (alpha-1 receptors); beta-2 skin vasodilation keeps heat in"],"k":1,"more":"<p>Costanzo says only \"beta receptors\"; many texts name beta-3. Thyroid hormone is permissive for the catecholamine effect.<\/p>"},{"id":"10-57","q":"Mechanism of shivering?","o":["Cold → hypothalamus inhibits alpha and gamma motor neurons → rhythmic cardiac-muscle contraction","Cold → spinal cord reflex alone fires alpha motor neurons → tonic smooth-muscle contraction","Cold → hypothalamus readjusts alpha and gamma motor neurons → rhythmic skeletal-muscle contraction"],"k":2},{"id":"10-58","q":"Which part of the hypothalamus controls heat loss?","o":["Posterior hypothalamus","Anterior hypothalamus","Lateral hypothalamus"],"k":1},{"id":"10-59","q":"How does the skin lose heat?","o":["↑ Sympathetic outflow → skin vessels dilate → blood shunted to surface veins → red, warm skin","↓ Sympathetic outflow → skin vessels constrict → blood shunted to deep veins → pale, cool skin","↓ Sympathetic outflow → skin vessels dilate → blood shunted to surface veins → red, warm skin"],"k":2},{"id":"10-60","q":"What drives sweating?","o":["Parasympathetic cholinergic fibres (vagal nerves releasing acetylcholine)","Sympathetic cholinergic fibres (sympathetic nerves releasing acetylcholine)","Sympathetic adrenergic fibres (sympathetic nerves releasing norepinephrine)"],"k":1}]},{"t":"Fever and heat illness","qs":[{"id":"10-61","q":"Pathway of fever?","o":["Pyrogens → prostaglandin E2 → hypothalamus → interleukin-1 → raised set point","Pyrogens → interleukin-1 → hypothalamus → prostaglandin E2 → raised set point","Pyrogens → interleukin-1 → pituitary → thromboxane A2 → raised set point"],"k":1},{"id":"10-62","q":"How do aspirin, other NSAIDs and acetaminophen lower fever?","o":["Inhibit cyclooxygenase → no prostaglandin E2","Inhibit phospholipase A2 → no arachidonic acid","Inhibit lipoxygenase → no leukotriene B4"],"k":0,"more":"<p>NSAIDs = non-steroidal anti-inflammatory drugs.<\/p>"},{"id":"10-63","q":"How much does each 1 °C of fever raise fluid and calorie needs?","o":["About 40%","About 13%","About 25%"],"k":1},{"id":"10-64","q":"Heat cramps: temperature, mental state and clues?","o":["Both raised; painful leg, arm or abdominal muscles; creatine kinase (CK) high","Temperature above 40 °C, confused; painful leg, arm or abdominal muscles; CK normal","Both normal; painful leg, arm or abdominal muscles; creatine kinase (CK) normal"],"k":2},{"id":"10-65","q":"Heat exhaustion: mental state and clues?","o":["Normal, or mild confusion clearing within 30 min of cooling; sweating, nausea, vomiting, headache, weakness, dizziness, severe thirst; BP normal","Normal, or mild confusion clearing within 30 min of cooling; no sweating, rigidity, high CK, raised arterial CO<sub>2<\/sub>; BP high","Coma clearing within 30 min of cooling; dry skin, nausea, vomiting, headache, weakness, dizziness, no thirst; BP normal"],"k":0,"more":"<p>Mild–moderate dehydration. May faint but recovers promptly.<\/p>"},{"id":"10-66","q":"Why may a patient with heat exhaustion faint (Costanzo)?","o":["Peripheral vasoconstriction raises resistance → cardiac output falls","Heavy sweating shrinks blood volume → arterial pressure falls","Fever raises the set point → cerebral vessels constrict"],"k":1},{"id":"10-67","q":"Heat stroke: temperature, mental state and clues?","o":["Normal temperature; altered mental status; dry skin; CK normal","Above 40 °C; normal mental status; heavy sweating; CK normal","Above 40 °C; altered mental status; dry skin; CK often raised"],"k":2},{"id":"10-68","q":"Treatment of heat stroke?","o":["Dantrolene + intravenous fluids","Evaporative cooling + intravenous fluids","Antipyretics (acetaminophen) + oral fluids"],"k":1},{"id":"10-69","q":"What is malignant hyperthermia, and its findings?","o":["Infection-triggered reaction to anaesthetics (enflurane, sevoflurane): flaccid paralysis, normal CK and arterial CO<sub>2<\/sub>","Probably inherited reaction to local anaesthetics (lidocaine): masseter and general rigidity, low CK and arterial CO<sub>2<\/sub>","Probably inherited reaction to anaesthetics (enflurane, sevoflurane): masseter and general rigidity, high CK and arterial CO<sub>2<\/sub>"],"k":2},{"id":"10-70","q":"Treatment of malignant hyperthermia?","o":["Bromocriptine","Dantrolene","Acetaminophen"],"k":1}]},{"t":"Exercise","qs":[{"id":"10-71","q":"Overall cardiovascular response to exercise?","o":["Metabolites dilate muscle; sympathetic ↑ rate and contractility; venous return ↑; cardiac output ↑ several-fold","Metabolites dilate muscle; sympathetic ↓ rate, ↑ contractility; venous return ↓; cardiac output ↑ several-fold","Metabolites constrict muscle; parasympathetic ↑ rate and contractility; venous return ↓; cardiac output ↑ slightly"],"k":0,"figs":["img/10_special_2.png"],"hy":true},{"id":"10-72","q":"In exercise, why does mean pressure rise only modestly, and what happens to pulse pressure?","o":["Overall resistance falls (much muscle dilated)<br>Pulse pressure widens","Overall resistance falls (much muscle dilated)<br>Pulse pressure narrows","Overall resistance rises (sympathetic constriction)<br>Pulse pressure narrows"],"k":0,"hy":true},{"id":"10-73","q":"Where does the cardiovascular drive in exercise start?","o":["Peripheral chemoreceptors (carotid body)<br>Lung stretch receptors","Arterial baroreceptors (carotid sinus)<br>Central chemoreceptors in the medulla","Central command (brain)<br>Mechano- and chemoreceptors in working muscle"],"k":2,"figs":["img/10_special_2.png"],"hy":true},{"id":"10-74","q":"What do central command and muscle receptors do to autonomic outflow in exercise?","o":["↑ Sympathetic outflow; vagal tone increased to the heart","↑ Sympathetic outflow; vagal tone withdrawn from the heart","↓ Sympathetic outflow; vagal tone increased to the heart"],"k":1,"figs":["img/10_special_2.png"],"hy":true},{"id":"10-75","q":"How does venous return keep pace in exercise?","o":["Veins dilate + muscle pump squeezes them (one-way valves → towards heart)","Arteries constrict + muscle pump squeezes them (two-way valves → towards heart)","Veins constrict + muscle pump squeezes them (one-way valves → towards heart)"],"k":2,"hy":true},{"id":"10-76","q":"Which beds constrict in exercise?","o":["Skin, spleen, gut, kidney, inactive muscle","Coronary, cerebral, working muscle","Skin, coronary, working muscle, kidney"],"k":0,"hy":true},{"id":"10-77","q":"Which beds dilate in exercise?","o":["Skin, spleen, gut (metabolites + beta-2)","Inactive muscle (beta-2), kidney, coronary","Working muscle (metabolites + beta-2), coronary, cerebral"],"k":2,"hy":true},{"id":"10-78","q":"Costanzo's two refinements to the exercise response?","o":["Brain flow held steady, not increased<br>Gut constriction reverses as body temperature climbs → gut flushes","Brain flow held steady, not increased<br>Skin constriction reverses as body temperature climbs → skin flushes","Coronary flow held steady, not increased<br>Skin dilation reverses as body temperature climbs → skin pales"],"k":1},{"id":"10-79","q":"Why do heat and exercise together cause collapse?","o":["Sweating raises blood viscosity; flow to the brain stops","Heat directly depresses the myocardium; cardiac output falls","Muscle and skin both want flow; not enough cardiac output for both"],"k":2}]},{"t":"Haemorrhage and standing","qs":[{"id":"10-80","q":"Initial haemodynamic chain in haemorrhage?","o":["Volume ↓ → cardiac output ↓ → venous return ↓ → pressure ↑","Volume ↓ → venous return ↓ → cardiac output ↓ → pressure ↓","Volume ↓ → pressure ↓ → venous return ↓ → cardiac output ↓"],"k":1},{"id":"10-81","q":"Immediate reflex response to haemorrhage?","o":["Baroreceptors (carotid sinus IX, aortic arch X) → hypothalamus: ↓ sympathetic, ↑ parasympathetic → bradycardia, ↓ contractility, venodilation, arteriolar dilation","Baroreceptors (carotid sinus X, aortic arch IX) → medulla: ↑ sympathetic, ↓ parasympathetic → tachycardia, ↑ contractility, venoconstriction, arteriolar constriction","Baroreceptors (carotid sinus IX, aortic arch X) → medulla: ↑ sympathetic, ↓ parasympathetic → tachycardia, ↑ contractility, venoconstriction, arteriolar constriction"],"k":2,"figs":["img/10_special_3.png"]},{"id":"10-82","q":"Which beds are constricted in haemorrhage, and why?","o":["Skeletal muscle, lung → protect kidney and gut","Skin, gut, kidney → protect brain and heart","Brain, heart → protect skin and gut"],"k":1},{"id":"10-83","q":"Why does fluid shift in from the tissues after haemorrhage?","o":["Constricted arterioles ↓ capillary hydrostatic pressure → Starling balance tips to reabsorption","Constricted venules ↓ capillary hydrostatic pressure → lymph flow increases","Constricted arterioles ↑ capillary hydrostatic pressure → Starling balance tips to filtration"],"k":0,"figs":["img/10_special_3.png"]},{"id":"10-84","q":"Why is renin released in haemorrhage?","o":["↓ Renal perfusion and ↓ afferent arteriole stretch → juxtaglomerular cells release renin","↓ Renal perfusion → macula densa cells release renin directly into the tubule","↑ Renal perfusion and ↑ afferent arteriole stretch → juxtaglomerular cells release renin"],"k":0,"more":"<p>ADH also rises. A fall in volume of about 10% releases enough ADH to act on <b>V1<\/b> receptors (arteriolar constriction), on top of its <b>V2<\/b> effect (the kidney holds on to water).<\/p>","figs":["img/10_special_3.png"]},{"id":"10-85","q":"What does angiotensin II do in haemorrhage?","o":["Constricts venules only<br>Releases cortisol → sodium and water retained","Constricts arterioles<br>Releases aldosterone → sodium and water retained","Constricts arterioles<br>Releases ADH → sodium excreted, water retained"],"k":1,"more":"<p>RAAS = renin-angiotensin-aldosterone system.<\/p>","figs":["img/10_special_3.png"]},{"id":"10-86","q":"How do chemoreceptors add to the haemorrhage response?","o":["Hypoxia → peripheral chemoreceptors push sympathetic outflow higher; brain ischaemia → central chemoreceptors do the same","Hypoxia → central chemoreceptors push sympathetic outflow lower; brain ischaemia → peripheral chemoreceptors do the same","Hypercapnia → peripheral chemoreceptors push parasympathetic outflow higher; brain ischaemia → baroreceptors do the same"],"k":0},{"id":"10-87","q":"Subarachnoid haemorrhage with new, deep T-wave inversions: what do they reflect?","o":["Increased sympathetic outflow — not a coronary clot","A coronary clot — not increased sympathetic outflow","Hyperkalaemia from the bleed — not a coronary clot"],"k":0},{"id":"10-88","q":"Reflex chain on standing up?","o":["Blood pools in legs → venous return ↓ → pressure ↓ → carotid baroreceptors → medulla → beta-1 tachycardia + alpha-1 vasoconstriction","Blood pools in legs → venous return ↓ → pressure ↓ → carotid chemoreceptors → hypothalamus → beta-2 tachycardia + alpha-2 vasodilation","Blood pools in legs → venous return ↓ → pressure ↓ → atrial stretch receptors → medulla → alpha-1 tachycardia + beta-1 vasoconstriction"],"k":0,"more":"<p>Corrects pressure within seconds. Same arc as haemorrhage; only the trigger changes.<\/p>","figs":["img/10_special_4.png"]},{"id":"10-89","q":"Why do the ankles swell after long standing?","o":["Pooling ↑ interstitial oncotic pressure in the legs → more reabsorption","Pooling ↑ capillary hydrostatic pressure in the legs → more filtration","Pooling ↓ capillary hydrostatic pressure in the legs → less lymph drainage"],"k":1},{"id":"10-90","q":"Normal pulse and systolic changes on standing?","o":["Pulse rises < 30 beats/min<br>Systolic falls < 40 mmHg","Pulse falls < 10 beats/min<br>Systolic rises < 20 mmHg","Pulse rises < 10 beats/min<br>Systolic falls < 20 mmHg"],"k":2},{"id":"10-91","q":"What is a positive orthostatic test, and what does it mean?","o":["Pulse ↑ 10, systolic ↓ 20, diastolic ↓ 10 → ~30–40% of blood volume lost","Pulse ↑ 10, systolic ↓ 20, diastolic ↓ 10 → ~15–20% of blood volume lost","Pulse ↓ 10, systolic ↑ 20, diastolic ↑ 10 → ~15–20% of blood volume lost"],"k":1},{"id":"10-92","q":"In a gastrointestinal bleed, what do orthostatics vs endoscopy tell you?","o":["Orthostatics: whether bleeding has stopped<br>Endoscopy: haemoglobin level","Orthostatics: where it is bleeding<br>Endoscopy: how severe (volume lost)","Orthostatics: how severe (volume lost)<br>Endoscopy: where it is bleeding"],"k":2},{"id":"10-93","q":"Systolic < 100 or pulse > 100 in a bleed: how much is lost and what do you do?","o":["~30% lost → skip orthostatics, give 1 L normal saline","~30% lost → do orthostatics, then give 250 mL normal saline","~10% lost → do orthostatics first, give 1 L 5% dextrose"],"k":0},{"id":"10-94","q":"Why give normal saline rather than 5% dextrose in water for blood loss?","o":["Dextrose water spreads through all body water instead of staying in the circulation","Dextrose water pulls fluid out of cells into the circulation","Dextrose water stays in the circulation better but causes hyperglycaemia"],"k":0},{"id":"10-95","q":"Pressure stays low (e.g. 70/40 after 4 L saline): what next?","o":["Add a vasodilator: nitroprusside (or nitroglycerin, hydralazine)","Add a vasopressor: norepinephrine (or dopamine, vasopressin, phenylephrine)","Add a beta-blocker: metoprolol (or esmolol, propranolol)"],"k":1}]},{"t":"Swan–Ganz and shock","qs":[{"id":"10-96","q":"What is a Swan–Ganz catheter?","o":["Balloon-tipped catheter floated through left atrium and ventricle into the aorta (left-heart catheterization)","Central venous catheter ending in the superior vena cava (central line)","Balloon-tipped catheter floated through right atrium and ventricle into a pulmonary artery (right-heart catheterization)"],"k":2,"figs":["img/10_special_5.webp"]},{"id":"10-97","q":"What does the right atrial pressure on a Swan–Ganz catheter reflect?","o":["Filling (preload)","Left ventricular contractility","Pulmonary vascular resistance"],"k":0},{"id":"10-98","q":"What does the Swan–Ganz wedge pressure equal?","o":["Pulmonary artery systolic pressure","Left atrial pressure","Right atrial pressure"],"k":1,"more":"<p>Read with the balloon wedged in a small pulmonary artery branch.<\/p>","figs":["img/10_special_5.webp"]},{"id":"10-99","q":"How is systemic vascular resistance (SVR) obtained from a Swan–Ganz catheter?","o":["Calculated from the cardiac output it measures","Calculated from the wedge pressure alone","Read from the right atrial pressure alone"],"k":0},{"id":"10-100","q":"Septic shock: SVR, cardiac output, wedge?","o":["SVR ↓<br>CO ↑<br>Wedge ↓","SVR ↑<br>CO ↓<br>Wedge ↑","SVR ↓<br>CO ↓<br>Wedge ↑"],"k":0,"more":"<p>Endotoxin dilates vessels → resistance and wedge fall; baroreceptor reflex drives output up.<\/p>"},{"id":"10-101","q":"Cardiac failure: SVR, cardiac output, wedge?","o":["SVR ↑<br>CO ↓<br>Wedge ↑","SVR ↓<br>CO ↑<br>Wedge ↓","SVR ↑<br>CO ↓<br>Wedge ↓"],"k":0,"more":"<p>Weak ventricle can't keep output up; blood backs into the left atrium → wedge rises; reflex vasoconstriction raises resistance.<\/p>"},{"id":"10-102","q":"Hypovolaemia: SVR, cardiac output, wedge?","o":["SVR ↑<br>CO ↓<br>Wedge ↑","SVR ↑<br>CO ↓<br>Wedge ↓","SVR ↓<br>CO ↑<br>Wedge ↓"],"k":1,"more":"<p>Too little venous return lowers output and wedge together; reflex vasoconstriction raises resistance.<\/p><table><tr><th><\/th><th>SVR<\/th><th>CO<\/th><th>Wedge<\/th><\/tr><tr><td>Sepsis<\/td><td>↓<\/td><td>↑<\/td><td>↓<\/td><\/tr><tr><td>Cardiac failure<\/td><td>↑<\/td><td>↓<\/td><td>↑<\/td><\/tr><tr><td>Hypovolaemia<\/td><td>↑<\/td><td>↓<\/td><td>↓<\/td><\/tr><\/table>"}]}]},{"n":30,"key":"phys","t":"Drugs that act on the heart and vessels","sub":"Drug workshop","cp2":false,"secs":[{"t":"BP = CO × TPR","qs":[{"id":"30-0","q":"What equation do you read every cardiovascular drug off?","o":["BP = CO / TPR","CO = BP × TPR","BP = CO × TPR"],"k":2,"more":"<p>Blood pressure = cardiac output × total peripheral resistance.<\/p>","hy":true},{"id":"30-1","q":"A drug can change BP only through which two things?","o":["CO (acting on the arterioles)<br>TPR (acting on the heart)","CO (acting on the heart)<br>TPR (acting on the arterioles)","CO (acting on the heart)<br>TPR (acting on the veins)"],"k":1,"hy":true},{"id":"30-2","q":"Three steps of any drug's blood-pressure tracing?","o":["Direct effect → baroreceptor reflex → change in pressure (if anything is left to carry it)","Baroreceptor reflex → change in pressure → direct effect (if anything is left to carry it)","Direct effect → change in pressure → baroreceptor reflex (if anything is left to carry it)"],"k":2,"figs":["img/30_drugs_1.webp"],"hy":true}]},{"t":"Receptors","qs":[{"id":"30-3","q":"Effect of α<sub>1<\/sub> receptor activation?","o":["Arterioles and veins constrict → TPR ↑","Arterioles and veins dilate → TPR ↓","Heart beats faster and harder → CO ↑"],"k":0},{"id":"30-4","q":"Effect of β<sub>1<\/sub> receptor activation?","o":["Heart beats faster and harder → TPR ↑","Heart beats faster and harder → CO ↑","Heart beats slower and weaker → CO ↓"],"k":1},{"id":"30-5","q":"Effect of β<sub>2<\/sub> receptor activation on vessels?","o":["Skeletal-muscle arterioles dilate → TPR ↓","Skeletal-muscle arterioles constrict → TPR ↑","Heart beats faster and harder → CO ↑"],"k":0},{"id":"30-6","q":"Effect of M<sub>2<\/sub> receptor activation?","o":["Endothelium releases NO → TPR ↓","Heart (vagus) speeds up → CO ↑","Heart (vagus) slows → CO ↓"],"k":2},{"id":"30-7","q":"Effect of M<sub>3<\/sub> receptor activation on vessels?","o":["Endothelium releases endothelin → vessels constrict","Endothelium releases nitric oxide (NO) → vessels constrict","Endothelium releases nitric oxide (NO) → vessels dilate"],"k":2},{"id":"30-8","q":"Where are N<sub>N<\/sub> receptors?","o":["Every neuromuscular junction, skeletal muscle","Parasympathetic ganglia only","Every autonomic ganglion, sympathetic and parasympathetic"],"k":2},{"id":"30-9","q":"What does α<sub>2<\/sub> do?","o":["Brake on norepinephrine release from the nerve ending; in the brainstem ↓ sympathetic outflow","Brake on acetylcholine release from the nerve ending; in the brainstem ↑ sympathetic outflow","Accelerator of norepinephrine release from the nerve ending; in the brainstem ↑ sympathetic outflow"],"k":0}]},{"t":"The baroreceptor reflex","qs":[{"id":"30-10","q":"Reflex response to a <b>rise<\/b> in BP?","o":["Vagal (M<sub>2<\/sub>) reflex → slows the heart","Sympathetic (β<sub>1<\/sub>) reflex → speeds the heart","Vagal (M<sub>3<\/sub>) reflex → dilates arterioles"],"k":0,"figs":["img/30_drugs_1.webp"]},{"id":"30-11","q":"Reflex response to a <b>fall<\/b> in BP?","o":["Sympathetic (β<sub>1<\/sub>) reflex → slows the heart","Sympathetic (β<sub>2<\/sub>) reflex → speeds the heart","Sympathetic (β<sub>1<\/sub>) reflex → speeds the heart"],"k":2,"figs":["img/30_drugs_1.webp"]},{"id":"30-12","q":"Why does blocking autonomic ganglia silence every reflex?","o":["Both reflex arms run through autonomic ganglia","Both reflex arms use β<sub>1<\/sub> receptors on the heart","Both reflex arms run through the adrenal medulla"],"k":0}]},{"t":"Pressors and vasodilators","qs":[{"id":"30-13","q":"Tracing for phenylephrine (pure α<sub>1<\/sub> agonist)?","o":["CO ↑ → BP ↑ → vagal reflex slows heart → CO ↓","TPR ↑ → BP ↑ → vagal reflex slows heart → CO ↓","TPR ↓ → BP ↓ → vagal reflex slows heart → CO ↓"],"k":1,"figs":["img/30_drugs_1.webp"]},{"id":"30-14","q":"Tracing for a vasodilator?","o":["TPR ↓ → BP ↓ → reflex tachycardia → CO ↑","TPR ↑ → BP ↑ → reflex tachycardia → CO ↑","CO ↓ → BP ↓ → reflex vasoconstriction → TPR ↑"],"k":0,"figs":["img/30_drugs_1.webp"]},{"id":"30-15","q":"Three kinds of drug that give the vasodilator tracing?","o":["β<sub>1<\/sub> agonist (dobutamine)<br>Any arteriolar dilator<br>α<sub>1<\/sub> blocker (prazosin)","β<sub>2<\/sub> agonist (albuterol)<br>Any arteriolar dilator<br>α<sub>1<\/sub> blocker (prazosin)","β<sub>2<\/sub> agonist (albuterol)<br>Any arteriolar dilator<br>β<sub>1<\/sub> blocker (atenolol)"],"k":1,"figs":["img/30_drugs_1.webp"]},{"id":"30-16","q":"Size of prazosin's BP fall, and its use?","o":["Mild (e.g. 140/100 → 130/90) — vasopressor in shock","Mild (e.g. 140/100 → 130/90) — antihypertensive","Large (e.g. 140/100 → 90/60) — hypertensive emergency"],"k":1},{"id":"30-17","q":"Why does phentolamine cause a bigger reflex tachycardia than prazosin?","o":["Also stimulates β<sub>1<\/sub> directly → heart beats faster on its own","Also blocks α<sub>2<\/sub> → brake removed → more norepinephrine reaches the heart","Also blocks β<sub>2<\/sub> → vessels constrict → more reflex drive to the heart"],"k":1},{"id":"30-18","q":"Effect of a drug that raises stroke volume alone (β<sub>1<\/sub>: dobutamine or dopamine, cardiotonic use)?","o":["CO ↑ → BP ↑","CO ↑ → BP ↓","CO ↓ → BP ↓"],"k":0}]},{"t":"Phenylephrine after pretreatment","qs":[{"id":"30-19","q":"Phenylephrine after prazosin (α<sub>1<\/sub> blocker)?","o":["Little or no rise — receptor occupied","Bigger rise — vagal reflex removed","Normal rise — different receptor"],"k":0},{"id":"30-20","q":"Phenylephrine after atropine (M<sub>2<\/sub> blocker)?","o":["<b>Same<\/b> rise — atropine acts only on M<sub>3<\/sub> in vessels","<b>Smaller<\/b> rise — vagal reflex potentiated","<b>Bigger<\/b> rise — vagal reflex can no longer slow the heart"],"k":2,"figs":["img/30_drugs_2.webp"]},{"id":"30-21","q":"Phenylephrine after mecamylamine (ganglion blocker)?","o":["No rise at all — every pressor response must pass through a ganglion","Rise with no reflex at all — every reflex must pass through a ganglion","Fall with reflex tachycardia — ganglion blocker reverses the α<sub>1<\/sub> effect"],"k":1,"figs":["img/30_drugs_2.webp"]},{"id":"30-22","q":"Phenylephrine after physostigmine (anticholinesterase)?","o":["Acetylcholine lingers → sympathetic reflex potentiated → heart speeds so much that pressure climbs higher","Acetylcholine lingers → vagal reflex potentiated → heart slows so much that pressure drops back sharply","Acetylcholine destroyed faster → vagal reflex weakened → bigger, sustained rise in pressure"],"k":1,"figs":["img/30_drugs_2.webp"]}]},{"t":"Catecholamines","qs":[{"id":"30-23","q":"Receptors and BP effect of norepinephrine?","o":["α<sub>2<\/sub>, β<sub>1<\/sub>: TPR and CO ↓ together → BP falls steeply","α<sub>1<\/sub>, β<sub>2<\/sub>: TPR ↑, CO ↓ together → BP unchanged","α<sub>1<\/sub>, β<sub>1<\/sub>: TPR and CO ↑ together → BP climbs steeply"],"k":2},{"id":"30-24","q":"Why does norepinephrine show no reflex slowing of the heart?","o":["No vagal reflex is triggered because BP rises too slowly","A vagal reflex is triggered, but the direct β<sub>1<\/sub> push covers it","The vagal reflex is blocked at the ganglion by norepinephrine"],"k":1,"more":"<p>Many pharmacology texts describe the reflex winning instead, with heart rate falling slightly.<\/p>"},{"id":"30-25","q":"Receptors and BP effect of epinephrine?","o":["β<sub>1<\/sub>, β<sub>2<\/sub> (no α<sub>1<\/sub>): CO ↑, BP ↓, reflex tachycardia","α<sub>1<\/sub>, α<sub>2<\/sub>, β<sub>2<\/sub>: TPR ↑, CO ↓, visible reflex slowing","α<sub>1<\/sub>, β<sub>1<\/sub>, β<sub>2<\/sub>: CO and BP ↑, no visible reflex"],"k":2,"figs":["img/30_drugs_3.webp"]},{"id":"30-26","q":"Why does diastolic pressure rise less with epinephrine than norepinephrine?","o":["β<sub>2<\/sub> dilation of muscle vessels opposes the α<sub>1<\/sub> constriction","β<sub>1<\/sub> stimulation shortens diastole and lowers filling pressure","α<sub>2<\/sub> constriction of muscle vessels opposes the β<sub>2<\/sub> dilation"],"k":0},{"id":"30-27","q":"Receptors and BP effect of isoproterenol?","o":["β<sub>2<\/sub> only (no β<sub>1<\/sub>): TPR ↓ → mean and diastolic ↓; CO ↓, pulse pressure narrows","β<sub>1<\/sub>, β<sub>2<\/sub> (no α<sub>1<\/sub>): TPR ↓ → mean and diastolic ↓; CO ↑, pulse pressure widens","β<sub>1<\/sub>, β<sub>2<\/sub> (no α<sub>1<\/sub>): TPR ↑ → mean and diastolic ↑; CO ↓, pulse pressure widens"],"k":1,"more":"<p>The direct β<sub>1<\/sub> effect also hides any reflex.<\/p>"}]},{"t":"Agonists after blockers","qs":[{"id":"30-28","q":"Norepinephrine after phentolamine?","o":["Only β<sub>1<\/sub> left → BP still rises, on output alone","Only α<sub>2<\/sub> left → BP rises on resistance alone","Only β<sub>2<\/sub> left → BP falls (reversal)"],"k":0},{"id":"30-29","q":"Epinephrine after phentolamine?","o":["All receptors blocked → BP <b>unchanged<\/b> (response abolished)","β<sub>2<\/sub> dilation wins → TPR ↓ → BP <b>falls<\/b> (epinephrine reversal)","α<sub>1<\/sub> constriction wins → TPR ↑ → BP <b>rises<\/b> more steeply"],"k":1,"more":"<p>Also called Dale's vasomotor reversal.<\/p>","figs":["img/30_drugs_3.webp"]},{"id":"30-30","q":"Norepinephrine after a β blocker?","o":["Only β<sub>2<\/sub> left → behaves like terbutaline","Only α<sub>1<\/sub> left → behaves like phenylephrine","Only β<sub>1<\/sub> left → behaves like dobutamine"],"k":1},{"id":"30-31","q":"Isoproterenol after a blocker of both β<sub>1<\/sub> and β<sub>2<\/sub>?","o":["Response unchanged","Response abolished","Response reversed"],"k":1},{"id":"30-32","q":"Isoproterenol after metoprolol (β<sub>1<\/sub>-selective)?","o":["β<sub>2<\/sub> lowers TPR, but β<sub>1<\/sub> reflex tachycardia restores BP to baseline","Response abolished — metoprolol blocks β<sub>2<\/sub> as well as β<sub>1<\/sub> at usual doses","β<sub>2<\/sub> still lowers TPR and BP — no direct CO rise and no β<sub>1<\/sub> reflex to offset it"],"k":2},{"id":"30-33","q":"Terbutaline (β<sub>2<\/sub> agonist) after metoprolol?","o":["Same as phenylephrine: TPR and BP rise with reflex slowing","Opposite of isoproterenol: TPR and BP rise with no β<sub>1<\/sub> offset","Same as isoproterenol: TPR and BP fall with no β<sub>1<\/sub> offset"],"k":2}]},{"t":"Cholinergic tracings","qs":[{"id":"30-34","q":"Effect of vagal stimulation (M<sub>2<\/sub>)?","o":["Arterioles dilate → pressure plunges","
