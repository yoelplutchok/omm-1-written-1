>Malonyl transacylase<br>3-Ketoacyl synthase<br>3-Ketoacyl reductase<br>Dehydratase<br>Enoyl reductase<br>Thioesterase"],"k":2},{"id":"18-37","q":"What does the acyl carrier protein's phosphopantetheine arm do?","o":["Swings the growing chain from one active site to the next","Anchors the finished palmitate to the ER membrane","Transfers the chain from cytosol into the mitochondrion"],"k":0},{"id":"18-38","q":"Why does only the fatty acid synthase dimer work?","o":["Each cycle needs the ACP of one chain and the ketoacyl synthase cysteine of the other","The two chains must swap NADPH between their reductase sites","Each cycle needs the biotin of one chain and the thioesterase of the other"],"k":0},{"id":"18-39","q":"How does fatty acid synthase make the first 4-carbon unit?","o":["Loads acetyl + malonyl → transfers 2 carbons from acetyl to malonyl, adding CO<sub>2<\/sub>","Loads acetyl + malonyl → transfers 2 carbons from malonyl to acetyl, releasing CO<sub>2<\/sub>","Loads two acetyls → joins them directly, using ATP"],"k":1,"more":"<p>The CO<sub>2<\/sub> released is the one acetyl-CoA carboxylase added.<\/p>"},{"id":"18-40","q":"After condensation, what three steps complete each fatty acid synthase cycle?","o":["Oxidise → hydrate → oxidise","Reduce → dehydrate → reduce","Dehydrate → reduce → reduce"],"k":1,"more":"<p>Then it repeats with a fresh malonyl-CoA.<\/p>"},{"id":"18-41","q":"How many cycles does fatty acid synthase run to make palmitate?","o":["7","6","8"],"k":0},{"id":"18-42","q":"In which direction is the palmitate chain built?","o":["From the ω-end toward the carboxyl end","From the carboxyl end toward the ω-end","From both ends toward the middle"],"k":0},{"id":"18-43","q":"Which activity cuts the finished palmitate off fatty acid synthase?","o":["Thioesterase","Enoyl reductase","3-Ketoacyl synthase"],"k":0},{"id":"18-44","q":"What does thioesterase II do in the lactating breast?","o":["Adds double bonds to 16-carbon chains, making them easier for infants to digest","Releases shorter 8–12-carbon fatty acids, easier for infants to digest","Releases longer 20–22-carbon fatty acids, essential for infant brain growth"],"k":1},{"id":"18-45","q":"What is the overall equation for palmitate synthesis?","o":["Acetyl-CoA + 7 malonyl-CoA + 7 NADPH + 7 H<sup>+<\/sup> → palmitate + 7 CO<sub>2<\/sub> + 6 H<sub>2<\/sub>O + 8 CoA + 7 NADP<sup>+<\/sup>","Acetyl-CoA + 8 malonyl-CoA + 14 NADH + 14 H<sup>+<\/sup> → palmitate + 8 CO<sub>2<\/sub> + 7 H<sub>2<\/sub>O + 9 CoA + 14 NAD<sup>+<\/sup>","Acetyl-CoA + 7 malonyl-CoA + 14 NADPH + 14 H<sup>+<\/sup> → palmitate + 7 CO<sub>2<\/sub> + 6 H<sub>2<\/sub>O + 8 CoA + 14 NADP<sup>+<\/sup>"],"k":2},{"id":"18-46","q":"How many NADPH does one palmitate cost?","o":["16","14","7"],"k":1,"more":"<p>2 per cycle × 7 cycles (the two reductions in each cycle).<\/p>"}]},{"t":"Supplying NADPH","qs":[{"id":"18-47","q":"What is the chief source of NADPH for fatty acid synthesis?","o":["Pentose phosphate pathway","Malate–aspartate shuttle","Citric acid cycle"],"k":0},{"id":"18-48","q":"Which enzyme supplies roughly half the NADPH for fat synthesis?","o":["Isocitrate lyase","Malate dehydrogenase","Malic enzyme"],"k":2,"figs":["img/18_synth_1.webp"]},{"id":"18-49","q":"How is the oxaloacetate left by ATP-citrate lyase recycled while making NADPH?","o":["OAA → malate (cytosolic malate dehydrogenase, uses NADH) → pyruvate + CO<sub>2<\/sub> (malic enzyme, makes NADPH)","OAA → PEP + CO<sub>2<\/sub> (PEP carboxykinase, makes NADPH) → pyruvate (pyruvate kinase, makes ATP)","OAA → malate (malic enzyme, makes NADPH) → pyruvate + CO<sub>2<\/sub> (cytosolic malate dehydrogenase, uses NADH)"],"k":0,"figs":["img/18_synth_1.webp"]},{"id":"18-50","q":"Besides fatty acid synthesis, what else uses NADPH?","o":["Steroid synthesis<br>Cytochrome P450 system<br>Detoxifying reactive oxygen species","β-Oxidation<br>Cytochrome P450 system<br>Detoxifying reactive oxygen species","Steroid synthesis<br>Glycolysis<br>Detoxifying reactive oxygen species"],"k":0}]},{"t":"Elongation and desaturation","qs":[{"id":"18-51","q":"From which fatty acid are all other fatty acids made, and in what form?","o":["Palmitate, activated to palmitoylcarnitine","Palmitate, activated to palmitoyl-CoA","Stearate, activated to stearoyl-CoA"],"k":1,"figs":["img/18_synth_1.webp"]},{"id":"18-52","q":"Where does fatty acid elongation occur, and what is the two-carbon donor at each site?","o":["Rough ER: propionyl-CoA<br>Peroxisomes: acetyl-CoA","Smooth ER: acetyl-CoA<br>Mitochondria: malonyl-CoA","Smooth ER: malonyl-CoA<br>Mitochondria: acetyl-CoA"],"k":2,"more":"<p>Both add two carbons at a time and use NADPH.<\/p>"},{"id":"18-53","q":"Where does fatty acid desaturation occur?","o":["Endoplasmic reticulum","Mitochondrial matrix","Cytosol, on fatty acid synthase"],"k":0},{"id":"18-54","q":"Where does the first double bond almost always go, and which enzyme places it?","o":["Δ12 (between C12 and C13); Δ12 desaturase","Δ9 (between C9 and C10); stearoyl-CoA (Δ9) desaturase","Δ9 (between C9 and C10); fatty acid synthase dehydratase"],"k":1},{"id":"18-55","q":"What does Δ9 desaturase make from stearic acid?","o":["Palmitic acid (16:0) → stearic acid (18:0)","Stearic acid (18:0) → oleic acid (18:1Δ9)","Stearic acid (18:0) → linoleic acid (18:2Δ9,12)"],"k":1},{"id":"18-56","q":"At which positions can human desaturases insert double bonds?","o":["Δ4, Δ5, Δ6, Δ9, Δ12 — never beyond C12 toward the ω-end","Δ4, Δ5, Δ6, Δ9 — never beyond C9 toward the ω-end","Δ9, Δ12, Δ15 — never below C9 toward the carboxyl end"],"k":1},{"id":"18-57","q":"Name the two essential fatty acids and their ω family.","o":["Linoleic acid: ω-6<br>α-Linolenic acid: ω-3","Linoleic acid: ω-6<br>Arachidonic acid: ω-6","Linoleic acid: ω-3<br>α-Linolenic acid: ω-6"],"k":0},{"id":"18-58","q":"Why are linoleic and α-linolenic acid essential?","o":["Their double bonds lie beyond C9 toward the ω-end, where human desaturases cannot work","They are too long for human elongases to build","Their double bonds lie below C9 toward the carboxyl end, where human desaturases cannot work"],"k":0,"more":"<p>Linoleic (18:2Δ9,12): bond nearest the ω-end is 6 carbons in → ω-6. α-Linolenic (18:3Δ9,12,15): 3 carbons in → ω-3. Both come from the diet (plant oils, fish).<\/p>"},{"id":"18-59","q":"Which ω fatty acid family can humans make themselves, and from what?","o":["ω-6, starting from oleic acid","ω-9, starting from oleic acid","ω-6, starting from linoleic acid"],"k":1},{"id":"18-60","q":"How is arachidonic acid made from linoleic acid?","o":["Linoleic → (Δ6 desaturase) α-linolenic → (elongase) 20:3 → (Δ5 desaturase) arachidonic acid (20:4Δ5,8,11,14)","Linoleic → (Δ5 desaturase) γ-linolenic → (elongase) 20:3 → (Δ6 desaturase) arachidonic acid (20:4Δ5,8,11,14)","Linoleic → (Δ6 desaturase) γ-linolenic → (elongase) 20:3 → (Δ5 desaturase) arachidonic acid (20:4Δ5,8,11,14)"],"k":2},{"id":"18-61","q":"How is eicosapentaenoic acid (EPA) made from α-linolenic acid?","o":["α-Linolenic → (Δ6) 18:4 → (elongase) 20:4 → (Δ5) EPA (20:5)","α-Linolenic → (Δ5) 18:4 → (elongase) 20:4 → (Δ6) EPA (20:5)","α-Linolenic → (elongase) 20:3 → (Δ9) 20:4 → (Δ5) EPA (20:5)"],"k":0},{"id":"18-62","q":"How is docosahexaenoic acid (DHA) made from EPA?","o":["EPA → elongation to 24:5 → (Δ6) 24:6 → one round of β-oxidation → DHA (22:6)","EPA → elongation to 22:5 → (Δ9) DHA (22:6)","EPA → elongation to 24:5 → (Δ6) 24:6 → two rounds of β-oxidation → DHA (22:6)"],"k":0}]},{"t":"Triacylglycerol: liver vs adipose","qs":[{"id":"18-63","q":"What is a triacylglycerol (TAG) built from?","o":["Two fatty acyl-CoA and one phosphocholine added to a glycerol 3-phosphate backbone","Three free fatty acids added all at once to a free glycerol backbone","Three fatty acyl-CoA added one at a time to a glycerol 3-phosphate backbone"],"k":2,"figs":["img/18_synth_3.webp"]},{"id":"18-64","q":"Where does liver TAG go vs adipose TAG?","o":["Liver: exported as HDL<br>Adipose: stored as depot fat","Liver: stored as depot fat<br>Adipose: exported as VLDL","Liver: exported as VLDL<br>Adipose: stored as depot fat"],"k":2,"figs":["img/18_synth_3.webp"]},{"id":"18-65","q":"What fatty acids typically sit on C1, C2 and C3 of stored TAG?","o":["C1 unsaturated<br>C2 saturated<br>C3 variable","C1 saturated<br>C2 unsaturated<br>C3 variable","C1 variable<br>C2 saturated<br>C3 unsaturated"],"k":1},{"id":"18-66","q":"Where is most of the body's lipid stored, and as what?","o":["&gt;95% as glycogen in liver (small amounts in adipose and muscle)","&gt;95% as TAG in liver (small amounts in adipose and muscle)","&gt;95% as TAG in adipose tissue (small amounts in liver and muscle)"],"k":2},{"id":"18-67","q":"Where do adipose tissue and muscle get most of their fatty acids?","o":["Plasma: FFA on LDL, or TAG of VLDL (after a meal) and chylomicrons (post-absorptive, 6–12 h later)","Plasma: FFA on transferrin, or TAG of HDL (after a meal) and LDL (post-absorptive, 6–12 h later)","Plasma: FFA on albumin, or TAG of chylomicrons (after a meal) and VLDL (post-absorptive, 6–12 h later)"],"k":2},{"id":"18-68","q":"Which enzyme frees fatty acids from lipoprotein TAG for adipose and muscle, and when is it most active?","o":["Hormone-sensitive lipase (HSL); fasting state, especially low-carbohydrate diet; stimulated by glucagon","Lipoprotein lipase (LPL); fed state, especially high-carbohydrate diet; stimulated by insulin","Lipoprotein lipase (LPL); fasting state, especially high-fat diet; inhibited by insulin"],"k":1},{"id":"18-69","q":"From what glycolytic intermediate can both liver and adipose make glycerol 3-phosphate, and with which enzyme?","o":["Phosphoenolpyruvate (PEP); glycerol 3-phosphate dehydrogenase","Dihydroxyacetone phosphate (DHAP); glycerol 3-phosphate dehydrogenase","Dihydroxyacetone phosphate (DHAP); glycerol kinase"],"k":1,"figs":["img/18_synth_3.webp"]},{"id":"18-70","q":"Which tissue has glycerol kinase to use free glycerol: liver or adipose?","o":["Liver only — adipose lacks glycerol kinase","Neither — both rely on DHAP only","Adipose only — liver lacks glycerol kinase"],"k":0,"figs":["img/18_synth_3.webp"],"hy":true},{"id":"18-71","q":"How does glucose enter liver vs adipose cells?","o":["Liver: GLUT4, insulin-dependent<br>Adipose: GLUT2","Liver: GLUT1<br>Adipose: GLUT3, insulin-dependent","Liver: GLUT2<br>Adipose: GLUT4, insulin-dependent"],"k":2},{"id":"18-72","q":"Where does each tissue get the fatty acids for its TAG: liver vs adipose?","o":["Liver: lipoproteins via LPL (major route)<br>Adipose: its own synthesis (major route)","Liver: its own synthesis (major route)<br>Adipose: lipoproteins via LPL (little made there)","Liver: chylomicron remnants via LPL (major route)<br>Adipose: albumin-bound FFA (little made there)"],"k":1,"more":"<table><tr><th><\/th><th>Liver<\/th><th>Adipose<\/th><\/tr><tr><td>Glucose entry<\/td><td>GLUT2<\/td><td>GLUT4, insulin-dependent<\/td><\/tr><tr><td>Glycerol 3-P from<\/td><td>DHAP + free glycerol<\/td><td>DHAP only<\/td><\/tr><tr><td>Fatty acids from<\/td><td>own synthesis<\/td><td>lipoproteins via LPL<\/td><\/tr><tr><td>TAG<\/td><td>exported as VLDL<\/td><td>stored<\/td><\/tr><\/table>"},{"id":"18-73","q":"Why does adipose tissue store little TAG when glucose or insulin is low?","o":["No glycerol kinase → glycerol 3-P only from DHAP → needs insulin-driven glucose entry via GLUT4","No glycerol 3-P dehydrogenase → glycerol 3-P only from free glycerol → needs glycerol kinase","No lipoprotein lipase → fatty acids only from own synthesis → needs insulin-driven ACC"],"k":0,"hy":true}]},{"t":"Acylation steps and clinical links","qs":[{"id":"18-74","q":"What is the sequence of TAG synthesis from glycerol 3-phosphate, with enzymes?","o":["Glycerol 3-P → (AGPAT) lysophosphatidic acid → (GPAT) phosphatidic acid → (phosphatase) diacylglycerol → (DGAT) TAG","Glycerol 3-P → (GPAT) phosphatidic acid → (AGPAT) lysophosphatidic acid → (phosphatase) diacylglycerol → (DGAT) TAG","Glycerol 3-P → (GPAT) lysophosphatidic acid → (AGPAT) phosphatidic acid → (phosphatase) diacylglycerol → (DGAT) TAG"],"k":2,"more":"<p>GPAT = glycerol-3-phosphate acyltransferase; AGPAT = acylglycerol-phosphate acyltransferase; DGAT = diacylglycerol acyltransferase.<\/p>"},{"id":"18-75","q":"How do insulin and AMPK regulate GPAT and MGAT?","o":["Insulin activates (phosphorylation)<br>AMPK activates","Insulin activates (dephosphorylation)<br>AMPK inhibits","Insulin inhibits (dephosphorylation)<br>AMPK inhibits"],"k":1,"more":"<p>MGAT = monoacylglycerol acyltransferase. Insulin also induces DGAT.<\/p>"},{"id":"18-76","q":"Which TAG-synthesis enzyme does insulin induce?","o":["GPAT (glycerol-3-phosphate acyltransferase)","DGAT (diacylglycerol acyltransferase)","AGPAT (acylglycerol-phosphate acyltransferase)"],"k":1},{"id":"18-77","q":"What does AGPAT deficiency cause?","o":["Familial hypertriglyceridaemia: excess adipose tissue + high VLDL","Congenital generalised lipodystrophy: no adipose tissue + fatty liver","Congenital generalised lipodystrophy: excess adipose tissue + normal liver"],"k":1},{"id":"18-78","q":"Which TAG-synthesis enzyme is overexpressed in cancer, and which is studied as an obesity drug target?","o":["Overexpressed in cancer: DGAT<br>Obesity target: AGPAT","Overexpressed in cancer: AGPAT<br>Obesity target: DGAT","Overexpressed in cancer: AGPAT<br>Obesity target: glycerol kinase"],"k":1},{"id":"18-79","q":"How does liver TAG reach peripheral tissues?","o":["As nascent VLDL, which matures in the blood","As chylomicrons, which mature in the lymph","As nascent HDL, which matures in the blood"],"k":0,"figs":["img/18_synth_3.webp"]},{"id":"18-80","q":"What results when TAG builds up in the liver, and what is the clinical example?","o":["Fatty liver; alcoholic fatty liver (alcohol impairs VLDL export)","Fatty liver; alcoholic fatty liver (alcohol increases VLDL export)","Fatty liver; familial hypercholesterolaemia (LDL receptor defect)"],"k":0,"figs":["img/18_synth_3.webp"]}]}]},{"n":19,"key":"bio","t":"Burning fat: the fasting state","sub":"Lecture 26","cp2":false,"secs":[{"t":"Fasting: releasing stored fat","qs":[{"id":"19-0","q":"What hormonal shift switches the body from storing to releasing fat?","o":["Insulin falls, glucagon rises","Insulin falls, cortisol falls","Insulin rises, glucagon falls"],"k":0},{"id":"19-1","q":"Which adipose enzyme releases fatty acids from stored TAG during fasting?","o":["Hormone-sensitive lipase (HSL)","Acyl-CoA synthetase","Lipoprotein lipase (LPL)"],"k":0},{"id":"19-2","q":"What activates and what inhibits hormone-sensitive lipase?","o":["Activated: glucagon, adrenaline (and cortisol)<br>Inhibited: insulin","Activated: insulin<br>Inhibited: glucagon, adrenaline (and cortisol)","Activated: glucagon, insulin<br>Inhibited: adrenaline"],"k":0},{"id":"19-3","q":"How are free fatty acids carried in the blood?","o":["Bound to albumin","Packaged in VLDL","Free in plasma, unbound"],"k":0},{"id":"19-4","q":"By what mechanism do glucagon and adrenaline activate hormone-sensitive lipase?","o":["↑ IP<sub>3<\/sub> → Ca<sup>2+<\/sup> release → calmodulin activates HSL","↑ cAMP → protein kinase → phosphorylates HSL (active)","↑ cGMP → protein kinase G → phosphorylates HSL (active)"],"k":1,"more":"<p>Insulin opposes this through a phosphatase.<\/p>"},{"id":"19-5","q":"In what order is triacylglycerol taken apart during lipolysis?","o":["TAG → monoacylglycerol → diacylglycerol → glycerol + fatty acids","TAG → diacylglycerol → monoacylglycerol → glycerol + fatty acids","TAG → diacylglycerol → phosphatidate → glycerol + fatty acids"],"k":1},{"id":"19-6","q":"Why can't adipocytes use the glycerol released by lipolysis?","o":["They lack hormone-sensitive lipase","They lack glycerol kinase","They lack glucose 6-phosphatase"],"k":1},{"id":"19-7","q":"What happens to lipolysis glycerol in the liver?","o":["Glycerol kinase → glycerol 3-P → (glycerol 3-P dehydrogenase) pyruvate → gluconeogenesis","Glycerol kinase → glycerol 3-P → (glycerol 3-P dehydrogenase) DHAP → gluconeogenesis","Glycerol 3-P dehydrogenase → glycerol 3-P → (glycerol kinase) DHAP → gluconeogenesis"],"k":1}]},{"t":"Activation and the carnitine shuttle","qs":[{"id":"19-8","q":"Where is fat burned, and in which tissues mainly?","o":["Mitochondrial matrix; liver and muscle","Mitochondrial matrix; brain and red cells","Endoplasmic reticulum; liver and kidney"],"k":0},{"id":"19-9","q":"Which cells do not oxidise fatty acids?","o":["Brain<br>Cells without peroxisomes (e.g. hepatocytes)","Brain<br>Cells without mitochondria (e.g. mature red cells)","Heart<br>Cells without nuclei (e.g. mature red cells)"],"k":1},{"id":"19-10","q":"Which enzyme activates a fatty acid to fatty acyl-CoA, and where does it sit?","o":["Acyl-CoA synthetase; ER and outer mitochondrial and peroxisomal membranes","Thiokinase; cytosol and inner mitochondrial membrane","Carnitine palmitoyltransferase I; outer mitochondrial membrane only"],"k":0},{"id":"19-11","q":"What does fatty acid activation cost, and why that much?","o":["2 ATP equivalents — 2 ATP are split to ADP","2 ATP equivalents — ATP is split to AMP","1 ATP equivalent — ATP is split to ADP"],"k":1},{"id":"19-12","q":"Which vitamin is coenzyme A made from?","o":["Vitamin B5","Vitamin B3","Vitamin B2"],"k":0},{"id":"19-13","q":"Which fatty acids need the carnitine shuttle to enter the mitochondrion?","o":["Short chains (medium and long chains drift in)","Long chains (short and medium chains drift in)","Medium chains (short and long chains drift in)"],"k":1},{"id":"19-14","q":"What are the three steps of the carnitine shuttle?","o":["CPT-II (outer membrane): acyl-CoA → acylcarnitine<br>CACT: carries acylcarnitine in, swaps for free carnitine<br>CPT-I (inner membrane): acylcarnitine → acyl-CoA in matrix","CPT-I (outer membrane): acyl-CoA → acylcarnitine<br>CACT: carries acylcarnitine in, swaps for free carnitine<br>CPT-II (inner membrane): acylcarnitine → acyl-CoA in matrix","CPT-I (inner membrane): acylcarnitine → acyl-CoA<br>CACT: carries acylcarnitine out, swaps for free carnitine<br>CPT-II (outer membrane): acyl-CoA → acylcarnitine in cytosol"],"k":1,"more":"<p>CPT = carnitine palmitoyltransferase; CACT = carnitine–acylcarnitine translocase.<\/p>","figs":["img/19_burn_1.webp"]},{"id":"19-15","q":"Where is CPT-I and what does it do?","o":["Outer mitochondrial membrane; moves acyl group from CoA to carnitine → acylcarnitine","Inner mitochondrial membrane; moves acyl group from carnitine back onto CoA","Outer mitochondrial membrane; moves acyl group from carnitine to CoA → acyl-CoA"],"k":0,"figs":["img/19_burn_1.webp"]},{"id":"19-16","q":"What does carnitine–acylcarnitine translocase (CACT) do?","o":["Carries acylcarnitine across the outer membrane in exchange for free CoA","Carries acylcarnitine across the inner membrane in exchange for free carnitine","Carries acyl-CoA across the inner membrane in exchange for free CoA"],"k":1,"figs":["img/19_burn_1.webp"]},{"id":"19-17","q":"Where is CPT-II and what does it do?","o":["Inner mitochondrial membrane; carries acylcarnitine in for free carnitine","Inner mitochondrial membrane; moves acyl group back onto CoA inside the matrix","Outer mitochondrial membrane; moves acyl group from CoA onto carnitine"],"k":1,"figs":["img/19_burn_1.webp"]},{"id":"19-18","q":"Where does carnitine come from?","o":["Mainly dietary vegetables; limited synthesis in liver from methionine and folate","Mainly synthesised in muscle from lysine and SAM; little from diet","Mainly dietary meat; limited synthesis in liver and kidney from lysine and SAM"],"k":2,"more":"<p>SAM = S-adenosylmethionine.<\/p>"},{"id":"19-19","q":"How do heart and skeletal muscle get carnitine?","o":["Cannot make it — passive diffusion from plasma","Cannot make it — high-affinity uptake transporter","Make it from lysine and SAM — no uptake needed"],"k":1}]},{"t":"Control: malonyl-CoA and CPT-I","qs":[{"id":"19-20","q":"What is the rate-limiting step of fatty acid oxidation, and what inhibits it?","o":["CPT-I; malonyl-CoA","CPT-I; citrate","CPT-II; malonyl-CoA"],"k":0,"figs":["img/19_burn_1.webp"]},{"id":"19-21","q":"Why can't a cell make fat and burn it at the same time?","o":["Citrate (made only during fat synthesis) blocks CPT-II, so acylcarnitine cannot enter the matrix","Malonyl-CoA (made only during fat synthesis) blocks acyl-CoA synthetase, so fatty acids cannot be activated","Malonyl-CoA (made only during fat synthesis) blocks CPT-I, so fatty acids cannot enter mitochondria"],"k":2,"more":"<p>The two pathways cannot run simultaneously and waste energy.<\/p>","figs":["img/19_burn_1.webp"]},{"id":"19-22","q":"How does low energy (high AMP) speed fatty acid oxidation?","o":["AMPK → activates ACC + promotes malonyl-CoA synthesis → CPT-I runs faster","AMPK → inactivates ACC + promotes malonyl-CoA breakdown → CPT-I runs faster","PKA → inactivates CPT-I + promotes malonyl-CoA breakdown → CPT-II runs faster"],"k":1},{"id":"19-23","q":"How do glucagon and adrenaline speed fatty acid oxidation?","o":["Inhibit ACC → malonyl-CoA rises → CPT-I slower","Stimulate ACC → malonyl-CoA rises → CPT-I faster","Inhibit ACC → malonyl-CoA falls → CPT-I faster"],"k":2},{"id":"19-24","q":"How does insulin slow fatty acid oxidation?","o":["Stimulates ACC → malonyl-CoA rises → CPT-I slower","Stimulates ACC → malonyl-CoA falls → CPT-I faster","Inhibits ACC → malonyl-CoA falls → CPT-I slower"],"k":0},{"id":"19-25","q":"When do fat synthesis vs breakdown run (insulin:glucagon)?","o":["Synthesis: starved, low insulin:glucagon<br>Breakdown: fed, high insulin:glucagon","Synthesis: fed, low insulin:glucagon<br>Breakdown: starved, high insulin:glucagon","Synthesis: fed, high insulin:glucagon<br>Breakdown: starved, low insulin:glucagon"],"k":2},{"id":"19-26","q":"Where do fat synthesis vs breakdown occur?","o":["Synthesis: mainly liver; cytosol<br>Breakdown: muscle and liver; mitochondria","Synthesis: mainly muscle; cytosol<br>Breakdown: liver and brain; mitochondria","Synthesis: mainly liver; mitochondria<br>Breakdown: muscle and liver; cytosol"],"k":0},{"id":"19-27","q":"What is the membrane carrier for fat synthesis vs breakdown?","o":["Synthesis: citrate (out of mitochondria)<br>Breakdown: carnitine (into mitochondria)","Synthesis: carnitine (out of mitochondria)<br>Breakdown: citrate (into mitochondria)","Synthesis: citrate (into mitochondria)<br>Breakdown: carnitine (out of mitochondria)"],"k":0},{"id":"19-28","q":"What is the chain carrier for fat synthesis vs breakdown?","o":["Synthesis: carnitine<br>Breakdown: acyl carrier protein","Synthesis: CoA<br>Breakdown: acyl carrier protein, CoA","Synthesis: acyl carrier protein, CoA<br>Breakdown: CoA"],"k":2},{"id":"19-29","q":"What coenzymes do fat synthesis vs breakdown use?","o":["Synthesis: NADH (reduction)<br>Breakdown: NADP<sup>+<\/sup>, FAD (oxidation)","Synthesis: NAD<sup>+<\/sup>, FAD (oxidation)<br>Breakdown: NADPH (reduction)","Synthesis: NADPH (reduction)<br>Breakdown: NAD<sup>+<\/sup>, FAD (oxidation)"],"k":2},{"id":"19-30","q":"How is the two-carbon unit handled in fat synthesis vs breakdown?","o":["Synthesis: donated by citrate<br>Breakdown: released as acetoacetate","Synthesis: released as acetyl-CoA<br>Breakdown: donated by malonyl-CoA","Synthesis: donated by malonyl-CoA<br>Breakdown: released as acetyl-CoA"],"k":2},{"id":"19-31","q":"What is the key control of fat synthesis vs breakdown?","o":["Synthesis: citrate activates ACC; long-chain acyl-CoA inhibits it<br>Breakdown: malonyl-CoA inhibits CPT-I","Synthesis: citrate activates fatty acid synthase; AMP inhibits it<br>Breakdown: acetyl-CoA inhibits CPT-II","Synthesis: malonyl-CoA activates ACC; citrate inhibits it<br>Breakdown: long-chain acyl-CoA inhibits CPT-I"],"k":0},{"id":"19-32","q":"What is the product of fat synthesis vs breakdown?","o":["Synthesis: palmitate<br>Breakdown: acetyl-CoA","Synthesis: stearate<br>Breakdown: malonyl-CoA","Synthesis: acetyl-CoA<br>Breakdown: palmitate"],"k":0,"more":"<table><tr><th><\/th><th>Synthesis<\/th><th>Breakdown<\/th><\/tr><tr><td>When<\/td><td>fed<\/td><td>starved<\/td><\/tr><tr><td>Where<\/td><td>liver cytosol<\/td><td>muscle/liver mitochondria<\/td><\/tr><tr><td>Carrier<\/td><td>citrate<\/td><td>carnitine<\/td><\/tr><tr><td>Coenzyme<\/td><td>NADPH<\/td><td>NAD<sup>+<\/sup>, FAD<\/td><\/tr><tr><td>Control<\/td><td>ACC<\/td><td>CPT-I<\/td><\/tr><tr><td>Product<\/td><td>palmitate<\/td><td>acetyl-CoA<\/td><\/tr><\/table>"}]},{"t":"Beta-oxidation and ATP yield","qs":[{"id":"19-33","q":"What does each cycle of β-oxidation release?","o":["2 acetyl-CoA + 1 NADH + 1 FADH<sub>2<\/sub>; chain 4 carbons shorter","1 acetyl-CoA + 1 NADPH + 1 FADH<sub>2<\/sub>; chain 2 carbons shorter","1 acetyl-CoA + 1 NADH + 1 FADH<sub>2<\/sub>; chain 2 carbons shorter"],"k":2,"figs":["img/19_burn_2.webp"]},{"id":"19-34","q":"Where do the products of β-oxidation go?","o":["Acetyl-CoA → fatty acid synthesis<br>NADH, FADH<sub>2<\/sub> → electron transport chain","Acetyl-CoA → electron transport chain<br>NADH, FADH<sub>2<\/sub> → citric acid cycle","Acetyl-CoA → citric acid cycle<br>NADH, FADH<sub>2<\/sub> → electron transport chain"],"k":2},{"id":"19-35","q":"What are the four reaction types of a β-oxidation turn, in order?","o":["Oxidation → oxidation → hydration → thiolysis","Oxidation → hydration → oxidation → thiolysis","Hydration → oxidation → oxidation → thiolysis"],"k":1,"figs":["img/19_burn_2.webp"]},{"id":"19-36","q":"What does acyl-CoA dehydrogenase do in β-oxidation, and what does it produce?","o":["Trans double bond between α- and β-carbons; NADH","Cis double bond between β- and γ-carbons; NADH","Trans double bond between α- and β-carbons; FADH<sub>2<\/sub>"],"k":2,"figs":["img/19_burn_2.webp"]},{"id":"19-37","q":"What does enoyl-CoA hydratase do?","o":["Adds CoA across the double bond","Adds water across the double bond","Oxidises the double bond to a ketone"],"k":1},{"id":"19-38","q":"What does 3-hydroxyacyl-CoA dehydrogenase do, and what does it produce?","o":["Oxidises the α-carbon; FADH<sub>2<\/sub>","Reduces the β-carbon; NADPH","Oxidises the β-carbon; NADH"],"k":2},{"id":"19-39","q":"What does β-ketoacyl-CoA thiolase do?","o":["Uses carnitine to cut off acetyl-CoA → acylcarnitine two carbons shorter","Uses fresh CoA to cut off acetyl-CoA → acyl-CoA two carbons shorter","Uses fresh CoA to cut off malonyl-CoA → acyl-CoA three carbons shorter"],"k":1},{"id":"19-40","q":"Name the four chain-length versions of acyl-CoA dehydrogenase and their ranges.","o":["SCAD: under C6<br>MCAD: C6–C12<br>LCAD: C14–C20<br>VLCAD: over C24","SCAD: under C6<br>MCAD: C6–C12<br>LCAD: C14–C18<br>VLCAD: over C20","SCAD: under C4<br>MCAD: C4–C10<br>LCAD: C12–C16<br>VLCAD: over C18"],"k":1},{"id":"19-41","q":"How many ATP does one palmitate yield (older values) vs one glucose?","o":["Palmitate 131; glucose 36–38","Palmitate 106; glucose 30–32","Palmitate 129; glucose 36–38"],"k":2,"figs":["img/19_burn_2.webp"]},{"id":"19-42","q":"Why is fat the fuel of prolonged fasting?","o":["Huge ATP yield: ~1.5× the energy of the same mass of carbohydrate or protein","Huge ATP yield: ~4× the energy of the same mass of carbohydrate or protein","Huge ATP yield: ~2.5× the energy of the same mass of carbohydrate or protein"],"k":2},{"id":"19-43","q":"How many turns of β-oxidation does palmitate need, and what do they yield?","o":["7 turns → 7 FADH<sub>2<\/sub>, 7 NADH, 7 acetyl-CoA","7 turns → 7 FADH<sub>2<\/sub>, 7 NADH, 8 acetyl-CoA","8 turns → 8 FADH<sub>2<\/sub>, 8 NADH, 8 acetyl-CoA"],"k":1,"figs":["img/19_burn_2.webp"]},{"id":"19-44","q":"Show the calculation of 129 ATP from palmitate.","o":["7 FADH<sub>2<\/sub> × 3 + 7 NADH × 2 + 8 acetyl-CoA × 12 = 131; − 2 activation = 129","7 FADH<sub>2<\/sub> × 2 + 7 NADH × 3 + 8 acetyl-CoA × 12 = 131; − 2 activation = 129","7 FADH<sub>2<\/sub> × 2 + 7 NADH × 3 + 8 acetyl-CoA × 12 = 131; + 2 activation = 133"],"k":1,"figs":["img/19_burn_2.webp"]},{"id":"19-45","q":"What are the older ATP conversion values per NADH, FADH<sub>2<\/sub> and acetyl-CoA?","o":["NADH 3<br>FADH<sub>2<\/sub> 2<br>Acetyl-CoA 10","NADH 2<br>FADH<sub>2<\/sub> 3<br>Acetyl-CoA 12","NADH 3<br>FADH<sub>2<\/sub> 2<br>Acetyl-CoA 12"],"k":2},{"id":"19-46","q":"What are the newer ATP conversion values, and the resulting yields per palmitate and glucose?","o":["NADH 1.5, FADH<sub>2<\/sub> 2.5, acetyl-CoA 10 → palmitate 98; glucose ~28–30","NADH 2.5, FADH<sub>2<\/sub> 1.5, acetyl-CoA 10 → palmitate 129; glucose ~36–38","NADH 2.5, FADH<sub>2<\/sub> 1.5, acetyl-CoA 10 → palmitate 106; glucose ~30–32"],"k":2,"more":"<p>Expect to see either 129 or 106 on exams.<\/p>"}]},{"t":"Minor and awkward fatty acids","qs":[{"id":"19-47","q":"Which fatty acids does mitochondrial β-oxidation handle?","o":["Most — those over 20 carbons","Most — those under 20 carbons","Only those under 12 carbons"],"k":1},{"id":"19-48","q":"Which pathway handles very-long-chain fatty acids (VLCFA, over C20), and what is its drawback?","o":["Peroxisomal β-oxidation; needs the carnitine shuttle twice","ER ω-oxidation; makes toxic dicarboxylic acids","Peroxisomal β-oxidation; less ATP than mitochondria"],"k":2},{"id":"19-49","q":"Why does peroxisomal β-oxidation make less ATP?","o":["Thiolase releases propionyl-CoA instead of acetyl-CoA, which cannot enter the citric acid cycle","Enoyl-CoA hydratase uses ATP to add water instead of using free energy from the bond","Acyl-CoA oxidase passes electrons straight to O<sub>2<\/sub> (→ H<sub>2<\/sub>O<sub>2<\/sub>) instead of the electron transport chain"],"k":2},{"id":"19-50","q":"What happens to a VLCFA once peroxisomes shorten it below 20 carbons?","o":["Exported to the endoplasmic reticulum","Stored as triacylglycerol in the peroxisome","Exported to mitochondria"],"k":2},{"id":"19-51","q":"Which fatty acid does α-oxidation handle, where, and with what energy yield?","o":["Branched phytanic acid; mitochondria; 2 ATP per carbon","Very-long-chain lignoceric acid; peroxisome; no energy yield","Branched phytanic acid; peroxisome; no energy yield"],"k":2},{"id":"19-52","q":"Why can't phytanic acid enter β-oxidation directly?","o":["Double bond on its β-carbon blocks it","Methyl group on its α-carbon blocks it","Methyl group on its β-carbon blocks it"],"k":2},{"id":"19-53","q":"Where does phytanic acid come from?","o":["Chlorophyll; found in dairy products and some fish","Carotene; found in carrots and some fruits","Chlorophyll; found in leafy greens and grains"],"k":0,"more":"<p>Chemically 3,7,11,15-tetramethylhexadecanoic acid.<\/p>"},{"id":"19-54","q":"What does α-oxidation do to phytanic acid?","o":["Removes one carbon from the methyl end → pristanic acid, which ω-oxidation can handle","Removes two carbons from the carboxyl end → pristanic acid, which β-oxidation can handle","Removes one carbon from the carboxyl end → pristanic acid, which β-oxidation can handle"],"k":2},{"id":"19-55","q":"Where does ω-oxidation occur, what enzyme does it use, and what does it make?","o":["Mitochondrial matrix; cytochrome P450 oxidises the α-carbon → hydroxy acids (e.g. lactic acid)","Endoplasmic reticulum; acyl-CoA dehydrogenase oxidises the β-carbon → ketoacids (e.g. acetoacetic acid)","Endoplasmic reticulum; cytochrome P450 oxidises the ω-carbon → dicarboxylic acids (e.g. adipic acid)"],"k":2},{"id":"19-56","q":"When does ω-oxidation rise above its normally minor role?","o":["When α-oxidation fails, e.g. Refsum disease","When β-oxidation fails, e.g. MCAD deficiency","When insulin is high, e.g. after a large meal"],"k":1},{"id":"19-57","q":"What does the last turn of odd-chain fatty acid β-oxidation leave?","o":["Propionyl-CoA (3 carbons) instead of acetyl-CoA","Malonyl-CoA (3 carbons) instead of acetyl-CoA","Butyryl-CoA (4 carbons) instead of acetyl-CoA"],"k":0},{"id":"19-58","q":"Besides odd-chain fatty acids, which amino acids feed into propionyl-CoA?","o":["Leucine, lysine, phenylalanine, tyrosine","Isoleucine, alanine, cysteine, tryptophan","Valine, isoleucine, methionine, threonine"],"k":2},{"id":"19-59","q":"How is propionyl-CoA converted to succinyl-CoA?","o":["Propionyl-CoA carboxylase (B12, ATP) → D-methylmalonyl-CoA → racemase → L-methylmalonyl-CoA → methylmalonyl-CoA mutase (biotin) → succinyl-CoA","Propionyl-CoA carboxylase (biotin, ATP) → D-methylmalonyl-CoA → racemase → L-methylmalonyl-CoA → methylmalonyl-CoA mutase (B12) → succinyl-CoA","Propionyl-CoA carboxylase (biotin, ATP) → L-methylmalonyl-CoA → racemase → D-methylmalonyl-CoA → methylmalonyl-CoA mutase (B12) → succinyl-CoA"],"k":1,"more":"<p>Succinyl-CoA can go on to make glucose.<\/p>"},{"id":"19-60","q":"Which vitamin coenzyme does methylmalonyl-CoA mutase need?","o":["Folate (tetrahydrofolate)","Vitamin B12 (deoxyadenosylcobalamin)","Vitamin B6 (pyridoxal phosphate)"],"k":1},{"id":"19-61","q":"What does a defective methylmalonyl-CoA mutase or B12 lack cause?","o":["Maple syrup urine disease: ketoacidosis, sweet-smelling urine","Methylmalonic aciduria: metabolic alkalosis, normal development","Methylmalonic aciduria: metabolic acidosis, intellectual disability"],"k":2},{"id":"19-62","q":"What does a block at propionyl-CoA carboxylase cause?","o":["↑ Succinyl-CoA and metabolic acidosis","↑ Propionyl-CoA and metabolic acidosis","↓ Propionyl-CoA and respiratory acidosis"],"k":1},{"id":"19-63","q":"Which two extra enzymes does β-oxidation of unsaturated fatty acids need?","o":["Enoyl-CoA epimerase<br>NADPH-dependent acyl-CoA oxidase","Enoyl-CoA hydratase<br>FAD-dependent acyl-CoA dehydrogenase","Enoyl-CoA isomerase<br>NADPH-dependent enoyl-CoA reductase"],"k":2,"more":"<p>They fix double bonds sitting in the wrong place for the cycle.<\/p>"},{"id":"19-64","q":"Do unsaturated fatty acids yield more or fewer ATP than saturated ones of the same length?","o":["The same","Fewer","More"],"k":1}]},{"t":"Ketone bodies","qs":[{"id":"19-65","q":"When does the liver make ketone bodies?","o":["Protein broken down faster than the urea cycle can handle the ammonia (prolonged fasting, liver failure)","Fat burned faster than the citric acid cycle can handle the acetyl-CoA (prolonged fasting, uncontrolled diabetes)","Glucose burned faster than the citric acid cycle can handle the pyruvate (exercise, hyperglycaemia)"],"k":1,"figs":["img/19_burn_3.webp"]},{"id":"19-66","q":"Name the three ketone bodies.","o":["Acetoacetate<br>D-β-hydroxybutyrate<br>Acetyl-CoA","Acetoacetyl-CoA<br>HMG-CoA<br>Acetone","Acetoacetate<br>D-β-hydroxybutyrate<br>Acetone"],"k":2},{"id":"19-67","q":"Why do ketone bodies add acid to the blood?","o":["Acetoacetate and β-hydroxybutyrate are acids (pK<sub>a<\/sub> 3.5) → almost fully dissociated at blood pH","Acetoacetate and β-hydroxybutyrate are bases (pK<sub>a<\/sub> 9.5) → consume H<sup>+<\/sup> buffers","Acetoacetate and β-hydroxybutyrate are acids (pK<sub>a<\/sub> 7.4) → half dissociated at blood pH"],"k":0},{"id":"19-68","q":"Where are ketone bodies made?","o":["In muscle and liver mitochondria","Only in liver mitochondria","Only in liver cytosol"],"k":1,"figs":["img/19_burn_3.webp"]},{"id":"19-69","q":"What are the four steps of ketone body synthesis?","o":["Thiolase: 2 acetyl-CoA → acetoacetyl-CoA<br>HMG-CoA synthase: + acetyl-CoA → HMG-CoA<br>HMG-CoA lyase: → acetoacetate + acetyl-CoA<br>3-Hydroxybutyrate dehydrogenase (NADH): → β-hydroxybutyrate","HMG-CoA synthase: 2 acetyl-CoA → acetoacetyl-CoA<br>Thiolase: + acetyl-CoA → HMG-CoA<br>HMG-CoA lyase: → acetoacetate + acetyl-CoA<br>3-Hydroxybutyrate dehydrogenase (NAD<sup>+<\/sup>): → β-hydroxybutyrate","Thiolase: 2 acetyl-CoA → acetoacetyl-CoA<br>HMG-CoA lyase: + acetyl-CoA → HMG-CoA<br>HMG-CoA synthase: → acetoacetate + acetyl-CoA<br>3-Hydroxybutyrate dehydrogenase (NADH): → β-hydroxybutyrate"],"k":0,"more":"<p>HMG-CoA = 3-hydroxy-3-methylglutaryl-CoA.<\/p>"},{"id":"19-70","q":"Which enzyme reduces acetoacetate to β-hydroxybutyrate, and with what cofactor?","o":["3-Hydroxybutyrate dehydrogenase; NADH","HMG-CoA lyase; NADPH","3-Hydroxybutyrate dehydrogenase; NAD<sup>+<\/sup>"],"k":0},{"id":"19-71","q":"How is acetone formed, and what is its fate?","o":["Spontaneous loss of CO<sub>2<\/sub> from acetoacetate; excreted mainly by the kidney as an acid","Spontaneous loss of CO<sub>2<\/sub> from acetoacetate; dead end, breathed out (fruity breath)","Enzymatic decarboxylation of HMG-CoA; converted back to acetyl-CoA in muscle"],"k":1,"figs":["img/19_burn_3.webp"]},{"id":"19-72","q":"How do extrahepatic tissues use acetoacetate?","o":["Thiophorase (succinyl-CoA:acetoacetate CoA transferase) → HMG-CoA → lyase → 2 acetyl-CoA","Thiophorase (succinyl-CoA:acetoacetate CoA transferase) → acetoacetyl-CoA → thiolase → 2 acetyl-CoA","Acyl-CoA synthetase (ATP) → acetoacetyl-CoA → thiolase → 1 acetyl-CoA + acetone"],"k":1,"figs":["img/19_burn_3.webp"]},{"id":"19-73","q":"Why can't the liver use the ketones it makes?","o":["Lacks thiophorase","Lacks thiolase","Lacks HMG-CoA synthase"],"k":0,"figs":["img/19_burn_3.webp"]},{"id":"19-74","q":"Which tissues use ketones, and which cannot?","o":["Use: brain, liver (in starvation)<br>Cannot: muscle, red cells","Use: muscle, brain (in starvation)<br>Cannot: liver, red cells","Use: liver, muscle<br>Cannot: brain, red cells"],"k":1,"figs":["img/19_burn_3.webp"]},{"id":"19-75","q":"How many ATP do acetoacetate and β-hydroxybutyrate each yield?","o":["Acetoacetate 23<br>β-Hydroxybutyrate 26","Acetoacetate 24<br>β-Hydroxybutyrate 24","Acetoacetate 26<br>β-Hydroxybutyrate 23"],"k":0},{"id":"19-76","q":"Why does β-hydroxybutyrate yield more ATP than acetoacetate?","o":["Converting it back to acetoacetate makes an extra NADH","It carries one more carbon, giving an extra acetyl-CoA","Converting it back to acetoacetate makes an extra FADH<sub>2<\/sub>"],"k":0},{"id":"19-77","q":"How do blood glucose and ketones change over prolonged fasting?","o":["Glucose climbs for weeks while ketones level off","Ketones climb for weeks while glucose levels off","Ketones and glucose both fall steadily for weeks"],"k":1},{"id":"19-78","q":"Well fed vs 5 weeks starvation: blood glucose and fatty acids?","o":["Glucose ~6.1 → 1.4 mM<br>Fatty acids 0.14 → 3.6 mM","Glucose ~6.1 → 3.6 mM<br>Fatty acids 0.14 → 1.4 mM","Glucose ~3.6 → 6.1 mM<br>Fatty acids 1.4 → 0.14 mM"],"k":1},{"id":"19-79","q":"Well fed vs 5 weeks starvation: acetoacetate and β-hydroxybutyrate?","o":["Acetoacetate 0.04 → 1.3 mM<br>β-Hydroxybutyrate 0.03 → ~6 mM","Acetoacetate 0.4 → 1.3 mM<br>β-Hydroxybutyrate 0.3 → ~2 mM","Acetoacetate 0.04 → ~6 mM<br>β-Hydroxybutyrate 0.03 → 1.3 mM"],"k":0},{"id":"19-80","q":"Which fuel rises most in prolonged starvation?","o":["β-Hydroxybutyrate (to ~6 mM)","Acetoacetate (to ~6 mM)","Free fatty acids (to ~6 mM)"],"k":0}]},{"t":"Diabetic ketoacidosis","qs":[{"id":"19-81","q":"What is diabetic ketoacidosis (DKA), in one line?","o":["The fasting programme running unchecked: little insulin, much glucagon","The fasting programme switched off: little insulin, little glucagon","The fasting programme running unchecked: much insulin, much glucagon"],"k":0},{"id":"19-82","q":"In DKA, why does β-oxidation make a surplus of acetyl-CoA?","o":["HSL floods liver with fatty acids; ACC off → citrate falls → CPT-II runs freely","HSL floods liver with fatty acids; ACC off → malonyl-CoA falls → CPT-I runs freely","LPL floods liver with fatty acids; ACC on → malonyl-CoA rises → CPT-I runs freely"],"k":1},{"id":"19-83","q":"In DKA, why can't the citric acid cycle take up the acetyl-CoA?","o":["Fatty acid synthesis (↑ ACC, fatty acid synthase) pulls away citrate; high ATP slows the cycle too","Gluconeogenesis (↑ pyruvate carboxylase, PEPCK) adds excess oxaloacetate; low NADH slows the cycle too","Gluconeogenesis (↑ pyruvate carboxylase, PEPCK) pulls away oxaloacetate; high NADH slows the cycle too"],"k":2,"more":"<p>PEPCK = phosphoenolpyruvate carboxykinase. The acetyl-CoA's one exit is ketone bodies, and the ketoacids overwhelm the buffers.<\/p>"},{"id":"19-84","q":"In poorly controlled type 1 diabetes, which fat-metabolism enzyme is more active than normal?","o":["Fatty acid synthase (FAS)","Acetyl-CoA carboxylase (ACC)","Hormone-sensitive lipase (HSL)"],"k":2,"hy":true},{"id":"19-85","q":"In poorly controlled type 1 diabetes, which insulin-driven proteins are less active?","o":["Lipoprotein lipase<br>Acetyl-CoA carboxylase<br>Fatty acid synthase<br>GLUT4","Hormone-sensitive lipase<br>Acetyl-CoA carboxylase<br>Fatty acid synthase<br>GLUT4","Lipoprotein lipase<br>Acetyl-CoA carboxylase<br>HMG-CoA synthase<br>GLUT1"],"k":0,"hy":true}]},{"t":"MCAD deficiency","qs":[{"id":"19-86","q":"What is the classic fatty acid oxidation defect?","o":["Carnitine palmitoyltransferase II (CPT-II) deficiency","Short-chain acyl-CoA dehydrogenase (SCAD) deficiency","Medium-chain acyl-CoA dehydrogenase (MCAD) deficiency"],"k":2},{"id":"19-87","q":"What is the typical story of MCAD deficiency?","o":["Adult fine at rest, then exercises hard and develops muscle cramps and dark urine","Child unwell while eating, then improves when fasting because fat burning takes over","Child fine while eating, then fasts (illness, missed meal) and cannot switch to burning fat"],"k":2},{"id":"19-88","q":"What lab combination is the fingerprint of MCAD deficiency?","o":["Hyperglycaemia with inappropriately low ketones","Hypoglycaemia with inappropriately low ketones","Normoglycaemia with markedly raised ketones"],"k":1,"hy":true},{"id":"19-89","q":"In MCAD deficiency, why does gluconeogenesis fail during a fast?","o":["Liver lacks NADPH and malonyl-CoA; malonyl-CoA is the obligatory activator of PEPCK","Liver lacks glucose 6-phosphatase; glycogen cannot be released as glucose","Liver lacks ATP and acetyl-CoA; acetyl-CoA is the obligatory activator of pyruvate carboxylase"],"k":2},{"id":"19-90","q":"In MCAD deficiency, why are few ketones made?","o":["Little acetyl-CoA","Little HMG-CoA lyase","Lack of thiophorase"],"k":0},{"id":"19-91","q":"In what form do stranded medium chains leave mitochondria in MCAD deficiency?","o":["C6–C10 acylcarnitines (C8 and C10 build up in blood and urine)","C14–C18 acylcarnitines (C16 and C18 build up in blood and urine)","C6–C10 acyl-CoAs (C8 and C10 build up in blood and urine)"],"k":0,"hy":true},{"id":"19-92","q":"In MCAD deficiency, which pathway turns medium chains into dicarboxylic acids, and how are they excreted?","o":["ω-Oxidation; with their glucuronide and sulphate conjugates","ω-Oxidation; with their carnitine and glycine conjugates","α-Oxidation; with their taurine and glucuronide conjugates"],"k":1,"hy":true},{"id":"19-93","q":"What is the incidence of MCAD deficiency?","o":["~1 in 120,000","~1 in 12,000","~1 in 50,000"],"k":1},{"id":"19-94","q":"Classic MCAD case: what is the presentation?","o":["Newborn breast-fed girl, jaundiced and unrousable within hours of birth before any fasting","6-month-old breast-fed girl, unrousable for feed after 3 days of cold with vomiting","6-year-old girl with muscle cramps and dark urine after a long football match"],"k":1,"more":"<p>Irritable/lethargic before feeds since 2 months; older sibling died of a \"Reye-like\" illness; tachypnoeic, opens eyes only to pain, large fatty liver. Parents German.<\/p>"},{"id":"19-95","q":"MCAD case: why is glucose 2.5 mmol/L (normal 5)?","o":["Excess insulin drives glucose into cells; glycogenolysis is blocked by high malonyl-CoA","Fasting + infection empty liver glycogen; gluconeogenesis cannot run without acetyl-CoA and ATP","Fasting + infection empty liver glycogen; gluconeogenesis is blocked by excess ketone bodies"],"k":1},{"id":"19-96","q":"MCAD case: why is ammonia 100 µmol/L (normal under 20)?","o":["Ketone bodies inhibit the urea cycle directly; carbamoyl phosphate synthetase I is blocked","Fat-laden liver works poorly; octanoate (C8) inhibits glutamine synthetase → more ammonia released","Fat-laden liver works poorly; octanoate (C8) uncouples mitochondria → less ATP → less urea made"],"k":2},{"id":"19-97","q":"MCAD case: which acylcarnitines are high, and why?","o":["Hexanoyl- (C6) and octanoylcarnitine (C8) — trapped medium chains leave mitochondria","Acetyl- (C2) and butyrylcarnitine (C4) — trapped short chains leave mitochondria","Palmitoyl- (C16) and stearoylcarnitine (C18) — trapped long chains leave mitochondria"],"k":0},{"id":"19-98","q":"MCAD case: what are hexanoylglycine and suberylglycine in the urine?","o":["Hexanoylglycine: C6 β-oxidation product<br>Suberylglycine: C8 dicarboxylic ω-oxidation product","Hexanoylglycine: C6 ketone body conjugate<br>Suberylglycine: C8 acylcarnitine breakdown product","Hexanoylglycine: C6 α-oxidation product<br>Suberylglycine: C8 dicarboxylic peroxisomal product"],"k":0},{"id":"19-99","q":"MCAD case: why is urine acetoacetate only a trace?","o":["Liver lacks thiophorase, so ketones cannot form","Little acetyl-CoA, so few ketones","Kidneys reabsorb all ketones in hypoglycaemia"],"k":1},{"id":"19-100","q":"MCAD case: why is the anion gap 20 (normal 8–16)?","o":["Extra ketone bodies from β-oxidation","Extra lactate from tissue hypoxia","Extra mono- and dicarboxylic acids"],"k":2},{"id":"19-101","q":"List the differential of hypoketotic hypoglycaemia.","o":["Carnitine excess<br>CPT deficiency<br>Thiophorase deficiency<br>MCAD deficiency<br>Adrenal insufficiency","Carnitine deficiency<br>CPT deficiency<br>LCAD deficiency<br>MCAD deficiency<br>Congenital hyperinsulinism","Carnitine deficiency<br>CPT deficiency<br>LCAD deficiency<br>MCAD deficiency<br>Type 1 diabetes"],"k":1},{"id":"19-102","q":"How does congenital hyperinsulinism differ from MCAD deficiency?","o":["Usually at birth, often large for gestational age; free fatty acids also suppressed","Usually at birth, often small for gestational age; free fatty acids markedly raised","Usually in adolescence, often obese; ketones raised but free fatty acids suppressed"],"k":0,"more":"<p>Insulin blocks both lipolysis and ketogenesis, so FFA and ketones are both low.<\/p>"},{"id":"19-103","q":"Which gene is sequenced to confirm MCAD deficiency, and on which chromosome?","o":["ACADM; chromosome 7","ACADM; chromosome 1","ACADL; chromosome 2"],"k":1},{"id":"19-104","q":"What is the commonest MCAD mutation in people of European descent, and its effect?","o":["Lys304Glu (985A→G); enzyme cannot assemble into its homotetramer","Lys329Glu (985A→G); enzyme cannot bind its FAD cofactor","Gly304Arg (985G→A); enzyme cannot enter mitochondria"],"k":0},{"id":"19-105","q":"Besides gene sequencing, how else can MCAD deficiency be confirmed?","o":["MCAD activity in urine or plasma; C2–C4 acylcarnitines in cultured fibroblasts","MCAD activity in erythrocytes or platelets; C14–C18 acylcarnitines in cultured fibroblasts","MCAD activity in leukocytes or fibroblasts; C6–C10 acylcarnitines in cultured fibroblasts"],"k":2},{"id":"19-106","q":"How is MCAD deficiency treated in infancy?","o":["Never fast: feeds every 3–4 h with high fat; medium-chain-TAG formula preferred","Never fast: feeds every 3–4 h with complex carbohydrate; no medium-chain-TAG formula","Fast overnight: feeds every 8–10 h with simple sugars; medium-chain-TAG formula preferred"],"k":1},{"id":"19-107","q":"Why must MCAD-deficient infants avoid formula based on medium-chain triacylglycerol?","o":["It is the very fat they cannot burn","It needs carnitine they do not have","It blocks CPT-I through malonyl-CoA"],"k":0},{"id":"19-108","q":"How is MCAD deficiency managed in toddlers?","o":["Higher-fat diet (&gt;50% calories) + uncooked cornstarch 2 g/kg at bedtime (slow-release overnight glucose)","Lower-fat diet (&lt;30% calories) + uncooked cornstarch 2 g/kg at bedtime (slow-release overnight glucose)","Lower-protein diet (&lt;10% calories) + medium-chain TAG 2 g/kg at bedtime (overnight ketones)"],"k":1}]},{"t":"Other oxidation defects","qs":[{"id":"19-109","q":"What causes primary carnitine deficiency, and how does it present?","o":["Too little carnitine (vegan diet, transporter, liver synthesis or renal reabsorption defects); peripheral neuropathy and ataxia","Too much carnitine (high meat diet, overactive transporter or renal reabsorption); hypoglycaemia and ketosis","Too little carnitine (vegan diet, transporter, liver synthesis or renal reabsorption defects); muscle cramps and weakness"],"k":2},{"id":"19-110","q":"What causes secondary carnitine deficiency?","o":["Acylcarnitines from CPT-I defects increase renal carnitine reabsorption","Free carnitine from MCAD defects blocks intestinal carnitine uptake","Acylcarnitines from CPT-II or CACT defects block renal carnitine reabsorption"],"k":2},{"id":"19-111","q":"What is the outcome of liver CPT-I or CACT deficiency?","o":["Lethal at a young age","Mild, presents only in adulthood","Usually asymptomatic throughout life"],"k":0},{"id":"19-112","q":"Which carnitine-shuttle defect causes cardiomyopathy and rhabdomyolysis?","o":["MCAD deficiency (muscle form)","CPT-II deficiency (muscle form)","CPT-I deficiency (liver form)"],"k":1,"hy":true},{"id":"19-113","q":"What is the defect in Zellweger syndrome, and its consequence?","o":["Peroxisome biogenesis (peroxins); VLCFA not oxidised","Lysosome biogenesis (mannose 6-P tagging); VLCFA not degraded","Mitochondrial biogenesis (mitofusins); long-chain fatty acids not oxidised"],"k":0},{"id":"19-114","q":"Which disease lies on the Zellweger spectrum, and what are its features?","o":["Infantile Refsum disease: poor cerebral myelination, loss of hearing and vision","X-linked adrenoleukodystrophy: adrenal insufficiency, demyelination","Adult Refsum disease: cerebellar ataxia, retinitis pigmentosa"],"k":0},{"id":"19-115","q":"What is the defect in X-linked adrenoleukodystrophy?","o":["CPT-II, which carries VLCFA into mitochondria → VLCFA not oxidised","ABCD1, which carries VLCFA-CoA into peroxisomes → VLCFA not oxidised","PEX genes, which build the peroxisome → VLCFA not oxidised"],"k":1},{"id":"19-116","q":"What is the enzyme defect in adult Refsum disease?","o":["Pristanoyl-CoA oxidase (peroxisomal β-oxidation)","Cytochrome P450 ω-hydroxylase (ω-oxidation)","Phytanoyl-CoA hydroxylase (α-oxidation)"],"k":2},{"id":"19-117","q":"What are the features of adult Refsum disease?","o":["Cerebellar ataxia<br>Peripheral polyneuropathy<br>Retinitis pigmentosa<br>Adrenal insufficiency","Cardiomyopathy<br>Peripheral polyneuropathy<br>Retinitis pigmentosa<br>Rhabdomyolysis","Cerebellar ataxia<br>Peripheral polyneuropathy<br>Retinitis pigmentosa<br>Hearing loss"],"k":2,"hy":true},{"id":"19-118","q":"How are carnitine-shuttle defects managed?","o":["High-carbohydrate, low long-chain-fat diet<br>Extra medium-chain fat<br>Limited physical activity<br>Carnitine supplements","High-protein, low medium-chain-fat diet<br>Extra long-chain fat<br>Limited physical activity<br>Biotin supplements","High-carbohydrate, low long-chain-fat diet<br>Avoid medium-chain fat<br>Limited physical activity<br>Carnitine restriction"],"k":0},{"id":"19-119","q":"Why is medium-chain fat given in carnitine-shuttle defects?","o":["It inhibits malonyl-CoA formation","It enters mitochondria without carnitine","It is converted to carnitine in the liver"],"k":1},{"id":"19-120","q":"What causes Jamaican vomiting sickness?","o":["Hypoglycin A in unripe ackee fruit","Phytanic acid in dairy products","Hypoglycin A in ripe breadfruit"],"k":0,"hy":true},{"id":"19-121","q":"How does hypoglycin A block β-oxidation?","o":["Its metabolites tie up carnitine and CoA","Its metabolites inhibit HMG-CoA synthase","It raises malonyl-CoA and blocks CPT-I"],"k":0},{"id":"19-122","q":"What is the clinical course of Jamaican vomiting sickness?","o":["Diarrhoea within 2–6 h → mild hypoglycaemia, full recovery in all cases","Vomiting within 2–6 h → severe hypoglycaemia, weakness, altered consciousness, sometimes death","Vomiting within 2–6 days → severe hyperglycaemia, ketoacidosis, sometimes death"],"k":1},{"id":"19-123","q":"Match: infant, fasting, hypoketotic hypoglycaemia, C8 acylcarnitines, dicarboxylic aciduria → ?","o":["MCAD deficiency","Congenital hyperinsulinism","LCAD deficiency"],"k":0,"hy":true}]}]},{"n":22,"key":"anat","t":"The thoracic cage and intercostal space","sub":"Oct 8","cp2":false,"secs":[{"t":"Surface landmarks","qs":[{"id":"22-0","q":"What two contradictory jobs must the chest wall do?","o":["Support the upper limbs<br>Store red marrow for haematopoiesis","Protect the heart and lungs<br>Move constantly for breathing","Move constantly for breathing<br>Stay fixed to anchor the diaphragm"],"k":1,"more":"<p>Its structure is a compromise between the two.<\/p>","figs":["img/p/g22a_cage_ant.webp","img/p/g22a_cavity.webp","img/p/g22a_rib_move.webp"]},{"id":"22-1","q":"What is the sternal angle?","o":["The ridge where the manubrium meets the body of the sternum","The notch between the medial ends of the clavicles","The ridge where the body of the sternum meets the xiphoid process"],"k":0,"figs":["img/22_cage_3.jpg","img/p/g22a_sternum.webp"]},{"id":"22-2","q":"Which rib does the sternal angle mark?","o":["The 2nd rib (2nd costal cartilage)","The 1st rib (1st costal cartilage)","The 3rd rib (3rd costal cartilage)"],"k":0,"more":"<p>Counting ribs starts here. It is the single most useful landmark in the thorax.<\/p>","figs":["img/22_cage_3.jpg","img/p/g22a_count_ribs.webp"]},{"id":"22-3","q":"Why does rib counting start at the sternal angle instead of the 1st rib?","o":["The 1st rib is hidden behind the clavicle and cannot be felt","The 1st rib is buried under the pectoralis major and cannot be felt","The 1st rib is fused to the manubrium and cannot be separated by touch"],"k":0,"figs":["img/p/g22a_count_ribs.webp"]},{"id":"22-4","q":"At what vertebral level does the sternal angle lie?","o":["T4/T5 intervertebral disc","T6/T7 intervertebral disc","T2/T3 intervertebral disc"],"k":0,"figs":["img/p/g22a_levels.webp"]},{"id":"22-5","q":"What three thoracic events happen at the level of the sternal angle?","o":["Brachiocephalic veins unite to form the SVC<br>Trachea bifurcates<br>Thoracic duct joins the left subclavian vein","Aortic arch begins and ends (descending aorta starts)<br>Trachea bifurcates<br>Hemiazygos vein joins the inferior vena cava (IVC)","Aortic arch begins and ends (descending aorta starts)<br>Trachea bifurcates<br>Azygos vein joins the superior vena cava (SVC)"],"k":2,"figs":["img/p/g22a_tiv_plane.webp","img/p/g22a_levels.webp","img/p/g22a_c_trach_bifurc.webp","img/p/g22a_c_azygos_arch.webp"]},{"id":"22-6","q":"Where is the jugular (suprasternal) notch, and at what vertebral level does it lie?","o":["Top of the sternum, between the medial ends of the clavicles → upper border of C7","Top of the sternum, between the medial ends of the clavicles → lower border of T2","Top of the sternum, between the medial ends of the clavicles → lower border of T4"],"k":1,"figs":["img/p/g22a_levels.webp","img/p/g22a_count_ribs.webp"]},{"id":"22-7","q":"How far below the jugular notch is the sternal angle, and why?","o":["About 4 cm → the manubrium is about 4 cm long","About 8 cm → the manubrium is about 8 cm long","About 2 cm → the manubrium is about 2 cm long"],"k":0,"figs":["img/p/g22a_sternum.webp"]},{"id":"22-8","q":"At what vertebral level does the xiphisternal joint lie?","o":["T11","T9","T7"],"k":1,"figs":["img/p/g22a_levels.webp"]},{"id":"22-9","q":"What four things does the xiphisternal joint mark or guide?","o":["Hand position in cardiopulmonary resuscitation (CPR)<br>Upper limit of the liver<br>Bifurcation of the trachea<br>Inferior border of the heart","Hand position in cardiopulmonary resuscitation (CPR)<br>Lower limit of the liver<br>Central tendon of the diaphragm<br>Apex of the heart","Hand position in cardiopulmonary resuscitation (CPR)<br>Upper limit of the liver<br>Central tendon of the diaphragm<br>Inferior border of the heart"],"k":2,"figs":["img/p/g22a_levels.webp","img/p/g22a_c_xiphoid_sag.webp","img/p/g22a_diaphragm_dome.webp"]},{"id":"22-10","q":"At what level is the tip of the xiphoid process, and when does it become easier to feel?","o":["About T12 → easier to feel after about age 40","About T10 → easier to feel before about age 20","About T10 → easier to feel after about age 40"],"k":2,"figs":["img/p/g22a_levels.webp"]},{"id":"22-11","q":"What forms the costal margin?","o":["Costal cartilages of ribs 1–7","Costal cartilages of ribs 7–10","Costal cartilages of ribs 8–12"],"k":1,"figs":["img/22_cage_3.jpg","img/p/g22a_surface.webp"]},{"id":"22-12","q":"What is the angle where the two costal margins meet?","o":["Costovertebral angle","Infrasternal (subcostal) angle","Sternal angle (angle of Louis)"],"k":1,"figs":["img/22_cage_3.jpg","img/p/g22a_surface.webp"]},{"id":"22-13","q":"Over which intercostal space does the nipple usually lie in men?","o":["5th intercostal space","4th intercostal space","3rd intercostal space"],"k":1,"more":"<p>In women the shape and size of the breast make the nipple an unreliable landmark.<\/p>","figs":["img/p/g22a_count_ribs.webp"]},{"id":"22-14","q":"What forms the anterior axillary fold?","o":["Lower border of latissimus dorsi","Lower border of pectoralis major","Lower border of pectoralis minor"],"k":1,"figs":["img/p/g22a_axillary_folds.webp"]},{"id":"22-15","q":"What forms the posterior axillary fold?","o":["Serratus anterior and subscapularis","Pectoralis major and pectoralis minor","Latissimus dorsi and teres major"],"k":2,"figs":["img/p/g22a_axillary_folds.webp"]},{"id":"22-16","q":"What vertical lines are drawn on the thoracic wall to describe location?","o":["Sternal angle line<br>Midclavicular line (MCL)<br>Anterior and posterior axillary lines<br>Midaxillary line (MAL)<br>Intertubercular lines","Anterior and posterior median lines<br>Parasternal line<br>Anterior and posterior axillary lines<br>Costal margin line<br>Paravertebral lines","Anterior and posterior median lines<br>Midclavicular line (MCL)<br>Anterior and posterior axillary lines<br>Midaxillary line (MAL)<br>Scapular lines"],"k":2,"figs":["img/p/g22a_lines.webp"]},{"id":"22-17","q":"Through what point does the midclavicular line (MCL) run?","o":["Acromioclavicular joint","Midpoint of the clavicle","Sternoclavicular joint"],"k":1,"figs":["img/p/g22a_lines_gil.webp"]},{"id":"22-18","q":"From where does the midaxillary line (MAL) run down?","o":["Apex of the axilla","Tip of the acromion","Coracoid process"],"k":0,"more":"<p>The anterior and posterior axillary lines run along the anterior and posterior axillary folds.<\/p>","figs":["img/p/g22a_lines_gil.webp"]},{"id":"22-19","q":"Through what do the scapular lines run?","o":["Superior angles of the scapulae","Inferior angles of the scapulae","Medial borders of the scapulae"],"k":1,"figs":["img/p/g22a_lines.webp"]}]},{"t":"Sternum, vertebrae and ribs","qs":[{"id":"22-20","q":"What three components make up the thoracic cage?","o":["Sternum + costal cartilages (front)<br>12 pairs of ribs (sides)<br>12 thoracic vertebrae (behind)","Sternum + costal cartilages (front)<br>10 pairs of ribs (sides)<br>10 thoracic vertebrae (behind)","Sternum + costal cartilages (front)<br>12 pairs of ribs (sides)<br>7 cervical vertebrae (behind)"],"k":0,"figs":["img/22_cage_3.jpg"]},{"id":"22-21","q":"What are the functions of the thoracic cage?","o":["Protects heart, great vessels, lungs and trachea<br>Passage between neck and abdomen<br>Main site of adult haematopoiesis","Protects heart, great vessels, lungs and trachea<br>Separates thorax from abdomen<br>Supports the upper limbs","Protects heart, great vessels, lungs and trachea<br>Passage between neck and abdomen<br>Supports the upper limbs"],"k":2,"figs":["img/p/g22a_cavity.webp","img/p/g22a_inlet.webp","img/p/g22a_diaph_openings.webp","img/p/g22a_axillary_inlet.webp"]},{"id":"22-22","q":"What are the three parts of the sternum, top to bottom?","o":["Body → manubrium → xiphoid process","Manubrium → body → xiphoid process","Manubrium → xiphoid process → body"],"k":1,"figs":["img/22_cage_3.jpg","img/p/g22a_sternum.webp"]},{"id":"22-23","q":"What notches and articulations does the manubrium carry?","o":["Clavicular notch only<br>Takes the clavicle and the 1st and 2nd ribs","Jugular and clavicular notches<br>Takes the scapula and the 2nd rib","Jugular and clavicular notches<br>Takes the clavicle and the 1st rib"],"k":2,"figs":["img/p/g22a_sternum.webp","img/p/g22a_sternocostal_n.webp"]},{"id":"22-24","q":"Opposite which vertebrae does the body of the sternum lie?","o":["T3–T6","T5–T9","T1–T4"],"k":1,"figs":["img/p/g22a_levels.webp"]},{"id":"22-25","q":"Which ribs attach directly to the body of the sternum?","o":["Ribs 2–5","Ribs 3–6","Ribs 1–7"],"k":1,"figs":["img/p/g22a_sternocostal_n.webp"]},{"id":"22-26","q":"Where do the 2nd and 7th ribs attach to the sternum?","o":["2nd → jugular notch<br>7th → xiphoid process tip","2nd → sternal angle<br>7th → xiphisternal joint","2nd → xiphisternal joint<br>7th → sternal angle"],"k":1,"figs":["img/22_cage_3.jpg","img/p/g22a_sternocostal.webp","img/p/g22a_sternocostal_n.webp"]},{"id":"22-27","q":"What feature defines a thoracic vertebra?","o":["Costal facets (on the bodies and transverse processes)","Mammillary processes (on the articular processes)","Foramen transversarium (in the transverse processes)"],"k":0,"figs":["img/p/g22a_t6_sup.webp"]},{"id":"22-28","q":"Besides costal facets, what three features mark a thoracic vertebra?","o":["Heart-shaped body<br>Large triangular vertebral foramen<br>Bifid spine","Heart-shaped body<br>Small vertebral foramen<br>Long spine sloping downward","Kidney-shaped body<br>Small vertebral foramen<br>Short, square spine"],"k":1,"figs":["img/p/g22a_typ_vert.webp","img/p/g22a_t6_sup.webp","img/p/g22a_c_t6_lat.webp"]},{"id":"22-29","q":"Which thoracic vertebrae are typical, and what facets do their bodies carry?","o":["T5–T12 → a demifacet (half-facet) above and below on each body","T1–T12 → a single whole facet on each body","T2–T9 → a demifacet (half-facet) above and below on each body"],"k":2,"figs":["img/p/g22a_typ_vert.webp"]},{"id":"22-30","q":"Why do typical thoracic vertebrae have demifacets?","o":["A typical rib tubercle touches two vertebrae","A typical rib head touches two vertebrae","A typical rib head touches only its own vertebra"],"k":1,"figs":["img/p/g22a_rib5_joints.webp"]},{"id":"22-31","q":"What costal facets do T10–T12 have?","o":["No costal facets","Two whole facets each","One whole facet each"],"k":2,"figs":["img/p/g22a_t10_t11.webp"]},{"id":"22-32","q":"What costal facets does T1 have?","o":["Whole facet for the 1st rib + inferior demifacet for the 2nd rib","Superior demifacet for the 1st rib + inferior demifacet for the 2nd rib","Whole facet for the 1st rib + whole facet for the 2nd rib"],"k":0,"figs":["img/p/g22a_t1.webp"]},{"id":"22-33","q":"Which are the true ribs, and how do they reach the sternum?","o":["Ribs 1–10 → directly, through their own costal cartilages","Ribs 1–5 → directly, through their own costal cartilages","Ribs 1–7 → directly, through their own costal cartilages"],"k":2,"figs":["img/22_cage_3.jpg"]},{"id":"22-34","q":"Which are the false ribs, and how do they reach the sternum?","o":["Ribs 6–9 → indirectly; their cartilages join the cartilage of the rib below","Ribs 8–12 → indirectly; their cartilages join the cartilage of the rib above","Ribs 8–10 → indirectly; their cartilages join the cartilage of the rib above"],"k":2,"figs":["img/22_cage_3.jpg"]},{"id":"22-35","q":"Which are the floating ribs, and where do they end?","o":["Ribs 10 and 11 → in the muscles of the posterior abdominal wall (do not reach the sternum)","Ribs 11 and 12 → at the xiphoid process (reach the sternum indirectly)","Ribs 11 and 12 → in the muscles of the posterior abdominal wall (do not reach the sternum)"],"k":2,"figs":["img/22_cage_3.jpg"]},{"id":"22-36","q":"Why is the 7th rib usually counted as a true rib?","o":["Its cartilage joins the cartilage of the 6th rib above it","Its cartilage meets the sternum (at the sternal angle)","Its cartilage meets the sternum (at the xiphisternal joint)"],"k":2,"more":"<p>You may also see the split given as true 1–6 and false 7–9, with the 10th sometimes floating.<\/p>","figs":["img/22_cage_3.jpg","img/p/g22a_sternocostal.webp"]},{"id":"22-37","q":"By shape, which ribs are typical and which are atypical?","o":["Typical: 3–9<br>Atypical: 1, 2, 10, 11, 12","Typical: 1–7<br>Atypical: 8, 9, 10, 11, 12","Typical: 3–10<br>Atypical: 1, 2, 11, 12"],"k":0,"figs":["img/p/g22a_atyp_ribs.webp","img/p/g22a_t10_t11.webp"]},{"id":"22-38","q":"What are the parts of a typical rib, from medial to lateral?","o":["Neck → head → tubercle → body (with angle and costal groove)","Head → tubercle → neck → body (with angle and costal groove)","Head → neck → tubercle → body (with angle and costal groove)"],"k":2,"figs":["img/p/g22a_typ_rib.webp"]},{"id":"22-39","q":"What does the head of a typical rib look like?","o":["Wedge-shaped, with two facets separated by a crest","Wedge-shaped, with one facet and a nonarticular tubercle","Flat, with three facets separated by two crests"],"k":0,"figs":["img/p/g22a_rib_head.webp"]},{"id":"22-40","q":"Which vertebrae do the two facets on a typical rib head meet?","o":["Inferior facet → the vertebra below<br>Superior facet → its own vertebra","Inferior facet → its own vertebra<br>Superior facet → the vertebra above","Inferior facet → the vertebra above<br>Superior facet → its own vertebra"],"k":1,"figs":["img/p/g22a_rib5_joints.webp"]},{"id":"22-41","q":"What does the facet on a rib tubercle articulate with?","o":["Transverse process of the vertebra below","Transverse process of its own vertebra","Transverse process of the vertebra above"],"k":1,"figs":["img/p/g22a_costovert.webp"]},{"id":"22-42","q":"What is the angle of a rib, and what does it mark?","o":["Where the body turns forward → lateral limit of the deep back muscles","Where the body turns backward → lateral limit of the serratus anterior","Where the body turns forward → medial limit of the deep back muscles"],"k":0,"figs":["img/22_cage_3.jpg","img/p/g22a_typ_rib.webp"]},{"id":"22-43","q":"Where is the costal groove, and what does it shelter?","o":["Inner upper edge of the rib body → intercostal vessels and nerve","Inner lower edge of the rib body → intercostal vessels and nerve","Outer upper edge of the rib body → intercostal vessels and nerve"],"k":1,"figs":["img/p/g22a_typ_rib.webp","img/22_cage_2.jpg"]},{"id":"22-44","q":"How does the shape of the 1st rib compare with the other true ribs?","o":["Narrowest, shortest and most sharply curved","Broadest, shortest and most sharply curved","Longest, narrowest and least curved"],"k":1,"figs":["img/p/g22a_rib1.webp"]},{"id":"22-45","q":"Why does the head of the 1st rib have only one facet?","o":["It meets only C7","It meets T1 and T2 equally","It meets only T1"],"k":2,"figs":["img/p/g22a_atyp_ribs.webp"]},{"id":"22-46","q":"What grooves lie on the upper surface of the 1st rib?","o":["Grooves for the internal thoracic artery and vein","Grooves for the subclavian artery and subclavian vein","Grooves for the brachiocephalic artery and vein"],"k":1,"figs":["img/p/g22a_atyp_ribs.webp"]},{"id":"22-47","q":"What marks the 2nd rib?","o":["A groove for the subclavian artery","A rough area for pectoralis minor","A rough area for serratus anterior"],"k":2,"more":"<p>It is also thinner, less curved and longer than the 1st rib.<\/p>","figs":["img/p/g22a_atyp_ribs.webp"]},{"id":"22-48","q":"What is atypical about the 10th rib?","o":["A single facet on its head","Two facets separated by a crest","No costal groove on its body"],"k":0,"figs":["img/p/g22a_t10_t11.webp"]},{"id":"22-49","q":"What is atypical about the 11th and 12th ribs?","o":["Shortest ribs; two facets; prominent costal groove","Shortest ribs; one facet; no neck or tubercle","Longest ribs; two facets; no neck or tubercle"],"k":1,"figs":["img/p/g22a_atyp_ribs.webp"]}]},{"t":"Joints of the cage","qs":[{"id":"22-50","q":"What two joints does each typical rib make posteriorly, and what type are they?","o":["Costovertebral + costotransverse → both r necks","Ribs 7–10 drop at their middles and swing inward"],"k":0,"figs":["img/22_cage_1.webp","img/p/g22a_rib_axes.webp"]},{"id":"22-65","q":"Which thoracic diameter does the bucket-handle movement increase?","o":["Vertical","Transverse","Anteroposterior"],"k":1,"figs":["img/22_cage_1.webp","img/p/g22a_rib_axes.webp"]},{"id":"22-66","q":"Which thoracic diameters must every inspiration enlarge?","o":["Only the anteroposterior and transverse ones","Only the vertical one; the others change in forced breathing","All three at once: vertical, anteroposterior and transverse"],"k":2,"figs":["img/p/g22a_rib_move.webp"]},{"id":"22-67","q":"What happens in expiration?","o":["Diaphragm relaxes → intrapleural pressure becomes more negative → air is pushed out","Diaphragm contracts → intra-abdominal pressure rises → lungs recoil and expel the air","Diaphragm relaxes → intra-abdominal pressure falls → lungs recoil and expel the air"],"k":2,"figs":["img/p/g22a_diaph_pos.webp","img/p/g22a_c_expiration.webp"]}]},{"t":"Rib injuries and apertures","qs":[{"id":"22-68","q":"What does a 1st-rib fracture signal, and why?","o":["Osteoporosis → the 1st rib is the weakest rib","Severe trauma → the 1st rib is rarely fractured","Minor trauma → the 1st rib is the most often fractured"],"k":1,"figs":["img/p/g22a_count_ribs.webp"]},{"id":"22-69","q":"Which ribs break most often?","o":["The upper ribs","The floating ribs","The middle ribs"],"k":2,"figs":["img/p/g22a_cage_ant.webp"]},{"id":"22-70","q":"Where is a rib weakest?","o":["At its costochondral junction","Just in front of its angle","Just behind its tubercle"],"k":1,"figs":["img/p/g22a_typ_rib.webp"]},{"id":"22-71","q":"What can broken lower ribs damage?","o":["Pierce the oesophagus<br>Damage the thoracic duct","Tear the diaphragm<br>Rupture the trachea","Tear the diaphragm<br>Pierce the lung or heart"],"k":2,"figs":["img/p/g22a_diaphragm_dome.webp","img/p/g22a_cavity.webp"]},{"id":"22-72","q":"What is a flail chest?","o":["Several rib fractures leave a loose segment of chest wall → improves ventilation","A single rib fracture that splints the chest wall → reduces pain on breathing","Several rib fractures leave a loose segment of chest wall → impairs ventilation"],"k":2,"figs":["img/p/g22a_flail.webp"]},{"id":"22-73","q":"How does a flail segment move during breathing?","o":["The wrong way: in on inspiration, out on expiration","The normal way: out on inspiration, in on expiration","The wrong way: out on inspiration, in on expiration"],"k":0,"figs":["img/p/g22a_flail_paradox.webp"]},{"id":"22-74","q":"What does notching of the ribs usually indicate?","o":["Patent ductus arteriosus","Thoracic outlet syndrome","Coarctation of the aorta"],"k":2,"figs":["img/p/g22a_notching.webp"]},{"id":"22-75","q":"Why does coarctation of the aorta notch the ribs?","o":["Blood rerouted around the narrowing enlarges the intercostal arteries","Blood rerouted around the narrowing enlarges the internal thoracic veins","Raised pressure in the intercostal veins erodes the rib's upper border"],"k":0,"figs":["img/p/g22a_notching.webp","img/22_cage_4.webp"]},{"id":"22-76","q":"Which bone is used for bone marrow biopsy and marrow harvest for transplantation, and why?","o":["Xiphoid process → easiest to reach below the costal margin","Body of the sternum → broad and just under the skin","1st rib → broad and just under the clavicle"],"k":1,"figs":["img/p/g22a_sternum.webp"]},{"id":"22-77","q":"What are the boundaries of the thoracic inlet (superior thoracic aperture)?","o":["Behind: T1<br>Sides: 1st ribs and their cartilages<br>Front: upper border of the manubrium","Behind: T1<br>Sides: 1st ribs and their cartilages<br>Front: xiphisternal joint","Behind: T4<br>Sides: 2nd ribs and their cartilages<br>Front: sternal angle"],"k":0,"more":"<p>The inlet is small and kidney-shaped, and connects the thorax with the neck and upper limbs.<\/p>","figs":["img/22_cage_3.jpg","img/p/g22a_inlet.webp"]},{"id":"22-78","q":"Besides vessels and nerves, what passes through the thoracic inlet?","o":["Trachea<br>Oesophagus<br>Azygos vein<br>Cisterna chyli","Trachea<br>Oesophagus<br>Apices of the lungs<br>Thoracic duct","Trachea<br>Oesophagus<br>Bases of the lungs<br>Thoracic duct"],"k":1,"figs":["img/p/g22a_inlet.webp","img/p/g22a_inlet_vessels.webp"]},{"id":"22-79","q":"Which blood vessels pass through the thoracic inlet?","o":["Subclavian artery and vein<br>Brachiocephalic artery<br>Costocervical trunk<br>Musculophrenic artery","Axillary artery and vein<br>Brachiocephalic artery<br>Thyrocervical trunk<br>Inferior epigastric artery","Subclavian artery and vein<br>Brachiocephalic artery<br>Costocervical trunk<br>Internal thoracic artery"],"k":2,"figs":["img/p/g22a_inlet_vessels.webp"]},{"id":"22-80","q":"Which nerves pass through the thoracic inlet?","o":["Phrenic and accessory nerves<br>Sympathetic chain<br>Anterior ramus of T1","Phrenic and vagus nerves<br>Sympathetic chain<br>Anterior ramus of C4","Phrenic and vagus nerves<br>Sympathetic chain<br>Anterior ramus of T1"],"k":2,"figs":["img/p/g22a_inlet_vessels.webp","img/p/g22a_c_azygos_arch.webp","img/p/g22a_bplexus.webp"]},{"id":"22-81","q":"What are the boundaries of the thoracic outlet (inferior thoracic aperture)?","o":["Behind: T12<br>Posterolaterally: ribs 11 and 12<br>Anterolaterally: costal margins<br>Front: xiphisternal joint","Behind: T12<br>Posterolaterally: ribs 11 and 12<br>Anterolaterally: costal margins<br>Front: sternal angle","Behind: L1<br>Posterolaterally: ribs 10 and 11<br>Anterolaterally: costal margins<br>Front: xiphisternal joint"],"k":0,"more":"<p>Much larger than the inlet.<\/p>","figs":["img/22_cage_3.jpg","img/p/g22a_outlet.webp"]},{"id":"22-82","q":"What almost closes off the thoracic outlet?","o":["The pericardium","The costal margins","The diaphragm"],"k":2,"figs":["img/p/g22a_diaphragm_dome.webp"]},{"id":"22-83","q":"What passes through or behind the diaphragm into the abdomen?","o":["Aorta<br>Trachea<br>Inferior vena cava (IVC)<br>Azygos vein<br>Thoracic duct<br>Nerves","Aorta<br>Oesophagus<br>Inferior vena cava (IVC)<br>Azygos vein<br>Thoracic duct<br>Nerves","Aorta<br>Oesophagus<br>Superior vena cava (SVC)<br>Azygos vein<br>Thoracic duct<br>Nerves"],"k":1,"figs":["img/p/g22a_diaph_openings.webp","img/p/g22a_c_duct_azygos.webp"]},{"id":"22-84","q":"Which anatomical aperture does thoracic outlet syndrome actually involve?","o":["The thoracic outlet (inferior thoracic aperture)","The thoracic inlet (superior thoracic aperture)","The superior mediastinum below the sternal angle"],"k":1,"more":"<p>The naming trap: it is named for the vessels and nerves &ldquo;coming out&rdquo; of the thorax to supply the head, neck and arm.<\/p>","figs":["img/p/g22a_tos_xray.webp"]},{"id":"22-85","q":"What causes thoracic outlet syndrome?","o":["Fractured clavicle or tight pectoralis major → compresses the axillary vessels and/or C5 nerve","Extra cervical rib or abnormal anterior scalene attachment → compresses subclavian vessels and/or T1 nerve","Extra cervical rib or abnormal posterior scalene attachment → compresses the brachiocephalic vessels and/or phrenic nerve"],"k":1,"figs":["img/p/g22a_cervical_rib.webp","img/p/g22a_inlet_vessels.webp"]},{"id":"22-86","q":"What does the T1 nerve feed, making it relevant in thoracic outlet syndrome?","o":["Middle trunk of the brachial plexus","Upper trunk of the brachial plexus","Lower trunk of the brachial plexus"],"k":2,"figs":["img/p/g22a_bplexus.webp"]},{"id":"22-87","q":"What are the signs of thoracic outlet syndrome?","o":["Diminished radial pulse<br>Poor blood flow to the arm<br>Pain along medial forearm and hand<br>Wasting of the small muscles of the hand","Diminished femoral pulse<br>Poor blood flow to the leg<br>Pain along medial thigh<br>Wasting of the small muscles of the foot","Bounding radial pulse<br>Increased blood flow to the arm<br>Pain along lateral forearm and thumb<br>Wasting of the deltoid"],"k":0,"figs":["img/p/g22a_axillary_inlet.webp"]}]},{"t":"Intercostal muscles","qs":[{"id":"22-88","q":"What three muscle layers lie in each intercostal space, superficial to deep?","o":["External intercostal → internal intercostal → innermost intercostal","Innermost intercostal → internal intercostal → external intercostal","Internal intercostal → external intercostal → innermost intercostal"],"k":0,"more":"<p>They are arranged like the abdominal wall in miniature.<\/p>","figs":["img/22_cage_2.jpg","img/p/g22b_grays_van.webp"]},{"id":"22-89","q":"Which way do the fibres of the external intercostals run?","o":["Downward and backward","Downward and forward","Upward and forward"],"k":1,"figs":["img/p/g22b_gil_wall_muscles.webp","img/22_cage_2.jpg"]},{"id":"22-90","q":"What is the extent of the external intercostals, and what replaces them anteriorly?","o":["Rib angles (behind) → costochondral junctions (front) → then a membrane","Sternum (front) → rib angles (behind) → then a membrane","Rib tubercles (behind) → costochondral junctions (front) → then a membrane"],"k":2,"figs":["img/p/g22b_gil_wall_muscles.webp","img/22_cage_2.jpg","img/p/g22b_gil_innermost_subcostal.webp"]},{"id":"22-91","q":"Below the thorax, the external intercostals are continuous with which muscle?","o":["Internal oblique","Rectus abdominis","External oblique"],"k":2,"figs":["img/p/g22b_accessory_muscles.webp"]},{"id":"22-92","q":"Which way do the fibres of the internal intercostals run?","o":["Downward and backward (at right angles to the externals)","Downward and forward (parallel to the externals)","Upward and forward (at right angles to the externals)"],"k":0,"figs":["img/22_cage_2.jpg","img/p/g22b_gil_innermost_subcostal.webp"]},{"id":"22-93","q":"What is the extent of the internal intercostals, and what replaces them posteriorly?","o":["Costochondral junctions → rib angles → then a ligament","Sternum → rib tubercles → no membrane","Sternum → rib angles → then a membrane"],"k":2,"figs":["img/p/g22b_gil_wall_muscles.webp","img/p/g22b_gil_innermost_subcostal.webp","img/p/g22b_c_int_ic_membrane.webp"]},{"id":"22-94","q":"Below the thorax, the internal intercostals are continuous with which muscle?","o":["Quadratus lumborum","External oblique","Internal oblique"],"k":2},{"id":"22-95","q":"How do the internal intercostals compare with the externals in strength and timing?","o":["Weaker → most active in expiration","Stronger → most active in inspiration","Weaker → most active in quiet inspiration"],"k":0,"figs":["img/p/g22b_wall_muscle_table.webp"]},{"id":"22-96","q":"What are the innermost intercostals?","o":["Most superficial fibres of the external layer, split off by the neurovascular bundle","Deepest fibres of the external layer, separated by the endothoracic fascia","Deepest fibres of the internal layer, split off by the neurovascular bundle"],"k":2,"figs":["img/22_cage_2.jpg","img/p/g22b_gil_innermost_subcostal.webp"]},{"id":"22-97","q":"What is the action of the innermost intercostals?","o":["Pull the diaphragm down → well established","Clearly like transversus thoracis → depress the sternum","Probably like the internals → not established"],"k":2,"figs":["img/p/g22b_wall_muscle_table.webp"]},{"id":"22-98","q":"Which accessory muscles of respiration join in forced inspiration?","o":["Latissimus dorsi<br>Rectus abdominis<br>Internal obliques","Pectoralis major and minor<br>Internal intercostals<br>Transversus abdominis","Pectoralis major and minor<br>Serratus anterior<br>Scalenes"],"k":2,"figs":["img/p/g22b_accessory_muscles.webp"]},{"id":"22-99","q":"Which small thoracic wall muscles are thought to work mainly as proprioceptors?","o":["External intercostals<br>Innermost intercostals","Subcostal muscles<br>Transversus thoracis","Serratus posterior muscles<br>Levatores costarum"],"k":2,"more":"<p>Serratus posterior is implicated in myofascial pain; levatores costarum also help move the vertebrae.<\/p>","figs":["img/p/g22b_gil_serratus_post.webp","img/p/g22b_gil_levatores.webp"]},{"id":"22-100","q":"What are th
