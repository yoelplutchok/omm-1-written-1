<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cardio-Pulm 1 Questions</title>
<meta name="robots" content="noindex">
<style>
/* Same paper, type and subject colours as the Cardio-Pulm 1 flashcards. Home = lessons grouped by subject;
   lesson = its numbered sections; study = one section (or lesson) of three-choice questions running down the page,
   numbered from 1 in each section, with the card's More + Pictures dropdowns under each answer. */
:root{
  --bg:#faf8f4; --panel:#ffffff; --ink:#1d1b16; --mut:#6f6a5e; --line:#e3ddd0; --soft:#f1ece1; --chip:#ece7db;
  --phys:#2f6b8f; --hist:#8a4b2a; --bio:#4a3b7a; --anat:#2f6b45; --acc:#2f6b8f;
  --hy:#fdf7dc; --hyb:#cfa92f; --hyt:#6b5410; --cp2:#8a8170;
  --serif:Charter,"Iowan Old Style","Source Serif Pro",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151a; --panel:#1b1e25; --ink:#e9e6df; --mut:#9b968b; --line:#2c313a; --soft:#232730; --chip:#262b35;
  --phys:#7fb8d8; --hist:#d39168; --bio:#a99ad8; --anat:#74b58d; --acc:#7fb8d8;
  --hy:#2c2714; --hyb:#8d7629; --hyt:#e8d394; --cp2:#8f887a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151a; --panel:#1b1e25; --ink:#e9e6df; --mut:#9b968b; --line:#2c313a; --soft:#232730; --chip:#262b35;
  --phys:#7fb8d8; --hist:#d39168; --bio:#a99ad8; --anat:#74b58d; --acc:#7fb8d8;
  --hy:#2c2714; --hyb:#8d7629; --hyt:#e8d394; --cp2:#8f887a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.6 var(--serif);margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:18px}
button{font:500 14px/1 var(--sans);color:inherit;background:var(--chip);border:1px solid transparent;border-radius:999px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--line)}
button:focus-visible,summary:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
select{font:500 14px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:600 18px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);font:12.5px var(--sans)}
#themeBtn{margin-left:auto;padding:5px 10px;font-size:12.5px}
nav.subj{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav.subj button.on{color:var(--bg)}
nav.subj button.on[data-k=all]{background:var(--acc)} nav.subj button.on[data-k=phys]{background:var(--phys)}
nav.subj button.on[data-k=hist]{background:var(--hist)} nav.subj button.on[data-k=bio]{background:var(--bio)}
nav.subj button.on[data-k=anat]{background:var(--anat)}

.phys{--c:var(--phys)} .hist{--c:var(--hist)} .bio{--c:var(--bio)} .anat{--c:var(--anat)}

/* home */
#home{padding-block:22px 60px}
.intro{color:var(--mut);font:14px/1.55 var(--sans);margin:0 0 22px;max-width:62ch}
.sect{margin-bottom:30px}
.sect h2{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--c);margin:0 0 10px}
.sect h2 .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sect h2 .ct{color:var(--mut);font-weight:500;letter-spacing:.04em}
.sect h2 button{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;padding:5px 11px}
.lessons{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px 10px 10px 4px;padding:13px 16px;font:inherit;color:inherit}
.lrow:hover{border-color:var(--c)}
.lrow .lt{font:600 17px/1.3 var(--serif);min-width:0;text-wrap:balance}
.lrow .lm{font:12px/1.4 var(--sans);color:var(--mut);grid-column:1}
.lrow .lc{grid-row:1/3;grid-column:2;text-align:right;font:500 12px/1.3 var(--sans);color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow .lc b{display:block;font:600 18px/1.1 var(--sans);color:var(--ink)}
.lrow .lp{grid-column:1/-1;height:3px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:6px}
.lrow .lp i{display:block;height:100%;background:var(--c)}
.cp2tag{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--cp2);border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin-left:6px;vertical-align:2px}

/* study */
#study{padding-block:16px 120px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.top .back{padding:6px 11px}
.top select{flex:1 1 180px;min-width:0}
.top button[aria-pressed="true"]{background:var(--c);color:var(--bg)}
.ltitle{font:600 12px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--c);margin:0 0 2px}
.posrow{display:flex;align-items:center;gap:12px;font:500 12.5px var(--sans);color:var(--mut);font-variant-numeric:tabular-nums;margin-bottom:18px}
.bar{flex:1;height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .2s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px 26px 22px}
@media (max-width:560px){.card{padding:20px 18px}.wrap{padding-inline:16px}}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:600 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.eyebrow .tp{color:var(--c)}
.hyb{font:600 10px/1 var(--sans);letter-spacing:.07em;color:var(--hyt);background:var(--hy);border:1px solid var(--hyb);border-radius:999px;padding:3px 7px}
.q{font:600 clamp(20px,4.6vw,24px)/1.35 var(--serif);margin:0 0 20px;text-wrap:balance;letter-spacing:-.01em}
.flip{width:100%;padding:16px;border:1.5px dashed var(--line);background:transparent;border-radius:10px;font:600 15px var(--sans);color:var(--c)}
.flip span{font:500 12px var(--sans);color:var(--mut);margin-left:8px}
.ans{background:var(--soft);border-left:4px solid var(--c);border-radius:0 10px 10px 0;padding:14px 18px;font:650 clamp(18px,4.2vw,21px)/1.45 var(--sans);color:var(--ink)}
.ans sub,.ans sup{font-size:.7em}
.drops{display:grid;gap:8px;margin-top:14px}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
summary{cursor:pointer;padding:10px 14px;font:600 13.5px var(--sans);color:var(--mut);list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary .n{font-weight:500;opacity:.8}
.more{padding:0 16px 14px;font-size:15.5px;line-height:1.6}
.more p{margin:0 0 10px}.more p:last-child{margin-bottom:0}
.more ul,.more ol{margin:0 0 10px;padding-left:20px}.more li{margin:3px 0}
.more .tw{overflow-x:auto}
.more table{border-collapse:collapse;font:14px/1.45 var(--sans);margin:4px 0 8px;min-width:100%}
.more th,.more td{text-align:left;vertical-align:top;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
.more th{font-weight:600}
.pics{display:grid;gap:14px;padding:0 14px 14px}
.pics figure{margin:0;min-width:0}
.pics img{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.pics figcaption{font:11.5px/1.45 var(--sans);color:var(--mut);margin-top:6px;text-align:center}
.star{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:600 15px/1 var(--sans);color:var(--mut);letter-spacing:0;text-transform:none}
.star[aria-pressed="true"]{color:var(--hyb);border-color:var(--hyb);background:var(--hy)}
.lrow .ls{color:var(--hyb);font-weight:600;margin-left:6px}
.starbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--hyb);border-radius:4px 10px 10px 4px;padding:12px 16px;margin:0 0 26px;font:14px var(--sans)}
.starbar b{font-weight:600}.starbar .sync{color:var(--mut);font-size:12px}
.starbar button{margin-left:auto;background:var(--hy);border-color:var(--hyb);color:var(--hyt);font-weight:600}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
.lhead h2{font:600 22px/1.25 var(--serif);margin:6px 0 2px;flex-basis:100%;text-wrap:balance}
.lhead .lm{font:13px var(--sans);color:var(--mut);flex-basis:100%}
.lacts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.lacts .go{background:var(--c);color:var(--bg);font-weight:600}
.lacts .rs{background:var(--hy);border-color:var(--hyb);color:var(--hyt);font-weight:600}
.trow{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px 10px 10px 4px}
.trow:hover{border-color:var(--c)}
.trow .tm{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;background:transparent;border:0;border-radius:0;padding:12px 14px;font:inherit;color:inherit}
.trow .tn{grid-row:1/3;font:600 13px/1 var(--sans);color:var(--c);font-variant-numeric:tabular-nums;min-width:1.4em}
.trow .tt{font:600 16px/1.3 var(--serif);min-width:0}
.trow .tc{grid-row:1/3;grid-column:3;font:500 12px/1.3 var(--sans);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.trow .tp2{grid-column:2;height:3px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:6px}
.trow .tp2 i{display:block;height:100%;background:var(--c)}
.trow .tr{flex:none;align-self:center;margin:0 10px 0 0;padding:6px 11px;font-size:13px;font-weight:600;background:var(--hy);border:1px solid var(--hyb);color:var(--hyt)}
.empty{color:var(--mut);font:14px var(--sans);text-align:center;padding:30px 10px}
.endcard{text-align:center;padding:34px 20px}
.endcard p{color:var(--mut);font:14px var(--sans);margin:6px 0 18px}
.endcard h3{font:600 22px var(--serif);margin:0}
.endcard .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.endcard .go{background:var(--c);color:var(--bg)}
nav.foot{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
nav.foot .in{max-width:780px;margin:0 auto;display:flex;gap:8px}
nav.foot button{flex:1;border-radius:10px;padding:12px 8px;font-size:15px}
nav.foot .nx{background:var(--c);color:var(--bg);font-weight:600}
.keys{font:12px var(--sans);color:var(--mut);text-align:center;margin-top:12px}
@media (max-width:560px){.keys{display:none}}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
#lb img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
#lb button{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:#222;color:#fff;border-color:#555}
@media (prefers-reduced-motion:reduce){.bar i,summary::before{transition:none}}

/* ---- multiple choice additions (same tokens as above, plus right/wrong colours) ---- */
:root{ --ok:#2e7148; --okbg:#e7f2ea; --bad:#a8382c; --badbg:#f8e6e2; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --ok:#7cc79a; --okbg:#1a2b21; --bad:#ef8c80; --badbg:#35201e; }}
:root[data-theme="dark"]{ --ok:#7cc79a; --okbg:#1a2b21; --bad:#ef8c80; --badbg:#35201e; }

.lrow .lm b,.trow .tc b{color:var(--ink);font-weight:600}
.reviewbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.starbar .reviewbar button{margin-left:0}
.starbar .miss{background:var(--badbg);border-color:var(--bad);color:var(--bad)}

/* study list: questions flow down the page, numbered from 1 in each section */
.qlist{display:grid;gap:14px}
.lsep{font:600 22px/1.25 var(--serif);margin:26px 0 0;text-wrap:balance}
.lsep small{display:block;font:600 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.ssep{display:flex;align-items:baseline;gap:10px;margin:18px 0 0;padding:10px 14px;background:var(--soft);border-left:3px solid var(--c);border-radius:4px 10px 10px 4px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
.ssep .sn{font:600 13px/1 var(--sans);color:var(--c);font-variant-numeric:tabular-nums}
.ssep h3{flex:1;min-width:0;font:600 17px/1.3 var(--serif);margin:0;text-wrap:balance}
.ssep .sc{font:500 12px/1.3 var(--sans);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.card.mc{padding:20px 22px 18px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px)}
@media (max-width:560px){.card.mc{padding:18px 16px 16px}}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;background:var(--c);color:var(--bg);font:700 13px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:0}
.card.mc .q{font-size:clamp(18px,4.3vw,21px);margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font:500 16px/1.45 var(--sans);color:var(--ink)}
.opt sub,.opt sup{font-size:.7em}
.opt .ol{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font:600 13px/1 var(--sans);color:var(--mut);margin-top:-1px}
.opt .ot{flex:1;min-width:0;overflow-wrap:anywhere}
.opt .mk{display:none;align-self:center;font:700 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.mc:not(.done) .opt:hover{border-color:var(--c)}
.mc:not(.done) .opt:active{background:var(--soft)}
.mc.done .opt{cursor:default}
.mc.done .opt.is-ans{border-color:var(--ok);background:var(--okbg)}
.mc.done .opt.is-ans .ol{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.mc.done .opt.is-ans .mk{display:inline;color:var(--ok)}
.mc.done .opt.picked:not(.is-ans){border-color:var(--bad);background:var(--badbg)}
.mc.done .opt.picked:not(.is-ans) .ol{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.mc.done .opt.picked:not(.is-ans) .mk{display:inline;color:var(--bad)}
.mc.done .opt:not(.is-ans):not(.picked){opacity:.72}
.res{display:none;margin-top:12px}
.mc.done .res{display:block}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:700 14.5px var(--sans);margin:0}
.verdict.right{color:var(--ok)} .verdict.wrong{color:var(--bad)}
.verdict button{margin-left:auto;font-size:12.5px;padding:5px 11px}
.res .drops{margin-top:10px}
.mc.peek:not(.done) .opt.is-ans{border-color:var(--ok);background:var(--okbg)}
.mc.peek:not(.done) .opt.is-ans .ol{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.mc.peek:not(.done) .opt.is-ans .mk{display:inline;color:var(--ok)}
.mc.peek:not(.done) .res{display:block}
.mc.peek:not(.done) .verdict{display:none}
.top button.miss[aria-pressed="true"]{background:var(--bad);color:var(--panel)}
.posrow b{color:var(--ink);font-weight:600}
.endcard .rs{background:var(--hy);border-color:var(--hyb);color:var(--hyt);font-weight:600}
.endcard .score{font:600 34px/1.1 var(--sans);color:var(--c);margin:10px 0 0;font-variant-numeric:tabular-nums}
.armed{background:var(--bad)!important;color:var(--panel)!important}
.lp i,.tp2 i{transition:width .2s}
@media (prefers-reduced-motion:reduce){.lp i,.tp2 i{transition:none}}
body.studying nav.subj{display:none}
@media (max-width:560px){.mc.done .opt .mk,.mc.peek .opt .mk{display:none!important}}
</style>

atrium → tricuspid valve → right ventricle → pulmonic valve → pulmonary vein → lungs → pulmonary artery → left atrium → mitral valve → left ventricle → aortic valve → aorta → organs → veins → vena cava → right atrium","Right atrium → mitral valve → right ventricle → pulmonic valve → pulmonary artery → lungs → pulmonary vein → left atrium → tricuspid valve → left ventricle → aortic valve → aorta → organs → veins → vena cava → right atrium"],"k":0,"figs":["img/01_circuit_1.png"]},{"id":"1-6","q":"Name the two right-heart valves in the order blood crosses them.","o":["Pulmonic (right atrium → right ventricle)<br>Tricuspid (right ventricle → pulmonary artery)","Tricuspid (right atrium → right ventricle)<br>Aortic (right ventricle → pulmonary artery)","Tricuspid (right atrium → right ventricle)<br>Pulmonic (right ventricle → pulmonary artery)"],"k":2},{"id":"1-7","q":"Name the two left-heart valves in the order blood crosses them.","o":["Mitral (left atrium → left ventricle)<br>Aortic (left ventricle → aorta)","Mitral (left atrium → left ventricle)<br>Pulmonic (left ventricle → aorta)","Aortic (left atrium → left ventricle)<br>Mitral (left ventricle → aorta)"],"k":0},{"id":"1-8","q":"What fraction of the cardiac output passes through each heart chamber and through the lungs every minute?","o":["100%","50%","25%"],"k":0,"more":"<p>Every drop goes round the one loop, so left ventricular output equals right ventricular output.<\/p>","figs":["img/01_circuit_1.png"]}]},{"t":"Right vs left pressures","qs":[{"id":"1-9","q":"Typical pulmonary artery pressure?","o":["About 25/0 mmHg (mean 8)","About 40/15 mmHg (mean 25)","About 25/8 mmHg (mean 15)"],"k":2},{"id":"1-10","q":"Typical aortic pressure?","o":["About 120/80 mmHg (mean 100)","About 120/0 mmHg (mean 60)","About 140/90 mmHg (mean 120)"],"k":0},{"id":"1-11","q":"Why does the left ventricle have to generate far more pressure than the right ventricle?","o":["Systemic circuit carries more flow than the pulmonary circuit at the same resistance","Systemic circuit is short and low-resistance; pulmonary circuit is long and high-resistance","Systemic circuit is long and high-resistance; pulmonary circuit is short and low-resistance"],"k":2,"more":"<p><b>Picture it:<\/b> pulmonary circulation is a short garden hose, systemic circulation is a mile of narrow pipe. Same pump rate, wildly different pressure needed.<\/p>"},{"id":"1-12","q":"At the same flow, how does left ventricular pressure compare with right ventricular pressure?","o":["About 10× the peak pressure; 20× the mean","About 2× the peak pressure; 3× the mean","About 5× the peak pressure; 6–7× the mean"],"k":2},{"id":"1-13","q":"Why is the left ventricular wall thick and the right ventricular wall thin?","o":["The left pumps about five times the flow at the same pressure","Same flow, but the right must generate about five times the peak pressure","Same flow, but the left must generate about five times the peak pressure"],"k":2,"more":"<p>The lesson calls the left-high/right-low pressure difference the single most useful fact for the rest of the block.<\/p>"}]},{"t":"Pressure at each level","qs":[{"id":"1-14","q":"What pressure pattern do both the systemic and pulmonary circuits share?","o":["Lowest leaving the ventricle → highest arriving back at an atrium","Highest leaving the ventricle → lowest arriving back at an atrium","Highest in the capillaries → lowest in the arteries and veins"],"k":1,"more":"<p>The pulmonary side runs the same pattern at a fraction of the pressure.<\/p>"},{"id":"1-15","q":"Mean pressure in the systemic arterioles?","o":["85 mmHg","50 mmHg","30 mmHg"],"k":1,"more":"<p>No arteriole value is given for the pulmonary circuit.<\/p>"},{"id":"1-16","q":"Mean pressure in the systemic capillaries?","o":["20 mmHg","10 mmHg","35 mmHg"],"k":0},{"id":"1-17","q":"Mean pressure in the pulmonary capillaries?","o":["20 mmHg","10 mmHg","15 mmHg"],"k":1},{"id":"1-18","q":"Mean pressure in the vena cava?","o":["0 mmHg","8 mmHg","4 mmHg"],"k":2},{"id":"1-19","q":"Mean pressure in the pulmonary vein?","o":["8 mmHg","4 mmHg","1 mmHg"],"k":0},{"id":"1-20","q":"Right atrial pressure?","o":["5–8 mmHg","0–2 mmHg","2–5 mmHg"],"k":1},{"id":"1-21","q":"Left atrial pressure?","o":["0–2 mmHg","2–5 mmHg","8–12 mmHg"],"k":1,"more":"<table><tr><th>Level<\/th><th>Systemic<\/th><th>Pulmonary<\/th><\/tr><tr><td>Main artery<\/td><td>Aorta 100 (120/80)<\/td><td>Pulmonary artery 15 (25/8)<\/td><\/tr><tr><td>Arterioles<\/td><td>50<\/td><td>–<\/td><\/tr><tr><td>Capillaries<\/td><td>20<\/td><td>10<\/td><\/tr><tr><td>Main vein<\/td><td>Vena cava 4<\/td><td>Pulmonary vein 8<\/td><\/tr><tr><td>Receiving atrium<\/td><td>Right atrium 0–2<\/td><td>Left atrium 2–5<\/td><\/tr><\/table><p>Mean pressures, mmHg.<\/p>"},{"id":"1-22","q":"How is left atrial pressure estimated, since it is hard to measure directly?","o":["Pulmonary wedge pressure","Mean pulmonary artery pressure","Central venous pressure"],"k":0},{"id":"1-23","q":"Why does a catheter wedged in a small pulmonary artery branch read left atrial pressure?","o":["It stops flow in that branch, so it senses the left atrium almost directly","It stops flow in that branch, so it senses the right atrium almost directly","It sits in the capillary bed, so it senses alveolar pressure directly"],"k":0}]},{"t":"Resistance: TPR vs PVR","qs":[{"id":"1-24","q":"Rearrange flow = pressure difference ÷ resistance to give resistance.","o":["R = ΔP / Q","R = Q / ΔP","R = ΔP × Q"],"k":0},{"id":"1-25","q":"For total peripheral resistance (TPR), what is the pressure difference (ΔP)?","o":["Mean arterial pressure (MAP) − right atrial pressure","Mean arterial pressure (MAP) − left atrial pressure","Mean pulmonary artery pressure − right atrial pressure"],"k":0},{"id":"1-26","q":"For pulmonary vascular resistance (PVR), what is the pressure difference (ΔP)?","o":["Mean pulmonary artery pressure − right atrial pressure","Mean pulmonary artery pressure − left atrial pressure","Mean arterial pressure (MAP) − left atrial pressure"],"k":1},{"id":"1-27","q":"Calculate TPR: MAP 96 mmHg, right atrial pressure 2 mmHg, cardiac output 5,229 mL/min.","o":["(96 − 2) / 5,229 ≈ 0.18 mmHg/mL per min","(96 + 2) / 5,229 ≈ 0.019 mmHg/mL per min","(96 − 2) / 5,229 ≈ 0.018 mmHg/mL per min"],"k":2},{"id":"1-28","q":"Calculate PVR: pulmonary artery pressure 15 mmHg, left atrial pressure 5 mmHg, cardiac output 5,229 mL/min.","o":["(15 − 5) / 5,229 ≈ 0.019 mmHg/mL per min","(15 − 5) / 5,229 ≈ 0.0019 mmHg/mL per min","(15 + 5) / 5,229 ≈ 0.0038 mmHg/mL per min"],"k":1},{"id":"1-29","q":"How does pulmonary vascular resistance compare with total peripheral resistance?","o":["PVR ≈ one half of TPR","PVR ≈ ten times TPR","PVR ≈ one tenth of TPR"],"k":2,"more":"<p>Same flow at a fraction of the pressure means a fraction of the resistance.<\/p>"},{"id":"1-30","q":"Total flow through all the pulmonary capillaries (or through all the systemic arteries) equals what?","o":["Half the cardiac output","The stroke volume","The cardiac output"],"k":2},{"id":"1-31","q":"What do you need to calculate the resistance of a single organ?","o":["Mean arterial pressure − right atrial pressure and the cardiac output","That organ's own arterial pressure alone and the cardiac output","That organ's own arterial − venous pressure and its own blood flow"],"k":2}]},{"t":"Where the blood sits","qs":[{"id":"1-32","q":"Where is most of the blood volume at any moment?","o":["In the arteries: about two thirds","In the heart and lungs: about half","In the veins: about two thirds"],"k":2,"more":"<p>Arteries hold only a small fraction, under high pressure.<\/p>","figs":["img/01_circuit_2.webp"]},{"id":"1-33","q":"Which vessels are called the capacitance vessels, and why?","o":["Arterioles: they set the resistance","Arteries: they are the blood reservoir","Veins: they are the blood reservoir"],"k":2}]},{"t":"Branching and cross-sectional area","qs":[{"id":"1-34","q":"Approximate number of each systemic vessel type: aorta, arteries, arterioles, capillaries?","o":["Aorta 1<br>Arteries 10<sup>5<\/sup><br>Arterioles 10<sup>10<\/sup><br>Capillaries 10<sup>7<\/sup>","Aorta 1<br>Arteries 10<sup>3<\/sup><br>Arterioles 10<sup>5<\/sup><br>Capillaries 10<sup>7<\/sup>","Aorta 1<br>Arteries 10<sup>5<\/sup><br>Arterioles 10<sup>7<\/sup><br>Capillaries 10<sup>10<\/sup>"],"k":2,"more":"<p>Each level of branching multiplies the count. Veins and venules together are counted as 10<sup>12<\/sup> in older editions of this figure and 10<sup>7<\/sup> in the current one.<\/p>","figs":["img/01_circuit_2.webp"]},{"id":"1-35","q":"Which vessels have the largest total cross-sectional area, and about how large?","o":["Capillaries: about 2,500 cm² (vs a few cm² for the aorta)","Arterioles: about 2,500 cm² (vs a few cm² for the aorta)","Aorta: about 2,500 cm² (vs a few cm² for the capillaries)"],"k":0,"more":"<p>A single capillary is tiny, but there are so many that together they have the largest area; that is why blood slows right down in them.<\/p>","figs":["img/01_circuit_2.webp"]}]},{"t":"Organ share of cardiac output","qs":[{"id":"1-36","q":"How are the systemic organs arranged relative to the aorta, and what follows for their flows?","o":["In series → their separate flows add up to the whole cardiac output","In parallel → their separate flows add up to the whole cardiac output","In series → each organ receives the whole cardiac output in turn"],"k":1,"more":"<p>This is Kirchhoff's junction rule.<\/p>","figs":["img/01_circuit_1.png"]},{"id":"1-37","q":"Which organs get the biggest share of cardiac output at rest, and what do they have in common?","o":["Liver and gut, kidneys, skeletal muscle, brain → all doing continuous chemical work","Brain, heart, skin, lungs → all with the highest oxygen extraction","Heart, lungs, kidneys, spleen → all needing high-pressure perfusion"],"k":0},{"id":"1-38","q":"Resting share of cardiac output: kidneys?","o":["About 40%","About 15%","About 25%"],"k":2,"figs":["img/01_circuit_1.png"],"hy":true},{"id":"1-39","q":"Resting share of cardiac output: liver and gut (gastrointestinal) together?","o":["About 25%","About 15%","About 50%"],"k":0,"hy":true},{"id":"1-40","q":"Resting share of cardiac output: skeletal muscle?","o":["About 25%","About 15%","About 50%"],"k":0,"hy":true},{"id":"1-41","q":"Resting share of cardiac output: brain?","o":["About 15%","About 25%","About 5%"],"k":0,"hy":true},{"id":"1-42","q":"Resting share of cardiac output: coronaries?","o":["About 1% (one hundredth)","About 25% (one quarter)","About 5% (one twentieth)"],"k":2,"hy":true},{"id":"1-43","q":"Resting share of cardiac output: skin?","o":["About 1%","About 25%","About 5%"],"k":2,"more":"<table><tr><th>Organ<\/th><th>Resting share<\/th><\/tr><tr><td>Kidneys<\/td><td>~25%<\/td><\/tr><tr><td>Liver + gut<\/td><td>~25%<\/td><\/tr><tr><td>Skeletal muscle<\/td><td>~25%<\/td><\/tr><tr><td>Brain<\/td><td>~15%<\/td><\/tr><tr><td>Coronaries<\/td><td>~5%<\/td><\/tr><tr><td>Skin<\/td><td>~5%<\/td><\/tr><\/table>","figs":["img/01_circuit_1.png"],"hy":true},{"id":"1-44","q":"Which organ has the highest blood flow per gram?","o":["Kidney: about half a percent of body weight, a quarter of the output","Heart: about half a percent of body weight, a twentieth of the output","Liver: about 2% of body weight, a quarter of the output"],"k":0,"hy":true},{"id":"1-45","q":"Why do the kidneys take so much of the cardiac output?","o":["They store a large reserve of blood for emergencies","Their tubules extract almost all the oxygen delivered","Their job is filtering, not feeding themselves"],"k":2},{"id":"1-46","q":"How do the coronaries combine blood flow and oxygen extraction?","o":["High flow + low oxygen extraction","Low flow + near-maximal oxygen extraction","High flow + near-maximal oxygen extraction"],"k":1,"hy":true},{"id":"1-47","q":"Why does the heart have almost no oxygen reserve except to dilate its vessels?","o":["It extracts only a small fraction of the oxygen, leaving little unused","It already extracts almost all the oxygen from each unit of blood","It receives the largest share of cardiac output already"],"k":1},{"id":"1-48","q":"Share of cardiac output vs oxygen extraction: how do resting skeletal muscle and the heart differ?","o":["Resting muscle: small share, extracts almost everything<br>Heart: big share, extracts little","Resting muscle: big share, extracts little<br>Heart: small share, extracts almost everything","Resting muscle: small share, extracts little<br>Heart: big share, extracts almost everything"],"k":1,"more":"<p><b>The trap:<\/b> share of output and oxygen extraction are different things.<\/p>"},{"id":"1-49","q":"During exercise, how do the organ shares of cardiac output change?","o":["Skeletal muscle ↑ enormously<br>Heart ↑ with cardiac output<br>Brain ↓ sharply","Skeletal muscle ↑ enormously<br>Heart ↑ with cardiac output<br>Gut and kidney ↓","Skeletal muscle ↑ slightly<br>Heart ↓<br>Gut and kidney ↑ enormously"],"k":1}]}]},{"n":2,"key":"phys","t":"Flow, pressure and resistance","sub":"Lecture 18","cp2":false,"secs":[{"t":"Ohm's law for blood","qs":[{"id":"2-0","q":"What actually drives blood flow?","o":["The absolute pressure at the start of a vessel, not the difference","A pressure <i>difference<\/i> between two points, not pressure itself","A pressure <i>difference<\/i> between two points, plus gravity alone"],"k":1,"more":"<p>The lesson flags this as the thing people get wrong most often.<\/p>"},{"id":"2-1","q":"Flow in a vessel with 100 mmHg at both ends?","o":["Maximal","Zero","100 mL/min"],"k":1},{"id":"2-2","q":"Write Ohm's law for blood flow.","o":["Q = ΔP / R","Q = R / ΔP","Q = ΔP × R"],"k":0,"more":"<p>Q = blood flow, ΔP = pressure gradient, R = resistance. In words: flow = pressure difference ÷ resistance, the same relationship that governs electricity.<\/p>"},{"id":"2-3","q":"Ohm's law applied to the whole systemic circulation?","o":["CO = MAP × TPR","MAP = CO / TPR","MAP = CO × TPR"],"k":2,"more":"<p>Q becomes the cardiac output (CO), R the total peripheral resistance (TPR), and ΔP the mean arterial pressure (MAP).<\/p>"},{"id":"2-4","q":"Why can ΔP for the whole systemic circulation be taken as simply the mean arterial pressure?","o":["Venous resistance is close to zero","Right atrial pressure is close to zero","Left atrial pressure is close to zero"],"k":1}]},{"t":"What sets resistance","qs":[{"id":"2-5","q":"Name the three things that set vascular resistance.","o":["Vessel length<br>Blood velocity<br>Vessel radius (dominant)","Vessel length (dominant)<br>Blood viscosity<br>Vessel radius","Vessel length<br>Blood viscosity<br>Vessel radius (dominant)"],"k":2},{"id":"2-6","q":"Write the Poiseuille equation for resistance.","o":["R = 8ηl / πr<sup>2<\/sup>","R = πr<sup>4<\/sup> / 8ηl","R = 8ηl / πr<sup>4<\/sup>"],"k":2,"more":"<p>η = blood viscosity, l = vessel length, r = radius.<\/p>"},{"id":"2-7","q":"Why does vessel width dominate resistance?","o":["Resistance depends on radius to the fourth power","Viscosity changes in proportion to radius","Resistance depends on length to the fourth power"],"k":0,"more":"<p>Nothing else in the system has that kind of leverage.<\/p>"},{"id":"2-8","q":"Halve a vessel's radius: what happens to resistance?","o":["↑ 16-fold","↑ 4-fold","↑ 2-fold"],"k":0},{"id":"2-9","q":"Halve a vessel's radius at the same pressure gradient: what happens to flow?","o":["Falls to one sixteenth","Falls to one half","Falls to one quarter"],"k":0},{"id":"2-10","q":"What mainly sets blood viscosity?","o":["Platelet count","Plasma albumin","Haematocrit"],"k":2},{"id":"2-11","q":"Polycythaemia vs severe anaemia: effect on viscosity and resistance?","o":["Polycythaemia: viscosity ↑ → resistance ↑<br>Anaemia: viscosity ↓ → resistance ↓","Polycythaemia: viscosity ↓ → resistance ↓<br>Anaemia: viscosity ↑ → resistance ↑","Polycythaemia: viscosity ↑ → resistance ↓<br>Anaemia: viscosity ↓ → resistance ↑"],"k":0,"more":"<p>A real mechanism for cardiovascular trouble, not a footnote.<\/p>"}]},{"t":"Arterioles and their receptors","qs":[{"id":"2-12","q":"How does the body control blood flow to a tissue?","o":["Almost entirely by changing cardiac output","Almost entirely by changing vessel diameter","Almost entirely by changing blood viscosity"],"k":1,"more":"<p>Because resistance varies with r<sup>4<\/sup>, a small change in diameter changes flow enormously.<\/p>"},{"id":"2-13","q":"Which vessels are the main resistance vessels?","o":["Capillaries: the thin exchange vessels between arterioles and venules","Large arteries: the elastic vessels leaving the heart","Arterioles: the small muscular vessels just before the capillaries"],"k":2,"more":"<p>A small squeeze there changes flow enormously.<\/p>","figs":["img/02_flow_1.png"]},{"id":"2-14","q":"What controls arteriolar diameter, and what decides whether it constricts or dilates?","o":["Sympathetic nervous system; the receptor type on the arteriole","Parasympathetic nervous system; the receptor type on the arteriole","Sympathetic nervous system; the frequency of firing alone"],"k":0},{"id":"2-15","q":"Alpha-1 receptors on arterioles: effect and location?","o":["Constriction<br>Skin, gut, kidney, spleen","Constriction<br>Skeletal muscle only","Dilatation<br>Skin, gut, kidney, spleen"],"k":0},{"id":"2-16","q":"Beta-2 receptors on arterioles: effect and location?","o":["Constriction<br>Skeletal muscle","Dilatation<br>Skeletal muscle","Dilatation<br>Skin and gut"],"k":1},{"id":"2-17","q":"What controls coronary arteriolar flow?","o":["Local metabolism (very little sympathetic control)","Parasympathetic vagal tone (very little metabolic control)","Sympathetic alpha-1 tone (very little metabolic control)"],"k":0},{"id":"2-18","q":"What does a surge of adrenaline do to blood distribution?","o":["Squeezes blood out of gut and skin → pushes it towards muscle","Dilates gut and skin equally with muscle → no redistribution","Squeezes blood out of muscle → pushes it towards gut and skin"],"k":0,"more":"<p>The fight-or-flight redistribution, written in receptor distribution: alpha-1 constricts gut and skin, beta-2 dilates muscle.<\/p>"}]},{"t":"Resistances in series","qs":[{"id":"2-19","q":"Which vessels are arranged in series, and how do their resistances combine?","o":["Artery → capillary → arteriole → venule → vein<br>R<sub>total<\/sub> = R<sub>1<\/sub> × R<sub>2<\/sub> × R<sub>3<\/sub> × R<sub>4<\/sub> × R<sub>5<\/sub>","Artery → arteriole → capillary → venule → vein<br>1/R<sub>total<\/sub> = 1/R<sub>1<\/sub> + 1/R<sub>2<\/sub> + … + 1/R<sub>5<\/sub>","Artery → arteriole → capillary → venule → vein<br>R<sub>total<\/sub> = R<sub>1<\/sub> + R<sub>2<\/sub> + R<sub>3<\/sub> + R<sub>4<\/sub> + R<sub>5<\/sub>"],"k":2,"figs":["img/02_flow_1.png","img/02_flow_2.webp"]},{"id":"2-20","q":"In vessels in series, how do flow and pressure behave from segment to segment?","o":["Flow: falls across each segment<br>Pressure: the same at every level","Flow: the same at every level<br>Pressure: falls across each segment","Flow: the same at every level<br>Pressure: the same at every level"],"k":1},{"id":"2-21","q":"Across which series segment does pressure fall most?","o":["The arterioles","The large arteries","The capillaries"],"k":0},{"id":"2-22","q":"How does total series resistance compare with any single resistance in the series?","o":["Equal to the average of them","Bigger than any single one","Smaller than any single one"],"k":1}]},{"t":"Resistances in parallel","qs":[{"id":"2-23","q":"Which vascular beds sit in parallel off the aorta?","o":["Artery, arteriole, capillary, venule, vein","Cerebral, coronary, renal, gastrointestinal, skeletal muscle, skin","Cerebral, coronary, pulmonary, renal, skin"],"k":1,"figs":["img/02_flow_2.webp"]},{"id":"2-24","q":"How do parallel resistances combine?","o":["R<sub>total<\/sub> = 1/R<sub>1<\/sub> + 1/R<sub>2<\/sub> + … + 1/R<sub>6<\/sub>","1/R<sub>total<\/sub> = R<sub>1<\/sub> + R<sub>2<\/sub> + … + R<sub>6<\/sub>","1/R<sub>total<\/sub> = 1/R<sub>1<\/sub> + 1/R<sub>2<\/sub> + … + 1/R<sub>6<\/sub>"],"k":2},{"id":"2-25","q":"Four parallel beds, each of resistance 10: what is R<sub>total<\/sub>?","o":["2.5 (1/R<sub>total<\/sub> = 4/10)","40 (R<sub>total<\/sub> = 4 × 10)","0.4 (1/R<sub>total<\/sub> = 10/4)"],"k":0},{"id":"2-26","q":"Four parallel beds of resistance 10 (R<sub>total<\/sub> 2.5): add a fifth, or block one of the four?","o":["Add a fifth → 3.3<br>Block one → 2","Add a fifth → 2.5<br>Block one → 2.5","Add a fifth → 2<br>Block one → 3.3"],"k":2},{"id":"2-27","q":"How does total parallel resistance compare with the smallest single branch?","o":["Equal to the smallest branch","Smaller than the smallest branch","Larger than the largest branch"],"k":1},{"id":"2-28","q":"Adding another parallel path does what to total resistance, and why?","o":["Always raises it: blood has to supply another bed","Always lowers it: blood has another way through","Leaves it unchanged: pressure is shared equally"],"k":1},{"id":"2-29","q":"Why does the parallel arrangement of the systemic circulation matter?","o":["Each organ gets the same driving pressure → controls its own flow independently via its arteriolar diameter","Each organ gets the same flow → controls its own pressure independently via its venous tone","Each organ's resistance adds to the next → one organ's constriction lowers flow everywhere"],"k":0},{"id":"2-30","q":"Lose a kidney: what happens to total peripheral resistance, and why?","o":["Goes down: a parallel channel was removed","Goes up: a parallel channel was removed","Stays the same: the other kidney compensates"],"k":1}]},{"t":"Velocity vs flow","qs":[{"id":"2-31","q":"How does velocity differ from flow?","o":["Velocity = volume per minute; flow = distance per minute","Velocity = distance per minute; flow = volume per minute","Velocity and flow are the same thing in different units"],"k":1},{"id":"2-32","q":"Formula for velocity of blood flow?","o":["v = Q / A","v = A / Q","v = Q × A"],"k":0,"more":"<p>A = total cross-sectional area.<\/p>"},{"id":"2-33","q":"Cardiac output 5,229 mL/min through an aorta 20 mm across (area 3.14 cm²): velocity?","o":["About 1,665 cm/min","About 16,420 cm/min","About 166 cm/min"],"k":0},{"id":"2-34","q":"Cardiac output 5,229 mL/min spread over the capillaries (about 2,500 cm²): velocity?","o":["About 20 cm/min","About 13 cm/min","About 2 cm/min"],"k":2},{"id":"2-35","q":"Where does blood move slowest, and why?","o":["Aorta: smallest total cross-sectional area","Capillaries: largest total cross-sectional area","Capillaries: highest resistance per vessel"],"k":1,"more":"<p>Flow through every segment in series is the same, so velocity is lowest where total area is greatest.<\/p>","hy":true},{"id":"2-36","q":"Why is slow capillary velocity useful?","o":["Prevents capillary rupture","Gives time for exchange","Keeps flow laminar to avoid clotting"],"k":1},{"id":"2-37","q":"Where is blood velocity fastest, and why?","o":["Capillaries: largest cross-sectional area","Aorta: smallest cross-sectional area","Arterioles: smallest single-vessel radius"],"k":1}]},{"t":"Laminar vs turbulent flow","qs":[{"id":"2-38","q":"What is laminar flow?","o":["Disordered eddies and swirls; noisy","Smooth concentric layers; quiet","Smooth concentric layers; noisy"],"k":1},{"id":"2-39","q":"What makes flow turbulent?","o":["Velocity too high, or a vessel narrows abruptly","Velocity too low, or a vessel widens gradually","Pressure too low, or a vessel is very long"],"k":0},{"id":"2-40","q":"What is a murmur or bruit?","o":["The sound of valves closing normally","The sound of turbulent (disordered) flow","The sound of the vessel wall stretching"],"k":1},{"id":"2-41","q":"Why can you hear Korotkoff sounds when taking blood pressure?","o":["The cuff fully occludes the artery → laminar flow → noise","The cuff partly occludes the artery → turbulent flow → noise","The cuff partly occludes the vein → venous pooling → noise"],"k":1},{"id":"2-42","q":"Write the Reynolds number.","o":["N<sub>R<\/sub> = ρdv / η","N<sub>R<\/sub> = ηdv / ρ","N<sub>R<\/sub> = ρη / dv"],"k":0,"more":"<p>ρ = blood density, d = vessel diameter, v = velocity, η = viscosity.<\/p>"},{"id":"2-43","q":"What does a high Reynolds number predict?","o":["Laminar flow","Turbulence","Low velocity"],"k":1},{"id":"2-44","q":"Name the four conditions that favour turbulent flow.","o":["High velocity<br>Large diameter<br>High density<br>High viscosity","High velocity<br>Large diameter<br>High density<br>Low viscosity","Low velocity<br>Small diameter<br>High density<br>Low viscosity"],"k":1},{"id":"2-45","q":"Name the two classic settings for flow murmurs.","o":["Anaemia<br>Narrowed valve or vessel","Polycythaemia<br>Narrowed valve or vessel","Anaemia<br>Dilated vessel with slow flow"],"k":0},{"id":"2-46","q":"How does anaemia produce a flow murmur?","o":["Lowers viscosity → turbulence (not by raising pressure)","Raises viscosity → turbulence (not by lowering pressure)","Lowers velocity → turbulence (not by lowering viscosity)"],"k":0,"hy":true},{"id":"2-47","q":"How does a narrowed valve or vessel produce a murmur?","o":["Velocity falls through the narrowing → turbulence","Velocity rises through the narrowing → turbulence","Viscosity rises through the narrowing → turbulence"],"k":1}]},{"t":"Velocity profile and shear","qs":[{"id":"2-48","q":"Shape of the velocity profile in laminar flow?","o":["Parabola: zero at the wall, fastest in the centre","Flat plug: same speed at the wall and in the centre","Parabola: fastest at the wall, zero in the centre"],"k":0,"figs":["img/02_flow_3.png"]},{"id":"2-49","q":"Why is velocity zero at the vessel wall in laminar flow?","o":["The outermost layer of blood clings to the wall and does not move","The wall's pressure is zero, so no driving force acts there","The central layer of blood drags the wall layer backward"],"k":0},{"id":"2-50","q":"What happens to the blood streams in turbulent flow, and what does it cost?","o":["Break into eddies that mix sideways as well as forward → lower resistance and silence","Line up into parallel layers that move only forward → saved energy and silence","Break into eddies that mix sideways as well as forward → wasted energy and noise"],"k":2,"figs":["img/02_flow_3.png"]},{"id":"2-51","q":"What is shear?","o":["Blood pressing outward on the vessel wall","Red cells clumping into stacks (rouleaux)","Layers of blood sliding past each other at different speeds"],"k":2},{"id":"2-52","q":"Where is shear highest and where lowest in a vessel?","o":["Highest at the wall; lowest in the centre","Highest in the centre; lowest at the wall","Highest halfway between the wall and centre"],"k":0,"more":"<p>At the wall, layers slide past the motionless outer layer; in the centre neighbouring layers move at nearly the same speed.<\/p>"},{"id":"2-53","q":"How does shear affect blood viscosity, and where is viscosity therefore lowest?","o":["Packs red cells together → raises viscosity → lowest in the centre","Breaks up red-cell clumps → lowers viscosity → lowest in the centre","Breaks up red-cell clumps → lowers viscosity → lowest near the wall"],"k":2}]}]},{"n":3,"key":"phys","t":"Compliance and the pressure profile","sub":"Lecture 19","cp2":false,"secs":[{"t":"What compliance is","qs":[{"id":"3-0","q":"What is compliance?","o":["How much pressure a vessel generates when it contracts","How much a vessel stretches when volume is put into it","How much a vessel resists flow through it"],"k":1,"more":"<p>Also called capacitance.<\/p>"},{"id":"3-1","q":"Formula for compliance?","o":["C = V / P","C = P / V","C = V × P"],"k":0,"more":"<p>Millilitres you can add per mmHg of pressure rise.<\/p>"},{"id":"3-2","q":"Compliant vessel vs stiff vessel: what happens when you add volume?","o":["Compliant: little volume, pressure jumps<br>Stiff: lots of volume, little pressure rise","Compliant: lots of volume, pressure jumps<br>Stiff: little volume, little pressure rise","Compliant: lots of volume, little pressure rise<br>Stiff: little volume, pressure jumps"],"k":2},{"id":"3-3","q":"How is compliance related to elasticity?","o":["Inverse: the floppier the wall, the lower the compliance","Direct: the stiffer and more elastic the wall, the higher the compliance","Inverse: the stiffer and more elastic the wall, the lower the compliance"],"k":2,"more":"<p>Elasticity is the stiffness that makes a wall resist stretch and spring back.<\/p>"}]},{"t":"Veins vs arteries","qs":[{"id":"3-4","q":"How much more compliant are veins than arteries?","o":["About 200×","About 2×","About 20×"],"k":2,"more":"<p>Veins take roughly twenty times more volume than arteries for the same pressure rise.<\/p>","figs":["img/03_compliance_1.png"]},{"id":"3-5","q":"Why can the veins hold most of the blood at very low pressure?","o":["They have thick muscular walls that hold pressure","They are highly compliant: they stretch easily","They are highly elastic: they resist stretch"],"k":1,"more":"<p><b>Picture it:<\/b> an artery is a bicycle inner tube (stiff, holds pressure); a vein is a plastic shopping bag (floppy, holds volume at almost no pressure).<\/p>","figs":["img/03_compliance_1.png"]},{"id":"3-6","q":"What happens to arterial compliance with age?","o":["Falls: arteries dilate and soften","Rises: arteries become floppier","Falls: arteries stiffen"],"k":2,"figs":["img/03_compliance_1.png"]}]},{"t":"Arterial compliance smooths flow","qs":[{"id":"3-7","q":"How does the aorta turn the heart's brief squirt into continuous flow at the tissues?","o":["Balloons in systole, storing some stroke volume → recoils in diastole and keeps pushing","Stays rigid throughout, passing each stroke volume straight on → valves smooth the flow","Balloons in diastole, storing venous return → recoils in systole and adds to ejection"],"k":0},{"id":"3-8","q":"Without arterial compliance, when would tissues get flow?","o":["Only during systole","Continuously, at a lower pressure","Only during diastole"],"k":0}]},{"t":"Systolic, diastolic, pulse pressure","qs":[{"id":"3-9","q":"What is systolic pressure?","o":["Lowest arterial pressure in a cardiac cycle, while the ventricle relaxes","Highest pressure in the left atrium, just before the mitral valve opens","Highest arterial pressure in a cardiac cycle, just after the ventricle ejects"],"k":2,"figs":["img/03_compliance_2.png"]},{"id":"3-10","q":"What is diastolic pressure?","o":["Average arterial pressure, weighted toward the time in diastole","Lowest ventricular pressure, while the ventricle fills from the atrium","Lowest arterial pressure, while the ventricle relaxes and ejects nothing"],"k":2,"figs":["img/03_compliance_2.png"]},{"id":"3-11","q":"Formula for pulse pressure?","o":["Systolic ÷ diastolic","Systolic − diastolic","Systolic + diastolic"],"k":1,"figs":["img/03_compliance_2.png"]},{"id":"3-12","q":"Other things equal, pulse pressure tracks what?","o":["Venous return pressure","Heart rate","Stroke volume"],"k":2},{"id":"3-13","q":"Pulse pressure changes whenever which two things change?","o":["Blood viscosity<br>Arterial compliance","Stroke volume<br>Venous compliance","Stroke volume<br>Arterial compliance"],"k":2}]},{"t":"Mean arterial pressure","qs":[{"id":"3-14","q":"Formula for mean arterial pressure (MAP)?","o":["MAP = diastolic + ⅔ pulse pressure","MAP = diastolic + ⅓ pulse pressure","MAP = systolic + ⅓ pulse pressure"],"k":1,"figs":["img/03_compliance_2.png"]},{"id":"3-15","q":"Why does MAP sit closer to diastolic than to systolic?","o":["About two thirds of each cycle is spent in systole","About two thirds of each cycle is spent in diastole","Diastolic pressure is measured more accurately"],"k":1},{"id":"3-16","q":"Blood pressure 124/82: pulse pressure and MAP?","o":["Pulse pressure 42<br>MAP 82 + 21 = 103 mmHg","Pulse pressure 42<br>MAP 82 + 14 = 96 mmHg","Pulse pressure 41<br>MAP 82 + 28 = 110 mmHg"],"k":1}]},{"t":"Stiff arteries and valve disease","qs":[{"id":"3-17","q":"Stiff aorta (age or arteriosclerosis): systolic, diastolic and pulse pressure?","o":["Systolic normal<br>Diastolic ↑<br>Pulse pressure narrow","Systolic ↑<br>Diastolic ↑<br>Pulse pressure unchanged","Systolic ↑<br>Diastolic normal or ↓<br>Pulse pressure wide"],"k":2,"figs":["img/03_compliance_3.webp"],"hy":true},{"id":"3-18","q":"Why does systolic pressure climb when the aorta stiffens?","o":["The aorta cannot absorb the ejected volume","The heart ejects a larger stroke volume","The aorta recoils more strongly in diastole"],"k":0},{"id":"3-19","q":"Why does diastolic pressure not rise (and often falls) when the aorta stiffens?","o":["Stroke volume falls, so less blood reaches the aorta","The aorta cannot recoil to maintain flow in diastole","The arterioles dilate and drop resistance in diastole"],"k":1},{"id":"3-20","q":"A widening pulse pressure in an older patient usually means what?","o":["A stronger heart, not arterial stiffness","Arterial stiffness, not a stronger heart","Aortic stenosis, not arterial stiffness"],"k":1,"hy":true},{"id":"3-21","q":"Arteriosclerosis: effect on systolic, pulse and mean arterial pressure?","o":["All fall","All rise","Only systolic rises"],"k":1,"more":"<p>Works through reduced compliance; plaque also narrows the arteries, adding resistance.<\/p>","figs":["img/03_compliance_3.webp"]},{"id":"3-22","q":"Through what does aortic stenosis change arterial pressure?","o":["Compliance: the narrowed valve stiffens the aorta","Resistance: the narrowed valve raises peripheral resistance","Stroke volume: the narrowed valve lets less blood out per beat"],"k":2},{"id":"3-23","q":"Aortic stenosis: effect on systolic, pulse and mean arterial pressure?","o":["Only pulse pressure falls","All fall","All rise"],"k":1,"figs":["img/03_compliance_3.webp"]},{"id":"3-24","q":"Aortic stenosis: effect on the pressure the ventricle must generate?","o":["↑ (higher preload) to fill through the narrowed valve","↑ (higher afterload) to eject through the narrowed valve","↓ (lower afterload) as the narrowed valve slows ejection"],"k":1},{"id":"3-25","q":"Aortic regurgitation: what happens to diastolic pressure, and why?","o":["Rises: the leaky valve lets ejected blood run back into the aorta","Unchanged: the leak only affects systolic pressure","Falls: the leaky valve lets ejected blood run back into the relaxed ventricle"],"k":2},{"id":"3-26","q":"Aortic regurgitation: what happens to stroke volume and systolic pressure, and why?","o":["Both rise: the ventricle re-ejects the regurgitated blood with the next beat","Stroke volume falls, systolic rises: the aorta stiffens to compensate","Stroke volume rises, systolic falls: blood leaks back before reaching the arteries"],"k":0},{"id":"3-27","q":"Aortic regurgitation: pulse pressure?","o":["Wide","Zero","Narrow"],"k":0}]},{"t":"The pressure profile","qs":[{"id":"3-28","q":"How does mean pressure behave through the big arteries?","o":["Rises steadily (about 120 mmHg at the arterioles)","Stays high (about 100 mmHg) and barely falls","Stays low (about 20 mmHg) and barely changes"],"k":1,"figs":["img/03_compliance_4.png"]},{"id":"3-29","q":"Where does mean pressure drop most steeply along the circulation?","o":["Across the capillaries","Across the large arteries","Across the arterioles"],"k":2,"more":"<p>By the capillaries pressure is low and smooth (about 20 mmHg); about 4 mmHg in the vena cava.<\/p>","figs":["img/03_compliance_4.png"]},{"id":"3-30","q":"What does a pressure profile along the vasculature tell you?","o":["Where the flow is fastest: the steep drop marks the exchange vessels","Where the compliance is: the steep drop marks the capacitance vessels","Where the resistance is: the steep drop marks the resistance vessels"],"k":2,"figs":["img/03_compliance_4.png"]}]},{"t":"Unstressed and stressed volume","qs":[{"id":"3-31","q":"What is unstressed volume?","o":["Volume sitting in a vessel before pressure starts to rise: held, not pushed","Volume above the point where pressure starts to rise: pushed, not held","Volume sitting in the arteries during diastole: pushed, not held"],"k":0,"hy":true},{"id":"3-32","q":"What is stressed volume, and why does it matter?","o":["Volume above the unstressed volume; only it generates the pressure that drives return to the heart","Volume above the unstressed volume; it generates no pressure and is simply held","Volume sitting in a vessel before pressure rises; it alone drives return to the heart"],"k":0,"hy":true},{"id":"3-33","q":"What does sympathetic venoconstriction do to venous blood volume?","o":["Converts unstressed volume → stressed volume (creates no blood)","Converts unstressed volume → stressed volume (adds new blood)","Converts stressed volume → unstressed volume (creates no blood)"],"k":0,"more":"<p>Squeezing the reservoir lets the same total volume generate more filling pressure: the body mobilises a transfusion from its own veins in seconds. Expect it as the answer to &lsquo;what raised venous return without adding volume&rsquo;.<\/p>","hy":true}]}]},{"n":4,"key":"phys","t":"The heart's electrics","sub":"Lectures 20–21","cp2":false,"secs":[{"t":"Conduction pathway","qs":[{"id":"4-0","q":"Why can the heart beat without any nerve telling it to?","o":["It contains cells that depolarise on their own; the fastest sets the rate","Circulating catecholamines trigger each beat; the adrenal medulla sets the rate","Its vagal tone sets a fixed rhythm that persists after denervation"],"k":0},{"id":"4-1","q":"Where does the cardiac impulse normally start?","o":["Sinoatrial (SA) node, in the right atrium","Bundle of His, in the interventricular septum","Sinoatrial (SA) node, in the left atrium"],"k":0,"figs":["img/04_electrics_1.png"]},{"id":"4-2","q":"What is the normal conduction pathway of the cardiac impulse?","o":["SA node → internodal tracts (atria) → atrioventricular (AV) node → Purkinje fibres → right and left bundle branches → bundle of His","SA node → internodal tracts (atria) → bundle of His → atrioventricular (AV) node → right and left bundle branches → Purkinje fibres","SA node → internodal tracts (atria) → atrioventricular (AV) node → bundle of His → right and left bundle branches → Purkinje fibres"],"k":2,"figs":["img/04_electrics_1.png"]},{"id":"4-3","q":"Which pathway carries the impulse from the right atrium to the left atrium?","o":["The posterior internodal tract","Thorel&rsquo;s tract","Bachmann&rsquo;s bundle"],"k":2,"figs":["img/04_electrics_1.png"]},{"id":"4-4","q":"Into which fascicles does the left bundle branch split?","o":["Superior<br>Inferior<br>Septal","Anterior<br>Lateral<br>Apical","Anterior<br>Posterior<br>Septal"],"k":2},{"id":"4-5","q":"What does the atrioventricular (AV) node deliberately do to the impulse?","o":["Slows it down (the AV delay)","Speeds it up (the AV boost)","Reverses its direction (the AV re-entry)"],"k":0},{"id":"4-6","q":"Why does the AV-node delay matter?","o":["Lets the ventricles finish relaxing before the atria contract","Lets the atria finish emptying into the ventricles before the ventricles contract","Protects the ventricles from all atrial rates above 100/min"],"k":1,"more":"<p>If atria and ventricles contracted together, the atria would squeeze against closed valves and achieve nothing. The AV delay is what makes the atrial kick useful.<\/p>"},{"id":"4-7","q":"Why do the Purkinje fibres conduct so fast?","o":["So the whole ventricle contracts almost at once, not in a ripple","So the AV node has time to repolarise before the next beat","So the ventricle contracts from base to apex in a slow ripple"],"k":0}]},{"t":"Conduction velocity","qs":[{"id":"4-8","q":"What is conduction velocity?","o":["The number of action potentials fired per minute","The speed at which the action potential travels","The time between the P wave and the QRS complex"],"k":1},{"id":"4-9","q":"Which cardiac tissue conducts fastest, and at what speed?","o":["Purkinje fibres: 2–4 m/s","Purkinje fibres: 0.3–1 m/s","Atrial muscle: 2–4 m/s"],"k":0,"hy":true},{"id":"4-10","q":"Which cardiac tissue conducts slowest, and at what speed?","o":["Bundle of His: 0.05–0.1 m/s","SA node: 0.01–0.03 m/s","AV node: 0.01–0.03 m/s"],"k":2,"hy":true},{"id":"4-11","q":"Rank cardiac conduction velocity, fastest to slowest.","o":["Atrial and ventricular muscle → Purkinje fibres → AV node","Purkinje fibres → atrial and ventricular muscle → AV node","Purkinje fibres → AV node → atrial and ventricular muscle"],"k":1,"more":"<p>Both extremes are deliberate: the slow node buys the atrial kick; the fast Purkinje network makes the ventricle contract as one unit.<\/p>","hy":true},{"id":"4-12","q":"What two things determine cardiac conduction velocity?","o":["Size of the outward potassium current during repolarisation<br>Thickness of the ventricular wall","Duration of the plateau phase<br>Number of sympathetic fibres reaching the tissue","Size of the inward current during the upstroke<br>Cable properties (membrane and internal resistance)"],"k":2},{"id":"4-13","q":"Why does a bigger inward current speed conduction?","o":["Steeper upstroke (larger dV/dt) → next patch of membrane reaches threshold sooner","Longer plateau → membrane stays refractory for less time","Shallower upstroke (smaller dV/dt) → less current leaks across the membrane"],"k":0},{"id":"4-14","q":"Does high or low membrane resistance favour conduction, and why?","o":["High: speeds sodium flow through the gap junctions","Low: lowers the threshold of the next patch","High: keeps current from leaking out"],"k":2,"more":"<p>Like the wall of a tunnel.<\/p>"},{"id":"4-15","q":"Does high or low internal resistance favour conduction, and why?","o":["Low: lets current leak out through the membrane","High: stops current leaking out of the fibre","Low: lets current flow along the fibre"],"k":2,"more":"<p>Like a road with no traffic.<\/p>"},{"id":"4-16","q":"What keeps internal resistance low between cardiac cells?","o":["Gap junctions","Desmosomes","Tight junctions"],"k":0},{"id":"4-17","q":"Name the conditions in which cardiac conduction is abnormally fast.","o":["Atrial fibrillation and flutter<br>Supraventricular tachycardia<br>Wolff-Parkinson-White syndrome","First-degree AV block<br>Supraventricular tachycardia<br>Wolff-Parkinson-White syndrome","Atrial fibrillation and flutter<br>Complete heart block<br>Wolff-Parkinson-White syndrome"],"k":0},{"id":"4-18","q":"What is the defect in Wolff-Parkinson-White syndrome?","o":["Extra pathway lets the impulse reach the ventricles without the AV-node delay","Extra pathway lets the impulse travel from ventricles back to the SA node only","Damaged AV node lengthens the delay before the impulse reaches the ventricles"],"k":0,"more":"<p>It is a pre-excitation syndrome.<\/p>"}]},{"t":"Pacemaker cells","qs":[{"id":"4-19","q":"What are the two kinds of electrical cell in the heart?","o":["Fast-response cells (SA and AV node)<br>Slow-response cells (atrial and ventricular)","Pacemaker cells (atrial and ventricular)<br>Working muscle cells (SA and AV node)","Pacemaker cells (SA and AV node)<br>Working muscle cells (atrial and ventricular)"],"k":2,"figs":["img/04_electrics_2.png"]},{"id":"4-20","q":"What makes pacemaker cells automatic?","o":["No stable resting potential: they leak slowly up to threshold, fire, and repeat","A long plateau: calcium keeps them depolarised and firing continuously","A very negative stable resting potential: they fire whenever the vagus releases them"],"k":0,"more":"<p>Changing the slope of that leak changes heart rate.<\/p>","figs":["img/04_electrics_2.png"]},{"id":"4-21","q":"In the SA node, phase 4 drifts from what voltage up to what threshold?","o":["About −45 mV → threshold about −65 mV","About −90 mV → threshold about −70 mV","About −65 mV → threshold about −45 mV"],"k":2,"figs":["img/04_electrics_2.png"]},{"id":"4-22","q":"What actually sets heart rate at the SA node?","o":["How long the cell takes to get from −65 to −45 mV (phase 4)","How long the plateau lasts at about 0 mV (phase 2)","How long the cell takes to repolarise from +10 to −65 mV (phase 3)"],"k":0,"more":"<p>Phase 4 <i>is<\/i> heart rate.<\/p>"},{"id":"4-23","q":"What current drives SA-node phase 4?","o":["Funny current, I<sub>f<\/sub>: an outward potassium current","Funny current, I<sub>f<\/sub>: an inward sodium current","L-type calcium current: an inward calcium current"],"k":1},{"id":"4-24","q":"When does the funny current (I<sub>f<\/sub>) switch on and off?","o":["On at the peak of the upstroke; off when the cell reaches −65 mV","On as the previous beat repolarises; off as the cell nears −45 mV","On as the cell nears −45 mV; off as the previous beat repolarises"],"k":1},{"id":"4-25","q":"What adds to the funny current late in SA-node phase 4?","o":["T-type calcium channels","Fast voltage-gated sodium channels","L-type calcium channels"],"k":0},{"id":"4-26","q":"What carries the SA-node upstroke (phase 0)?","o":["T-type calcium channels (calcium, not sodium)","Funny channels (sodium, not calcium)","L-type calcium channels (calcium, not sodium)"],"k":2,"hy":true},{"id":"4-27","q":"Why is the nodal upstroke slow, and why does the node conduct slowly?","o":["It has very few potassium channels to repolarise it","Its upstroke is carried by sodium, not calcium","Its upstroke is carried by calcium, not sodium"],"k":2,"hy":true},{"id":"4-28","q":"What repolarises the SA node (phase 3)?","o":["Potassium current (I<sub>K<\/sub>): potassium out","Chloride current (I<sub>Cl<\/sub>): chloride in","Calcium current (I<sub>Ca<\/sub>): calcium out"],"k":0,"hy":true},{"id":"4-29","q":"Which phases does a pacemaker-cell action potential have?","o":["All five, 0 to 4 (with a short plateau and a stable rest)","Only 0, 1 and 2 (no phase 3 or 4, no repolarisation, no drift)","Only 4, 0 and 3 (no phase 1 or 2, no plateau, no stable rest)"],"k":2,"more":"<table><tr><th>4<\/th><td>Slow drift up: sodium-carrying inward current<\/td><\/tr><tr><th>0<\/th><td>Upstroke: calcium<\/td><\/tr><tr><th>3<\/th><td>Repolarisation: potassium out<\/td><\/tr><\/table>","figs":["img/04_electrics_2.png"],"hy":true}]},{"t":"Autonomic control of rate","qs":[{"id":"4-30","q":"How does sympathetic stimulation raise heart rate at the SA node?","o":["Hyperpolarises the cell → threshold sooner → rate rises","Steepens phase 4 → threshold sooner → rate rises","Flattens phase 4 → threshold later → rate rises"],"k":1,"figs":["img/04_electrics_3.png"]},{"id":"4-31","q":"How does vagal stimulation lower heart rate at the SA node?","o":["Shortens the plateau → refractory period shorter → rate falls","Flattens phase 4 → threshold later → rate falls","Steepens phase 4 → threshold sooner → rate falls"],"k":1,"figs":["img/04_electrics_3.png"]},{"id":"4-32","q":"Besides flattening phase 4, how else does acetylcholine slow the SA node?","o":["Raises G<sub>K<\/sub> → potassium leaves → SA node hyperpolarises → each cycle starts further from threshold","Lowers G<sub>K<\/sub> → potassium stays in → SA node depolarises → each cycle starts closer to threshold","Raises G<sub>Na<\/sub> → sodium enters → SA node depolarises → threshold reached later"],"k":0,"more":"<p>Through its G protein, acetylcholine opens a special set of potassium channels.<\/p>","figs":["img/04_electrics_3.png"]},{"id":"4-33","q":"What is the heart&rsquo;s sympathetic receptor?","o":["Alpha-1 (norepinephrine, epinephrine)","Beta-1 (norepinephrine, epinephrine)","Beta-2 (norepinephrine, epinephrine)"],"k":1},{"id":"4-34","q":"What is the heart&rsquo;s parasympathetic receptor?","o":["Muscarinic M2 (acetylcholine)","Muscarinic M1 (acetylcholine)","Muscarinic M3 (acetylcholine)"],"k":0},{"id":"4-35","q":"What does beta-1 stimulation do inside the cardiac cell?","o":["Stimulates guanylyl cyclase → cyclic GMP (cGMP) up","Inhibits adenylyl cyclase → cyclic AMP (cAMP) down","Stimulates adenylyl cyclase → cyclic AMP (cAMP) up"],"k":2},{"id":"4-36","q":"What does M2 stimulation do inside the cardiac cell?","o":["Inhibits phosphodiesterase → cAMP up","Stimulates adenylyl cyclase → cAMP up","Inhibits adenylyl cyclase → cAMP down"],"k":2},{"id":"4-37","q":"How do sympathetic and parasympathetic stimulation change the funny current?","o":["Sympathetic: less I<sub>f<\/sub>, slower leak<br>Parasympathetic: more I<sub>f<\/sub>, faster leak","Sympathetic: more I<sub>f<\/sub>, faster leak<br>Parasympathetic: less I<sub>f<\/sub>, slower leak","Sympathetic: more I<sub>f<\/sub>, faster leak<br>Parasympathetic: no change in I<sub>f<\/sub>"],"k":1},{"id":"4-38","q":"What do chronotropic, dromotropic and inotropic refer to?","o":["Chronotropic: heart rate<br>Dromotropic: contractility<br>Inotropic: AV conduction","Chronotropic: heart rate<br>Dromotropic: AV conduction<br>Inotropic: contractility","Chronotropic: contractility<br>Dromotropic: heart rate<br>Inotropic: AV conduction"],"k":1},{"id":"4-39","q":"What are the sympathetic effects on heart rate, AV conduction and contractility?","o":["Heart rate up<br>AV conduction faster<br>Contractility up","Heart rate up<br>AV conduction slower<br>Contractility up","Heart rate up<br>AV conduction unchanged<br>Contractility down"],"k":0,"more":"<table><tr><th><\/th><th>Sympathetic<\/th><th>Parasympathetic<\/th><\/tr><tr><th>Receptor<\/th><td>Beta-1<\/td><td>M2<\/td><\/tr><tr><th>cAMP<\/th><td>Up<\/td><td>Down<\/td><\/tr><tr><th>I<sub>f<\/sub><\/th><td>More<\/td><td>Less<\/td><\/tr><tr><th>Rate<\/th><td>Up<\/td><td>Down<\/td><\/tr><tr><th>AV conduction<\/th><td>Faster<\/td><td>Slower<\/td><\/tr><tr><th>Contractility<\/th><td>Up<\/td><td>Down, atria only<\/td><\/tr><\/table>"},{"id":"4-40","q":"What are the parasympathetic effects on heart rate, AV conduction and contractility?","o":["Heart rate down<br>AV conduction slower<br>Contractility down, atria only","Heart rate down<br>AV conduction slower<br>Contractility down, ventricles only","Heart rate down<br>AV conduction slower<br>Contractility up, atria only"],"k":0},{"id":"4-41","q":"How do AV-nodal cells respond to sympathetic and vagal stimulation?","o":["Only to vagal stimulation: sympathetic fibres reach the ventricles only","Like the SA node: sympathetic speeds their action potentials, vagal slows them","Opposite to the SA node: sympathetic slows their action potentials, vagal speeds them"],"k":1},{"id":"4-42","q":"How does the speed of AV conduction show on the electrocardiogram (EKG)?","o":["Faster conduction → narrower QRS complex<br>Slower conduction → wider QRS complex","Faster conduction → longer PR interval<br>Slower conduction → shorter PR interval","Faster conduction → shorter PR interval<br>Slower conduction → longer PR interval"],"k":2},{"id":"4-43","q":"Do alpha receptors act on the heart?","o":["No: the heart&rsquo;s sympathetic receptor is beta-1","Yes: alpha-1 is the heart&rsquo;s main sympathetic receptor","No: the heart&rsquo;s sympathetic receptor is beta-2"],"k":0},{"id":"4-44","q":"Where does alpha-1 act, and what does it do?","o":["On vessels: dilates those of skeletal muscle and coronaries","On vessels: constricts those of skin, kidney, spleen and gut","On vessels: constricts only those of skeletal muscle"],"k":1},{"id":"4-45","q":"How does parasympathetic stimulation affect the vessels of skin, kidney, spleen and gut?","o":["Dilates them through muscarinic (M2) receptors","Constricts them through alpha-1 receptors","Constricts them through muscarinic (M2) receptors"],"k":0,"more":"<p>Textbooks place this receptor on the endothelium as M3, which relaxes the vessel by releasing nitric oxide.<\/p>"},{"id":"4-46","q":"How does propranolol change the SA-node action potential?","o":["Beta-blocker: steepens phase 4 → rate rises","Beta-blocker: flattens phase 4 → rate falls","Calcium blocker: removes phase 0 → rate falls"],"k":1,"hy":true},{"id":"4-47","q":"How does atropine change the SA-node action potential?","o":["Muscarinic blocker: adds to the vagal brake → slows (lengthens) phase 4","Nicotinic blocker: removes ganglionic input → flattens phase 4","Muscarinic blocker: removes the vagal brake → speeds up (shortens) phase 4"],"k":2,"hy":true},{"id":"4-48","q":"Which patient is atropine used to treat?","o":["Light-headed, hypotensive patient with sinus bradycardia","Patient with atrial fibrillation and a fast ventricular rate","Hypertensive patient with sinus tachycardia and palpitations"],"k":0,"hy":true},{"id":"4-49","q":"Why can myasthenia gravis treatment (a cholinesterase inhibitor) cause bradycardia?","o":["Less acetylcholine on the heart → G<sub>K<\/sub> down → SA node depolarises → bradycardia","More acetylcholine on the heart → G<sub>Na<\/sub> up → SA node depolarises → bradycardia","More acetylcholine on the heart → G<sub>K<\/sub> up → SA node hyperpolarises → bradycardia"],"k":2,"hy":true}]},{"t":"Working-cell action potential","qs":[{"id":"4-50","q":"What is the resting potential of a working (atrial or ventricular) muscle cell?","o":["Stable, about +60 to +65 mV (near the sodium equilibrium potential)","Stable, about −60 to −65 mV (near the chloride equilibrium potential)","Stable, about −85 to −90 mV (near the potassium equilibrium potential)"],"k":2,"figs":["img/04_electrics_2.png"]},{"id":"4-51","q":"Why does a working muscle cell rest near the potassium equilibrium potential?","o":["Its resting potassium channels are all closed, so potassium is trapped inside the cell","Its resting sodium channels are ungated (always open), so sodium dominates the resting membrane","Its resting potassium channels are ungated (always open), so potassium dominates the resting membrane"],"k":2,"more":"<p>Potassium&rsquo;s Nernst balance of concentration against charge sets the value.<\/p>"},{"id":"4-52","q":"Which cells have the five-phase (fast) action potential?","o":["Atrial, ventricular and SA-node cells","SA node, AV node and Purkinje cells","Atrial, ventricular and Purkinje cells"],"k":2,"hy":true},{"id":"4-53","q":"Phase 0 of the working-cell action potential: what happens and which current?","o":["Upstroke: fast sodium in (I<sub>Na<\/sub>)","Brief dip: potassium out (I<sub>to<\/sub>)","Upstroke: funny sodium in (I<sub>f<\/sub>)"],"k":0,"figs":["img/04_electrics_2.png"],"hy":true},{"id":"4-54","q":"How high does the working-cell upstroke peak?","o":["About +65 mV","About +20 mV","About −45 mV"],"k":1},{"id":"4-55","q":"Why does the working-cell upstroke stop well short of the sodium equilibrium potential (+65 mV)?","o":["Potassium activation gates close","Calcium channels open and take over","Sodium inactivation gates close"],"k":2},{"id":"4-56","q":"When is the working-cell upstroke steepest, and why?","o":["From a more negative resting potential: more calcium channels are ready to open","From a less negative resting potential: the cell is already closer to threshold","From a more negative resting potential: more sodium channels are ready to open"],"k":2},{"id":"4-57","q":"Phase 1 of the working-cell action potential: what happens?","o":["Brief dip: sodium channels reopen; a little calcium in","Brief dip: sodium channels inactivate; a little potassium out","Brief dip: chloride channels open; calcium out"],"k":1,"figs":["img/04_electrics_2.png"],"hy":true},{"id":"4-58","q":"Phase 2 of the working-cell action potential: what happens and which current?","o":["Plateau: potassium out through inward rectifiers (I<sub>K1<\/sub>), balanced by sodium in","Plateau: calcium in through T-type channels (I<sub>Ca-T<\/sub>), balanced by chloride in","Plateau: calcium in through L-type channels (I<sub>Ca-L<\/sub>), balanced by potassium out"],"k":2,"more":"<p>L-type = &ldquo;long-lasting&rdquo; calcium channel.<\/p>","figs":["img/04_electrics_2.png"],"hy":true},{"id":"4-59","q":"What does the calcium entering during the phase 2 plateau do?","o":["Triggers relaxation","Triggers contraction","Triggers repolarisation"],"k":1,"hy":true},{"id":"4-60","q":"Which calcium channel blockers block the plateau current (I<sub>Ca-L<\/sub>)?","o":["Lidocaine<br>Flecainide","Nifedipine<br>Diltiazem","Propranolol<br>Metoprolol"],"k":1},{"id":"4-61","q":"Phase 3 of the working-cell action potential: what happens and which currents?","o":["Repolarisation: sodium channels shut, chloride in wins (I<sub>Cl<\/sub>, with I<sub>to<\/sub>)","Repolarisation: calcium channels shut, potassium out wins (I<sub>Ks<\/sub>, I<sub>Kr<\/sub>, with I<sub>K1<\/sub>)","Repolarisation: calcium channels open, potassium in wins (I<sub>K1<\/sub>, with I<sub>f<\/sub>)"],"k":1,"more":"<p>I<sub>Ks<\/sub> and I<sub>Kr<\/sub> are the slow and rapid delayed-rectifier potassium currents.<\/p>","figs":["img/04_electrics_2.png"],"hy":true},{"id":"4-62","q":"Phase 4 of the working-cell action potential: what happens and which current?","o":["Stable rest near the potassium equilibrium potential; I<sub>K1<\/sub> (inward rectifier)","Stable rest near the calcium equilibrium potential; I<sub>Ca-L<\/sub> (L-type)","Stable rest near the sodium equilibrium potential; I<sub>Na<\/sub> (fast sodium)"],"k":0,"figs":["img/04_electrics_2.png"],"hy":true},{"id":"4-63","q":"Which ion carries the upstroke in working cells versus nodal cells?","o":["Working cells: calcium<br>Nodal cells: sodium","Working cells: sodium<br>Nodal cells: calcium","Working cells: sodium<br>Nodal cells: sodium"],"k":1,"more":"<p>One-line version: fast cells upstroke on sodium and plateau on calcium. Nodal cells upstroke on calcium and have no plateau at all.<\/p>","hy":true},{"id":"4-64","q":"How long do cardiac action potentials last, compared with nerve and skeletal muscle?","o":["15 ms (SA node) to 30 ms (Purkinje fibres), versus 1–2 ms","150 ms (Purkinje fibres) to 300 ms (SA node), versus 10–20 ms","150 ms (SA node) to 300 ms (Purkinje fibres), versus 1–2 ms"],"k":2},{"id":"4-65","q":"What does the long plateau protect the heart against, and why?","o":["Fibrillation: the cell fires faster than the SA node can follow","Hyperkalaemia: the plateau pumps potassium back into the cell","Tetany: the cell cannot be re-stimulated until it has relaxed"],"k":2,"more":"<p>The plateau keeps the cell depolarised and refractory for a long time. A heart that could tetanise would stop pumping.<\/p>"},{"id":"4-66","q":"Besides preventing tetany, what two things does the plateau buy time for?","o":["Atria to relax<br>SA node to repolarise","Ventricle to empty<br>Wave to reach every cell","Coronaries to perfuse<br>Calcium to be pumped out"],"k":1}]},{"t":"Refractory periods","qs":[{"id":"4-67","q":"What is excitability?","o":["The membrane potential at which the cell fires (how negative the threshold is)","The speed at which the action potential travels along the fibre","The current needed to reach threshold (how easily the sodium activation gates open)"],"k":2},{"id":"4-68","q":"Why is a depolarised cardiac cell refractory?","o":["Depolarisation empties the sarcoplasmic reticulum; until refilled, the cell is refractory","Depolarisation closes the slower sodium inactivation gates; while closed, the cell is refractory","Depolarisation closes the fast sodium activation gates; while closed, the cell is refractory"],"k":1},{"id":"4-69","q":"What does the absolute refractory period (ARP) span, and when does it end?","o":["Upstroke, plateau and all of repolarisation; ends at about −90 mV","Upstroke, plateau and most of repolarisation; ends below about −50 mV","Plateau and phase 4; ends when the cell reaches threshold"],"k":1,"figs":["img/04_electrics_4.webp"],"hy":true},{"id":"4-70","q":"Why can no stimulus of any size fire the cell during the absolute refractory period?","o":["Sodium channels are inactivated and must be reset by repolarisation","Sodium channels are activated and cannot open any further","Calcium channels are inactivated and must be reset by depolarisation"],"k":0,"hy":true},{"id":"4-71","q":"What is the effective refractory period (ERP)?","o":["A little shorter than the ARP: a stronger stimulus can produce an action potential","A little longer than the ARP: no action potential that can <i>propagate<\/i> can be produced","The period after the ARP when a supranormal stimulus can <i>propagate<\/i> an action potential"],"k":1,"figs":["img/04_electrics_4.webp"],"hy":true},{"id":"4-72","q":"What can fire the cell during the relative refractory period, and why?","o":["A stronger-than-normal stimulus: some sodium channels have recovered","No stimulus at all: the sodium channels are still inactivated","A stronger-than-normal stimulus: calcium channels have taken over the upstroke"],"k":0,"more":"<p>The result is a smaller, slower action potential.<\/p>","figs":["img/04_electrics_4.webp"],"hy":true},{"id":"4-73","q":"What sets the length of the cardiac refractory period?","o":["The upstroke","The plateau","The phase 4 slope"],"k":1,"more":"<p>Anything that lengthens the plateau lengthens refractoriness and protects against re-entry.<\/p>","hy":true}]},{"t":"Latent pacemakers","qs":[{"id":"4-74","q":"What are latent pacemakers?","o":["Upstream nodal cells that fire only when stimulated by the sympathetic system","Downstream conduction structures that can fire on their own, slower the further down","Downstream conduction structures that can fire on their own, faster the further down"],"k":1,"more":"<p>They are why a heart with a dead SA node still beats, just inadequately.<\/p>"},{"id":"4-75","q":"Why does the SA node normally set the heart rate?","o":["It fires slowest","It fires fastest","It conducts fastest"],"k":1},{"id":"4-76","q":"What takes over if the SA node fails?","o":["Purkinje fibres (faster) → then the AV node (slower still)","Atrial muscle (slower) → then the AV node (slower still)","AV node (slower) → then the ventricle itself (slower still)"],"k":2},{"id":"4-77","q":"What is the intrinsic rate of the SA node?","o":["100–140 per minute","40–60 per minute","60–100 per minute"],"k":2,"more":"<p>SA node 60–100 → AV node 40–60 → bundle of His ~40 → Purkinje 20–30. Exact numbers vary; the order never changes.<\/p>"},{"id":"4-78","q":"What is the intrinsic rate
