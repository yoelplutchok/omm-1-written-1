e attachments of serratus posterior superior?","o":["Transverse processes C7–T3 → ribs 1–3","Nuchal ligament + spines C7–T3 → ribs 2–4","Nuchal ligament + spines C7–T3 → ribs 6–9"],"k":1,"more":"<p>Action: proprioception (elevates ribs).<\/p>","figs":["img/p/g22b_gil_serratus_post.webp","img/p/g22b_wall_muscle_table.webp"]},{"id":"22-101","q":"What nerves supply serratus posterior superior?","o":["Anterior rami T9–T12","Intercostal nerves 2–5","Dorsal scapular nerve"],"k":1,"figs":["img/p/g22b_wall_muscle_table.webp"]},{"id":"22-102","q":"What are the attachments of serratus posterior inferior?","o":["Spines T6–T10 → ribs 4–8","Spines T11–L2 → iliac crest","Spines T11–L2 → ribs 8–12"],"k":2,"more":"<p>Action: proprioception (depresses ribs).<\/p>","figs":["img/p/g22b_gil_serratus_post.webp","img/p/g22b_wall_muscle_table.webp"]},{"id":"22-103","q":"What nerves supply serratus posterior inferior?","o":["Anterior rami T9–T12","Anterior rami L1–L3","Posterior rami T9–T12"],"k":0,"figs":["img/p/g22b_wall_muscle_table.webp"]},{"id":"22-104","q":"What are the attachments and action of levatores costarum?","o":["Transverse processes → rib below → elevate ribs","Transverse processes → rib above → depress ribs","Spinous processes → rib below → elevate ribs"],"k":0,"figs":["img/p/g22b_gil_levatores.webp","img/p/g22b_wall_muscle_table.webp"]},{"id":"22-105","q":"What nerves supply levatores costarum?","o":["Posterior rami C8–T11","Intercostal nerves 2–5","Anterior rami C8–T11"],"k":0,"figs":["img/p/g22b_wall_muscle_table.webp"]},{"id":"22-106","q":"What are the attachments of the intercostal muscles?","o":["Lower border of a rib → upper border of the rib two below","Lower border of a rib → upper border of the rib below","Upper border of a rib → lower border of the rib above"],"k":1,"figs":["img/p/g22b_wall_muscle_table.webp","img/p/g22b_grays_van.webp"]},{"id":"22-107","q":"What is the action of the external intercostals?","o":["Elevate the ribs (expiration)","Elevate the ribs (inspiration)","Depress the ribs (expiration)"],"k":1,"figs":["img/p/g22b_wall_muscle_table.webp"]},{"id":"22-108","q":"What is the action of the internal and innermost intercostals?","o":["Elevate the ribs → but the part between the cartilages depresses them","Depress the ribs → but the part between the cartilages elevates them","Depress the ribs → throughout, including between the cartilages"],"k":1,"figs":["img/p/g22b_wall_muscle_table.webp"]},{"id":"22-109","q":"What are the attachments of the subcostal muscles?","o":["Inner surface of lower ribs near the angles → 2nd or 3rd rib below","Outer surface of upper ribs near the tubercles → the rib immediately below","Inner surface of lower ribs near the sternum → 2nd or 3rd rib above"],"k":0,"more":"<p>Best developed low in the thorax; they run like the internal intercostals and probably act like them.<\/p>","figs":["img/p/g22b_grays_subcostal.webp"]},{"id":"22-110","q":"What are the attachments and action of transversus thoracis?","o":["Front of upper sternum → costal cartilages 2–6 → strongly elevates ribs","Back of lower sternum → costal cartilages 2–6 → weakly depresses ribs","Inner surface of lower ribs → 2nd or 3rd rib below → weakly depresses ribs"],"k":1,"more":"<p>Continuous below with transversus abdominis; the internal thoracic vessels lie just in front of it.<\/p>","figs":["img/p/g22b_transversus_slide.webp","img/22_cage_4.webp"]},{"id":"22-111","q":"What nerves supply the intercostals, subcostals and transversus thoracis?","o":["Phrenic nerves","Thoracic sympathetic chain","Intercostal nerves"],"k":2,"more":"<table><tr><th>Muscle<\/th><th>From → to<\/th><th>Nerve<\/th><th>Action<\/th><\/tr><tr><td>Serratus posterior superior<\/td><td>Nuchal ligament, C7–T3 → ribs 2–4<\/td><td>Intercostal 2–5<\/td><td>Proprioception (elevates)<\/td><\/tr><tr><td>Serratus posterior inferior<\/td><td>T11–L2 → ribs 8–12<\/td><td>Anterior rami T9–T12<\/td><td>Proprioception (depresses)<\/td><\/tr><tr><td>Levatores costarum<\/td><td>Transverse processes → rib below<\/td><td>Posterior rami C8–T11<\/td><td>Elevate<\/td><\/tr><tr><td>Intercostals<\/td><td>Rib → rib below<\/td><td>Intercostal<\/td><td>External elevate; internal/innermost depress<\/td><\/tr><tr><td>Subcostals<\/td><td>Lower ribs → 2nd/3rd rib below<\/td><td>Intercostal<\/td><td>As internals<\/td><\/tr><tr><td>Transversus thoracis<\/td><td>Lower sternum → cartilages 2–6<\/td><td>Intercostal<\/td><td>Weakly depresses<\/td><\/tr><\/table>","figs":["img/p/g22b_wall_muscle_table.webp"]}]},{"t":"Intercostal neurovascular bundle","qs":[{"id":"22-112","q":"Where does the intercostal neurovascular bundle run?","o":["In the costal groove on the inferior border of each rib, between the external and internal intercostals","In the costal groove on the inferior border of each rib, between the internal and innermost intercostals","In the costal groove on the superior border of each rib, between the external and internal intercostals"],"k":1,"figs":["img/22_cage_2.jpg","img/p/g22b_gil_ic_coronal.webp"]},{"id":"22-113","q":"What is the order of structures in the intercostal neurovascular bundle, top to bottom?","o":["Vein → artery → nerve","Nerve → artery → vein","Artery → vein → nerve"],"k":0,"more":"<p>Tucked up under the lower border of the rib in the costal groove.<\/p>","figs":["img/22_cage_2.jpg","img/p/g22b_grays_van.webp"],"hy":true},{"id":"22-114","q":"Which intercostal structure is most often injured, and why?","o":["The vein → it is the highest and most exposed of the three","The nerve → it is the lowest and least protected of the three","The nerve → it is the highest and most tightly packed of the three"],"k":1,"more":"<p>This is also why pain follows the intercostal distribution.<\/p>","figs":["img/p/g22b_grays_van.webp"],"hy":true},{"id":"22-115","q":"Where do the collateral branches of the intercostal bundle run?","o":["Along the upper border of the rib below, between the external and internal layers","Along the middle of the space, between the external and internal layers","Along the upper border of the rib below, between the internal and innermost layers"],"k":2,"figs":["img/22_cage_2.jpg","img/p/g22b_grays_van.webp"]},{"id":"22-116","q":"What is the order of structures in the collateral branches, top to bottom?","o":["Nerve → artery → vein (reverse of the main bundle)","Nerve → vein → artery (reverse of the main bundle)","Artery → nerve → vein (reverse of the main bundle)"],"k":0,"figs":["img/22_cage_2.jpg","img/p/g22b_grays_van.webp"]},{"id":"22-117","q":"Where in the intercostal space is a needle or chest drain inserted?","o":["Just below the rib above (upper part of the space)","Just above the rib below (lower part of the space)","Directly through the middle of the rib"],"k":1,"figs":["img/p/g22b_gil_chest_tube.webp"],"hy":true},{"id":"22-118","q":"Why is a chest needle placed just above the rib below, but not right on it?","o":["Avoids the collateral branches under the rib above → yet clears the main bundle on the rib below","Avoids the main bundle under the rib above → yet clears the collateral branches on the rib below","Avoids the main bundle above the rib below → yet clears the collateral branches under the rib above"],"k":1,"figs":["img/p/g22b_gil_chest_tube.webp","img/p/g22b_grays_van.webp"]},{"id":"22-119","q":"How many intercostal spaces are there, and how are they numbered?","o":["12 → each numbered for the rib above","11 → each numbered for the rib above","11 → each numbered for the rib below"],"k":1,"more":"<p>The 4th space lies between ribs 4 and 5. These numbers are how you name where to put a stethoscope or a needle.<\/p>","figs":["img/22_cage_3.jpg"]},{"id":"22-120","q":"What is the space below the 12th rib called?","o":["Subcostal space","Lumbar space","Infracostal space"],"k":0}]},{"t":"Intercostal nerves and dermatomes","qs":[{"id":"22-121","q":"What are the intercostal nerves?","o":["Anterior rami of thoracic spinal nerves T1–T12","Anterior rami of thoracic spinal nerves T1–T11","Anterior rami of thoracic spinal nerves T2–T12"],"k":1,"figs":["img/22_cage_4.webp","img/p/g22b_gil_spinal_branches.webp"]},{"id":"22-122","q":"What is the anterior ramus of T12 called?","o":["Ilioinguinal nerve","Subcostal nerve","Iliohypogastric nerve"],"k":1,"figs":["img/p/g22b_gil_ic_nerves.webp"]},{"id":"22-123","q":"What do the posterior rami of the thoracic spinal nerves supply?","o":["Intercostal muscles and the skin over them","Deep back muscles and the skin over them","Serratus anterior and the skin over it"],"k":1,"figs":["img/22_cage_4.webp","img/p/g22b_gil_spinal_branches.webp"]},{"id":"22-124","q":"Which intercostal nerves are typical?","o":["T2–T5","T3–T6","T1–T6"],"k":1,"figs":["img/p/g22b_gil_ic_nerves.webp"]},{"id":"22-125","q":"Between which muscle layers does a typical intercostal nerve run?","o":["External and internal intercostals","External intercostals and the skin","Internal and innermost intercostals"],"k":2,"figs":["img/22_cage_4.webp","img/p/g22b_gil_ic_coronal.webp"]},{"id":"22-126","q":"What branches does a typical intercostal nerve give, in order?","o":["Collateral branch (near rib angle) → anterior cutaneous branch (midaxillary line) → lateral cutaneous branch (beside sternum)","Lateral cutaneous branch (midaxillary line) → collateral branch (near rib angle) → anterior cutaneous branch (beside sternum)","Collateral branch (near rib angle) → lateral cutaneous branch (midaxillary line) → anterior cutaneous branch (beside sternum)"],"k":2,"more":"<p>The lateral cutaneous branch splits into anterior and posterior branches.<\/p>","figs":["img/p/g22b_typical_ic_nerve.webp","img/22_cage_4.webp"]},{"id":"22-127","q":"Besides skin, what does a typical intercostal nerve supply along its course?","o":["Deep back muscles<br>Parietal pleura","Intercostal muscles<br>Visceral pleura","Intercostal muscles<br>Parietal pleura"],"k":2,"figs":["img/p/g22b_gil_ic_coronal.webp"]},{"id":"22-128","q":"Which intercostal nerves are atypical?","o":["T1–T6 and T12","T3–T6 and T12","T1–T2 and T7–T11"],"k":2,"figs":["img/p/g22b_gil_ic_nerves.webp","img/p/g22b_c_thoracoabdominal.webp"]},{"id":"22-129","q":"How does the anterior ramus of T1 divide?","o":["Small upper part → brachial plexus<br>Large lower part → 1st intercostal nerve","Large upper part → cervical plexus<br>Small lower part → 1st intercostal nerve","Large upper part → brachial plexus<br>Small lower part → 1st intercostal nerve"],"k":2,"more":"<p>The 1st intercostal nerve usually has no anterior cutaneous branch.<\/p>","figs":["img/p/g22a_bplexus.webp","img/p/g22b_gil_ic_nerves.webp"]},{"id":"22-130","q":"How does the course of the 1st and 2nd intercostal nerves differ from typical ones?","o":["They run behind the pleura without entering an intercostal space","They run on the inner surface of their ribs, not along the lower border","They run along the upper border of their ribs, not the lower border"],"k":1,"figs":["img/p/g22b_gil_ic_nerves.webp"]},{"id":"22-131","q":"What is the intercostobrachial nerve?","o":["Lateral cutaneous branch of the 2nd intercostal nerve → supplies the floor of the axilla","Anterior cutaneous branch of the 2nd intercostal nerve → supplies the skin over the sternum","Lateral cutaneous branch of the 1st intercostal nerve → supplies the medial arm"],"k":0,"more":"<p>It comes through serratus anterior at the midaxillary line.<\/p>","figs":["img/p/g22b_gil_ic_nerves.webp"]},{"id":"22-132","q":"What are the thoracoabdominal nerves?","o":["Intercostal nerves 7–11 → continue into the diaphragm, supplying its muscle","Intercostal nerves 7–11 → continue into the abdominal wall, supplying its skin and muscles","Intercostal nerves 3–6 → continue into the abdominal wall, supplying its skin and muscles"],"k":1,"more":"<p>Their anterior cutaneous branches pierce rectus abdominis near the midline.<\/p>","figs":["img/p/g22b_gil_ic_nerves.webp","img/p/g22b_c_thoracoabdominal.webp"]},{"id":"22-133","q":"What is a dermatome?","o":["The strip of skin supplied by one spinal nerve","The group of muscles supplied by one spinal nerve","The segment of bone supplied by one spinal nerve"],"k":0,"figs":["img/p/g22b_dermatomes_front.webp"]},{"id":"22-134","q":"Which dermatome lies at the clavicles?","o":["T1 (many charts put T2 there)","C5 (many charts put C4 there)","C7 (many charts put C8 there)"],"k":1,"figs":["img/p/g22b_dermatome_levels.webp","img/p/g22b_dermatomes_front.webp"]},{"id":"22-135","q":"Which dermatome lies at the nipple?","o":["T2","T6","T4"],"k":2,"figs":["img/p/g22b_dermatomes_front.webp","img/p/g22b_dermatome_levels.webp"]},{"id":"22-136","q":"Which dermatome lies at the umbilicus?","o":["T8","T12","T10"],"k":2,"figs":["img/p/g22b_dermatomes_front.webp","img/p/g22b_dermatome_levels.webp"]},{"id":"22-137","q":"Which dermatome lies at the inguinal region?","o":["S1","L1","L3"],"k":1,"figs":["img/p/g22b_dermatomes_front.webp","img/p/g22b_dermatome_levels.webp"]},{"id":"22-138","q":"Why is loss of all feeling over one whole dermatome rare?","o":["The sympathetic chain takes over sensation","Neighbouring dermatomes overlap","Sensory nerves regenerate within days"],"k":1,"figs":["img/p/g22b_dermatomes_full.webp"]},{"id":"22-139","q":"Why does the herpes zoster (shingles) rash stay in one dermatome?","o":["The virus invades one ventral horn and travels out along motor axons","The virus invades one spinal ganglion and travels out along its axons","The virus invades the spinal cord and spreads up and down it"],"k":1,"figs":["img/p/g22b_shingles_slide.webp","img/p/g22b_gil_spinal_branches.webp"]},{"id":"22-140","q":"Why must an intercostal nerve block numb several nerves?","o":["Each intercostal nerve supplies only half its dermatome","Dermatomes overlap → neighbouring nerves also supply the area","The anaesthetic only spreads within the neurovascular bundle"],"k":1,"more":"<p>Care is taken not to puncture the neurovascular bundle.<\/p>","figs":["img/p/g22b_ic_block.webp","img/p/g22b_dermatomes_full.webp"]},{"id":"22-141","q":"How is a thoracotomy incision placed to spare the intercostal bundles?","o":["Just below the rib above, or (for wider access) by dividing the costal cartilages vertically","Directly along the costal groove, or (for wider access) through the neurovascular bundle","Midway between ribs, or (for wider access) through the periosteum of a removed piece of rib"],"k":2,"more":"<p>A thoracotomy is an opening into the pleural cavity.<\/p>","figs":["img/p/g22b_thoracotomy.webp"]}]},{"t":"Intercostal arteries and veins","qs":[{"id":"22-142","q":"From which two directions do the intercostal spaces get their blood supply?","o":["Anterior intercostals from behind (mostly aorta)<br>Posterior intercostals from the internal thoracic artery in front","Posterior intercostals from behind (mostly azygos)<br>Anterior intercostals from the lateral thoracic artery in front","Posterior intercostals from behind (mostly aorta)<br>Anterior intercostals from the internal thoracic artery in front"],"k":2,"more":"<p>The two meet in the middle.<\/p>","figs":["img/22_cage_4.webp","img/p/g22b_ic_arteries_section.webp"]},{"id":"22-143","q":"What is the internal thoracic artery a branch of, and where does it run?","o":["Subclavian artery → runs down along the midclavicular line","Subclavian artery → runs down just lateral to the sternum","Axillary artery → runs down along the midaxillary line"],"k":1,"figs":["img/22_cage_4.webp","img/p/g22b_gil_arteries_wall.webp"]},{"id":"22-144","q":"Which spaces get anterior intercostal arteries from the internal thoracic artery directly?","o":["Spaces 1–9","Spaces 1–6","Spaces 1–2"],"k":1,"figs":["img/p/g22b_gil_arteries_wall.webp"]},{"id":"22-145","q":"What are the two terminal branches of the internal thoracic artery?","o":["Inferior epigastric artery<br>Musculophrenic artery","Superior epigastric artery<br>Musculophrenic artery","Superior epigastric artery<br>Lateral thoracic artery"],"k":1,"figs":["img/p/g22b_grays_arteries.webp"]},{"id":"22-146","q":"Where does the superior epigastric artery go, and what does it anastomose with?","o":["Descends in the rectus sheath → inferior epigastric artery (from external iliac)","Descends behind the peritoneum → inferior epigastric artery (from internal iliac)","Runs along the costal margin → musculophrenic artery (from internal thoracic)"],"k":0,"figs":["img/22_cage_4.webp","img/p/g22b_grays_arteries.webp","img/p/g22b_c_epigastric.webp"]},{"id":"22-147","q":"What is the course of the musculophrenic artery, and which spaces does it supply?","o":["Follows the costal margin → anterior intercostals of spaces 7–9","Follows the costal margin → posterior intercostals of spaces 7–9","Follows the costal margin → anterior intercostals of spaces 1–6"],"k":0,"figs":["img/p/g22b_gil_arteries_wall.webp"]},{"id":"22-148","q":"Why do intercostal spaces 10 and 11 have no anterior intercostal arteries?","o":["The internal thoracic artery ends above that level","The diaphragm covers them in front","The cage is open in front at that level"],"k":2,"figs":["img/p/g22b_grays_arteries.webp"]},{"id":"22-149","q":"How much of each intercostal space do the posterior intercostal arteries supply?","o":["About one-third","About half","About two-thirds"],"k":2,"figs":["img/p/g22b_ic_arteries_section.webp"]},{"id":"22-150","q":"Where do the posterior intercostal arteries of spaces 1 and 2 come from?","o":["Superior (supreme) intercostal artery ← thyrocervical trunk","Superior (supreme) intercostal artery ← costocervical trunk","Internal thoracic artery ← subclavian artery"],"k":1,"figs":["img/p/g22b_grays_arteries.webp"]},{"id":"22-151","q":"Where do the posterior intercostal arteries of spaces 3–11 come from?","o":["Internal thoracic artery","Thoracic aorta","Costocervical trunk"],"k":1,"figs":["img/22_cage_4.webp","img/p/g22b_grays_arteries.webp"]},{"id":"22-152","q":"Why are the right posterior intercostal arteries longer than the left?","o":["The heart lies to the left → right arteries must reach further around the chest","The aorta lies to the left → right arteries must cross the vertebral bodies","The aorta lies to the right → left arteries must cross the vertebral bodies"],"k":1,"figs":["img/22_cage_4.webp","img/p/g22b_ic_arteries_section.webp"]},{"id":"22-153","q":"In which intercostal spaces do anterior and posterior intercostal arteries anastomose?","o":["Spaces 1–6","Spaces 1–9","Spaces 1–11"],"k":1,"figs":["img/p/g22b_gil_arteries_wall.webp"]},{"id":"22-154","q":"Into which venous system do the intercostal veins mainly drain?","o":["Internal thoracic (anterior) system only","Portal venous system","Azygos system"],"k":2,"more":"<p>A set of channels parallel to the venae cavae that drains the thoracic and posterior abdominal walls.<\/p>","figs":["img/p/g22b_azygos_system.webp"]},{"id":"22-155","q":"How does the azygos system begin?","o":["Ascending lumbar vein + subcostal vein → azygos vein (right) / hemiazygos vein (left)","Renal vein + subcostal vein → azygos vein (right) / accessory hemiazygos vein (left)","Ascending lumbar vein + subcostal vein → azygos vein (left) / hemiazygos vein (right)"],"k":0,"figs":["img/p/g22b_azygos_system.webp"]},{"id":"22-156","q":"Where do the 1st posterior intercostal veins drain?","o":["Internal jugular vein of the same side","Superior vena cava directly","Brachiocephalic vein of the same side"],"k":2,"figs":["img/p/g22b_ic_veins_schematic.webp"]},{"id":"22-157","q":"Where do the right 2nd–4th posterior intercostal veins drain?","o":["Directly into the superior vena cava","Right superior intercostal vein → right subclavian or internal jugular vein","Right superior intercostal vein → azygos or right brachiocephalic vein"],"k":2,"figs":["img/p/g22b_azygos_system.webp","img/p/g22b_ic_veins_schematic.webp"]},{"id":"22-158","q":"Where do the left 2nd–4th posterior intercostal veins drain?","o":["Left superior intercostal vein → azygos or right brachiocephalic vein","Left superior intercostal vein → left internal jugular vein","Left superior intercostal vein → left brachiocephalic or accessory hemiazygos vein"],"k":2,"figs":["img/p/g22b_ic_veins_schematic.webp","img/p/g22b_azygos_system.webp"]},{"id":"22-159","q":"Where do the 5th–8th posterior intercostal veins drain on each side?","o":["Right → azygos<br>Left → accessory hemiazygos → crosses to azygos","Right → superior vena cava<br>Left → left brachiocephalic","Right → right superior intercostal<br>Left → left superior intercostal"],"k":0,"figs":["img/p/g22b_ic_veins_schematic.webp"]},{"id":"22-160","q":"Where do the 9th–11th posterior intercostal, subcostal and lumbar veins drain on each side?","o":["Right → azygos<br>Left → accessory hemiazygos → crosses to azygos","Right → azygos<br>Left → hemiazygos → crosses to azygos","Right → inferior vena cava<br>Left → hemiazygos → left renal vein"],"k":1,"more":"<table><tr><th>Veins<\/th><th>Right<\/th><th>Left<\/th><\/tr><tr><td>1st<\/td><td>Right brachiocephalic<\/td><td>Left brachiocephalic<\/td><\/tr><tr><td>2nd–4th<\/td><td>Right superior intercostal → azygos or right brachiocephalic<\/td><td>Left superior intercostal → left brachiocephalic or accessory hemiazygos<\/td><\/tr><tr><td>5th–8th<\/td><td>Azygos<\/td><td>Accessory hemiazygos → azygos<\/td><\/tr><tr><td>9th–11th, subcostal, lumbar<\/td><td>Azygos<\/td><td>Hemiazygos → azygos<\/td><\/tr><\/table>","figs":["img/p/g22b_ic_veins_schematic.webp"]},{"id":"22-161","q":"Where does the azygos vein end?","o":["Arches over the root of the left lung → left brachiocephalic vein","Arches over the root of the right lung → superior vena cava","Arches over the root of the right lung → right atrium directly"],"k":1,"figs":["img/p/g22b_n234_azygos_arch.webp","img/p/g22b_azygos_system.webp"]}]},{"t":"Diaphragm","qs":[{"id":"22-162","q":"What nerve supplies the diaphragm, and from which spinal levels?","o":["Phrenic nerve → C1, C2, C3","Phrenic nerve → C3, C4, C5","Phrenic nerve → C5, C6, C7"],"k":1,"figs":["img/p/g22b_n199_phrenic.webp","img/22_cage_5.webp"]},{"id":"22-163","q":"Why does the phrenic nerve arise so high, in the neck?","o":["The diaphragm develops in the neck and migrates down, dragging its nerve with it","The diaphragm develops in the abdomen and its nerve grows up to reach the neck","The phrenic nerve must first pass through the brachial plexus to collect fibres"],"k":0,"figs":["img/p/g22b_n199_phrenic.webp"]},{"id":"22-164","q":"What does the phrenic nerve supply in the diaphragm?","o":["Motor to the whole diaphragm<br>Sensory to its periphery only","Motor to the whole diaphragm<br>Sensory to its central part","Motor to its central part<br>Sensory to the whole diaphragm"],"k":1,"figs":["img/p/g22b_n199_inset.webp"]},{"id":"22-165","q":"What carries sensation from the periphery of the diaphragm?","o":["Lower five intercostal nerves","The greater splanchnic nerves","The phrenic nerves"],"k":0,"more":"<p>Texts give the lower six or seven intercostals plus the subcostal nerve.<\/p>","figs":["img/p/g22b_n199_inset.webp"]},{"id":"22-166","q":"Where is pain referred from irritation of the central vs. peripheral diaphragm?","o":["Central → skin over the costal margin<br>Periphery → shoulder","Central → shoulder<br>Periphery → skin over the costal margin","Central → epigastrium<br>Periphery → shoulder"],"k":1,"more":"<p>Central sensation travels in the phrenic nerve (C3–C5); peripheral sensation in the lower intercostal nerves.<\/p>","figs":["img/p/g22b_n199_inset.webp"]},{"id":"22-167","q":"What is the structure of the diaphragm?","o":["Musculotendinous dome between the thoracic and abdominal cavities","Flat fibrous sheet between the thoracic and abdominal cavities","Purely muscular dome between the thoracic and pelvic cavities"],"k":0,"figs":["img/22_cage_5.webp","img/p/g22b_gil_diaph_coronal.webp"]},{"id":"22-168","q":"Which dome of the diaphragm sits higher, and why?","o":["Left → pushed up by the heart","Right → pushed up by the liver","Right → pulled up by the right lung"],"k":1,"figs":["img/p/g22b_gil_diaph_coronal.webp","img/p/g22b_c_liver_dome.webp"]},{"id":"22-169","q":"In expiration, what levels do the right and left domes of the diaphragm reach?","o":["Right → 5th intercostal space<br>Left → 5th rib","Right → 5th rib<br>Left → 5th intercostal space","Right → 7th rib<br>Left → 7th intercostal space"],"k":1,"figs":["img/p/g22b_gil_diaph_anterior.webp","img/p/g22b_c_domes_ribs.webp"]},{"id":"22-170","q":"What are the three muscular parts of the diaphragm and their origins?","o":["Sternal → xiphoid (not always present)<br>Costal → lower six costal cartilages<br>Lumbar → iliac crests + lower three lumbar vertebrae","Sternal → manubrium (not always present)<br>Costal → upper six costal cartilages<br>Lumbar → arcuate ligaments + upper three lumbar vertebrae","Sternal → xiphoid (not always present)<br>Costal → lower six costal cartilages<br>Lumbar → arcuate ligaments + upper three lumbar vertebrae"],"k":2,"figs":["img/p/g22b_diaph_inferior_slide.webp","img/22_cage_5.webp"]},{"id":"22-171","q":"Where do all three muscular parts of the diaphragm insert?","o":["Xiphoid process","Central tendon","Arcuate ligaments"],"k":1,"figs":["img/22_cage_5.webp","img/p/g22b_diaph_inferior_slide.webp"]},{"id":"22-172","q":"What is the central tendon of the diaphragm fused to?","o":["Upper surface of the liver capsule","Underside of the fibrous pericardium","Underside of the serous visceral pericardium"],"k":1,"figs":["img/p/g22b_n200_thoracic_surface.webp"]},{"id":"22-173","q":"What happens to the central tendon when the diaphragm contracts?","o":["The peripheral muscle pulls it down","It stays fixed and only the domes flatten","The peripheral muscle pushes it up"],"k":0,"figs":["img/p/g22b_gil_diaph_breathing.webp"]},{"id":"22-174","q":"Which part of the diaphragm forms the crura, and which crus is larger?","o":["Lumbar part → right crus is larger and longer","Lumbar part → left crus is larger and longer","Costal part → right crus is larger and longer"],"k":0,"figs":["img/22_cage_5.webp","img/p/g22b_gil_diaph_inferior.webp"]},{"id":"22-175","q":"What unites the two crura, and what does it arch in front of?","o":["Median arcuate ligament → arches in front of the oesophagus","Medial arcuate ligament → arches in front of psoas major","Median arcuate ligament → arches in front of the aorta"],"k":2,"figs":["img/22_cage_5.webp","img/p/g22b_gil_diaph_coronal.webp"]},{"id":"22-176","q":"Where is the caval opening of the diaphragm, and at what level?","o":["In the central tendon → T8","In the central tendon → T10","Behind the diaphragm → T12"],"k":0,"figs":["img/p/g22b_gil_apertures.webp","img/22_cage_5.webp"]},{"id":"22-177","q":"What passes through the caval opening?","o":["Inferior vena cava<br>Right vagus nerve<br>Azygos vein","Inferior vena cava<br>Right phrenic nerve<br>Lymphatics","Inferior vena cava<br>Left phrenic nerve<br>Thoracic duct"],"k":1,"figs":["img/p/g22b_grays_hiatus.webp","img/p/g22b_n200_thoracic_surface.webp"]},{"id":"22-178","q":"Where is the oesophageal hiatus, and at what level?","o":["In the right crus → T12","In the right crus → T10","In the left crus → T10"],"k":1,"figs":["img/p/g22b_gil_apertures.webp","img/22_cage_5.webp"]},{"id":"22-179","q":"What passes through the oesophageal hiatus?","o":["Oesophagus<br>Anterior and posterior vagal trunks<br>Thoracic duct","Oesophagus<br>Anterior and posterior vagal trunks<br>Oesophageal branches of the left gastric vessels","Oesophagus<br>Right and left phrenic nerves<br>Oesophageal branches of the left gastric vessels"],"k":1,"figs":["img/p/g22b_grays_hiatus.webp","img/p/g22b_c_vagal_trunks.webp","img/p/g22b_c_left_gastric.webp"]},{"id":"22-180","q":"Where is the aortic hiatus, and at what level?","o":["Behind the diaphragm → T12","Behind the diaphragm → L2","In the central tendon → T8"],"k":0,"figs":["img/p/g22b_grays_hiatus.webp","img/22_cage_5.webp","img/p/g22b_gil_apertures.webp"]},{"id":"22-181","q":"What passes through the aortic hiatus?","o":["Aorta<br>Inferior vena cava<br>Thoracic duct","Aorta<br>Azygos vein<br>Vagal trunks","Aorta<br>Azygos vein<br>Thoracic duct"],"k":2,"more":"<table><tr><th>Opening<\/th><th>Level<\/th><th>Passes<\/th><\/tr><tr><td>Caval (central tendon)<\/td><td>T8<\/td><td>IVC, right phrenic nerve, lymphatics<\/td><\/tr><tr><td>Oesophageal (right crus)<\/td><td>T10<\/td><td>Oesophagus, vagal trunks, oesophageal branches of left gastric vessels<\/td><\/tr><tr><td>Aortic (behind)<\/td><td>T12<\/td><td>Aorta, azygos vein, thoracic duct<\/td><\/tr><\/table>","figs":["img/p/g22b_n200_thoracic_surface.webp"]},{"id":"22-182","q":"Why does diaphragm contraction constrict the oesophagus but not the aorta?","o":["Right crus muscle surrounds the oesophageal hiatus → the aorta passes behind the diaphragm, not through it","Left crus muscle surrounds the oesophageal hiatus → the aorta passes through the central tendon","Right crus muscle surrounds the aortic hiatus → the oesophagus passes through the central tendon"],"k":0,"figs":["img/22_cage_5.webp"]},{"id":"22-183","q":"What happens to the diaphragm if one phrenic nerve is cut?","o":["That half is paralysed → dome stays permanently flattened (low) on chest X-ray; muscle atrophies","That half is paralysed → dome stays permanently elevated on chest X-ray; muscle atrophies","That half is unaffected → the intercostal nerves take over its motor supply"],"k":1},{"id":"22-184","q":"How can the diaphragm herniate?","o":["Through a rupture (most after minor coughing)","Congenitally, or through a rupture (most after major trauma)","Only congenitally, never through a rupture"],"k":1,"figs":["img/p/g22b_web_diaph_rupture.webp","img/p/gdev_cdh_xray.webp"]},{"id":"22-185","q":"On which side do most traumatic diaphragmatic ruptures occur, and why?","o":["Left → the heart weakens the left dome","Left → the liver shields the right","Right → the liver makes the right dome rigid"],"k":1,"figs":["img/p/g22b_web_diaph_rupture.webp"]},{"id":"22-186","q":"Which organs can pass into the thorax through a diaphragmatic hernia?","o":["Stomach<br>Small intestine<br>Transverse colon<br>Left kidney","Stomach<br>Small intestine<br>Transverse colon<br>Spleen","Stomach<br>Pancreas<br>Descending colon<br>Liver"],"k":1,"figs":["img/p/g22b_web_diaph_rupture.webp","img/p/gdev_cdh_xray.webp","img/p/gdev_cdh_mri.webp"]},{"id":"22-187","q":"Which muscles act in quiet inspiration?","o":["Diaphragm and internal intercostals","Diaphragm and pectoralis minor","Diaphragm and external intercostals"],"k":2,"figs":["img/p/g22b_gil_diaph_breathing.webp","img/p/g22b_gil_wall_muscles.webp"]},{"id":"22-188","q":"What produces quiet expiration?","o":["Active diaphragm contraction, with the external intercostals","Passive lung recoil and diaphragm relaxation, with the internal intercostals","Passive lung recoil and diaphragm contraction, with the external intercostals"],"k":1,"more":"<p>Many texts treat quiet expiration as purely passive and bring in the internal intercostals only for forced breathing.<\/p>","figs":["img/p/g22b_gil_diaph_breathing.webp","img/p/g22b_gil_innermost_subcostal.webp"]},{"id":"22-189","q":"Which muscles drive forced expiration?","o":["Muscles of the abdominal wall","Scalenes and sternocleidomastoid","Diaphragm and external intercostals"],"k":0,"more":"<table><tr><th><\/th><th>Inspiration<\/th><th>Expiration<\/th><\/tr><tr><td>Quiet<\/td><td>Diaphragm + external intercostals<\/td><td>Passive recoil + diaphragm relaxation, with internal intercostals<\/td><\/tr><tr><td>Forced<\/td><td>Adds pectoralis major and minor, serratus anterior, scalenes<\/td><td>Abdominal wall muscles<\/td><\/tr><\/table>","figs":["img/p/g22b_accessory_muscles.webp"]}]}]},{"n":23,"key":"anat","t":"The breast","sub":"Oct 8","cp2":false,"secs":[{"t":"Position and bed","qs":[{"id":"23-0","q":"In what layer does the breast sit?","o":["Subcutaneous fat of the lateral chest wall → on top of latissimus dorsi, not within it","Superficial fascia of the anterior chest wall → on top of pectoralis major, not within it","Superficial fascia of the anterior chest wall → beneath pectoralis major, on the ribs"],"k":1,"figs":["img/p/g2324_breast_medial.webp","img/23_breast_1.webp"]},{"id":"23-1","q":"What is the retromammary space, and what does it allow?","o":["Loose plane between pectoralis major and pectoralis minor → lets the muscles slide over each other","Loose plane between the breast and pectoralis major → lets the breast move freely over the chest wall","Loose plane between the skin and the breast → lets the skin move freely over the gland"],"k":1,"figs":["img/p/g2324_breast_medial.webp"]},{"id":"23-2","q":"What does a breast lump fixed to the chest wall indicate?","o":["Blocked superficial lymphatics in the skin → changes the staging","Spread along the suspensory ligaments into the skin → does not change the staging","Invasion through the retromammary space into the muscle → changes the staging"],"k":2,"more":"<p>A lump that moves freely is confined to the breast.<\/p>","figs":["img/p/g2324_breast_medial.webp"]},{"id":"23-3","q":"Over which muscles does the mammary gland develop?","o":["Pectoralis minor and latissimus dorsi (deep to their fascia)","Pectoralis minor and intercostals (superficial to their fascia)","Pectoralis major and serratus anterior (superficial to their fascia)"],"k":2,"more":"<p>The gland is well developed in women and rudimentary in men.<\/p>","figs":["img/23_breast_1.webp"]},{"id":"23-4","q":"What is the extent of the breast bed?","o":["Midline of sternum → posterior axillary line<br>1st → 4th rib","Lateral border of sternum → midaxillary line<br>3rd → 10th rib","Lateral border of sternum → midaxillary line<br>2nd → 6th rib"],"k":2,"figs":["img/23_breast_1.webp","img/p/g2324_c_breasts_cage.webp","img/p/g2324_c_midaxillary.webp"]},{"id":"23-5","q":"What forms the bed of the breast, and in what proportion?","o":["~1/3 pectoralis major and its fascia<br>~2/3 serratus anterior and its fascia","~2/3 pectoralis minor and its fascia<br>~1/3 serratus anterior and its fascia","~2/3 pectoralis major and its fascia<br>~1/3 serratus anterior and its fascia"],"k":2,"figs":["img/23_breast_1.webp"]},{"id":"23-6","q":"What is the axillary process (tail) of the breast?","o":["An extension of the breast toward the sternum","An extension of the breast toward the axilla","A separate accessory breast in the axilla"],"k":1,"figs":["img/23_breast_2.webp"]}]},{"t":"Internal structure","qs":[{"id":"23-7","q":"How many lobes of glandular tissue does the breast contain?","o":["15–20","30–40","5–10"],"k":0,"figs":["img/p/g2324_gil_sagittal.webp","img/23_breast_1.webp"]},{"id":"23-8","q":"How does each breast lobe drain to the nipple?","o":["Lactiferous duct → lactiferous sinus → opens separately onto the nipple","Lactiferous sinus → lactiferous duct → opens separately onto the nipple","Lactiferous duct → lactiferous sinus → joins one common duct onto the nipple"],"k":0,"figs":["img/23_breast_1.webp"]},{"id":"23-9","q":"What kind of gland is the breast?","o":["A modified sweat gland, with no capsule","A modified salivary gland, with a thin capsule","An endocrine gland, with a thick capsule"],"k":0,"figs":["img/p/g2324_gil_sagittal.webp"]},{"id":"23-10","q":"What makes up most of the breast's size, and what grows in pregnancy?","o":["Fat (laid down at puberty) → in pregnancy the glandular tissue itself grows","Fibrous tissue (laid down at birth) → in pregnancy the suspensory ligaments grow","Glandular tissue (laid down at puberty) → in pregnancy the fat itself grows"],"k":0,"figs":["img/p/g2324_breast_medial.webp"]},{"id":"23-11","q":"What are the suspensory ligaments of Cooper?","o":["Smooth-muscle bands from the nipple to the areola, contracting the areola","Elastic bands from the clavicle to the breast, holding it up","Fibrous bands from the skin to the deep fascia, separating the lobes"],"k":2,"figs":["img/23_breast_1.webp"]},{"id":"23-12","q":"What do the suspensory ligaments do, and where are they strongest?","o":["Bind the gland loosely to the ribs → strongest in the medial breast","Bind the gland firmly to the pectoralis major → strongest in the lower breast","Bind the gland firmly to the overlying skin → strongest in the upper breast"],"k":2,"figs":["img/p/g2324_gil_sagittal.webp"]},{"id":"23-13","q":"What glands make the areola rich, and what do they do?","o":["Mucous glands → lubricate the nipple during breastfeeding","Sebaceous glands → keep the areola and nipple from cracking during breastfeeding","Mammary glands → secrete milk directly onto the areola"],"k":1,"figs":["img/23_breast_1.webp"]},{"id":"23-14","q":"Where can supernumerary nipples appear?","o":["Anywhere along a line from the axilla to the groin (above or below the normal breasts)","Anywhere along the midline from the sternum to the umbilicus","Only in the axilla (never below the normal breasts)"],"k":0,"more":"<p>They are usually rudimentary.<\/p>","figs":["img/p/g2324_mammary_ridges.webp"]}]},{"t":"Skin and nipple signs","qs":[{"id":"23-15","q":"How does a breast tumour cause skin dimpling?","o":["Tethers and shortens the suspensory ligaments → pulls the overlying skin inward","Shortens the lactiferous ducts → pushes the overlying skin outward","Blocks the superficial lymphatics → pulls the overlying skin inward"],"k":0,"figs":["img/p/g2324_ca_signs.webp","img/p/g2324_gil_sagittal.webp"]},{"id":"23-16","q":"What causes the <i>peau d'orange<\/i> appearance of the breast?","o":["Shortened suspensory ligaments → dimpled, tethered skin","Blocked lactiferous ducts → swollen, cystic skin","Blocked superficial lymphatics → oedematous, puffy, pitted skin"],"k":2,"figs":["img/p/g2324_ca_signs.webp","img/23_breast_3.jpg"]},{"id":"23-17","q":"What causes nipple retraction in breast cancer?","o":["A cancer deep in the breast invades pectoralis major → pulls the nipple in","A cancer under the areola blocks the superficial lymphatics → pulls the nipple in","A cancer under the areola shortens the lactiferous ducts → pulls the nipple in"],"k":2,"more":"<p>The nipple can also deviate and the breast's contour change.<\/p>","figs":["img/p/g2324_ca_signs.webp","img/p/g2324_ca_sagittal.webp","img/p/g2324_gil_sagittal.webp"]}]},{"t":"Blood supply and nerves","qs":[{"id":"23-18","q":"What are the four arterial sources of the breast?","o":["Internal thoracic (medial mammary + anterior intercostal branches)<br>Suprascapular artery<br>Thyrocervical trunk<br>Posterior intercostal arteries","Internal thoracic (medial mammary + anterior intercostal branches)<br>Lateral thoracic artery<br>Thoracoacromial trunk<br>Posterior intercostal arteries","Internal thoracic (medial mammary + anterior intercostal branches)<br>Lateral thoracic artery<br>Thoracoacromial trunk<br>Superior epigastric arteries"],"k":1,"figs":["img/p/g2324_breast_arteries.webp","img/p/g2324_c_wall_arteries.webp"]},{"id":"23-19","q":"Where does venous blood from the breast drain?","o":["Mostly → cephalic vein<br>Smaller part → external jugular vein","Mostly → axillary vein<br>Smaller part → internal thoracic vein","Mostly → internal thoracic vein<br>Smaller part → axillary vein"],"k":1,"figs":["img/p/g2324_breast_veins.webp"]},{"id":"23-20","q":"Which nerves supply the breast?","o":["1st–3rd intercostal nerves","7th–9th intercostal nerves","4th–6th intercostal nerves"],"k":2,"figs":["img/p/g2324_breast_nerves.webp"]},{"id":"23-21","q":"What do the intercostal nerves carry to and from the breast?","o":["Sensation from the overlying skin<br>Sympathetic fibres to blood vessels and smooth muscle of skin and nipple","Motor fibres to the pectoralis major<br>Parasympathetic fibres to the glandular tissue","Sensation from the overlying skin<br>Parasympathetic fibres that drive milk secretion"],"k":0,"more":"<p>They pass through the pectoral fascia.<\/p>","figs":["img/p/g2324_breast_nerves.webp"]}]},{"t":"Quadrants","qs":[{"id":"23-22","q":"How is the breast divided to describe a lump?","o":["Four quadrants around the nipple, read like a clock face","Medial and lateral halves along the midclavicular line","Six sectors along the lactiferous ducts, read from the axilla"],"k":0,"figs":["img/23_breast_2.webp"]},{"id":"23-23","q":"Why do breast quadrants matter clinically?","o":["They have different arterial supplies<br>Cancers are spread evenly among them","They drain to different nodes<br>Cancers are not spread evenly among them","They drain to the same nodes<br>Cancers are not spread evenly among them"],"k":1,"figs":["img/23_breast_2.webp","img/p/g2324_c_breasts_cage.webp"]},{"id":"23-24","q":"Which breast quadrant is the site of most cancers, and what share?","o":["Superolateral → about 60%","Superolateral → about 25%","Inferolateral → about 40%"],"k":0,"figs":["img/23_breast_2.webp"]},{"id":"23-25","q":"Why does the superolateral quadrant get the most breast cancers?","o":["It has the most glandular tissue (includes the axillary tail)","It has the most fat (furthest from the nipple)","It has the fewest lymphatics draining it"],"k":0,"figs":["img/23_breast_2.webp"]},{"id":"23-26","q":"What share of breast cancers arise in the other three quadrants?","o":["Superomedial ~10%<br>Inferolateral ~15%<br>Inferomedial ~5%","Superomedial ~5%<br>Inferolateral ~10%<br>Inferomedial ~15%","Superomedial ~15%<br>Inferolateral ~10%<br>Inferomedial ~5%"],"k":2,"figs":["img/23_breast_2.webp"]}]},{"t":"Lymphatic drainage","qs":[{"id":"23-27","q":"Why is the breast's lymphatic drainage worth knowing precisely?","o":["It determines where cancer spreads","It determines where the nerves run","It determines how milk leaves the nipple"],"k":0,"figs":["img/p/g2324_lymph_arrows.webp"]},{"id":"23-28","q":"Where does most of the breast's lymph drain, and how much?","o":["Axillary nodes → more than 75% (mainly from the lateral quadrants)","Axillary nodes → about 25% (mainly from the medial quadrants)","Parasternal nodes → more than 75% (mainly from the medial quadrants)"],"k":0,"more":"<p>That is why the axilla is examined and sampled in breast cancer.<\/p>","figs":["img/23_breast_3.jpg"]},{"id":"23-29","q":"Which group of axillary nodes receives breast lymph first?","o":["Central group","Pectoral group","Apical group"],"k":1,"figs":["img/23_breast_3.jpg"]},{"id":"23-30","q":"Where does lymph from the medial part of the breast drain?","o":["Axillary (pectoral) nodes → stays on the same side","Supraclavicular nodes → can cross to the opposite side","Parasternal (internal thoracic) nodes → can cross to the opposite side"],"k":2,"figs":["img/23_breast_3.jpg","img/p/g2324_lymph_nodes.webp"]},{"id":"23-31","q":"Where can lymph from the lower and upper quadrants of the breast drain?","o":["Lower quadrants → supraclavicular nodes<br>Upper quadrants → abdominal nodes","Lower quadrants → abdominal nodes<br>Upper quadrants → supraclavicular nodes","Lower quadrants → parasternal nodes<br>Upper quadrants → axillary apical nodes only"],"k":1,"figs":["img/23_breast_3.jpg"]}]},{"t":"Breast cancer","qs":[{"id":"23-32","q":"What is the most common cancer in women, and what type is it usually?","o":["Breast cancer → adenocarcinoma of the myoepithelial cells","Breast cancer → adenocarcinoma of the lactiferous duct epithelium","Breast cancer → squamous cell carcinoma of the nipple skin"],"k":1,"figs":["img/p/g2324_ca_sagittal.webp","img/p/g2324_c_tdlu.webp"]},{"id":"23-33","q":"Where does breast cancer spread?","o":["Most often directly into pectoralis major<br>Also ribs, lung, opposite axilla","Most often parasternal nodes<br>Also inguinal nodes, opposite axilla, brain","Most often axillary nodes<br>Also supraclavicular nodes, opposite breast, abdomen"],"k":2,"more":"<p>It spreads along the lymph routes, so the drainage map is the map of spread.<\/p>","figs":["img/23_breast_3.jpg"]},{"id":"23-34","q":"What is the main screening test for breast cancer?","o":["Fine-needle aspiration","Mammography","Ultrasound"],"k":1,"figs":["img/p/g2324_mammo_proc.webp","img/p/g2324_gil_mammo.webp"]},{"id":"23-35","q":"What is ultrasound used for in breast imaging?","o":["Routine population screening<br>Planning treatment of a known tumour","Where mammograms see poorly (dense breasts)<br>Telling a fluid-filled cyst from a solid mass","Where mammograms see best (fatty breasts)<br>Staging distant metastases"],"k":1,"figs":["img/p/g2324_c_us_cyst.webp","img/p/g2324_c_us_fibroadenoma.webp"]},{"id":"23-36","q":"What is magnetic resonance imaging (MRI) used for in breast cancer?","o":["Examining dense breasts<br>Screening all women annually<br>Planning treatment","First test for any new lump<br>Ruling out false positives<br>Replacing biopsy","Examining a known tumour<br>Ruling out false positives<br>Planning treatment"],"k":2,"figs":["img/p/g2324_breast_mri.webp"]},{"id":"23-37","q":"What share of breast cancer cases occur in men?","o":["About 0.1% (anatomy texts give about 0.05%)","About 15% (anatomy texts give about 10%)","About 4.5% (anatomy texts give about 1.5%)"],"k":2},{"id":"23-38","q":"How does breast cancer in men typically behave?","o":["Stays confined to the nipple for years → usually found early","Invades pectoral fascia, pectoralis major and axillary nodes → often found only after wide spread","Spreads mainly to the opposite breast → rarely reaches the axillary nodes"],"k":1,"figs":["img/p/g2324_breast_medial.webp","img/23_breast_3.jpg"]},{"id":"23-39","q":"What share of males with Klinefelter syndrome develop gynaecomastia, and when?","o":["About 40% → at puberty","About 40% → in infancy","About 80% → in old age"],"k":0,"more":"<p>Gynaecomastia = enlarged breast tissue.<\/p>"}]},{"t":"Surgery and its complications","qs":[{"id":"23-40","q":"What does a simple mastectomy remove?","o":["The breast and pectoralis minor, down to the ribs","The lump alone, with a margin of normal tissue","The breast, down to the retromammary space"],"k":2,"figs":["img/p/g2324_breast_medial.webp"]},{"id":"23-41","q":"What does a radical mastectomy remove beyond a simple mastectomy?","o":["Pectoral muscles, fat, fascia, and as many axillary and pectoral nodes as needed","Serratus anterior, latissimus dorsi and the long thoracic nerve","Only the lump and a margin of normal tissue"],"k":0,"figs":["img/23_breast_3.jpg","img/p/g2324_breast_medial.webp"]},{"id":"23-42","q":"What breast cancer surgery is more common today?","o":["Bilateral mastectomy → followed by hormone therapy","Lumpectomy or quadrantectomy → followed by radiation","Radical mastectomy → followed by chemotherapy"],"k":1,"figs":["img/p/g2324_c_lumpectomy.webp","img/p/g2324_c_segmental.webp"]},{"id":"23-43","q":"Which nerve is at risk in surgery on the lateral breast quadrants, and what does its injury cause?","o":["Medial pectoral nerve → winged scapula","Long thoracic nerve → winged scapula","Thoracodorsal nerve → winged scapula"],"k":1,"figs":["img/p/g2324_netter_mammary_arteries.webp","img/p/g2324_c_winged_scapula.webp"]},{"id":"23-44","q":"Why is lymphoedema of the arm common after breast cancer treatment?","o":["Removing the axillary nodes spreads cancer into the arm → tumour accumulates in the limb","Removing or irradiating axillary nodes destroys the arm's drainage route → fluid accumulates in the limb","Removing the pectoral muscles destroys the arm's venous return → blood pools in the limb"],"k":1,"figs":["img/23_breast_3.jpg","img/p/g2324_lymphedema_arm.webp"]}]}]},{"n":24,"key":"anat","t":"Pleura and lungs","sub":"Oct 8 and Lab 14","cp2":false,"secs":[{"t":"Pleural layers and cavity","qs":[{"id":"24-0","q":"What is the visceral pleura?","o":["The pleura clinging tightly to the lung surface","The pleura lining the inside of the chest wall","The fascial layer separating pleura from the ribs"],"k":0,"more":"<p>The pleura is one continuous membrane folded back on itself.<\/p>","figs":["img/24_lungs_1.jpg"]},{"id":"24-1","q":"What does the parietal pleura line?","o":["Inside of the chest wall and the lung fissures only","Outer surface of the pericardium and the lung hilum","Inside of the chest wall, the diaphragm and the mediastinum"],"k":2,"figs":["img/24_lungs_1.jpg"]},{"id":"24-2","q":"Where do the visceral and parietal pleura become continuous?","o":["Where the root of the lung enters","At the inferior border of the lung","At the apex of the lung under the cupula"],"k":0,"figs":["img/p/g2324_pulm_ligament.webp","img/p/g2324_c_lung_medial.webp"]},{"id":"24-3","q":"What is the pleural cavity?","o":["A potential space between visceral and parietal pleura, holding a thin film of fluid","A real air-filled space between lung and chest wall, holding no fluid","A potential space between parietal pleura and endothoracic fascia, holding fat"],"k":0,"figs":["img/p/g2324_pleural_sacs.webp","img/24_lungs_1.jpg"]},{"id":"24-4","q":"What two jobs does the pleural fluid do?","o":["Lets the layers slide<br>Holds the lung against the chest wall by surface tension","Cushions the lung against the ribs<br>Lubricates the alveoli by surface tension","Nourishes the visceral pleura<br>Holds the lung against the chest wall by negative charge"],"k":0,"more":"<p>Because the lung is held to the wall, the lung expands when the chest does.<\/p>","figs":["img/24_lungs_1.jpg"]},{"id":"24-5","q":"How many pleural sacs does the thoracic cavity hold, and what lies between them?","o":["Four (two per lung); the mediastinum between them","Two (one per lung); the diaphragm between them","Two (one per lung); the mediastinum between them"],"k":2,"more":"<p>The heart has its own equivalent of a pleural sac: the pericardium.<\/p>","figs":["img/p/g2324_pleural_sacs.webp"]},{"id":"24-6","q":"In the &ldquo;fist pushed into a balloon&rdquo; model of the pleura, what does each part represent?","o":["Fist = lung<br>Balloon wall touching fist = parietal pleura<br>Rest of balloon = visceral pleura<br>Flattened space between = pleural cavity","Fist = lung<br>Balloon wall touching fist = visceral pleura<br>Rest of balloon = parietal pleura<br>Flattened space between = pleural cavity","Fist = heart<br>Balloon wall touching fist = visceral pleura<br>Rest of balloon = parietal pleura<br>Flattened space between = mediastinum"],"k":1,"figs":["img/24_lungs_1.jpg","img/p/g2324_c_fist_balloon.webp"]},{"id":"24-7","q":"Why does the lung collapse when the chest wall is punctured?","o":["Air enters pleural cavity &rarr; surface-tension link strengthened &rarr; diaphragm pushes lung upward","Air enters pleural cavity &rarr; surface-tension link broken &rarr; elastic lung recoils from the wall","Air enters the alveoli &rarr; surface tension rises &rarr; chest wall recoils from the lung"],"k":1,"more":"<p>That is a <b>pneumothorax<\/b>, and it follows entirely from the pleura being a potential space.<\/p>","figs":["img/p/g2324_pneumothorax.webp"]}]},{"t":"Parietal pleura and reflections","qs":[{"id":"24-8","q":"Name the four parts of the parietal pleura (named by what they line).","o":["Cervical<br>Costal<br>Diaphragmatic<br>Pericardial","Cervical<br>Costal<br>Diaphragmatic<br>Mediastinal","Cervical<br>Sternal<br>Diaphragmatic<br>Vertebral"],"k":1,"figs":["img/24_lungs_1.jpg","img/p/g2324_gil_parietal_parts.webp"]},{"id":"24-9","q":"What is the cupula?","o":["Mediastinal parietal pleura, folding around the root of the lung at the hilum","Visceral pleura covering the apex of the lung within the thoracic inlet","Cervical parietal pleura, rising into the root of the neck over the apex of the lung"],"k":2,"figs":["img/24_lungs_4.webp"]},{"id":"24-10","q":"What layer separates the parietal pleura from the chest wall?","o":["Pretracheal fascia","Transversalis fascia","Endothoracic fascia"],"k":2,"figs":["img/24_lungs_1.jpg","img/p/g2324_gil_coronal_recess.webp"]},{"id":"24-11","q":"What are the lines of pleural reflection?","o":["Lines where one part of the parietal pleura turns into the next","Lines where the lung's inferior border lies in quiet breathing","Lines where visceral pleura turns into parietal pleura"],"k":0,"figs":["img/p/g2324_reflections.webp"]},{"id":"24-12","q":"At the sternal and vertebral lines of pleural reflection, what does costal pleura turn into?","o":["Diaphragmatic pleura","Cervical pleura","Mediastinal pleura"],"k":2,"more":"<p>Sternal line in front, vertebral line behind.<\/p>","figs":["img/p/g2324_reflections.webp","img/p/g2324_gil_transverse_recess.webp"]},{"id":"24-13","q":"At the costal line of pleural reflection, what does costal pleura turn into?","o":["Diaphragmatic pleura (the line runs below)","Mediastinal pleura (the line runs in front)","Visceral pleura (the line runs behind)"],"k":0,"figs":["img/p/g2324_reflections.webp","img/p/g2324_gil_coronal_recess.webp"]},{"id":"24-14","q":"What is the pulmonary ligament?","o":["Loose double fold of visceral pleura within the oblique fissure, running from hilum toward the base","Fibrous band of endothoracic fascia below the lung root, anchoring the lung to the diaphragm","Loose double fold of mediastinal pleura below the lung root, running from hilum toward the diaphragmatic surface"],"k":2,"figs":["img/p/g2324_pulm_ligament.webp","img/p/g2324_c_lung_medial.webp"]},{"id":"24-15","q":"What is the function of the pulmonary ligament?","o":["Gives the root structures room to expand","Anchors the lung firmly to the diaphragm","Drains pleural fluid toward the hilum"],"k":0,"more":"<p>For example when venous return rises in exercise.<\/p>","figs":["img/p/g2324_pulm_ligament.webp"]},{"id":"24-16","q":"How does the visceral pleura differ in texture and extent from the parietal pleura?","o":["Shiny, inseparable from the lung; covers the costal surface only, not the fissures","Rough, easily stripped from the lung; covers all lung surfaces except the fissures and hilum","Shiny, inseparable from the lung; covers all lung surfaces, fissures included, except the hilum"],"k":2,"figs":["img/p/g2324_pulm_ligament.webp","img/p/g2324_c_lung_medial.webp"]}]},{"t":"Pleural recesses","qs":[{"id":"24-17","q":"What is a pleural recess?","o":["Where two layers of parietal pleura lie against each other with no lung between","Where visceral and parietal pleura lie against each other with lung between","Where the parietal pleura turns back to become visceral pleura at the hilum"],"k":0,"more":"<p>They exist because the lungs do not fill their pleural sacs completely.<\/p>","figs":["img/p/g2324_gil_recesses.webp"]},{"id":"24-18","q":"Where is the costomediastinal recess?","o":["Above the apex of the lung, where cervical pleura meets costal pleura","Behind the lung root, where mediastinal pleura meets vertebral pleura","Behind the sternum, where costal pleura meets mediastinal pleura"],"k":2,"figs":["img/24_lungs_4.webp","img/p/g2324_gil_transverse_recess.webp"]},{"id":"24-19","q":"Where is the costodiaphragmatic recess?","o":["Below the inferior border of the lung, between costal and diaphragmatic pleura","Below the lung root, between the two layers of the pulmonary ligament","Above the apex of the lung, between cervical and costal pleura"],"k":0,"more":"<p>It is the larger of the two recesses. The pleural cavity extends further down than the lung does.<\/p>","figs":["img/24_lungs_1.jpg","img/24_lungs_4.webp","img/p/g2324_gil_coronal_recess.webp"]},{"id":"24-20","q":"Which ribs does the costodiaphragmatic recess span in the midaxillary line?","o":["Roughly 10th &rarr; 12th ribs","Roughly 8th &rarr; 10th ribs","Roughly 6th &rarr; 8th ribs"],"k":1,"figs":["img/p/g2324_recess_views.webp","img/p/g2324_gil_cavity_table.webp"]},{"id":"24-21","q":"When does the lung fill the costodiaphragmatic recess?","o":["Only during a deep breath in","Throughout quiet breathing","Only during a forced breath out"],"k":0,"figs":["img/p/g2324_gil_breathing.webp"]},{"id":"24-22","q":"Which part of the pleural cavity fills first with a pleural effusion, and why?","o":["Costodiaphragmatic recess: the most anterior point of the cavity (in someone lying supine)","Costodiaphragmatic recess: the lowest point of the cavity (in someone sitting up)","Costomediastinal recess: the lowest point of the cavity (in someone sitting up)"],"k":1,"more":"<p>Because fluid collects there first, it is also where fluid is drained from.<\/p>","figs":["img/p/g2324_effusion_tap.webp"]}]},{"t":"Pleural nerves, vessels and disorders","qs":[{"id":"24-23","q":"What nerves supply the parietal pleura, and how pain-sensitive is it?","o":["Somatic (intercostal and vagus nerves) &rarr; poorly localised dull pain only","Autonomic (phrenic and splanchnic nerves) &rarr; exquisitely pain-sensitive","Somatic (intercostal and phrenic nerves) &rarr; exquisitely pain-sensitive"],"k":2,"more":"<p>Pain from its costal part localises well.<\/p>","figs":["img/p/g2324_gil_pleura_nerves.webp"]},{"id":"24-24","q":"What is the nerve supply of the visceral pleura, and is it pain-sensitive?","o":["Somatic only &rarr; exquisitely pain-sensitive","Phrenic nerve &rarr; sensitive to pain","Autonomic only &rarr; insensitive to pain"],"k":2,"figs":["img/p/g2324_gil_pleura_nerves.webp"]},{"id":"24-25","q":"Pleuritic chest pain comes from which layer of pleura?","o":["Parietal pleura","Pulmonary ligament","Visceral pleura"],"k":0,"figs":["img/p/g2324_gil_pleura_nerves.webp"]},{"id":"24-26","q":"Which nerves supply the costal pleura and the periphery of the diaphragmatic pleura?","o":["Pulmonary plexus","Phrenic nerves","Intercostal nerves"],"k":2,"figs":["img/p/g2324_gil_pleura_nerves.webp"]},{"id":"24-27","q":"Which nerve supplies the mediastinal pleura and the central diaphragmatic pleura?","o":["Phrenic nerve","Sympathetic trunk","Vagus nerve"],"k":0,"figs":["img/p/g2324_gil_pleura_nerves.webp"]},{"id":"24-28","q":"Which arteries supply the parietal pleura?","o":["Internal thoracic and bronchial arteries","Internal thoracic and posterior intercostal arteries","Pulmonary and posterior intercostal arteries"],"k":1,"more":"<p>The parietal pleura shares the blood supply of the chest wall.<\/p>","figs":["img/p/g2324_wall_arteries.webp"]},{"id":"24-29","q":"Where do the veins of the parietal pleura drain?","o":["Hemiazygos and pulmonary veins","Azygos and internal thoracic veins","Brachiocephalic and pulmonary veins"],"k":1,"figs":["img/p/g2324_wall_veins.webp"]},{"id":"24-30","q":"Where does lymph from the parietal pleura drain?","o":["Tracheobronchial and deep cervical nodes","Pulmonary and bronchopulmonary nodes","Parasternal, mediastinal and intercostal nodes"],"k":2,"figs":["img/p/g2324_gil_pleura_lymph.webp"]},{"id":"24-31","q":"What blood vessels supply and drain the visceral pleura?","o":["The lung&rsquo;s own bronchial vessels: bronchial arteries; bronchial veins &rarr; azygos system or left superior intercostal vein","The chest wall&rsquo;s vessels: internal thoracic arteries; internal thoracic veins &rarr; brachiocephalic veins","The intercostal vessels: posterior intercostal arteries; intercostal veins &rarr; azygos system"],"k":0,"figs":["img/p/g2324_bronchial_vessels.webp"]},{"id":"24-32","q":"Where does lymph from the visceral pleura drain?","o":["Deep cervical nodes","Parasternal nodes","Bronchopulmonary nodes"],"k":2,"figs":["img/p/g2324_gil_pleura_lymph.webp"]},{"id":"24-33","q":"What can be heard with a stethoscope in pleuritis, and why?","o":["Friction rub: the inflamed pleural layers rub together","Wheeze: narrowed bronchi vibrate with airflow","Stridor: the inflamed pleura narrows the trachea"],"k":0},{"id":"24-34","q":"What collects in the pleural cavity in pneumothorax, haemothorax, hydrothorax and chylothorax?","o":["Pneumothorax = fluid<br>Haemothorax = blood<br>Hydrothorax = air<br>Chylothorax = lymph","Pneumothorax = air<br>Haemothorax = blood<br>Hydrothorax = fluid<br>Chylothorax = lymph","Pneumothorax = air<br>Haemothorax = blood<br>Hydrothorax = lymph<br>Chylothorax = fluid"],"k":1,"figs":["img/p/g2324_pneumothorax.webp","img/p/g2324_effusion_tap.webp"]}]},{"t":"Lobes and surfaces of the lungs","qs":[{"id":"24-35","q":"How many lobes and which fissures does the right lung have?","o":["3 lobes; oblique + horizontal fissures","3 lobes; horizontal fissure only","2 lobes; oblique fissure only"],"k":0,"figs":["img/p/g24l_lobes.webp","img/24_lungs_2.jpg"]},{"id":"24-36","q":"How many lobes and which fissures does the left lung have?","o":["3 lobes; oblique + horizontal fissures","2 lobes; horizontal fissure only","2 lobes; oblique fissure only"],"k":2,"figs":["img/p/g24l_lobes.webp","img/24_lungs_3.jpg"]},{"id":"24-37","q":"Which two features of the left lung give up space to the heart?","o":["Hilum<br>Lingula (tongue-like)","Cardiac notch<br>Lingula (tongue-like)","Cardiac notch<br>Horizontal fissure"],"k":1,"figs":["img/p/g24l_lobes.webp","img/24_lungs_1.jpg","img/24_lungs_3.jpg"]},{"id":"24-38","q":"Compare the size and shape of the right and left lungs.","o":["Right: long and narrow, deep cardiac impression<br>Left: larger, heavier, short and wide, shallow cardiac impression","Right: larger, heavier, long and narrow, deep cardiac impression<br>Left: short and wide, shallow cardiac impression","Right: larger, heavier, short and wide, shallow cardiac impression<br>Left: long and narrow, deep cardiac impression"],"k":2,"more":"<p>Lobes and fissures do vary between people.<\/p>","figs":["img/p/g24l_lr_differences.webp","img/p/g24l_c_medial_impressions.webp"]},{"id":"24-39","q":"How high does the apex of the lung rise, and what artery lies against it?","o":["Level with the clavicle, not above it, under the costal pleura; against the subclavian artery","About an inch into the root of the neck, under the cervical pleura; against the subclavian artery","About an inch into the root of the neck, under the cervical pleura; against the common carotid artery"],"k":1,"more":"<p>Each lung is a cone; the apex is its top.<\/p>","figs":["img/24_lungs_2.jpg","img/24_lungs_4.webp","img/p/g2324_reflections.webp"]},{"id":"24-40","q":"What marks the costal surface of the lung?","o":["Impressions of the oesophagus","Impressions of the ribs","Impressions of the heart"],"k":1,"figs":["img/p/g24l_costal_surface.webp"]},{"id":"24-41","q":"What does the diaphragmatic surface of the right lung sit over?","o":["Stomach and spleen","Right lobe of the liver","Left lobe of the liver"],"k":1,"more":"<p>The diaphragmatic surface is concave.<\/p>","figs":["img/24_lungs_4.webp"]},{"id":"24-42","q":"What does the diaphragmatic surface of the left lung sit over?","o":["Left lobe of the liver<br>Stomach<br>Pancreas","Left lobe of the liver<br>Stomach<br>Spleen","Right lobe of the liver<br>Stomach<br>Spleen"],"k":1,"figs":["img/24_lungs_4.webp","img/p/g24l_c_below_diaphragm.webp"]},{"id":"24-43","q":"What does the mediastinal surface of the lung face, and what lies in its middle?","o":["Vertebrae in front, mediastinum behind; cardiac notch in the middle","Mediastinum behind, sternum in front; hilum in the middle","Vertebrae behind, mediastinum in front; hilum in the middle"],"k":2,"figs":["img/p/g24l_medial_surfaces.webp","img/p/g24l_c_section_t7.webp"]},{"id":"24-44","q":"Compare the anterior and posterior borders of the lung.","o":["Anterior: thick, shorter<br>Posterior: thin, beside the spine from C7 to T10","Anterior: thin, shorter<br>Posterior: thick, beside the spine from C7 to T10","Anterior: thin, shorter<br>Posterior: thick, beside the spine from T1 to T12"],"k":1,"figs":["img/p/g24l_medial_surfaces.webp","img/p/g24l_c_section_t7.webp","img/p/g24l_topo_posterior.webp"]},{"id":"24-45","q":"Why does healthy lung float in water while a stillborn baby&rsquo;s lungs sink?","o":["Healthy lung contains fat that is lighter than water; a stillborn&rsquo;s lungs lack fat","Healthy lung is spongy and air-filled; a stillborn&rsquo;s lungs were never aerated","Healthy lung has thin pleura; a stillborn&rsquo;s pleura is thickened and heavy"],"k":1},{"id":"24-46","q":"How does the colour of the lung change with age?","o":["Pink at birth &rarr; grey from years of inhaled carbon","Pink at birth &rarr; dark red from congestion with blood","Grey at birth &rarr; pink from increasing blood supply"],"k":0}]},{"t":"Hilum and root","qs":[{"id":"24-47","q":"What structures make up the root of each lung?","o":["1 main bronchus<br>1 pulmonary artery<br>1 pulmonary vein","1 main bronchus<br>1 pulmonary artery<br>2 pulmonary veins","1 main bronchus<br>2 pulmonary arteries<br>1 pulmonary vein"],"k":1,"figs":["img/p/g24l_medial_surfaces.webp","img/24_lungs_2.jpg","img/24_lungs_3.jpg"]},{"id":"24-48","q":"Which structures are the most anterior and inferior at the hilum of both lungs?","o":["Pulmonary veins","Main bronchi","Pulmonary arteries"],"k":0,"figs":["img/24_lungs_2.jpg","img/24_lungs_3.jpg"]},{"id":"24-49","q":"At the right hilum, which structure is most posterior, and what does &ldquo;eparterial&rdquo; mean?","o":["Main bronchus; one bronchial branch passes below the pulmonary artery (eparterial)","Main bronchus; one bronchial branch passes above the pulmonary artery (eparterial)","Pulmonary artery; one bronchial branch passes below the pulmonary vein (eparterial)"],"k":1,"more":"<p>The figure labels this branch the bronchus to the superior lobe.<\/p>","figs":["img/p/g24l_right_medial.webp","img/24_lungs_2.jpg"]},{"id":"24-50","q":"At the right hilum, where does the pulmonary artery lie relative to the bronchus?","o":["Anterior","Inferior","Superior"],"k":0,"figs":["img/24_lungs_2.jpg","img/p/g24l_right_medial.webp"]},{"id":"24-51","q":"Which structure is highest at the left hilum?","o":["Pulmonary artery","Main bronchus","Bronchial artery"],"k":0,"figs":["img/24_lungs_3.jpg"]},{"id":"24-52","q":"Which nerve passes in front of the lung root, and which behind it?","o":["Phrenic nerve in front<br>Sympathetic trunk behind","Phrenic nerve in front<br>Vagus nerve behind","Vagus nerve in front<br>Phrenic nerve behind"],"k":1,"figs":["img/p/g24l_right_mediastinum.webp","img/p/g24l_left_mediastinum.webp"]},{"id":"24-53","q":"Name the impressions on the mediastinal surface of the right lung.","o":["Right brachiocephalic vein<br>Superior vena cava<br>Azygos vein and its arch<br>Oesophagus<br>Trachea<br>Inferior vena cava","Left brachiocephalic vein<br>Superior vena cava<br>Azygos vein and its arch<br>Oesophagus<br>Trachea<br>Descending aorta","Right brachiocephalic vein<br>Left subclavian artery<br>Azygos vein and its arch<br>Oesophagus<br>Trachea<br>Inferior vena cava"],"k":0,"figs":["img/24_lungs_2.jpg","img/p/g24l_right_medial.webp"]},{"id":"24-54","q":"Which vein hooks over the root of the right lung?","o":["Arch of the hemiazygos vein","Arch of the azygos vein","Right brachiocephalic vein"],"k":1,"figs":["img/24_lungs_2.jpg","img/p/g24l_right_mediastinum.webp"]},{"id":"24-55","q":"Name the impressions on the mediastinal surface of the left lung.","o":["Aortic arch and descending aorta<br>Left subclavian artery<br>Left brachiocephalic vein<br>Oesophagus<br>Trachea<br>Azygos vein and its arch","Aortic arch and descending aorta<br>Left subclavian artery<br>Left brachiocephalic vein<br>Oesophagus<br>Trachea<br>Heart (apex, left ventricle, auricle)","Superior vena cava<br>Left subclavian artery<br>Left brachiocephalic vein<br>Oesophagus<br>Trachea<br>Heart (apex, left ventricle, auricle)"],"k":1,"figs":["img/24_lungs_3.jpg","img/p/g24l_left_medial.webp","img/p/g24l_c_heart_left.webp"]}]},{"t":"Surface markings and thoracentesis","qs":[{"id":"24-56","q":"What is the surface marking of the oblique fissure?","o":["Spine of T2 behind &rarr; 8th costal cartilage in front","Spine of T4 behind &rarr; 4th costal cartilage in front","Spine of T2 behind &rarr; 6th costal cartilage in front"],"k":2,"figs":["img/p/g24l_fissures_surface.webp","img/24_lungs_4.webp"]},{"id":"24-57","q":"What is the surface marking of the horizontal fissure?","o":["Forward from the oblique fissure along the 2nd rib and costal cartilage","Forward from the oblique fissure along the 6th rib and costal cartilage","Forward from the oblique fissure along the 4th rib and costal cartilage"],"k":2,"figs":["img/p/g24l_fissures_surface.webp","img/24_lungs_4.webp"]},{"id":"24-58","q":"How does the inferior border of the lung relate to the inferior border of the pleura?","o":["Lung and pleura lie at the same level all the way round","Lung lies two levels above the pleura all the way round","Lung lies two levels below the pleura all the way round"],"k":1,"more":"<table><tr><th>Line<\/th><th>Lung<\/th><th>Pleura<\/th><\/tr><tr><td>Midclavicular<\/td><td>6th rib<\/td><td>8th rib<\/td><\/tr><tr><td>Midaxillary<\/td><td>8th rib<\/td><td>10th rib<\/td><\/tr><tr><td>Beside the spine<\/td><td>T10<\/td><td>T12<\/td><\/tr><\/table>","figs":["img/p/g24l_lung_pleura_lines.webp","img/24_lungs_4.webp"]},{"id":"24-59","q":"In the midclavicular line, where are the inferior borders of the lung and the pleura?","o":["Lung: 8th rib<br>Pleura: 10th rib","Lung: 6th rib<br>Pleura: 8th rib","Lung: 4th rib<br>Pleura: 6th rib"],"k":1,"figs":["img/p/g24l_lung_pleura_lines.webp","img/p/g24l_lung_margin_ribs.webp","img/24_lungs_4.webp"]},{"id":"24-60","q":"In the midaxillary line, where are the inferior borders of the lung and the pleura?","o":["Lung: 8th rib<br>Pleura: 12th rib","Lung: 8th rib<br>Pleura: 10th rib","Lung: 6th rib<br>Pleura: 8th rib"],"k":1,"figs":["img/p/g24l_lung_pleura_lines.webp","img/p/g24l_lung_margin_ribs.webp","img/24_lungs_4.webp"]},{"id":"24-61","q":"Beside the spine, where are the inferior borders of the lung and the pleura?","o":["Lung: T8<br>Pleura: T10","Lung: T10<br>Pleura: T12","Lung: T12<br>Pleura: T10"],"k":1,"figs":["img/p/g24l_topo_posterior.webp","img/p/g24l_lung_margin_ribs.webp"]},{"id":"24-62","q":"Why is there a zone where a needle can enter the pleural cavity without touching lung?","o":["The lung retracts from the chest wall in expiration (the pulmonary ligament)","The pleura reaches lower than the lung at every point (the costodiaphragmatic recess)","The lung reaches lower than the pleura at every point (the costomediastinal recess)"],"k":1,"more":"<p>That mismatch between lung border and pleural border is the anatomy behind chest drainage.<\/p>","figs":["img/p/g24l_lung_pleura_lines.webp","img/p/g24l_lung_margin_ribs.webp"]},{"id":"24-63","q":"What is thoracentesis?","o":["Draining fluid, blood or pus from the costodiaphragmatic recess","Draining air from the apex of the pleural cavity","Draining fluid, blood or pus from the costomediastinal recess"],"k":0,"figs":["img/p/g24l_thoracentesis.webp"]},{"id":"24-64","q":"Where is the needle inserted for thoracentesis?","o":["5th intercostal space, midclavicular line","9th intercostal space, midaxillary line","7th intercostal space, midclavicular line"],"k":1,"more":"<p>Below the lung but inside the pleura.<\/p>","figs":["img/24_lungs_4.webp","img/p/g24l_thoracentesis.webp","img/p/g24l_lung_margin_ribs.webp"]},{"id":"24-65","q":"Why does the thoracentesis needle pass just above the rib below the space?","o":["Low enough to miss the collateral branches","High enough to miss the main intercostal bundle","High enough to miss the collateral branches"],"k":2,"figs":["img/p/g24l_thoracentesis.webp"]},{"id":"24-66","q":"Why is the thoracentesis needle angled upward?","o":["So it does not go through the lung into the bronchi","So it does not pierce the intercostal neurovascular bundle","So it does not go through the diaphragm into the liver"],"k":2,"figs":["img/p/g24l_thoracentesis.webp"]}]},{"t":"Trachea, bronchi and segments","qs":[{"id":"24-67","q":"At what level does the trachea divide into the two main bronchi?","o":["Body of T8","Sternal angle","Suprasternal notch"],"k":1,"figs":["img/p/g24l_left_bronchus_course.webp","img/p/g24l_sternal_angle_plane.webp"]},{"id":"24-68","q":"What is the carina?","o":["The cartilage ring at the start of the right main bronchus","The internal ridge between the lobar bronchi of the right lung","The internal ridge between the openings of the two main bronchi"],"k":2,"figs":["img/p/g24l_carina_trachea.webp","img/p/g24l_bronchoscopy.webp"]},{"id":"24-69","q":"What course does the left main bronchus take to reach its hilum?","o":["Below the aortic arch, in front of the oesophagus and thoracic aorta","Above the aortic arch, behind the oesophagus and thoracic aorta","Below the azygos arch, in front of the oesophagus and superior vena cava"],"k":0,"figs":["img/p/g24l_left_bronchus_course.webp"]},{"id":"24-70","q":"How does the right main bronchus differ from the left?","o":["Wider, shorter, more vertical","Wider, longer, more horizontal","Narrower, shorter, more vertical"],"k":0,"figs":["img/p/g24l_bronchial_tree.webp"]},{"id":"24-71","q":"Into which side do inhaled foreign bodies and aspirated material usually go, and why?","o":["Right: its main bronchus is wider, shorter and more vertical","Left: its main bronchus is wider, shorter and more vertical","Right: its main bronchus is narrower, longer and more horizontal"],"k":0,"more":"<p>There it can be seen through a bronchoscope.<\/p>","figs":["img/p/g24l_bronchoscopy.webp","img/p/g24l_bronchial_tree.webp"]},{"id":"24-72","q":"In what order does the bronchial tree branch?","o":["Main bronchus &rarr; lobar (secondary) bronchi &rarr; segmental (tertiary) bronchi &rarr; respiratory bronchioles &rarr; terminal bronchioles &rarr; alveolar ducts &rarr; alveolar sacs","Main bronchus &rarr; lobar (secondary) bronchi &rarr; segmental (tertiary) bronchi &rarr; terminal bronchioles &rarr; respiratory bronchioles &rarr; alveolar ducts &rarr; alveolar sacs","Main bronchus &rarr; segmental (secondary) bronchi &rarr; lobar (tertiary) bronchi &rarr; terminal bronchioles &rarr; respiratory bronchioles &rarr; alveolar ducts &rarr; alveolar sacs"],"k":1,"figs":["img/p/g24l_bronchial_tree.webp","img/p/g24l_c_bronchial_tree_gil.webp"]},{"id":"24-73","q":"How many lobar (secondary) bronchi are there on each side?","o":["Right: 2<br>Left: 3","Right: 3<br>Left: 3","Right: 3<br>Left: 2"],"k":2,"figs":["img/p/g24l_bronchial_tree.webp"]},{"id":"24-74","q":"What does each segmental (tertiary) bronchus supply?","o":["One pulmonary lobule","One bronchopulmonary segment","One alveolar sac"],"k":1,"figs":["img/p/g24l_segments_bronchi.webp"]},{"id":"24-75","q":"What shape is a bronchopulmonary segment?","o":["A pyramid, apex toward the root of the lung","A cone, apex toward the pleural surface","A pyramid, base toward the root of the lung"],"k":0,"figs":["img/p/g24l_segment_pyramid.webp"]},{"id":"24-76","q":"How many bronchopulmonary segments are there?","o":["Usually 18&ndash;20: 10 right, 8&ndash;10 left","Usually 18&ndash;20: 8&ndash;10 right, 10 left","Usually 22&ndash;24: 12 right, 10&ndash;12 left"],"k":0,"figs":["img/p/g24l_segments_anterior.webp"]},{"id":"24-77","q":"Why can a surgeon remove a single bronchopulmonary segment?","o":["Each segment is separated by a named fissure","Each segment is an independent respiratory unit","Each segment has its own pleural sac"],"k":1,"more":"<p>So the segment containing a lung cancer can be removed and the rest of the lung keeps working.<\/p>","figs":["img/p/g24l_segmentectomy.webp"]}]},{"t":"Blood, lymph and nerves of the lung","qs":[{"id":"24-78","q":"What are the two circulations of the lung, and the job of each?","o":["Pulmonary: gas exchange and feeding the bronchi<br>Bronchial: drains lymph from the visceral pleura","Pulmonary: gas exchange<br>Bronchial: feeds the lung&rsquo;s supporting tissue and the visceral pleura","Pulmonary: feeds the lung&rsquo;s supporting tissue and the visceral pleura<br>Bronchial: gas exchange"],"k":1,"figs":["img/p/g24l_alveolus_vessels.webp"]},{"id":"24-79","q":"Trace the pulmonary circulation through the lung.","o":["Right ventricle &rarr; pulmonary trunk &rarr; right/left pulmonary arteries &rarr; lobar &rarr; segmental arteries &rarr; capillaries &rarr; intersegmental veins &rarr; superior/inferior pulmonary veins &rarr; left atrium","Left ventricle &rarr; pulmonary trunk &rarr; right/left pulmonary arteries &rarr; lobar &rarr; segmental arteries &rarr; capillaries &rarr; intersegmental veins &rarr; superior/inferior pulmonar
