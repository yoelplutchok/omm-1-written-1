s &rarr; lymphatic duct of own side or venous angle","Superior and inferior (carinal) tracheobronchial nodes &rarr; bronchopulmonary (hilar) nodes &rarr; bronchomediastinal trunks &rarr; lymphatic duct of own side or venous angle","Bronchopulmonary (hilar) nodes &rarr; superior and inferior (carinal) tracheobronchial nodes &rarr; jugular trunks &rarr; thoracic duct of the opposite side only"],"k":0,"figs":["img/p/g24l_lung_lymph.webp"]},{"id":"24-85","q":"What is the venous angle?","o":["Where the external jugular and subclavian veins meet","Where the azygos vein joins the superior vena cava","Where the internal jugular and subclavian veins meet"],"k":2,"figs":["img/p/g24l_lung_lymph.webp"]},{"id":"24-86","q":"Through which plexuses do nerves reach the lung?","o":["Anterior and posterior oesophageal plexuses","Superior and inferior cardiac plexuses","Anterior and posterior pulmonary plexuses"],"k":2,"more":"<p>Autonomic plexuses whose fibres follow the bronchial tree as it branches.<\/p>","figs":["img/p/g24l_pulm_plexuses.webp"]},{"id":"24-87","q":"What is the source of the parasympathetic supply to the lung, and its effects?","o":["Phrenic nerve &rarr; bronchoconstriction, vasodilation, bronchial gland secretion","Vagus nerve &rarr; bronchodilation, vasoconstriction, inhibition of bronchial glands","Vagus nerve &rarr; bronchoconstriction, vasodilation, bronchial gland secretion"],"k":2,"more":"<p>Parasympathetic fibres also take part in the cough reflex and in monitoring blood gases.<\/p>","figs":["img/p/g24l_lung_autonomic.webp","img/p/g24l_pulm_plexuses.webp"]},{"id":"24-88","q":"What is the source of the sympathetic supply to the lung, and its effects?","o":["Sympathetic chain T2&ndash;T5 &rarr; bronchoconstriction, vasodilation, bronchial gland secretion","Sympathetic chain T6&ndash;T10 &rarr; bronchodilation, vasoconstriction, inhibition of alveolar glands","Sympathetic chain T2&ndash;T5 &rarr; bronchodilation, vasoconstriction, inhibition of alveolar glands"],"k":2,"figs":["img/p/g24l_lung_autonomic.webp"]}]},{"t":"Lung clinical correlations","qs":[{"id":"24-89","q":"What is the usual source of a pulmonary embolus?","o":["A clot from the left atrium, lodging in the pulmonary veins","A clot from a leg vein, lodging in the pulmonary arterial tree","A clot from a leg artery, lodging in the bronchial arteries"],"k":1,"figs":["img/p/g24l_pe_embolus.webp","img/p/g24l_c_dvt.webp"]},{"id":"24-90","q":"What happens if a pulmonary embolus blocks the pulmonary artery itself versus a segmental artery?","o":["Pulmonary artery &rarr; that segment can die (pulmonary infarct)<br>Segmental artery &rarr; acute respiratory distress","Pulmonary artery &rarr; acute respiratory distress<br>Segmental artery &rarr; that segment can die (pulmonary infarct)","Pulmonary artery &rarr; no symptoms, bronchial supply compensates<br>Segmental artery &rarr; acute respiratory distress"],"k":1,"figs":["img/p/g24l_pe_embolus.webp","img/p/g24l_c_saddle_pe.webp","img/p/g24l_c_infarct_ct.webp"]},{"id":"24-91","q":"What are the usual symptoms of a pulmonary embolus?","o":["Chest pain; gradual onset of productive cough","Chest pain; sudden shortness of breath (dyspnoea)","Fever; sudden painless loss of voice (hoarseness)"],"k":1},{"id":"24-92","q":"Where does a Pancoast tumour sit, and what does it press on?","o":["Hilum of the lung &rarr; vagus nerve + recurrent laryngeal nerve","Apex of the lung &rarr; upper trunk of the brachial plexus + phrenic nerve","Apex of the lung &rarr; lower trunk of the brachial plexus + sympathetic chain"],"k":2,"figs":["img/p/g24l_pancoast_cxr.webp","img/24_lungs_4.webp","img/p/g24l_oculosympathetic.webp","img/p/g24l_c_apex_relations.webp"]},{"id":"24-93","q":"What arm and hand signs does a Pancoast tumour cause?","o":["Severe pain down the lateral arm<br>Wasting of shoulder and upper arm muscles","Severe pain down the medial arm<br>Wasting of deltoid and biceps","Severe pain down the medial arm<br>Wasting of forearm and hand muscles"],"k":2,"more":"<p>From pressure on the lower trunk of the brachial plexus.<\/p>","figs":["img/p/g22a_bplexus.webp"]},{"id":"24-94","q":"What facial signs does a Pancoast tumour cause?","o":["Large pupil (mydriasis)<br>Drooping eyelid (ptosis)<br>Loss of sweating (anhidrosis)","Small pupil (miosis)<br>Drooping eyelid (ptosis)<br>Loss of sweating (anhidrosis)","Large pupil (mydriasis)<br>Wide-open eyelid (lid retraction)<br>Facial flushing"],"k":1,"more":"<p>From pressure on the sympathetic chain.<\/p>","figs":["img/p/g24l_horner_eyes.webp","img/p/g24l_oculosympathetic.webp"]},{"id":"24-95","q":"What does pneumonia do to the alveoli, and how does it show on a chest X-ray?","o":["Inflamed alveoli fill with fluid &rarr; localised radiodense area","Alveoli fill with air and over-expand &rarr; localised radiolucent area","Alveoli collapse completely &rarr; diffuse radiolucent lung fields"],"k":0,"more":"<p>It can bring up blood-stained sputum.<\/p>","figs":["img/p/g24l_pneumonia_cxr.webp","img/p/g24l_c_pneumonia_alveoli.webp"]},{"id":"24-96","q":"What percussion note is heard over air, fluid and solid tissue?","o":["Air: resonant<br>Fluid: flat<br>Solid: dull","Air: resonant<br>Fluid: dull<br>Solid: flat","Air: dull<br>Fluid: resonant<br>Solid: flat"],"k":1,"figs":["img/p/g24l_percussion.webp"]},{"id":"24-97","q":"What percussion note do you expect over the liver and spleen, and over the scapula and thick muscle?","o":["Liver/spleen: resonant<br>Scapula/thick muscle: dull","Liver/spleen: dull to flat<br>Scapula/thick muscle: flat","Liver/spleen: hyperresonant<br>Scapula/thick muscle: dull"],"k":1,"figs":["img/p/g24l_percussion.webp"]}]}]},{"n":26,"key":"anat","t":"How the lungs are built","sub":"Oct 9","cp2":false,"secs":[{"t":"Origin of the respiratory system","qs":[{"id":"26-0","q":"From what does the respiratory system begin?","o":["An ingrowth of ectoderm from the stomodeum (nasal placode)","An outpouching from the foregut (respiratory diverticulum)","An outpouching from the hindgut (respiratory diverticulum)"],"k":1,"more":"<p>It grows downward and branches repeatedly.<\/p>","figs":["img/26_respdev_1.webp"]},{"id":"26-1","q":"When and from where does the laryngotracheal diverticulum appear?","o":["Day 22 (week 3), from the dorsal wall of the primordial pharynx","Day 28 (week 4), from the ventral wall of the primordial pharynx","Day 28 (week 4), from the dorsal wall of the primordial pharynx"],"k":1,"more":"<p>Also called the respiratory diverticulum or lung bud; it is the first sign of the respiratory system.<\/p>","figs":["img/26_respdev_1.webp"]},{"id":"26-2","q":"What is the laryngotracheal groove, and what does it become?","o":["Opening of the tracheo-oesophageal fold &rarr; laryngeal inlet","Opening of the laryngotracheal diverticulum &rarr; laryngeal inlet","Opening of the laryngotracheal diverticulum &rarr; foramen caecum"],"k":1,"figs":["img/p/gdev_larynx_groove.webp"]},{"id":"26-3","q":"Which germ layer forms the lining of the respiratory tract, and what does it give?","o":["Endoderm &rarr; lung epithelium + cartilage of larynx, trachea and bronchi","Ectoderm &rarr; lung epithelium + glands of larynx, trachea and bronchi","Endoderm &rarr; lung epithelium + glands of larynx, trachea and bronchi"],"k":2,"figs":["img/p/gdev_trachea_layers.webp","img/26_respdev_1.webp"]},{"id":"26-4","q":"What forms the cartilage, muscle and connective tissue around the airway?","o":["Splanchnic mesoderm","Somatic mesoderm","Neural crest"],"k":0,"figs":["img/p/gdev_trachea_layers.webp","img/26_respdev_1.webp"]},{"id":"26-5","q":"What do the laryngeal muscles and cartilages develop from, and what nerve does that give the larynx?","o":["Mesoderm of pharyngeal arch 3 &rarr; glossopharyngeal nerve (cranial nerve IX)","Mesoderm of pharyngeal arches 1 and 2 &rarr; trigeminal nerve (cranial nerve V)","Mesoderm of pharyngeal arches 4 and 6 &rarr; vagus nerve (cranial nerve X)"],"k":2,"more":"<p>The larynx is the exception: its walls come from the arches, not from splanchnic mesoderm.<\/p>","figs":["img/p/gdev_larynx_groove.webp","img/p/gdev_c_vagus_laryngeal.webp"]}]},{"t":"Separating airway from oesophagus","qs":[{"id":"26-6","q":"Why must a septum grow between the developing airway and the oesophagus?","o":["The airway buds off the gut tube (midgut)","The oesophagus buds off the airway","The airway buds off the gut tube (foregut)"],"k":2,"figs":["img/26_respdev_1.webp"]},{"id":"26-7","q":"How does the tracheo-oesophageal septum form?","o":["Tracheo-oesophageal folds grow in from the sides and fuse","The foregut lumen recanalises after an epithelial plug","Tracheo-oesophageal folds grow down from the pharynx and fuse"],"k":0,"figs":["img/26_respdev_1.webp"]},{"id":"26-8","q":"What does the tracheo-oesophageal septum divide the foregut into?","o":["Ventral laryngotracheal tube<br>Dorsal stomach","Dorsal laryngotracheal tube<br>Ventral oesophagus","Ventral laryngotracheal tube<br>Dorsal oesophagus"],"k":2,"figs":["img/26_respdev_1.webp"]}]},{"t":"Tracheo-oesophageal fistula","qs":[{"id":"26-9","q":"What causes a tracheo-oesophageal fistula?","o":["Incomplete separation by the tracheo-oesophageal septum &rarr; persistent trachea&ndash;oesophagus connection","Incomplete recanalisation of the oesophagus &rarr; persistent trachea&ndash;oesophagus connection","Failure of the lung bud to branch &rarr; persistent trachea&ndash;oesophagus connection"],"k":0,"more":"<p>Often occurs with oesophageal atresia.<\/p>","figs":["img/p/gdev_tef_a.webp"]},{"id":"26-10","q":"Why does a pregnancy with tracheo-oesophageal fistula often show polyhydramnios?","o":["The fetus cannot swallow amniotic fluid normally","The fetus swallows amniotic fluid into the lungs","The fetal lungs secrete excess fluid into the amnion"],"k":0,"figs":["img/p/gdev_tef_a.webp"]},{"id":"26-11","q":"How common is tracheo-oesophageal fistula, and which sex is more affected?","o":["About 1 in 3000&ndash;4500 live births; boys more often","About 1 in 300&ndash;450 live births; girls more often","About 1 in 3000&ndash;4500 live births; girls more often"],"k":0,"figs":["img/26_respdev_2.webp"]},{"id":"26-12","q":"What is the commonest variety of tracheo-oesophageal fistula (about 85%)?","o":["H-type fistula between trachea and oesophagus, with no atresia","Oesophageal atresia (blind lower pouch) + fistula between trachea and upper oesophagus","Oesophageal atresia (blind upper pouch) + fistula between trachea and lower oesophagus"],"k":2,"figs":["img/p/gdev_tef_a.webp","img/26_respdev_2.webp"]},{"id":"26-13","q":"Name the other three varieties of tracheo-oesophageal fistula.","o":["Laryngeal cleft, no atresia<br>Atresia + fistula from the upper pouch<br>Atresia + fistulas at both ends","H-type fistula, no atresia<br>Atresia + fistula from the lower pouch<br>Tracheal atresia + fistula","H-type fistula, no atresia<br>Atresia + fistula from the upper pouch<br>Atresia + fistulas at both ends"],"k":2,"figs":["img/26_respdev_2.webp"]},{"id":"26-14","q":"What is seen in the mouth and nose of a newborn with oesophageal atresia and fistula?","o":["Excess saliva: fine white frothy mucus that returns after suctioning","Dry mouth: no saliva because swallowing is absent","Clear watery rhinorrhoea that clears with suctioning"],"k":0,"figs":["img/p/gdev_tef_a.webp"]},{"id":"26-15","q":"What happens at feeds in a newborn with oesophageal atresia and fistula?","o":["Feeds well; projectile non-bilious vomiting after a few weeks","Chokes and gags but never regurgitates milk (because of the fistula)","Chokes, gags and turns cyanotic; regurgitates milk (because of the atresia)"],"k":2,"figs":["img/p/gdev_tef_a.webp"]},{"id":"26-16","q":"How can tracheo-oesophageal fistula cause aspiration pneumonia or pneumonitis?","o":["Saliva cannot drain into the stomach","The septum compresses the main bronchi","Stomach contents reflux into the lungs"],"k":2,"figs":["img/p/gdev_tef_a.webp"]},{"id":"26-17","q":"What prenatal findings suggest tracheo-oesophageal fistula with atresia?","o":["Oligohydramnios<br>Small or absent stomach bubble on ultrasound<br>Low fetal weight","Polyhydramnios<br>Small or absent stomach bubble on ultrasound<br>Low fetal weight","Polyhydramnios<br>Large dilated stomach bubble on ultrasound<br>High fetal weight"],"k":1,"more":"<p>The stomach bubble is the fluid-filled fetal stomach.<\/p>"},{"id":"26-18","q":"How is tracheo-oesophageal fistula with atresia usually diagnosed after birth?","o":["A catheter cannot be passed from the nose into the trachea","A catheter cannot be passed from the mouth into the stomach","A chest X-ray shows a double bubble sign"],"k":1,"more":"<p>Most cases are diagnosed after birth, between birth and about 12 days.<\/p>","figs":["img/p/gdev_ea_xray.webp"]},{"id":"26-19","q":"How is tracheo-oesophageal fistula treated?","o":["Medical; nasogastric feeding until the fistula closes spontaneously","Surgery; always performed immediately regardless of size or complications","Surgery; postponed if the baby is very small or has complications such as pneumonia"],"k":2}]},{"t":"Bronchial buds and pleura","qs":[{"id":"26-20","q":"What does the distal end of the laryngotracheal tube swell into?","o":["The laryngeal bud","The tracheal bud","The respiratory bud"],"k":2,"figs":["img/26_respdev_1.webp"]},{"id":"26-21","q":"By week 5, what has the respiratory bud split into?","o":["Two bronchial buds","Three bronchial buds","Two tracheal buds"],"k":0,"figs":["img/26_respdev_3.webp"]},{"id":"26-22","q":"Why does the right lung have three lobes and the left two?","o":["Bronchial buds branch into 3 secondary (lobar) bronchi on the right, 2 on the left","Bronchial buds branch into 3 secondary (lobar) bronchi on the left, 2 on the right","Bronchial buds branch into 3 tertiary (segmental) bronchi on the right, 2 on the left"],"k":0,"figs":["img/26_respdev_3.webp"]},{"id":"26-23","q":"Into which canals do the growing lung buds push, and what do they become?","o":["Pleuroperitoneal canals &rarr; peritoneal cavity","Pericardioperitoneal canals &rarr; pericardial cavity","Pericardioperitoneal canals &rarr; pleural cavities"],"k":2,"figs":["img/p/gdev_pleura.webp"]},{"id":"26-24","q":"What does the visceral pleura develop from?","o":["Splanchnic mesoderm of the septum transversum","Splanchnic mesoderm carried as a coat on the growing lung buds","Somatic mesoderm lining the body wall"],"k":1,"figs":["img/p/gdev_pleura.webp"]},{"id":"26-25","q":"What does the parietal pleura develop from?","o":["Endoderm lining the pericardioperitoneal canals","Splanchnic mesoderm covering the lung buds","Somatic mesoderm lining the body wall"],"k":2,"figs":["img/p/gdev_pleura.webp"]}]},{"t":"Stages of lung maturation","qs":[{"id":"26-26","q":"Name the four stages of lung maturation in order, with timing.","o":["Pseudoglandular 6&ndash;16 wk &rarr; canalicular 16&ndash;26 wk &rarr; terminal sac 26 wk&ndash;birth &rarr; alveolar 32 wk&ndash;8 yr","Pseudoglandular 6&ndash;16 wk &rarr; terminal sac 16&ndash;26 wk &rarr; canalicular 26 wk&ndash;birth &rarr; alveolar 32 wk&ndash;8 yr","Canalicular 6&ndash;16 wk &rarr; pseudoglandular 16&ndash;26 wk &rarr; terminal sac 26 wk&ndash;birth &rarr; alveolar 32 wk&ndash;8 yr"],"k":0,"more":"<p>Some newer textbooks give overlapping windows: about 5&ndash;17 weeks, 16&ndash;25 weeks, 24 weeks to late fetal life, and late fetal life to 8 years.<\/p>","figs":["img/26_respdev_4.jpg"]},{"id":"26-27","q":"What forms in the pseudoglandular stage (6&ndash;16 weeks)?","o":["Branching airways: simple columnar endodermal tubes &rarr; about 15&ndash;25 terminal bronchioles; few capillaries","Branching airways: simple squamous endodermal tubes &rarr; about 15&ndash;25 respiratory bronchioles; rich capillaries","Branching airways: simple columnar mesodermal tubes &rarr; about 150&ndash;250 terminal bronchioles; rich capillaries"],"k":0,"more":"<p>The lung looks like a gland.<\/p>","figs":["img/p/gdev_stages_ab.webp","img/26_respdev_4.jpg"]},{"id":"26-28","q":"Why is no gas exchange possible in the pseudoglandular stage?","o":["There is no surfactant yet","The airways are filled with mucus","There are ducts but no alveoli"],"k":2,"figs":["img/p/gdev_stages_ab.webp"]},{"id":"26-29","q":"What changes in the canalicular stage (16&ndash;26 weeks)?","o":["Airways narrow, tissue avascular; terminal bronchiole &rarr; &ge;3 alveolar ducts &rarr; 3&ndash;6 respiratory bronchioles (simple columnar)","Airways widen, type II cells appear; respiratory bronchiole &rarr; &ge;3 terminal bronchioles &rarr; 3&ndash;6 alveolar sacs (simple squamous)","Airways widen, tissue vascularised; terminal bronchiole &rarr; &ge;3 respiratory bronchioles &rarr; 3&ndash;6 alveolar ducts (simple cuboidal)"],"k":2,"figs":["img/p/gdev_stages_ab.webp","img/26_respdev_4.jpg"]},{"id":"26-30","q":"When does respiration first become (just about) possible?","o":["At the very start of the alveolar stage","At the very end of the terminal sac stage","At the very end of the canalicular stage"],"k":2,"more":"<p>Babies born before 20 weeks usually do not survive.<\/p>","figs":["img/p/gdev_stages_ab.webp"]},{"id":"26-31","q":"What happens to the terminal sacs in the terminal sac stage (26 weeks to birth)?","o":["They bud from alveolar ducts and thin out; capillaries bulge into them","They fuse into alveolar ducts and thicken; capillaries regress from them","They bud from terminal bronchioles and thicken; capillaries stay separate"],"k":0,"figs":["img/p/gdev_stages_cd.webp","img/26_respdev_4.jpg"]},{"id":"26-32","q":"In the terminal sac stage, what does the cuboidal lining become, and what do those cells form?","o":["Type II pneumocytes &rarr; with capillaries, the blood&ndash;air barrier","Type I pneumocytes &rarr; with macrophages, the surfactant layer","Type I pneumocytes &rarr; with capillaries, the blood&ndash;air barrier"],"k":2,"figs":["img/p/gdev_alv_barrier.webp","img/p/gdev_stages_cd.webp"]},{"id":"26-33","q":"In which stage do type II cells appear and surfactant production begin?","o":["Canalicular stage (16&ndash;26 weeks)","Terminal sac stage (26 weeks to birth)","Pseudoglandular stage (6&ndash;16 weeks)"],"k":1,"figs":["img/p/gdev_alv_barrier.webp"]},{"id":"26-34","q":"At what gestational age can babies survive with intensive care?","o":["32&ndash;34 weeks","20&ndash;22 weeks","25&ndash;28 weeks"],"k":2,"figs":["img/p/gdev_stages_cd.webp"]},{"id":"26-35","q":"How many alveoli are there at birth versus age 8, and how are new ones made?","o":["20&ndash;70 million &rarr; 300&ndash;400 million; by septation and branching of existing alveoli","20&ndash;70 million &rarr; 300&ndash;400 million; by enlargement of existing alveoli only","2&ndash;7 million &rarr; 30&ndash;40 million; by septation and branching of existing alveoli"],"k":0,"more":"<p>This is the alveolar stage (32 weeks to 8 years), running from late fetal life well into childhood.<\/p>","figs":["img/26_respdev_4.jpg"]},{"id":"26-36","q":"Which two things must arrive together for a premature baby to be viable?","o":["Thin enough blood&ndash;air barrier<br>Enough haemoglobin F to load oxygen","Thick enough blood&ndash;air barrier<br>Enough surfactant to stop alveoli overinflating","Thin enough blood&ndash;air barrier<br>Enough surfactant to stop alveoli collapsing"],"k":2,"more":"<p>Delivery before surfactant is adequate causes neonatal respiratory distress syndrome.<\/p>","figs":["img/p/gdev_alv_barrier.webp"]}]},{"t":"Surfactant and respiratory distress syndrome","qs":[{"id":"26-37","q":"Which cells make surfactant, and what does it do?","o":["Type II pneumocytes; increases surface tension in the alveolus","Type II pneumocytes; reduces surface tension in the alveolus","Type I pneumocytes; reduces surface tension in the alveolus"],"k":1,"figs":["img/p/gdev_alv_barrier.webp","img/p/gdev_surfactant.webp"]},{"id":"26-38","q":"Why do the smallest alveoli collapse without surfactant?","o":["Law of Laplace: larger radius &rarr; higher collapsing pressure","Boyle&rsquo;s law: smaller volume &rarr; higher collapsing pressure","Law of Laplace: smaller radius &rarr; higher collapsing pressure"],"k":2,"figs":["img/p/gdev_surfactant.webp"]},{"id":"26-39","q":"How can surfactant production be accelerated before a preterm delivery?","o":["Insulin given to the mother","Thyroxine given to the mother","Steroids given to the mother"],"k":2},{"id":"26-40","q":"What is respiratory distress syndrome (RDS) of the newborn, its other name, and how common is it?","o":["Surfactant deficiency in a premature baby; bronchopulmonary dysplasia; about 0.2% of live newborns","Meconium aspiration in a premature baby; hyaline membrane disease; about 2% of live newborns","Surfactant deficiency in a premature baby; hyaline membrane disease; about 2% of live newborns"],"k":2,"figs":["img/p/gdev_irds.webp"]},{"id":"26-41","q":"What are the signs of neonatal respiratory distress syndrome?","o":["Effortful or abnormal breathing<br>Plethora<br>Episodes of apnoea<br>More urine","Effortful or abnormal breathing<br>Cyanosis<br>Episodes of apnoea<br>Less urine","Effortful or abnormal breathing<br>Jaundice<br>Episodes of seizures<br>Less urine"],"k":1},{"id":"26-42","q":"How is neonatal respiratory distress syndrome treated?","o":["Artificial surfactant, oxygen, continuous positive airway pressure (CPAP)","Corticosteroids to the newborn, oxygen, routine mechanical ventilation","Artificial surfactant, nitric oxide, extracorporeal membrane oxygenation (ECMO)"],"k":0,"more":"<p>Mechanical ventilation is kept for severe cases and avoided when possible.<\/p>"}]},{"t":"Fetal breathing and birth","qs":[{"id":"26-43","q":"What do fetal breathing movements do?","o":["Draw in amniotic fluid &rarr; supply nutrients to the developing lung epithelium","Expel amniotic fluid &rarr; condition breathing muscles and stimulate lung maturation","Draw in amniotic fluid &rarr; condition breathing muscles and stimulate lung maturation"],"k":2},{"id":"26-44","q":"How full of fluid are the lungs at birth?","o":["About a quarter full","About half full","About one-tenth full"],"k":1},{"id":"26-45","q":"By which three routes is lung fluid cleared at birth?","o":["Out through mouth and nose (chest squeezed in vaginal delivery)<br>Into pulmonary capillaries, arteries and veins<br>Into lymphatics","Out through mouth and nose (chest squeezed in caesarean delivery)<br>Into pulmonary capillaries, arteries and veins<br>Into lymphatics","Out through mouth and nose (chest squeezed in vaginal delivery)<br>Into pulmonary capillaries, arteries and veins<br>Into the pleural cavity"],"k":0},{"id":"26-46","q":"What changes in the lungs and circulation at birth?","o":["Lungs: gas-exchanging &rarr; secretory; surfactant production begins for the first time<br>Pulmonary and systemic circulations become separate circuits","Lungs: secretory &rarr; gas-exchanging; surfactant released into alveolar sacs<br>Pulmonary and systemic circulations become joined in parallel","Lungs: secretory &rarr; gas-exchanging; surfactant released into alveolar sacs<br>Pulmonary and systemic circulations become separate circuits"],"k":2,"figs":["img/p/gdev_postnatal.webp","img/p/gdev_alv_barrier.webp"]}]},{"t":"Diaphragm development and hernia","qs":[{"id":"26-47","q":"Name the four sources of the diaphragm.","o":["Septum transversum<br>Pleuroperitoneal folds (membranes)<br>Muscular ingrowth from the body wall<br>Ventral mesentery of the stomach","Septum transversum<br>Pleuropericardial folds (membranes)<br>Muscular ingrowth from the body wall<br>Dorsal mesentery of the oesophagus","Septum transversum<br>Pleuroperitoneal folds (membranes)<br>Muscular ingrowth from the body wall<br>Dorsal mesentery of the oesophagus"],"k":2,"figs":["img/26_respdev_5.webp"]},{"id":"26-48","q":"What does the septum transversum become in the diaphragm?","o":["Central tendon","Posterolateral margins","Peripheral muscle"],"k":0,"figs":["img/26_respdev_5.webp"]},{"id":"26-49","q":"What does the dorsal mesentery of the oesophagus form in the diaphragm?","o":["Central tendon","Crura","Posterolateral parts"],"k":1,"figs":["img/26_respdev_5.webp"]},{"id":"26-50","q":"What happens if the components of the diaphragm fail to fuse?","o":["Abdominal contents herniate into the chest (congenital diaphragmatic hernia)","Abdominal contents herniate into the pericardium (Morgagni hernia)","Abdominal contents herniate into the umbilical cord (omphalocele)"],"k":0,"figs":["img/p/gdev_cdh_mri.webp","img/p/gdev_cdh_xray.webp"]},{"id":"26-51","q":"Why is a congenital diaphragmatic hernia dangerous for the lung?","o":["It compresses the developing heart &rarr; pulmonary hypoplasia","It compresses the developing lung &rarr; pulmonary hypoplasia","It compresses the developing lung &rarr; tracheo-oesophageal fistula"],"k":1,"more":"<p>The lung never gets room to grow; the problem is as much the lung as the hole.<\/p>","figs":["img/p/gdev_cdh_mri.webp"]},{"id":"26-52","q":"On which side, and where, does congenital diaphragmatic hernia usually occur?","o":["Right, posterolateral (Bochdalek type)","Left, posterolateral (Bochdalek type)","Right, anteromedial (Morgagni type)"],"k":1,"figs":["img/26_respdev_5.webp","img/p/gdev_cdh_xray.webp"]},{"id":"26-53","q":"Why is congenital diaphragmatic hernia usually on the left?","o":["Left pleuroperitoneal membrane lags in development and never fully fuses","Right pleuroperitoneal membrane lags in development and never fully fuses","Left septum transversum is thinner and never fully fuses"],"k":0,"figs":["img/26_respdev_5.webp"]},{"id":"26-54","q":"In a left posterolateral diaphragmatic hernia, what herniates and what does it do to the heart?","o":["Small intestine, colon, spleen, stomach &rarr; compress the heart in place","Liver, kidney, adrenal gland &rarr; push the heart across","Small intestine, colon, spleen, stomach &rarr; push the heart across"],"k":2,"more":"<p>About half of these babies survive.<\/p>","figs":["img/p/gdev_cdh_xray.webp","img/p/gdev_cdh_mri.webp"]},{"id":"26-55","q":"What nerve supplies the diaphragm, and why that nerve?","o":["Phrenic nerve (C3&ndash;C5): picked up where the diaphragm first formed, in the neck","Vagus nerve (CN X): picked up where the diaphragm first formed, in the neck","Phrenic nerve (C5&ndash;C7): picked up where the diaphragm first formed, in the chest"],"k":0,"figs":["img/p/gdev_phrenic.webp"]}]},{"t":"Pulmonary hypoplasia","qs":[{"id":"26-56","q":"What is pulmonary hypoplasia, and is it usually primary or secondary?","o":["Incomplete development of lung tissue; usually primary (genetic)","Overgrowth of lung tissue; usually secondary to something else","Incomplete development of lung tissue; usually secondary to something else"],"k":2,"figs":["img/p/gdev_cdh_mri.webp"]},{"id":"26-57","q":"Which two things does normal lung growth need?","o":["The right transcription factors<br>Enough amniotic fluid","Surfactant from type I cells<br>Enough amniotic fluid","The right transcription factors<br>Very little amniotic fluid"],"k":0},{"id":"26-58","q":"Besides diaphragmatic hernia, what is the classic cause of pulmonary hypoplasia?","o":["Oesophageal atresia","Bilateral renal agenesis","Tracheo-oesophageal fistula"],"k":1},{"id":"26-59","q":"How does bilateral renal agenesis cause pulmonary hypoplasia?","o":["No fetal urine &rarr; oligohydramnios &rarr; small thorax squeezed by the uterine wall","No fetal urine &rarr; oligohydramnios &rarr; lungs lack renal growth factors","Excess fetal urine &rarr; oligohydramnios &rarr; small thorax squeezed by the uterine wall"],"k":0},{"id":"26-60","q":"What is the clinical range and mortality of pulmonary hypoplasia?","o":["Always severe respiratory distress; mortality about 71&ndash;95%","No symptoms &rarr; severe respiratory distress; mortality about 11&ndash;25%","No symptoms &rarr; severe respiratory distress; mortality about 71&ndash;95%"],"k":2},{"id":"26-61","q":"In pulmonary hypoplasia, which way does the mediastinum shift, and what happens to breath sounds?","o":["Toward the affected side; breath sounds increased on that side","Toward the affected side; breath sounds reduced on that side","Away from the affected side; breath sounds reduced on that side"],"k":1,"figs":["img/p/gdev_c_pulm_hypo_xr.webp"]},{"id":"26-62","q":"Why can right-sided pulmonary hypoplasia be mistaken for dextrocardia?","o":["The mediastinum shifts toward the affected side, moving the heart to the left","The mediastinum shifts toward the affected side, moving the heart to the right","The mediastinum shifts away from the affected side, moving the heart to the right"],"k":1,"figs":["img/p/gdev_c_pulm_hypo_xr.webp"]},{"id":"26-63","q":"How is pulmonary hypoplasia managed?","o":["Maternal steroids to grow lung tissue; otherwise antibiotics until lungs cope","Fetal surgery always (e.g. closing the diaphragm); otherwise lung transplant at birth","Fetal surgery sometimes (e.g. relieving urinary obstruction so amniotic fluid recovers); otherwise ventilate until lungs cope"],"k":2,"more":"<p>The condition may be fatal.<\/p>"}]}]},{"n":25,"key":"anat","t":"How the heart is built","sub":"Oct 13","cp2":true,"secs":[{"t":"Tube to four chambers: looping","qs":[{"id":"25-0","q":"What three things must the heart tube do to become a four-chambered double pump?","o":["Loop<br>Fuse with the lung buds<br>Split its inflow in two","Loop<br>Divide by septa<br>Split its outflow in two","Lengthen<br>Divide by valves<br>Split its outflow in three"],"k":1,"more":"<p>Nearly every congenital heart defect is one of those three going wrong.<\/p>","figs":["img/p/gdev_heart_loop.webp","img/p/gdev_heart_septa.webp","img/p/gdev_spiral.webp"]},{"id":"25-1","q":"In looping, which way does the heart tube bend, and where does that put the chambers?","o":["To the right &rarr; atria up and behind, ventricles down and in front","To the right &rarr; atria down and in front, ventricles up and behind","To the left &rarr; atria up and behind, ventricles down and in front"],"k":0,"figs":["img/p/gdev_heart_loop.webp"]},{"id":"25-2","q":"What happens if the heart tube loops the wrong way?","o":["The chambers end up mirror-imaged","The outflow tract fails to divide","The chambers fail to septate"],"k":0,"figs":["img/p/gdev_heart_loop.webp"]}]},{"t":"Atrial septation","qs":[{"id":"25-3","q":"Why must the fetal atrial septum still let blood cross from right to left?","o":["The fetal lungs are not working, so blood must bypass them","The fetal right atrium must receive blood from the left","The fetal liver is not working, so blood must bypass it"],"k":0,"figs":["img/25_cvdev_1.jpg"]},{"id":"25-4","q":"How does the atrial septum divide the atria yet allow right-to-left flow?","o":["Two overlapping septa with a gap (the foramen ovale) acting as a one-way flap","A single septum with a permanent hole letting blood flow both ways","Two overlapping septa with a gap (the ductus arteriosus) acting as a one-way flap"],"k":0,"more":"<p>In the figure the two septa are the septum primum and septum secundum.<\/p>","figs":["img/25_cvdev_1.jpg"]},{"id":"25-5","q":"Why does the foramen ovale close at birth?","o":["Lungs open &rarr; left atrial pressure rises &rarr; flap pressed shut","Lungs open &rarr; oxygen rises &rarr; smooth muscle in the flap constricts","Lungs open &rarr; right atrial pressure rises &rarr; flap pressed shut"],"k":0,"figs":["img/25_cvdev_1.jpg","img/p/gdev_postnatal.webp"]},{"id":"25-6","q":"What results if the foramen ovale fails to seal?","o":["Atrial septal defect","Patent ductus arteriosus","Ventricular septal defect"],"k":0,"figs":["img/p/gdev_asd.webp"]}]},{"t":"Ventricular septation","qs":[{"id":"25-7","q":"How does the ventricular septum form?","o":["Forms from the spiral outflow septum alone, growing down to the apex","Grows down from the roof and meets tissue growing up from the floor","Grows up from the floor and meets tissue growing down from the outflow region"],"k":2,"figs":["img/25_cvdev_1.jpg","img/p/gdev_septum_inf.webp"]},{"id":"25-8","q":"What is the most common ventricular septal defect (VSD), and why?","o":["Membranous VSD: the membranous portion is the last part to close","Membranous VSD: the membranous portion is the first part to close","Muscular VSD: the muscular portion is the last part to close"],"k":0,"figs":["img/p/gdev_vsd.webp","img/p/gdev_c_membranous_septum.webp"]}]},{"t":"Outflow tract division","qs":[{"id":"25-9","q":"What divides the single outflow tract into aorta and pulmonary trunk?","o":["The septum primum","A spiral ridge of tissue (septum)","A straight ridge of tissue (septum)"],"k":1,"figs":["img/p/gdev_spiral.webp"]},{"id":"25-10","q":"Why do the aorta and pulmonary trunk wrap around each other?","o":["The ductus arteriosus pulls them together","The septum that divides them spirals","The heart tube loops to the right"],"k":1,"figs":["img/p/gdev_spiral.webp"]},{"id":"25-11","q":"What defect results if the spiral septum fails to form at all?","o":["Patent ductus arteriosus: aorta and pulmonary trunk stay connected","Persistent truncus arteriosus: aorta and pulmonary trunk stay one vessel","Transposition of the great arteries: vessels come off the wrong ventricles"],"k":1,"figs":["img/p/gdev_truncus.webp"]},{"id":"25-12","q":"What defect results if the outflow septum forms but does not spiral?","o":["Tetralogy of Fallot: aorta overrides both ventricles","Persistent truncus arteriosus: aorta and pulmonary trunk stay one vessel","Transposition of the great arteries: vessels come off the wrong ventricles"],"k":2,"figs":["img/p/gdev_tga.webp"]},{"id":"25-13","q":"What outflow septum error causes tetralogy of Fallot?","o":["Uneven division: septum sits too far back &rarr; aortic side too narrow","Straight division: septum fails to spiral &rarr; vessels on the wrong ventricles","Uneven division: septum sits too far forward &rarr; pulmonary side too narrow"],"k":2,"figs":["img/p/gdev_tof.webp"]},{"id":"25-14","q":"What are the four features of tetralogy of Fallot?","o":["Aortic stenosis<br>Ventricular septal defect<br>Overriding pulmonary trunk<br>Right ventricular hypertrophy","Pulmonary stenosis<br>Ventricular septal defect<br>Overriding aorta<br>Right ventricular hypertrophy","Pulmonary stenosis<br>Atrial septal defect<br>Overriding aorta<br>Left ventricular hypertrophy"],"k":1,"more":"<p>All are consequences of one septum sitting too far forward.<\/p>","figs":["img/p/gdev_tof.webp"]}]},{"t":"Fetal circulation","qs":[{"id":"25-15","q":"How many shunts does the fetal circulation have, and what does each do in general?","o":["Three; each carries blood to the placenta","Four; each bypasses one heart chamber","Three; each bypasses something not yet in use"],"k":2,"figs":["img/25_cvdev_2.jpg","img/p/gdev_netter_prenatal.webp"]},{"id":"25-16","q":"What does the ductus venosus bypass?","o":["The kidneys","The lungs","The liver"],"k":2,"figs":["img/25_cvdev_2.jpg","img/p/gdev_netter_prenatal.webp"]},{"id":"25-17","q":"What does the foramen ovale connect in fetal circulation, and what does it bypass?","o":["Right atrium &rarr; left atrium; bypasses the liver","Right atrium &rarr; left atrium; bypasses the lungs","Left atrium &rarr; right atrium; bypasses the lungs"],"k":1,"figs":["img/25_cvdev_2.jpg","img/p/gdev_netter_prenatal.webp"]},{"id":"25-18","q":"What does the ductus arteriosus connect, and what does it bypass?","o":["Aorta &rarr; pulmonary trunk; bypasses the lungs","Pulmonary trunk &rarr; aorta; bypasses the lungs","Pulmonary trunk &rarr; aorta; bypasses the liver"],"k":1,"figs":["img/25_cvdev_2.jpg","img/p/gdev_netter_prenatal.webp"]},{"id":"25-19","q":"Why do the three fetal shunts close at birth?","o":["The lungs collapse and pressures equalise","The lungs inflate and pressures reverse","The heart rate rises and the shunts are stretched shut"],"k":1,"more":"<p>Each shunt leaves a remnant:<\/p><ul><li>Ductus venosus → ligamentum venosum<\/li><li>Foramen ovale → fossa ovalis<\/li><li>Ductus arteriosus → ligamentum arteriosum<\/li><\/ul>","figs":["img/p/gdev_postnatal.webp"]}]}]}],"figs":{"img/01_circuit_1.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.1","img/01_circuit_2.webp":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.3","img/02_flow_1.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.2","img/02_flow_2.webp":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.5","img/02_flow_3.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.6","img/03_compliance_1.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.7","img/03_compliance_2.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.9","img/03_compliance_3.webp":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.10","img/03_compliance_4.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.8","img/04_electrics_1.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.11","img/04_electrics_2.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.12","img/04_electrics_3.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.16","img/04_electrics_4.webp":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.15","img/04_electrics_5.webp":"Course lecture &mdash; waves, segments and intervals of the EKG","img/04_electrics_6.webp":"Course lecture &mdash; sinus bradycardia","img/04_electrics_7.webp":"Course lecture &mdash; atrial fibrillation: irregular spacing, no P waves","img/04_electrics_8.webp":"Course lecture &mdash; atrial flutter: sawtooth waves between the QRS complexes","img/04_electrics_9.webp":"Course lecture &mdash; ventricular tachycardia: fast, regular, wide complexes arising in the ventricle","img/04_electrics_10.webp":"Course lecture &mdash; ventricular fibrillation: at the arrow, fast wide beats break down into chaotic waves with no QRS","img/05_pump_1.webp":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.21","img/05_pump_2.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.22","img/05_pump_3.png":"Costanzo, <i>Physiology<\/i> 6e &mdash; fig 4.18","img/05_pump_4.webp":"Course lecture &mdash; &beta;<sub>1<\/sub> (G<sub>s<\/sub> "Trachea, carina and main bronchi · <i>Lecture slide<\/i>","img/p/g24l_bronchoscopy.webp":"Carina and right main bronchus at bronchoscopy · <i>Lecture slide<\/i>","img/p/g24l_bronchial_tree.webp":"Main, lobar and segmental bronchi · <i>Netter 208<\/i>","img/p/g24l_c_bronchial_tree_gil.webp":"Segmental bronchus down to alveolar ducts and sacs · <i>Gilroy Atlas<\/i>","img/p/g24l_segments_bronchi.webp":"Each segmental bronchus supplies one segment · <i>Gilroy Atlas<\/i>","img/p/g24l_segment_pyramid.webp":"A bronchopulmonary segment, apex toward the root · <i>Lecture slide<\/i>","img/p/g24l_segments_anterior.webp":"Bronchopulmonary segments: 10 right, 8 left · <i>Netter 206<\/i>","img/p/g24l_segmentectomy.webp":"Segmentectomy: one segment removed · <i>Gilroy Atlas<\/i>","img/p/g24l_alveolus_vessels.webp":"Pulmonary and bronchial vessels at the alveoli · <i>Lecture slide<\/i>","img/p/g24l_c_pulm_vessels.webp":"Right ventricle, pulmonary trunk, pulmonary arteries and veins · <i>Gilroy Atlas<\/i>","img/p/g24l_c_pulm_arteries.webp":"Lobar and segmental branches of the pulmonary arteries · <i>Gilroy Atlas<\/i>","img/p/g24l_c_heart_base.webp":"Superior and inferior pulmonary veins entering the left atrium · <i>Netter 218<\/i>","img/p/g24l_bronchial_art_slide.webp":"Right and left bronchial arteries · <i>Lecture slide<\/i>","img/p/g24l_bronchial_arteries.webp":"Bronchial arteries from aorta and intercostal · <i>Netter 211<\/i>","img/p/g24l_bronchial_veins.webp":"Bronchial veins to azygos and accessory hemiazygos · <i>Gilroy Atlas<\/i>","img/p/g24l_bronchial_veins_slide.webp":"Right and left bronchial veins and their drainage · <i>Lecture slide<\/i>","img/p/g24l_lung_lymph.webp":"Lymph ducts enter where jugular and subclavian veins meet · <i>Lecture slide<\/i>","img/p/g24l_pulm_plexuses.webp":"Anterior and posterior pulmonary plexuses · <i>Lecture slide<\/i>","img/p/g24l_lung_autonomic.webp":"Vagus (blue) and T2–T5 sympathetic (red) to bronchi · <i>Gilroy Atlas<\/i>","img/p/g24l_pe_embolus.webp":"Embolus lodged in a pulmonary artery branch · <i>Wikimedia Commons<\/i>","img/p/g24l_c_dvt.webp":"Clot (thrombus) in a deep leg vein · <i>Wikimedia Commons<\/i>","img/p/g24l_c_saddle_pe.webp":"CT: emboli (arrows) in both main pulmonary arteries · <i>Wikimedia Commons<\/i>","img/p/g24l_c_infarct_ct.webp":"CT: wedge-shaped lung infarct (arrow) after embolism · <i>Wikimedia Commons<\/i>","img/p/g24l_pancoast_cxr.webp":"Pancoast tumour (P) at the right lung apex · <i>Wikimedia Commons<\/i>","img/p/g24l_oculosympathetic.webp":"Sympathetic chain to the eye passes the lung apex · <i>Wikimedia Commons<\/i>","img/p/g24l_c_apex_relations.webp":"Brachial plexus and sympathetic trunk at the cervical pleura · <i>Netter 234<\/i>","img/p/g24l_horner_eyes.webp":"Horner syndrome: right ptosis and miosis · <i>Wikimedia Commons<\/i>","img/p/g24l_pneumonia_cxr.webp":"Right middle lobe pneumonia: localised opacity · <i>Wikimedia Commons<\/i>","img/p/g24l_c_pneumonia_alveoli.webp":"Normal vs fluid-filled alveoli in pneumonia · <i>Wikimedia Commons<\/i>","img/p/g24l_percussion.webp":"Percussion: resonance over lung, flatness over bone · <i>Lecture slide<\/i>","img/p/gdev_larynx_groove.webp":"4th-arch tissue and arytenoid swellings frame the laryngeal inlet · <i>Lecture slide<\/i>","img/p/gdev_trachea_layers.webp":"Splanchnic mesoderm forms cartilage, muscle, connective tissue · <i>Lecture slide<\/i>","img/p/gdev_c_vagus_laryngeal.webp":"Vagus to larynx: superior laryngeal (arch 4), recurrent laryngeal (arch 6) · <i>Netter 214<\/i>","img/p/gdev_tef_a.webp":"Lower fistula lets stomach contents reach the trachea · <i>Lecture slide<\/i>","img/p/gdev_ea_xray.webp":"Contrast stops in the blind upper oesophageal pouch (X-ray) · <i>Wikimedia Commons<\/i>","img/p/gdev_pleura.webp":"Somatic mesoderm of the body wall gives parietal pleura · <i>Lecture slide<\/i>","img/p/gdev_stages_ab.webp":"B: canalicular stage (16–26 weeks) · <i>Lecture slide<\/i>","img/p/gdev_stages_cd.webp":"C: terminal sac stage (26 weeks to birth) · <i>Lecture slide<\/i>","img/p/gdev_alv_barrier.webp":"At birth type II pneumocytes release surfactant into the alveoli · <i>Wikimedia Commons<\/i>","img/p/gdev_surfactant.webp":"Without surfactant, surface tension collapses the alveolus · <i>Wikimedia Commons<\/i>","img/p/gdev_irds.webp":"Neonatal RDS: diffuse ground-glass lungs, air bronchograms · <i>Wikimedia Commons<\/i>","img/p/gdev_postnatal.webp":"After birth: ligamentum arteriosum, closed foramen, ligamentum venosum · <i>Gilroy Atlas<\/i>","img/p/gdev_phrenic.webp":"Phrenic nerves from C3–C5 descend to the diaphragm · <i>Netter 199<\/i>","img/p/gdev_c_pulm_hypo_xr.webp":"Right lung hypoplasia: heart shifted into the right chest · <i>Wikimedia Commons<\/i>","img/p/gdev_heart_loop.webp":"Normal rightward looping of the heart tube · <i>OpenStax<\/i>","img/p/gdev_heart_septa.webp":"Septa then divide it into four chambers · <i>OpenStax<\/i>","img/p/gdev_spiral.webp":"Ridge position rotates level by level: the septum spirals · <i>UNSW Embryology<\/i>","img/p/gdev_asd.webp":"Atrial septal defect: an opening between the atria · <i>CDC, Wikimedia Commons<\/i>","img/p/gdev_septum_inf.webp":"Septum rising from the floor meets aortic septum descending · <i>Gray's Anatomy 1918, Wikimedia Commons<\/i>","img/p/gdev_vsd.webp":"Ventricular septal defect: opening between the ventricles · <i>CDC, Wikimedia Commons<\/i>","img/p/gdev_c_membranous_septum.webp":"Membranous part of the interventricular septum, site of commonest VSD · <i>Netter 228<\/i>","img/p/gdev_truncus.webp":"Persistent truncus arteriosus: one vessel leaves both ventricles · <i>CDC, Wikimedia Commons<\/i>","img/p/gdev_tga.webp":"Transposition: aorta from right ventricle, pulmonary trunk from left · <i>CDC, Wikimedia Commons<\/i>","img/p/gdev_tof.webp":"The four features of tetralogy of Fallot · <i>Wikimedia Commons<\/i>","img/p/gdev_netter_prenatal.webp":"Ductus arteriosus: pulmonary trunk to aorta · <i>Netter 233<\/i>"}};
</script>
<script>
(() => {
const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem('cp1mc.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem('cp1mc.'+k,JSON.stringify(v))}catch(e){}}};
const SUBJ = [['all','All'],['phys','Physiology'],['hist','Histology'],['bio','Biochemistry'],['anat','Anatomy']];
const SN = Object.fromEntries(SUBJ);
const LET = 'ABC';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const strip = s => String(s).replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,' ');

// ---- data helpers
const QS = {};                     // id -> {q, l, j (section index), i (number within section, from 1)}
DATA.lessons.forEach(l => l.secs.forEach((s,j) => s.qs.forEach((q,i) => { QS[q.id] = {q, l, j, i:i+1}; })));
const total = Object.keys(QS).length;
const lessonQs = l => l.secs.flatMap(s => s.qs);
const byN = n => DATA.lessons.find(l => l.n === n);

// ---- per-viewer state (this browser)
let ans = store.get('ans3', {});                    // id -> picked option index (0-2)
let stars = new Set(store.get('stars', []));
let filt = store.get('filt', 'all');
const saveAns = () => store.set('ans3', ans);
const saveStars = () => store.set('stars', [...stars]);
const isRight = id => ans[id] !== undefined && ans[id] === QS[id].q.k;
const isWrong = id => ans[id] !== undefined && ans[id] !== QS[id].q.k;
function stat(qs){ let a=0,c=0; for (const q of qs){ if (ans[q.id]!==undefined){ a++; if (ans[q.id]===q.k) c++; } } return {t:qs.length,a,c}; }
const pct = (c,a) => a ? Math.round(c/a*100)+'%' : '';

// ---- views
let view = null;   // {type:'home'} | {type:'lesson', n} | {type:'study', kind:'sec'|'lesson'|'subj'|'starred'|'missed', n, j, k}
let only = '';     // '' | 'missed' | 'star'  (filter inside a study list)
let peek = false;  // show every answer without picking

function renderNav(){
  $('#subj').innerHTML = SUBJ.map(([k,t])=>`<button type="button" data-k="${k}" class="${k===filt?'on':''}">${t}</button>`).join('');
  $('#subj').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{filt=b.dataset.k;store.set('filt',filt);showHome();}));
}
function headSub(){
  const s = stat(Object.values(QS).map(x=>x.q));
  $('#hsub').textContent = `${DATA.lessons.length} lessons · ${total.toLocaleString()} questions` + (s.a ? ` · ${s.a.toLocaleString()} answered, ${pct(s.c,s.a)} right` : '');
}
function setHash(h){ history.replaceState(null,'',h?('#'+h):(location.pathname+location.search)); }
function showPane(study){ $('#home').hidden = study; $('#study').hidden = !study; document.body.classList.toggle('studying', study); }

function showHome(keep){
  view = {type:'home'}; renderNav(); showPane(false); setHash(''); headSub();
  const inF = l => filt==='all' || l.key===filt;
  const allQ = DATA.lessons.filter(inF).flatMap(lessonQs);
  const nst = allQ.filter(q=>stars.has(q.id)).length, nmiss = allQ.filter(q=>isWrong(q.id)).length;
  let h = filt==='all' ? `<p class="intro">Every card from the Cardio-Pulm 1 flashcards as a multiple-choice question with three choices, in the same lessons and sections. Open a lesson, then study it one section at a time; the questions in a section run down one page. Tap a choice to check it. Lessons tagged CP2 are not on the Oct 19 exam.</p>` : '';
  h += `<div class="starbar"><span>★ <b>${nst}</b> starred · ✗ <b>${nmiss}</b> missed${filt!=='all'?' in '+SN[filt]:''}</span><span class="sync">saved in this browser</span><span class="reviewbar">${nmiss?`<button type="button" class="miss" id="studyMissed">Redo missed →</button>`:''}${nst?`<button type="button" id="studyStars">Study starred →</button>`:''}</span></div>`;
  for (const [k,t] of SUBJ.slice(1)){
    if (filt!=='all' && filt!==k) continue;
    const ls = DATA.lessons.filter(l=>l.key===k), n = ls.reduce((a,l)=>a+lessonQs(l).length,0);
    h += `<div class="sect ${k}"><h2><span class="dot"></span>${t}<span class="ct">${ls.length} lessons · ${n} questions</span><button type="button" data-sub="${k}">Study all ${t.toLowerCase()}</button></h2><div class="lessons">`;
    for (const l of ls){
      const s = stat(lessonQs(l)), ns = lessonQs(l).filter(q=>stars.has(q.id)).length;
      h += `<button type="button" class="lrow ${k}" data-n="${l.n}"><span class="lt">${l.t}${l.cp2?'<span class="cp2tag">CP2</span>':''}</span>
        <span class="lm">${l.sub} · ${l.secs.length} sections${s.a?` · <b>${s.a}</b> done, <b>${pct(s.c,s.a)}</b> right`:''}${ns?`<span class="ls">★ ${ns}</span>`:''}</span><span class="lc"><b>${s.t}</b>questions</span>
        <span class="lp"><i style="width:${s.a/s.t*100}%"></i></span></button>`;
    }
    h += `</div></div>`;
  }
  $('#home').innerHTML = h;
  $('#home').querySelectorAll('.lrow').forEach(b=>b.addEventListener('click',()=>showLesson(+b.dataset.n)));
  $('#home').querySelectorAll('[data-sub]').forEach(b=>b.addEventListener('click',()=>study({kind:'subj',k:b.dataset.sub})));
  const sb=$('#studyStars'); if (sb) sb.addEventListener('click',()=>study({kind:'starred',k:filt}));
  const mb=$('#studyMissed'); if (mb) mb.addEventListener('click',()=>study({kind:'missed',k:filt}));
  if (!keep) window.scrollTo(0,0);
}

function showLesson(n, keep){
  const l = byN(n); if (!l) return showHome();
  view = {type:'lesson', n}; renderNav(); showPane(false); setHash('L'+n); headSub();
  const s = stat(lessonQs(l)), ns = lessonQs(l).filter(q=>stars.has(q.id)).length, nm = lessonQs(l).filter(q=>isWrong(q.id)).length;
  let h = `<div class="${l.key}"><div class="top"><button type="button" class="back" id="tolessons">← Lessons</button></div>
    <div class="lhead"><p class="ltitle" style="margin:0">${SN[l.key]}${l.cp2?' · CP2':''}</p><h2>${l.t}</h2><span class="lm">${l.sub} · ${l.secs.length} sections · ${s.t} questions${s.a?` · ${s.a} done, ${pct(s.c,s.a)} right`:''}</span></div>
    <div class="lacts"><button type="button" class="go" id="wholeL">Study whole lesson in order →</button>${nm?`<button type="button" class="rs" id="missL">✗ Redo ${nm} missed</button>`:''}${ns?`<button type="button" class="rs" id="starsL">★ Review ${ns} starred</button>`:''}</div>
    <div class="lessons">`;
  l.secs.forEach((sec,j)=>{
    const st = stat(sec.qs), sst = sec.qs.filter(q=>stars.has(q.id)).length;
    h += `<div class="trow"><button type="button" class="tm" data-j="${j}"><span class="tn">${j+1}</span><span class="tt">${sec.t}</span><span class="tc">${st.a?`<b>${st.a}</b>/${st.t} · ${pct(st.c,st.a)}`:`${st.t} questions`}</span><span class="tp2"><i style="width:${st.a/st.t*100}%"></i></span></button>${sst?`<button type="button" class="tr" data-r="${j}" aria-label="Review ${sst} starred in ${esc(strip(sec.t))}">★ ${sst}</button>`:''}</div>`;
  });
  h += `</div></div>`;
  $('#home').innerHTML = h;
  $('#tolessons').addEventListener('click',()=>showHome());
  $('#wholeL').addEventListener('click',()=>study({kind:'lesson',n}));
  const ml=$('#missL'); if (ml) ml.addEventListener('click',()=>study({kind:'lesson',n},'missed'));
  const sl=$('#starsL'); if (sl) sl.addEventListener('click',()=>study({kind:'lesson',n},'star'));
  $('#home').querySelectorAll('[data-j]').forEach(b=>b.addEventListener('click',()=>study({kind:'sec',n,j:+b.dataset.j})));
  $('#home').querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>study({kind:'sec',n,j:+b.dataset.r},'star')));
  if (!keep) window.scrollTo(0,0);
}

// groups for a study list: [{l, j, qs}]
function groups(v){
  const all = [];
  const add = (l,j) => all.push({l, j, qs:l.secs[j].qs});
  if (v.kind==='sec') add(byN(v.n), v.j);
  else if (v.kind==='lesson') byN(v.n).secs.forEach((_,j)=>add(byN(v.n),j));
  else DATA.lessons.filter(l=>v.k==='all'||l.key===v.k).forEach(l=>l.secs.forEach((_,j)=>add(l,j)));
  return all;
}
function keepQ(v, q){
  if (v.kind==='starred' || only==='star') { if (!stars.has(q.id)) return false; }
  if (v.kind==='missed' || only==='missed') { if (!isWrong(q.id)) return false; }
  return true;
}
let frozen = null;   // ids shown in a filtered list stay put while you answer them

function study(v, o){
  only = o || ''; peek = false;
  view = Object.assign({type:'study'}, v);
  frozen = null;
  renderStudy(true);
}
function scopeTitle(v){
  if (v.kind==='sec'){ const l=byN(v.n); return {kicker:`${l.t} · Section ${v.j+1} of ${l.secs.length}`, title:l.secs[v.j].t, key:l.key}; }
  if (v.kind==='lesson'){ const l=byN(v.n); return {kicker:`${SN[l.key]} · ${l.sub}`, title:l.t, key:l.key}; }
  const k = v.k, nm = k==='all' ? 'All subjects' : SN[k];
  if (v.kind==='starred') return {kicker:nm, title:'Starred questions', key:k==='all'?'phys':k};
  if (v.kind==='missed') return {kicker:nm, title:'Questions you missed', key:k==='all'?'phys':k};
  return {kicker:'All lessons', title:SN[k], key:k};
}
function backLabel(){ return (view.kind==='sec'||view.kind==='lesson') ? '← Sections' : '← Lessons'; }
function goBack(){ if (view.kind==='sec'||view.kind==='lesson') showLesson(view.n); else showHome(); }

function qHTML(q, i, l){
  const fs = (q.figs||[]).map(f=>({src:f, cap:DATA.figs[f]||''}));
  return `<article class="card mc ${l.key}${ans[q.id]!==undefined?' done':''}${peek?' peek':''}" id="q${q.id}" data-id="${q.id}">
    <div class="eyebrow"><span class="qn">${i}</span>${q.hy?'<span class="hyb">High yield</span>':''}${l.cp2?'<span class="cp2tag" style="margin:0">CP2</span>':''}<button type="button" class="star" data-star aria-pressed="${stars.has(q.id)}" aria-label="${stars.has(q.id)?'Unstar':'Star'} this question">${stars.has(q.id)?'★':'☆'}</button></div>
    <h3 class="q">${q.q}</h3>
    <div class="opts">${q.o.map((o,x)=>`<button type="button" class="opt${x===q.k?' is-ans':''}${ans[q.id]===x?' picked':''}" data-x="${x}"><span class="ol">${LET[x]}</span><span class="ot">${o}</span><span class="mk">${x===q.k?'Answer':'Your pick'}</span></button>`).join('')}</div>
    <div class="res"><p class="verdict ${ans[q.id]===undefined?'':ans[q.id]===q.k?'right':'wrong'}">${ans[q.id]===undefined?'':ans[q.id]===q.k?'✓ Correct':`✗ Not quite · the answer is ${LET[q.k]}`}<button type="button" data-retry>Try again</button></p>
    ${(q.more||fs.length)?`<div class="drops">${q.more?`<details><summary>More</summary><div class="more">${q.more.replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,'</table></div>')}</div></details>`:''}${fs.length?`<details class="picD"><summary>Pictures <span class="n">(${fs.length})</span></summary><div class="pics">${
      fs.map(f=>`<figure><img data-src="${esc(f.src)}" alt="${esc(strip(f.cap))}">${f.cap?`<figcaption>${f.cap}</figcaption>`:''}</figure>`).join('')}</div></details>`:''}</div>`:''}
    </div></article>`;
}

function renderStudy(scrollToOpen){
  const v = view, s = $('#study'), T = scopeTitle(v);
  s.className = 'wrap '+T.key;
  let gs = groups(v);
  if (frozen) gs = gs.map(g=>({...g, qs:g.qs.filter(q=>frozen.has(q.id))}));
  else { gs = gs.map(g=>({...g, qs:g.qs.filter(q=>keepQ(v,q))})); if (only||v.kind==='starred'||v.kind==='missed') frozen = new Set(gs.flatMap(g=>g.qs.map(q=>q.id))); }
  gs = gs.filter(g=>g.qs.length);
  const shown = gs.flatMap(g=>g.qs), st = stat(shown);
  setHash(v.kind==='sec'?`L${v.n}-${v.j+1}`:v.kind==='lesson'?`L${v.n}-all`:v.kind==='subj'?v.k:v.kind);

  const multiSec = gs.length>1 || v.kind!=='sec';
  let jump = '';
  if (v.kind==='sec'){ const l=byN(v.n); jump = `<select id="section" aria-label="Choose section">${l.secs.map((x,j)=>`<option value="${j}" ${j===v.j?'selected':''}>${j+1}. ${strip(x.t)}</option>`).join('')}</select>`; }
  else if (gs.length>1) jump = `<select id="jump" aria-label="Jump to section"><option value="">Jump to section…</option>${gs.map(g=>`<option value="${g.l.n}-${g.j}">${v.kind==='lesson'?'':strip(g.l.t)+' › '}${g.j+1}. ${strip(g.l.secs[g.j].t)}</option>`).join('')}</select>`;
  else jump = '<span style="flex:1"></span>';
  const canFilter = v.kind!=='starred' && v.kind!=='missed';

  let h = `<div class="top"><button type="button" class="back" id="backBtn">${backLabel()}</button>${jump}
    ${canFilter?`<button type="button" class="miss" id="onlyMiss" aria-pressed="${only==='missed'}">✗ Missed</button><button type="button" id="onlyStar" aria-pressed="${only==='star'}">★ only</button>`:''}
    <button type="button" id="peekBtn" aria-pressed="${peek}">Show answers</button></div>
    <p class="ltitle">${T.kicker}${only==='missed'?' · missed only':only==='star'?' · starred only':''}</p>
    <div class="lhead" style="margin:0 0 4px"><h2 style="margin:0">${T.title}</h2></div>
    <div class="posrow"><span id="pos"><b>${st.a}</b> / ${st.t} answered${st.a?` · <b>${st.c}</b> right (${pct(st.c,st.a)})`:''}</span></head><body>
<div class="bar"><i id="posbar" style="width:${st.t?st.a/st.t*100:0}%"></i></div></div>`;

  if (!shown.length){
    h += `<div class="card empty">${only==='star'||v.kind==='starred'?'No starred questions here yet. Tap ☆ on any question to star it.':only==='missed'||v.kind==='missed'?'Nothing missed here. Nice.':'No questions.'}</div>`;
  } else {
    h += `<div class="qlist">`;
    let lastL = null;
    for (const g of gs){
      if (v.kind!=='sec' && v.kind!=='lesson' && g.l!==lastL){ h += `<h2 class="lsep ${g.l.key}"><small>${SN[g.l.key]} · ${g.l.sub}</small>${g.l.t}</h2>`; lastL = g.l; }
      if (multiSec){ const gst = stat(g.qs); h += `<div class="ssep ${g.l.key}" id="S${g.l.n}-${g.j}"><span class="sn">${g.j+1}</span><h3>${g.l.secs[g.j].t}</h3><span class="sc" data-sc="${g.l.n}-${g.j}">${gst.a}/${gst.t}</span></div>`; }
      for (const q of g.qs) h += qHTML(q, QS[q.id].i, g.l);
    }
    h += `</div>`;
    h += endCard(v, st);
  }
  s.innerHTML = h;
  showPane(true); headSub();
  wireStudy();
  if (scrollToOpen){
    const first = s.querySelector('.mc:not(.done)');
    if (first && st.a && !only && v.kind!=='missed') first.scrollIntoView({block:'start'}); else window.scrollTo(0,0);
  }
}
function nextOf(v){
  if (v.kind==='sec'){ const l=byN(v.n); if (v.j+1<l.secs.length) return {label:`Next section: ${strip(l.secs[v.j+1].t)} →`, go:()=>study({kind:'sec',n:v.n,j:v.j+1}), key:l.key};
    const nl = DATA.lessons[DATA.lessons.indexOf(l)+1]; if (nl) return {label:`Next lesson: ${strip(nl.t)} →`, go:()=>showLesson(nl.n), key:nl.key}; }
  if (v.kind==='lesson'){ const l=byN(v.n), nl = DATA.lessons[DATA.lessons.indexOf(l)+1]; if (nl) return {label:`Next lesson: ${strip(nl.t)} →`, go:()=>showLesson(nl.n), key:nl.key}; }
  return null;
}
function endCard(v, st){
  const nx = nextOf(v), what = v.kind==='sec'?'section':v.kind==='lesson'?'lesson':'list';
  const left = st.t - st.a;
  return `<div class="card endcard" id="endcard"><h3>${left?`${left} question${left===1?'':'s'} left in this ${what}`:`End of ${what}`}</h3>
    <p class="score" id="endscore">${st.a?pct(st.c,st.a):'–'}</p><p>${st.c} of ${st.t} right</p><div class="row">
    <button type="button" id="redoMiss" ${st.a>st.c?'':'hidden'}>✗ Redo the ${st.a-st.c} missed</button>
    <button type="button" id="clearScope">Clear this ${what} &amp; start over</button>
    <button type="button" id="toList">${v.kind==='sec'||v.kind==='lesson'?'All sections':'All lessons'}</button>
    ${nx?`<button type="button" class="go ${nx.key}" id="nextBtn">${nx.label}</button>`:''}</div></div>`;
}
function scopeIds(){ return [...document.querySelectorAll('#study .mc')].map(e=>e.dataset.id); }
function refreshCounts(){
  const ids = scopeIds(), qs = ids.map(id=>QS[id].q), st = stat(qs);
  const p = $('#pos'); if (p) p.innerHTML = `<b>${st.a}</b> / ${st.t} answered${st.a?` · <b>${st.c}</b> right (${pct(st.c,st.a)})`:''}`;
  const b = $('#posbar'); if (b) b.style.width = (st.t?st.a/st.t*100:0)+'%';
  document.querySelectorAll('[data-sc]').forEach(el=>{
    const [n,j] = el.dataset.sc.split('-').map(Number), gq = qs.filter(q=>QS[q.id].l.n===n && QS[q.id].j===j), s2 = stat(gq);
    el.textContent = `${s2.a}/${s2.t}`;
  });
  const ec = $('#endcard'); if (ec){
    const left = st.t-st.a, what = view.kind==='sec'?'section':view.kind==='lesson'?'lesson':'list';
    ec.querySelector('h3').textContent = left?`${left} question${left===1?'':'s'} left in this ${what}`:`End of ${what}`;
    $('#endscore').textContent = st.a?pct(st.c,st.a):'–';
    $('#endscore').nextElementSibling.textContent = `${st.c} of ${st.t} right`;
    const rm = $('#redoMiss'); rm.hidden = !(st.a>st.c); rm.textContent = `✗ Redo the ${st.a-st.c} missed`;
  }
  headSub();
}
function repaintQ(el){
  const id = el.dataset.id, q = QS[id].q, p = ans[id];
  el.classList.toggle('done', p!==undefined);
  el.querySelectorAll('.opt').forEach(b=>b.classList.toggle('picked', p===+b.dataset.x));
  const vd = el.querySelector('.verdict'), rb = vd.querySelector('button');
  vd.className = 'verdict '+(p===undefined?'':p===q.k?'right':'wrong');
  vd.firstChild && vd.firstChild.nodeType===3 ? vd.firstChild.textContent = (p===undefined?'':p===q.k?'✓ Correct':`✗ Not quite · the answer is ${LET[q.k]}`) : vd.insertBefore(document.createTextNode(p===q.k?'✓ Correct':`✗ Not quite · the answer is ${LET[q.k]}`), rb);
}
function armed(btn, run){
  if (btn.classList.contains('armed')){ clearTimeout(btn._t); btn.classList.remove('armed'); run(); return; }
  const old = btn.innerHTML; btn.classList.add('armed'); btn.textContent = 'Tap again to clear';
  btn._t = setTimeout(()=>{ btn.classList.remove('armed'); btn.innerHTML = old; }, 3500);
}
function wireStudy(){
  $('#backBtn').addEventListener('click', goBack);
  const sc = $('#section'); if (sc) sc.addEventListener('change',()=>study({kind:'sec',n:view.n,j:+sc.value}, only));
  const jp = $('#jump'); if (jp) jp.addEventListener('change',()=>{ const el=document.getElementById('S'+jp.value); if (el) el.scrollIntoView({block:'start'}); jp.value=''; });
  const om = $('#onlyMiss'); if (om) om.addEventListener('click',()=>{ only = only==='missed'?'':'missed'; frozen=null; renderStudy(false); window.scrollTo(0,0); });
  const os = $('#onlyStar'); if (os) os.addEventListener('click',()=>{ only = only==='star'?'':'star'; frozen=null; renderStudy(false); window.scrollTo(0,0); });
  $('#peekBtn').addEventListener('click',e=>{ peek=!peek; e.currentTarget.setAttribute('aria-pressed',peek); document.querySelectorAll('#study .mc').forEach(el=>el.classList.toggle('peek',peek)); });
  const rm = $('#redoMiss'); if (rm) rm.addEventListener('click',()=>{ const ids = scopeIds().filter(isWrong); ids.forEach(id=>delete ans[id]); saveAns(); only=''; frozen=new Set(ids); peek=false; renderStudy(false); window.scrollTo(0,0); });
  const cs = $('#clearScope'); if (cs) cs.addEventListener('click',()=>armed(cs,()=>{ scopeIds().forEach(id=>delete ans[id]); saveAns(); renderStudy(false); window.scrollTo(0,0); }));
  const tl = $('#toList'); if (tl) tl.addEventListener('click', goBack);
  const nb = $('#nextBtn'); if (nb){ const nx = nextOf(view); nb.addEventListener('click',()=>{ nx.go(); window.scrollTo(0,0); }); }
}
// one listener for every question on the page
$('#study').addEventListener('click', e=>{
  const card = e.target.closest('.mc'); if (!card) return;
  const id = card.dataset.id;
  const opt = e.target.closest('.opt');
  if (opt){ if (ans[id]!==undefined) return; ans[id] = +opt.dataset.x; saveAns(); repaintQ(card); refreshCounts(); return; }
  const st = e.target.closest('[data-star]');
  if (st){ stars.has(id)?stars.delete(id):stars.add(id); saveStars(); const on=stars.has(id); st.setAttribute('aria-pressed',on); st.textContent=on?'★':'☆'; st.setAttribute('aria-label',(on?'Unstar':'Star')+' this question'); return; }
  if (e.target.closest('[data-retry]')){ delete ans[id]; saveAns(); repaintQ(card); refreshCounts(); return; }
  const img = e.target.closest('.pics img'); if (img) openLB(img.src);
});
$('#study').addEventListener('toggle', e=>{
  const d = e.target; if (!d.classList || !d.classList.contains('picD') || !d.open) return;
  d.querySelectorAll('img[data-src]').forEach(im=>{ im.src = im.dataset.src; im.removeAttribute('data-src'); });
}, true);

function openLB(src){
  if (!src) return;
  const lb=document.createElement('div'); lb.id='lb';
  lb.innerHTML=`<img src="${esc(src)}" alt=""><button type="button" aria-label="Close picture">Close</button>`;
  lb.addEventListener('click',()=>lb.remove()); document.body.appendChild(lb);
}
document.addEventListener('keydown',e=>{
  const lb=$('#lb'); if (lb){ if(e.key==='Escape'){e.preventDefault();lb.remove();} return; }
  if (e.key==='Escape' && view && view.type==='study' && e.target.tagName!=='SELECT') goBack();
  else if (e.key==='Escape' && view && view.type==='lesson') showHome();
});
$('#themeBtn').addEventListener('click',()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';store.set('theme',r.dataset.theme);});
{const th=store.get('theme',null); if(th) document.documentElement.dataset.theme=th;}

// deep links: #L<n> lesson, #L<n>-<section>, #L<n>-all, #phys etc., #starred, #missed
{const h = location.hash.slice(1), m = h.match(/^L(\d+)(?:-(all|\d+))?$/);
 renderNav();
 if (m && byN(+m[1])){ const n=+m[1], l=byN(n); if (m[2]==='all') study({kind:'lesson',n}); else if (m[2] && +m[2]>=1 && +m[2]<=l.secs.length) study({kind:'sec',n,j:+m[2]-1}); else showLesson(n); }
 else if (['phys','hist','bio','anat'].includes(h)) study({kind:'subj',k:h});
 else if (h==='starred') study({kind:'starred',k:'all'});
 else if (h==='missed') study({kind:'missed',k:'all'});
 else showHome();}
})();
</script>

</body></html>
