Heart slows → pressure rises by reflex","Heart slows or stops → pressure plunges"],"k":2},{"id":"30-35","q":"What happens during and after prolonged vagal stimulation?","o":["Heart escapes and beats again (β<sub>1<\/sub> drive helping); when stimulation stops, sympathetic reflex (α<sub>1<\/sub>, β<sub>1<\/sub>) leaves pressure above baseline","Heart stays stopped until stimulation ends (no escape); when stimulation stops, pressure returns exactly to baseline with no overshoot","Heart escapes and beats again (α<sub>1<\/sub> drive helping); when stimulation stops, pressure stays at the low level reached during stimulation"],"k":0},{"id":"30-36","q":"Vagal stimulation after atropine?","o":["Heart stops for longer","Nothing happens","Heart speeds up"],"k":1},{"id":"30-37","q":"Carotid occlusion tracing?","o":["↓ Pressure at carotid sinus → baroreceptors report a fall → sympathetic (α<sub>1<\/sub>, β<sub>1<\/sub>) pressor rise → opposed by vagal (M<sub>2<\/sub>) reflex","↓ Pressure at carotid sinus → baroreceptors report a rise → sympathetic (α<sub>1<\/sub>, β<sub>1<\/sub>) pressor rise → opposed by vagal (M<sub>3<\/sub>) reflex","↑ Pressure at carotid sinus → baroreceptors report a rise → vagal (M<sub>2<\/sub>) depressor fall → opposed by sympathetic (β<sub>1<\/sub>) reflex"],"k":0},{"id":"30-38","q":"How does acetylcholine (ACh) lower BP?","o":["Mainly vasodilation via β<sub>2<\/sub> → cAMP","Mainly bradycardia via M<sub>2<\/sub> → reduced CO","Mainly vasodilation via M<sub>3<\/sub> → nitric oxide"],"k":2},{"id":"30-39","q":"ACh after neostigmine (anticholinesterase)?","o":["Pressure rise — nicotinic ganglion actions dominate","Deeper, longer fall — only M<sub>2<\/sub> potentiated, M<sub>3<\/sub>/NO unaffected","Deeper, longer fall — both M<sub>2<\/sub> and M<sub>3<\/sub>/NO actions potentiated"],"k":2},{"id":"30-40","q":"Nicotine tracing?","o":["N<sub>N<\/sub> in every ganglion → small vagal dip, then larger sympathetic rise","N<sub>N<\/sub> in sympathetic ganglia only → sustained rise with no dip","N<sub>N<\/sub> in every ganglion → large sympathetic rise, then small vagal dip"],"k":0},{"id":"30-41","q":"Nicotine after neostigmine vs after atropine?","o":["Neostigmine: vagal dip potentiated<br>Atropine: pressor rise gone, only vagal dip","Neostigmine: pressor rise abolished<br>Atropine: whole response gone","Neostigmine: vagal dip potentiated<br>Atropine: vagal dip gone, only pressor rise"],"k":2}]},{"t":"Drugs with no reflex","qs":[{"id":"30-42","q":"Why do drugs that remove sympathetic tone lower BP with no reflex?","o":["They remove the pathway the reflex would use","They reset the baroreceptors to a lower set point","They block cardiac M<sub>2<\/sub> receptors as well"],"k":0},{"id":"30-43","q":"Clonidine: mechanism?","o":["Central α<sub>2<\/sub> agonist → cuts sympathetic outflow at the vasomotor centre","Peripheral α<sub>1<\/sub> blocker → dilates arterioles directly at the vessel wall","Central β<sub>1<\/sub> blocker → cuts sympathetic outflow at the vasomotor centre"],"k":0},{"id":"30-44","q":"Mecamylamine: mechanism?","o":["Blocks the neuromuscular junction (N<sub>M<\/sub>)","Blocks autonomic ganglia (N<sub>N<\/sub>)","Stimulates autonomic ganglia (N<sub>N<\/sub>)"],"k":1},{"id":"30-45","q":"Metyrosine: mechanism?","o":["Blocks α and β receptors on target cells","Stops norepinephrine and epinephrine being made","Blocks norepinephrine reuptake into nerve endings"],"k":1},{"id":"30-46","q":"Reserpine: mechanism?","o":["Empties nerve endings of norepinephrine","Brakes norepinephrine release via central α<sub>2<\/sub>","Stops norepinephrine and epinephrine being made"],"k":0},{"id":"30-47","q":"Atenolol (β<sub>1<\/sub> blocker): effect, and why no reflex?","o":["CO ↓ → BP ↓; no reflex because β<sub>1<\/sub> is blocked","CO ↑ → BP ↑; no reflex because β<sub>1<\/sub> is blocked","CO ↓ → BP ↓; no reflex because M<sub>2<\/sub> is blocked"],"k":0},{"id":"30-48","q":"Labetalol (β + α<sub>1<\/sub> blocker): effect, and why no reflex?","o":["CO and TPR ↓ → BP ↓; no reflex because β<sub>1<\/sub> is blocked","CO and TPR ↓ → BP ↓; no reflex because α<sub>2<\/sub> is blocked","CO and TPR ↑ → BP ↑; no reflex because M<sub>2<\/sub> is blocked"],"k":0},{"id":"30-49","q":"Venodilators and diuretics: how do they lower BP?","o":["↓ Venous return → CO and BP ↓; reflex ↑ heart rate, but output stays low","↓ Venous return → CO and BP ↓; no reflex at all, heart rate unchanged","↑ Venous return → CO and BP ↓; reflex ↓ heart rate, so output falls further"],"k":0},{"id":"30-50","q":"Name the drugs that lower BP with no reflex tachycardia.","o":["Atenolol<br>Labetalol<br>Clonidine<br>Prazosin<br>Metyrosine<br>Reserpine","Atenolol<br>Labetalol<br>Clonidine<br>Mecamylamine<br>Metyrosine<br>Reserpine","Atenolol<br>Hydralazine<br>Clonidine<br>Mecamylamine<br>Phentolamine<br>Reserpine"],"k":1,"more":"<table><tr><th>Drug<\/th><th>Heart<\/th><th>BP<\/th><\/tr><tr><td>Phenylephrine<\/td><td>Reflex slowing<\/td><td>↑<\/td><\/tr><tr><td>Norepinephrine<\/td><td>CO ↑, reflex masked<\/td><td>↑<\/td><\/tr><tr><td>Epinephrine<\/td><td>CO ↑<\/td><td>↑, diastolic blunted<\/td><\/tr><tr><td>Isoproterenol<\/td><td>CO ↑<\/td><td>↓ mean, diastolic<\/td><\/tr><tr><td>Albuterol, terbutaline<\/td><td>Reflex ↑<\/td><td>↓<\/td><\/tr><tr><td>Dobutamine<\/td><td>SV, CO ↑<\/td><td>↑<\/td><\/tr><tr><td>Prazosin<\/td><td>Reflex ↑<\/td><td>↓ mild<\/td><\/tr><tr><td>Phentolamine<\/td><td>Reflex ↑, extra<\/td><td>↓<\/td><\/tr><tr><td>Atenolol, labetalol, clonidine, metyrosine, reserpine<\/td><td>CO ↓, no reflex<\/td><td>↓<\/td><\/tr><tr><td>Mecamylamine<\/td><td>No reflex<\/td><td>↓<\/td><\/tr><tr><td>Arteriolar dilator<\/td><td>Reflex ↑<\/td><td>↓<\/td><\/tr><tr><td>Venodilator, diuretic<\/td><td>Rate ↑, CO ↓<\/td><td>↓<\/td><\/tr><\/table>"}]}]},{"n":13,"key":"hist","t":"The vessel wall: three tunics","sub":"H12 Part B","cp2":false,"secs":[{"t":"Circulation overview","qs":[{"id":"13-0","q":"What are the two parts of the circulatory system?","o":["Pulmonary vascular system<br>Lymphatic vascular system","Cardiovascular (blood vascular) system<br>Lymphatic vascular system","Cardiovascular (blood vascular) system<br>Portal venous system"],"k":1},{"id":"13-1","q":"Which side of the heart drives each circulation, and at what pressure?","o":["Left heart → low-pressure pulmonary circulation (lungs)<br>Right heart → high-pressure systemic circulation (body)","Right heart → low-pressure pulmonary circulation (lungs)<br>Left heart → high-pressure systemic circulation (body)","Right heart → high-pressure pulmonary circulation (lungs)<br>Left heart → low-pressure systemic circulation (body)"],"k":1},{"id":"13-2","q":"In what order does blood pass through the vessels after leaving the heart?","o":["Elastic arteries → muscular arteries → arterioles → small arteries → capillaries → venules → small → medium → large veins","Muscular arteries → elastic arteries → small arteries → arterioles → capillaries → venules → small → medium → large veins","Elastic arteries → muscular arteries → small arteries → arterioles → capillaries → venules → small → medium → large veins"],"k":2},{"id":"13-3","q":"What is the difference between an <b>afferent<\/b> and an <b>efferent<\/b> vessel?","o":["Afferent carries blood away from a structure<br>Efferent arrives at it","Afferent carries oxygenated blood<br>Efferent carries deoxygenated blood","Afferent arrives at a structure<br>Efferent carries blood away from it"],"k":2}]},{"t":"Three tunics","qs":[{"id":"13-4","q":"Name the three tunics of every blood vessel wall, from inside out.","o":["Tunica intima → tunica media → tunica adventitia","Tunica media → tunica intima → tunica adventitia","Tunica adventitia → tunica media → tunica intima"],"k":0,"more":"<p>Almost every histology question about vessels is really asking <b>which layer is emphasised<\/b>.<\/p>","figs":["img/13_vessel_1.jpg"]},{"id":"13-5","q":"What makes up the tunica intima?","o":["Loose connective tissue + vasa vasorum","Endothelium + a thick layer of smooth muscle","Endothelium + a little connective tissue"],"k":2,"more":"<p>The innermost tunic.<\/p>","figs":["img/13_vessel_1.jpg"]},{"id":"13-6","q":"Which tunic does every vessel have, right down to a capillary?","o":["Tunica adventitia","Tunica media","Tunica intima"],"k":2},{"id":"13-7","q":"In arteries, what marks the outer border of the intima?","o":["Internal elastic lamina — a wavy sheet of elastin","External elastic lamina — a wavy sheet of elastin","Internal elastic lamina — a straight sheet of collagen"],"k":0,"figs":["img/13_vessel_1.jpg"]},{"id":"13-8","q":"What makes up the tunica media?","o":["Skeletal muscle + elastic tissue","Smooth muscle + elastic tissue","Loose collagen + vasa vasorum"],"k":1},{"id":"13-9","q":"Which tunic varies most between vessels and is usually the thickest, most prominent tunic of an artery?","o":["Tunica adventitia","Tunica media","Tunica intima"],"k":1},{"id":"13-10","q":"In arteries, what may mark the outer edge of the media?","o":["Internal elastic lamina","External elastic lamina","Basal lamina"],"k":1,"figs":["img/13_vessel_1.jpg"]},{"id":"13-11","q":"What is the tunica adventitia, and what does it do?","o":["Inner connective tissue that lines the lumen","Outer connective tissue that anchors the vessel","Outer smooth muscle that constricts the vessel"],"k":1},{"id":"13-12","q":"In big vessels, what extra structure does the adventitia carry?","o":["Its own smooth muscle, the <i>tunica media<\/i>","Its own lymph drainage, the lacteals","Its own blood supply, the <i>vasa vasorum<\/i>"],"k":2}]},{"t":"Endothelium","qs":[{"id":"13-13","q":"What is the structure of endothelium?","o":["One layer of columnar cells on a basal lamina, held together by junctional complexes","Several layers of cuboidal cells on a basal lamina, held together by desmosomes only","One layer of flat cells on a basal lamina, held together by junctional complexes"],"k":2},{"id":"13-14","q":"What is endothelium's basic role as a lining?","o":["Interface between blood and organs — the selective barrier for everything exchanged with the tissues","Passive lining only — a smooth surface that plays no part in exchange","Structural layer — the main source of the vessel's tensile strength"],"k":0,"more":"<p>Far from passive: healthy endothelium also keeps four pairs of opposing signals in balance (tone, growth, clotting, inflammation).<\/p>"},{"id":"13-15","q":"Which endothelial signals <b>dilate<\/b> vessels, and which <b>constricts<\/b> them?","o":["Dilate: prostacyclin, endothelin-1<br>Constrict: nitric oxide","Dilate: nitric oxide, prostacyclin<br>Constrict: endothelin-1","Dilate: endothelin-1<br>Constrict: nitric oxide, prostacyclin"],"k":1},{"id":"13-16","q":"What opposing pair does endothelium balance for vessel-wall growth?","o":["Growth inhibition vs growth promotion (growth factors)","Antithrombosis vs prothrombosis (von Willebrand factor)","Anti-inflammation vs proinflammation (white cell adhesion)"],"k":0},{"id":"13-17","q":"What are endothelium's <b>antithrombotic<\/b> features?","o":["Non-clotting surface<br>von Willebrand factor<br>Tissue plasminogen activator","Non-clotting surface<br>Heparin<br>Tissue plasminogen activator","Exposed collagen<br>Heparin<br>Plasminogen activator inhibitor"],"k":1},{"id":"13-18","q":"What is endothelium's main <b>prothrombotic<\/b> factor?","o":["von Willebrand factor","Tissue plasminogen activator","Prostacyclin"],"k":0},{"id":"13-19","q":"What pair does endothelium balance for inflammation?","o":["Dilatation vs constriction (nitric oxide vs endothelin-1)","Antithrombosis vs prothrombosis (heparin vs von Willebrand factor)","Anti-inflammation vs proinflammation (letting white cells stick and leave)"],"k":2},{"id":"13-20","q":"When endothelium is damaged or dysfunctional, which way does the balance tip, and what does that start?","o":["Toward constriction, growth inhibition, antithrombosis, proinflammation → vasculitis","Toward constriction, growth, prothrombosis, proinflammation → thrombosis and atherosclerosis","Toward dilatation, growth inhibition, antithrombosis, anti-inflammation → aneurysm and haemorrhage"],"k":1,"more":"<table><tr><th>Job<\/th><th>One side<\/th><th>Other side<\/th><\/tr><tr><td>Tone<\/td><td>Dilatation (NO, prostacyclin)<\/td><td>Constriction (endothelin-1)<\/td><\/tr><tr><td>Growth<\/td><td>Inhibition<\/td><td>Promotion (growth factors)<\/td><\/tr><tr><td>Clotting<\/td><td>Antithrombosis (surface, heparin, tPA)<\/td><td>Prothrombosis (vWF)<\/td><\/tr><tr><td>Inflammation<\/td><td>Anti-<\/td><td>Pro- (white cells stick, leave)<\/td><\/tr><\/table><p>Damage tips toward the right-hand column.<\/p>"}]},{"t":"Arteries and arterioles","qs":[{"id":"13-21","q":"Which vessels are the elastic arteries, and what is their functional name?","o":["Aorta and its big branches — low-resistance <b>conducting vessels<\/b>","Aorta and its big branches — high-resistance <b>resistance vessels<\/b>","Femoral and radial arteries — low-resistance <b>distributing vessels<\/b>"],"k":0},{"id":"13-22","q":"What fills the media of an elastic artery?","o":["Loose connective tissue with vasa vasorum and few elastic fibres","Concentric, fenestrated elastic lamellae alternating with smooth-muscle layers","Thick bundles of longitudinal smooth muscle with scattered collagen"],"k":1,"more":"<p>On a slide the media looks layered and wavy.<\/p>","figs":["img/13_vessel_2.jpg","img/13_vessel_6.jpg"]},{"id":"13-23","q":"Why are elastic arteries built of elastin?","o":["They take each ejection's full force, balloon out, then recoil in diastole to keep blood moving","They must contract strongly in diastole to pump blood forward like a second heart","They must stay rigid so that pressure in diastole falls to zero"],"k":0,"more":"<p>Structure matches function: they must stretch and spring back.<\/p>","figs":["img/13_vessel_2.jpg"]},{"id":"13-24","q":"Why do elastic arteries need vasa vasorum?","o":["Lumen blood is too deoxygenated to feed the wall","Endothelium is impermeable to oxygen in elastic arteries","Walls too thick to be fed by diffusion from the lumen"],"k":2,"more":"<p>The vasa vasorum (&ldquo;vessels of the vessels&rdquo;) are arterioles, capillaries and venules in the adventitia and outer media.<\/p>","figs":["img/13_vessel_2.jpg"]},{"id":"13-25","q":"What is the functional name of muscular arteries, and what do they do?","o":["<b>Exchange vessels<\/b> — supply nutrients to individual organs","<b>Conducting vessels<\/b> — carry blood away from the heart","<b>Distributing vessels<\/b> — carry blood to individual organs"],"k":2},{"id":"13-26","q":"What makes up the media of a muscular artery, and why?","o":["Mostly skeletal muscle — to pump blood toward individual organs","Mostly elastic lamellae — to recoil in diastole and keep blood moving","Mostly smooth muscle — to change diameter, direct flow and help regulate blood pressure"],"k":2,"figs":["img/13_vessel_3.jpg"]},{"id":"13-27","q":"What is the classic slide giveaway of a muscular artery?","o":["Prominent internal elastic lamina — a crisp wavy line at the inner edge of the media","Prominent external elastic lamina — a crisp wavy line at the outer edge of the adventitia","Many wavy elastic sheets through the whole thickness of the media"],"k":0,"figs":["img/13_vessel_3.jpg","img/13_vessel_5.webp"]},{"id":"13-28","q":"On a slide, how do you tell an elastic artery from a muscular artery?","o":["Wavy elastic sheets through the whole media → elastic<br>No elastic lamina at all, muscle only → muscular","One crisp wavy line at the inner border, muscle behind → elastic<br>Wavy elastic sheets through the whole media → muscular","Wavy elastic sheets through the whole media → elastic<br>One crisp wavy line at the inner border, muscle behind → muscular"],"k":2,"more":"<p>Both have three tunics; what differs is what the media is made of, and it follows from the job: recoil (elastin) vs changing diameter (muscle).<\/p>","figs":["img/13_vessel_6.jpg","img/13_vessel_3.jpg"]},{"id":"13-29","q":"What is the functional name of arterioles?","o":["Exchange vessels","Resistance vessels","Capacitance vessels"],"k":1},{"id":"13-30","q":"What does the wall of an arteriole consist of?","o":["No smooth muscle; endothelium with scattered pericytes only; no adventitia","1–3 layers of smooth muscle; intima of endothelium alone; very thin adventitia","1–3 layers of elastic lamellae; intima of endothelium alone; thick adventitia"],"k":1,"more":"<p>A small artery has more smooth-muscle layers.<\/p>","figs":["img/13_vessel_8.webp"]},{"id":"13-31","q":"Why do arterioles, with only a few muscle layers, control flow through the entire circulation?","o":["Resistance depends linearly on radius","Resistance depends mainly on blood viscosity","Resistance depends very steeply on radius"],"k":2}]},{"t":"Capillaries","qs":[{"id":"13-32","q":"What is the functional name of capillaries?","o":["Exchange vessels","Conducting vessels","Resistance vessels"],"k":0},{"id":"13-33","q":"What does a capillary wall consist of?","o":["Endothelium + basement membrane + thin smooth-muscle media; no adventitia","Endothelium + basement membrane + scattered pericytes; no media or adventitia","Endothelium + internal elastic lamina + scattered pericytes; thin adventitia"],"k":1,"figs":["img/13_vessel_4.webp"]},{"id":"13-34","q":"Why is a capillary wall only one cell thick?","o":["Anything thicker would obstruct exchange","A thin wall withstands higher pressure","A thin wall stops red cells leaking out"],"k":0},{"id":"13-35","q":"What are pericytes, and which vessels do they wrap?","o":["Smooth muscle cells forming a continuous media around capillaries","Small cells whose long processes wrap the endothelium of capillaries and postcapillary venules","Small cells whose long processes wrap the endothelium of arterioles and muscular arteries"],"k":1,"more":"<p>As close as a capillary gets to a media.<\/p>","figs":["img/13_vessel_4.webp"]},{"id":"13-36","q":"What basal lamina surrounds a pericyte?","o":["The internal elastic lamina of the vessel","None — pericytes sit directly on the endothelial cells","Its own, fused with the endothelial basal lamina"],"k":2,"figs":["img/13_vessel_4.webp"]},{"id":"13-37","q":"What do pericytes contain, and what do they do?","o":["Contractile proteins — help regulate flow","Fenestrae — allow exchange of large molecules","Phagocytic granules — remove debris from the vessel wall"],"k":0},{"id":"13-38","q":"How are the three capillary types told apart?","o":["Light microscope: the thickness of the smooth-muscle layer","Electron microscope: the number of pericytes per capillary","Electron microscope: how continuous the endothelium and basement membrane are"],"k":2,"more":"<p>Under the light microscope they look alike. Each type sits where its leakiness suits the organ.<\/p>"},{"id":"13-39","q":"Describe the wall of a <b>continuous<\/b> capillary.","o":["Endothelium pierced by pores closed by a diaphragm; continuous basement membrane","Unbroken endothelium sealed by tight junctions, few pinocytotic vesicles; discontinuous basement membrane","Unbroken endothelium sealed by tight junctions, marginal folds, many pinocytotic vesicles (caveolae); continuous basement membrane"],"k":2,"more":"<p>The most common and narrowest type.<\/p>"},{"id":"13-40","q":"Where are continuous capillaries found?","o":["Endocrine glands, pancreas, intestinal villi","Muscle, brain, connective tissue, lung, thymus","Kidney glomerulus, choroid plexus, ciliary body"],"k":1},{"id":"13-41","q":"Why do continuous capillaries give the tightest control, and what do they make possible in the brain?","o":["Fenestrae pass only water and small solutes; in brain they are closed by diaphragms → blood–brain barrier","Tight junctions pass only water and small solutes; in brain they seal clefts completely → blood–brain barrier","Gap junctions pass only ions; in brain pericytes seal clefts completely → blood–brain barrier"],"k":1},{"id":"13-42","q":"Describe the wall of a <b>fenestrated<\/b> capillary.","o":["Gaps between endothelial cells; thin cytoplasm; discontinuous basement membrane","Tight junctions; thick cytoplasm full of caveolae, no pores; continuous basement membrane","Tight junctions; thin cytoplasm pierced by pores (fenestrae), many closed by a diaphragm; continuous basement membrane"],"k":2},{"id":"13-43","q":"Where are fenestrated capillaries found, and why there?","o":["Muscle, brain, lung — tight control so only water and small solutes cross","Endocrine glands, pancreas, intestinal villi — fast exchange of small molecules (hormones out, nutrients in)","Bone marrow, liver, spleen — passage of whole cells and large proteins"],"k":1},{"id":"13-44","q":"Describe the wall of a <b>sinusoidal<\/b> (discontinuous) capillary.","o":["Gaps between endothelial cells as well as pores; continuous basement membrane; narrow, round lumen","Unbroken endothelium sealed by tight junctions; continuous basement membrane; narrow lumen","Gaps between endothelial cells as well as pores; discontinuous basement membrane; wide, irregular lumen"],"k":2},{"id":"13-45","q":"Where are sinusoidal capillaries found?","o":["Bone marrow, liver, spleen, lymph nodes, some endocrine glands","Muscle, brain, connective tissue, lung, thymus","Endocrine glands, pancreas, intestinal villi, kidney"],"k":0,"more":"<p>Textbooks usually list sinusoids only in marrow, liver, spleen and some endocrine organs, not lymph nodes.<\/p>"},{"id":"13-46","q":"What can cross a sinusoidal capillary wall, and what example uses this?","o":["Large molecules but not cells — albumin leaves the bone marrow this way","Large molecules and whole cells — new blood cells leave the bone marrow this way","Only water and small solutes — oxygen reaches neurons this way"],"k":1},{"id":"13-47","q":"In the liver, what do sinusoid pores cluster into?","o":["Marginal folds","Caveolae","Sieve plates"],"k":2},{"id":"13-48","q":"On an electron micrograph, how do you name the capillary type from its wall?","o":["Unbroken cytoplasm + tight junctions → continuous<br>Gaps between cells, broken basement membrane, wide lumen → fenestrated<br>Thin cytoplasm with pores, intact basement membrane → sinusoid","Unbroken cytoplasm + tight junctions → fenestrated<br>Thin cytoplasm with pores, intact basement membrane → continuous<br>Gaps between cells, broken basement membrane, wide lumen → sinusoid","Unbroken cytoplasm + tight junctions → continuous<br>Thin cytoplasm with pores, intact basement membrane → fenestrated<br>Gaps between cells, broken basement membrane, wide lumen → sinusoid"],"k":2,"more":"<table><tr><th>Type<\/th><th>Wall<\/th><th>Where<\/th><\/tr><tr><td>Continuous<\/td><td>Tight junctions, caveolae, continuous BM<\/td><td>Muscle, brain, CT, lung, thymus<\/td><\/tr><tr><td>Fenestrated<\/td><td>Pores (often diaphragm), continuous BM<\/td><td>Endocrine, pancreas, villi<\/td><\/tr><tr><td>Sinusoidal<\/td><td>Gaps + pores, discontinuous BM<\/td><td>Marrow, liver, spleen<\/td><\/tr><\/table>","hy":true}]},{"t":"Microcirculation","qs":[{"id":"13-49","q":"What vessel often feeds a capillary bed from an arteriole, and what rings it?","o":["Thoroughfare channel — ringed by elastic lamellae acting as precapillary valves","Muscular artery — ringed by a continuous media acting as a precapillary sphincter","Metarteriole — ringed by scattered smooth muscle cells acting as precapillary sphincters"],"k":2},{"id":"13-50","q":"What happens in a capillary bed when the precapillary sphincters <b>relax<\/b>?","o":["Blood stops flowing through the metarteriole → bed is ischaemic","Blood flows backward into the arteriole → bed drains","Blood spreads through the true capillaries → bed is perfused"],"k":2},{"id":"13-51","q":"What happens when the precapillary sphincters <b>contract<\/b>?","o":["Blood spreads through the true capillaries → bed is perfused","Blood bypasses the bed via a thoroughfare channel → straight into the postcapillary venule","Blood bypasses the bed via an arteriovenous shunt → straight into the arteriole"],"k":1},{"id":"13-52","q":"What is the simple pathway linking capillary beds?","o":["Venule → capillaries → arteriole","Arteriole → capillaries → venule","Arteriole → venule → capillaries"],"k":1},{"id":"13-53","q":"What is an arteriovenous shunt, and where is it used?","o":["Arterial side joined directly to venous side, skipping capillaries — skin uses them to vary blood flow","Arterial side joined directly to venous side, skipping capillaries — liver uses them to filter blood","Arteriole joined to a lymphatic, skipping venules — gut uses them to absorb fat"],"k":0},{"id":"13-54","q":"What is a portal system, and where are there examples?","o":["Two capillary beds in series joined by a portal vein — liver, anterior pituitary","Two capillary beds in series joined by a portal vein — kidney, posterior pituitary","Two capillary beds in parallel joined by an arteriole — lung, spleen"],"k":0}]},{"t":"Veins","qs":[{"id":"13-55","q":"On a slide, how do you tell an artery from its companion vein?","o":["Artery: thick wall, irregular collapsed lumen<br>Vein: thin wall, small round open lumen","Artery: thick muscular wall, round open lumen<br>Vein: thin wall, large, often collapsed or irregular lumen","Artery: thin wall, large, often collapsed lumen<br>Vein: thick muscular wall, round open lumen"],"k":1,"more":"<p>The comparison most likely to be tested. Companion vessels on one slide: the round thick-walled one is the artery.<\/p>","figs":["img/13_vessel_5.webp"],"hy":true},{"id":"13-56","q":"In a neurovascular bundle, how is the nerve told apart from the artery and vein?","o":["Valves — irregular lumen","Thin wall — collapsed lumen","Solid — no lumen"],"k":2,"figs":["img/13_vessel_5.webp"]},{"id":"13-57","q":"Which is the thickest layer of a vein?","o":["Tunica adventitia","Tunica intima","Tunica media"],"k":0,"more":"<p>Veins have all three tunics but a thin media.<\/p>","figs":["img/13_vessel_7.webp","img/13_vessel_1.jpg"]},{"id":"13-58","q":"What are venous valves made of?","o":["Folds of intima and its subendothelial connective tissue, endothelium on both faces","Folds of media and its smooth muscle, endothelium on one face","Extensions of the internal elastic lamina, endothelium on both faces"],"k":0,"figs":["img/13_vessel_7.webp"]},{"id":"13-59","q":"Where are venous valves common and where absent, and why?","o":["Common in great veins of thorax; absent in legs — they matter only where pressure is highest","Common in legs; absent in great veins of thorax — they matter only where blood moves against gravity","Common in venules; absent in large veins — they matter only where flow is slowest"],"k":1},{"id":"13-60","q":"What are the size grades of veins?","o":["Venules ~10–100 µm<br>Small veins &lt;5 mm<br>Medium veins 5–20 mm<br>Large veins &gt;20 mm","Venules ~10–100 µm<br>Small veins &lt;1 mm<br>Medium veins 1–10 mm<br>Large veins &gt;10 mm","Venules ~1–10 µm<br>Small veins &lt;0.1 mm<br>Medium veins 0.1–1 mm<br>Large veins &gt;1 mm"],"k":1},{"id":"13-61","q":"What does the wall of a postcapillary venule consist of?","o":["Endothelium + thick adventitia","Endothelium + internal elastic lamina","Endothelium + pericytes"],"k":2},{"id":"13-62","q":"Where do white blood cells mainly stick to the vessel wall and leave the circulation in infection or tissue damage?","o":["Medium veins","Continuous capillaries","Postcapillary venules"],"k":2},{"id":"13-63","q":"Next to an arteriole, how does a venule look?","o":["Same lumen, thicker wall","Wider lumen, thinner wall","Narrower lumen, thicker wall"],"k":1,"figs":["img/13_vessel_8.webp"]},{"id":"13-64","q":"What size rules hold for every vein?","o":["Lumen wider than wall is thick; adventitia thickens as the vein gets bigger","Wall thicker than lumen is wide; media thickens as the vein gets bigger","Lumen wider than wall is thick; intima thickens as the vein gets bigger"],"k":0},{"id":"13-65","q":"Describe the wall of the vena cava.","o":["Thin intima; media by far thickest, with circular smooth muscle; adventitia thin, with no vasa vasorum","Thick intima; media of many elastic lamellae; adventitia thin, with vasa vasorum only","Thin intima; media of a few circular smooth-muscle layers; adventitia by far thickest, with longitudinal smooth-muscle bundles and vasa vasorum"],"k":2,"figs":["img/13_vessel_6.jpg"]},{"id":"13-66","q":"What is the thickest layer of the aorta, and what is it made of?","o":["Intima — wavy fenestrated elastic membranes (black in an elastic stain)","Media — wavy fenestrated elastic membranes (black in an elastic stain)","Adventitia — dense collagen with vasa vasorum (black in an elastic stain)"],"k":1,"figs":["img/13_vessel_6.jpg"]},{"id":"13-67","q":"What is the simple thickest-layer rule for artery vs vein?","o":["Thickest layer intima → artery<br>Thickest layer media → vein","Thickest layer media → artery<br>Thickest layer adventitia → vein","Thickest layer adventitia → artery<br>Thickest layer media → vein"],"k":1,"figs":["img/13_vessel_6.jpg"]}]},{"t":"Venous disease","qs":[{"id":"13-68","q":"What makes a leg vein varicose?","o":["Incompetent valves or a dilated vein wall → enlarged, tortuous veins (painful knots under the skin)","Thickened valves or a narrowed vein wall → small, straight veins (painless cords under the skin)","Arterial plaque in the leg arteries → enlarged, pulsatile veins (painful knots under the skin)"],"k":0,"more":"<p>Commoner in people who stand for long periods.<\/p>"},{"id":"13-69","q":"How do varicose veins damage the skin?","o":["Slow, turbulent flow → clot travels to the skin arteries → arterial ulcers","Fast, laminar flow → downstream arterioles constrict → skin starves of oxygen → dry gangrene","Slow, turbulent flow → upstream capillary beds engorge → fluid leaks into skin → stasis dermatitis, venous ulcers"],"k":2},{"id":"13-70","q":"In a varicose-vein biopsy, how do the valves appear?","o":["Thick flaps of smooth muscle inside a narrowed lumen","Thin flaps of intima inside a dilated lumen","Thin flaps of adventitia outside a dilated lumen"],"k":1},{"id":"13-71","q":"What is deep vein thrombosis, and what is its main danger?","o":["Clot on the wall of a deep leg vein → can break free → pulmonary embolus","Clot on the wall of a superficial leg vein → can break free → stroke","Plaque on the wall of a deep leg artery → can rupture → limb ischaemia"],"k":0}]},{"t":"Lymphatic vessels","qs":[{"id":"13-72","q":"What do lymphatic vessels do?","o":["Collect excess interstitial fluid left by capillaries and carry it to the kidney as urine","Collect lymph from the blood and deliver it to the interstitial fluid","Collect excess interstitial fluid left by capillaries and return it to the blood as lymph"],"k":2},{"id":"13-73","q":"Describe the structure of a lymphatic capillary.","o":["Blind-ended, very thin endothelial tube; no tight junctions; incomplete basal lamina","Open-ended, thick-walled endothelial tube; many tight junctions; continuous basal lamina","Blind-ended, very thin endothelial tube; many tight junctions; continuous basal lamina"],"k":0},{"id":"13-74","q":"How does fluid enter a lymphatic capillary?","o":["By active transport across the endothelial cells","Through fenestrae in the endothelial cells","Through openings between the endothelial cells"],"k":2},{"id":"13-75","q":"What are anchoring filaments in lymphatic capillaries?","o":["Smooth muscle cells tying the endothelial cells together, keeping the openings closed","Collagen and elastin tying the endothelial cells to surrounding tissue, holding the openings open","Collagen and elastin tying the endothelial cells to the basal lamina, sealing the openings"],"k":1},{"id":"13-76","q":"What stops lymph flowing back out of a lymphatic capillary?","o":["Overlapping edges of endothelial cells acting as flaps","Tight junctions between endothelial cells","Contraction of pericytes around the capillary"],"k":0},{"id":"13-77","q":"Trace lymph from the tissues back to the blood.","o":["Lymphatic capillaries → lymph nodes → larger lymphatic vessels → thoracic duct or right lymphatic duct → great veins at the root of the neck","Lymphatic capillaries → larger lymphatic vessels → lymph nodes → thoracic duct or right lymphatic duct → great veins at the root of the neck","Lymphatic capillaries → larger lymphatic vessels → thoracic duct or right lymphatic duct → lymph nodes → great veins at the root of the neck"],"k":1,"more":"<p>In the lymph nodes the lymph is filtered and immune responses start.<\/p>"},{"id":"13-78","q":"How does a lymphatic vessel wall compare with a vein of the same size?","o":["Thinner, with layers hard to make out","Thicker, with three clear tunics","Same thickness, with a thick muscular media"],"k":0},{"id":"13-79","q":"What are lymphatic valves, and what pushes lymph along?","o":["Single folds of media covered by smooth muscle; the heartbeat transmitted along the vessel","Paired folds of intima covered by endothelium; suction from the lymph nodes","Paired folds of intima covered by endothelium; outside pressure such as skeletal-muscle contraction"],"k":2},{"id":"13-80","q":"What is a lacteal?","o":["The fenestrated blood capillary in the core of an intestinal villus","The thoroughfare channel in the core of an intestinal villus","The lymphatic capillary in the clear core of an intestinal villus"],"k":2},{"id":"13-81","q":"On a slide, what is the quickest way to tell a lymphatic from a venule or small vein?","o":["No red blood cells in the lumen","A thick muscular wall with a round lumen","A prominent internal elastic lamina"],"k":0,"more":"<p>A lymphatic also has a very thin wall with indistinct layers, may show valves, and holds pale, protein-rich lymph and a few white cells.<\/p>","figs":["img/13_vessel_8.webp"],"hy":true},{"id":"13-82","q":"What is lymphoedema?","o":["Fluid lost from tissue because lymphatics are leaky","Blood trapped in tissue because capillaries are blocked","Fluid trapped in tissue because lymphatics are blocked"],"k":2},{"id":"13-83","q":"What causes elephantiasis in lymphatic filariasis?","o":["Parasitic flatworms obstruct arteries → gangrene of a leg or the scrotum","Parasitic roundworms obstruct deep veins → massive swelling of a leg or the scrotum","Parasitic roundworms obstruct lymphatic vessels → massive swelling of a leg or the scrotum"],"k":2}]}]},{"n":14,"key":"hist","t":"The heart wall and its valves","sub":"H12 Part A","cp2":false,"secs":[{"t":"Heart wall layers","qs":[{"id":"14-0","q":"Name the three layers of the heart wall, from inside out.","o":["Epicardium → myocardium → endocardium","Endocardium → epicardium → myocardium","Endocardium → myocardium → epicardium"],"k":2,"more":"<p>The heart is a vessel wall rearranged: its three layers map onto the vessel's three tunics.<\/p>","figs":["img/14_heart_4.jpg","img/14_heart_1.webp"]},{"id":"14-1","q":"The endocardium is continuous with which layer of the great vessels?","o":["Tunica intima","Tunica adventitia","Tunica media"],"k":0},{"id":"14-2","q":"What makes up the endocardium?","o":["Endothelium on thin connective tissue with some smooth muscle → deeper subendocardial layer","Simple cuboidal epithelium on dense connective tissue → deeper serous layer","Endothelium directly on cardiac muscle with no connective tissue → deeper fibrous layer"],"k":0,"figs":["img/14_heart_4.jpg"]},{"id":"14-3","q":"What conducting fibres run in the subendocardial layer?","o":["Sinoatrial nodal fibres","Intercalated discs","Purkinje fibres"],"k":2,"figs":["img/14_heart_4.jpg"]},{"id":"14-4","q":"What is the myocardium, and which vessel tunic does it correspond to?","o":["Thick cardiac-muscle middle layer, by far the bulkiest — equivalent of the media","Thin cardiac-muscle outer layer, the least bulky — equivalent of the adventitia","Thick cardiac-muscle inner layer, by far the bulkiest — equivalent of the intima"],"k":0},{"id":"14-5","q":"What is the epicardium, and what does it carry?","o":["Parietal layer of the serous pericardium — carries coronary vessels and fat","Visceral layer of the serous pericardium — carries coronary vessels and fat","Visceral layer of the serous pericardium — carries Purkinje fibres and no fat"],"k":1,"more":"<p>On the surface, epicardial fat fills the anterior interventricular sulcus around the coronary branch running in it.<\/p>","figs":["img/14_heart_1.webp"]}]},{"t":"Pericardium","qs":[{"id":"14-6","q":"List the layers of the pericardium, from outside in.","o":["Fibrous pericardium → visceral serous layer → pericardial cavity → parietal serous layer (epicardium)","Fibrous pericardium → parietal serous layer → pericardial cavity → visceral serous layer (epicardium)","Parietal serous layer → fibrous pericardium → pericardial cavity → visceral serous layer (epicardium)"],"k":1},{"id":"14-7","q":"What does the fibrous pericardium do, and what is its key mechanical property?","o":["Tough outer sac anchoring the heart; cannot stretch acutely","Elastic outer sac cushioning the heart; recoils after stretch","Tough outer sac anchoring the heart; stretches readily"],"k":0},{"id":"14-8","q":"Where is the pericardial cavity, and what does it hold?","o":["Between parietal and visceral serous layers; a large volume of air","Between visceral serous layer and myocardium; a small volume of blood","Between parietal and visceral serous layers; a small volume of lubricating fluid"],"k":2},{"id":"14-9","q":"What is the mechanism of cardiac tamponade?","o":["Blood fills pericardial cavity → fibrous pericardium stretches → heart dilates, cannot contract","Pericardium scars and thickens → heart squeezed from outside, cannot fill","Blood fills pericardial cavity → inextensible fibrous pericardium → heart squeezed from outside, cannot fill"],"k":2,"more":"<p>Example cause: a myocardial wall rupture. The mechanism is purely the inextensibility of the outer layer.<\/p>"},{"id":"14-10","q":"What is the difference between a pericardial effusion and tamponade?","o":["Effusion: fluid compresses the heart enough to stop it filling<br>Tamponade: fluid in the sac","Effusion: fluid in the sac<br>Tamponade: fluid compresses the heart enough to stop it filling","Effusion: fluid in the myocardium<br>Tamponade: fluid in the pericardial sac"],"k":1},{"id":"14-11","q":"What is constrictive pericarditis?","o":["Scarred pericardium, thickened by connective tissue to &gt;5 mm, inelastic → restricts venous inflow (no fluid needed)","Fluid-filled pericardium, distended to &gt;5 cm, compliant → restricts arterial outflow (no scarring needed)","Scarred myocardium, thickened by fibrosis to &gt;15 mm, stiff → restricts ventricular contraction"],"k":0},{"id":"14-12","q":"What treats constrictive pericarditis?","o":["Pericardiectomy (removing the pericardium)","Pericardiocentesis (draining the fluid)","Coronary artery bypass grafting"],"k":0},{"id":"14-13","q":"In section, what are the layers of the parietal pericardium, outside in?","o":["Dense fibrous layer → mesothelium → areolar tissue facing the cavity","Mesothelium → areolar tissue → dense fibrous layer facing the cavity","Dense fibrous layer → areolar tissue → mesothelium facing the cavity"],"k":2},{"id":"14-14","q":"In section, what does the epicardium consist of?","o":["Dense fibrous tissue over areolar tissue holding the phrenic nerve","Mesothelium directly on cardiac muscle, with no connective tissue","Mesothelium over loose connective tissue holding fat, nerves and coronary vessels"],"k":2,"figs":["img/14_heart_1.webp"]},{"id":"14-15","q":"What secretes pericardial fluid, and why is it needed?","o":["Endothelium — stops the two layers rubbing","Mesothelium — stops the two layers rubbing","Fibrous pericardium — nourishes the myocardium"],"k":1,"figs":["img/14_heart_1.webp"]},{"id":"14-16","q":"Mesothelium vs endothelium: what do they share, and how do they differ?","o":["Both simple squamous<br>Mesothelium lines a body cavity (pericardial sac)<br>Endothelium lines heart and vessels","Both simple squamous<br>Mesothelium lines heart and vessels<br>Endothelium lines a body cavity (pericardial sac)","Both simple cuboidal<br>Mesothelium lines heart and vessels<br>Endothelium lines a body cavity (pericardial sac)"],"k":0}]},{"t":"Myocardium","qs":[{"id":"14-17","q":"How is the myocardium arranged?","o":["Concentric, spiral layers around each chamber; connective-tissue septa (with vessels, nerves) group fibres into fascicles","Concentric, spiral layers around each chamber; cartilage plates group fibres into fascicles","Straight longitudinal sheets from base to apex; no septa — fibres form one continuous mass"],"k":0},{"id":"14-18","q":"Why is the left ventricular wall much thicker than the right?","o":["It pumps into the low-pressure pulmonary circulation","It must hold a larger volume than the right ventricle","It pumps into the high-pressure systemic circulation"],"k":2,"more":"<p>In cross-section the left ventricle is a thick ring; the right is a thinner crescent wrapped against the interventricular septum.<\/p>","figs":["img/14_heart_2.jpg"]},{"id":"14-19","q":"Which are thicker, atrial or ventricular muscle cells?","o":["Atrial","Purkinje","Ventricular"],"k":2},{"id":"14-20","q":"What do atrial muscle cells store in small secretory granules?","o":["Antidiuretic hormone (ADH)","Brain natriuretic peptide (BNP)","Atrial natriuretic factor (ANF)"],"k":2},{"id":"14-21","q":"What does atrial natriuretic factor do?","o":["Makes the kidney excrete more sodium and water","Constricts arterioles and raises blood pressure","Makes the kidney retain more sodium and water"],"k":0,"more":"<p>So the atria double as an endocrine organ.<\/p>"}]},{"t":"Conduction system","qs":[{"id":"14-22","q":"What is the cardiac conduction system made of?","o":["Specialised nerve fibres of the autonomic nervous system","Modified cardiac muscle cells, specialised for conduction rather than contraction","Modified smooth muscle cells, specialised for conduction rather than contraction"],"k":1},{"id":"14-23","q":"Trace the cardiac conduction pathway.","o":["SA node → AV bundle (of His) → AV node → right and left bundle branches → Purkinje fibres","SA node → AV node → AV bundle (of His) → right and left bundle branches → Purkinje fibres","AV node → SA node → AV bundle (of His) → right and left bundle branches → Purkinje fibres"],"k":1,"figs":["img/14_heart_2.jpg"]},{"id":"14-24","q":"Where is the sinoatrial (SA) node, and what is its role?","o":["Interventricular septum — pacemaker","Wall of the right atrium — pacemaker","Wall of the left atrium — pacemaker"],"k":1,"figs":["img/14_heart_2.jpg"]},{"id":"14-25","q":"Where is the atrioventricular (AV) node?","o":["Upper interventricular septum, below the cardiac skeleton","Floor of the right atrium, at the atria–ventricle junction","Floor of the left atrium, at the atria–ventricle junction"],"k":1,"figs":["img/14_heart_2.jpg"]},{"id":"14-26","q":"Why is the delay at the AV node useful?","o":["Lets the ventricles finish emptying before the atria contract","Lets the ventricles contract before the atria fill","Lets the atria finish emptying before the ventricles contract"],"k":2},{"id":"14-27","q":"What course does the AV bundle (of His) take?","o":["Around the cardiac skeleton → right atrial wall → splits into anterior and posterior fascicles","Through an opening in the cardiac skeleton → interventricular septum → splits into right and left bundle branches","Through an opening in the cardiac skeleton → left ventricular free wall → splits into Purkinje fibres directly"],"k":1,"figs":["img/14_heart_2.jpg"]},{"id":"14-28","q":"What do Purkinje fibres do?","o":["Carry the signal rapidly to the right ventricle only → ventricles contract in sequence","Carry the signal slowly to both atria, ending on contractile muscle → atria contract together","Carry the signal rapidly to both ventricles, ending on contractile muscle → ventricles contract together"],"k":2,"more":"<p>They are the subendocardial network the bundle branches break up into.<\/p>"},{"id":"14-29","q":"What does an electrocardiogram (ECG) record?","o":["Spread of the impulse through the heart, from skin electrodes","Sound of the heart valves closing, from a chest microphone","Blood flow through the coronary arteries, from skin electrodes"],"k":0}]},{"t":"Cardiac muscle on a slide","qs":[{"id":"14-30","q":"What three features together identify cardiac muscle on a slide?","o":["Non-striated<br>Central nucleus<br>Intercalated discs","Striated<br>Central nucleus<br>Intercalated discs","Striated<br>Peripheral nuclei<br>Intercalated discs"],"k":1,"more":"<p>The histology clickers lean on these three features to tell cardiac from skeletal and smooth muscle.<\/p>","figs":["img/14_heart_3.webp"],"hy":true},{"id":"14-31","q":"Cardiac vs skeletal muscle: how do the nuclei differ?","o":["Cardiac: usually one, peripheral<br>Skeletal: many, central","Cardiac: usually one, central<br>Skeletal: many, at the periphery","Cardiac: many, at the periphery<br>Skeletal: usually one, central"],"k":1,"figs":["img/14_heart_3.webp"],"hy":true},{"id":"14-32","q":"Cardiac vs skeletal muscle: how do the cell shapes differ?","o":["Cardiac: long, unbranched<br>Skeletal: long, branching","Cardiac: short, branching<br>Skeletal: long fibres","Cardiac: long fibres<br>Skeletal: short, branching"],"k":1,"figs":["img/14_heart_3.webp"],"hy":true},{"id":"14-33","q":"How do intercalated discs look on a slide?","o":["Pale longitudinal lines between myofibrils — also seen in skeletal muscle","Dark cross-lines joining cells end to end — also seen in smooth muscle","Dark cross-lines joining cells end to end — unique to cardiac muscle"],"k":2,"figs":["img/14_heart_3.webp"],"hy":true},{"id":"14-34","q":"What three junctions does an intercalated disc contain?","o":["Fascia adherens<br>Desmosomes<br>Gap junctions","Tight junctions<br>Desmosomes<br>Gap junctions","Fascia adherens<br>Hemidesmosomes<br>Tight junctions"],"k":0,"figs":["img/14_heart_3.webp"]},{"id":"14-35","q":"What do the fascia adherens and desmosomes of the intercalated disc do?","o":["Anchor cells to the basement membrane","Seal the intercellular space against fluid leak","Hold cells together against the pull of contraction"],"k":2},{"id":"14-36","q":"What do the gap junctions of the intercalated disc do?","o":["Let the signal spread cell to cell → the heart works as one electrical unit","Hold cells together against the pull of contraction","Seal the intercellular space so ions cannot leak"],"k":0}]},{"t":"Purkinje fibres","qs":[{"id":"14-37","q":"Where do Purkinje fibres sit on a heart slide?","o":["Subendocardial layer — the deepest part of the endocardium","Middle of the myocardium — among the contractile fibres","Subepicardial layer — just under the mesothelium"],"k":0,"figs":["img/14_heart_4.jpg"],"hy":true},{"id":"14-38","q":"What do Purkinje fibres look like, compared with ordinary cardiac muscle?","o":["Larger and paler — abundant glycogen, few myofibrils","Smaller and darker — little glycogen, many myofibrils","Larger and darker — abundant myoglobin, many myofibrils"],"k":0,"more":"<p>The pallor is the giveaway: pale, fat cells in the subendocardium are Purkinje fibres.<\/p>","figs":["img/14_heart_4.jpg"],"hy":true},{"id":"14-39","q":"Why do Purkinje fibres look pale on a slide?","o":["Lipid dissolves in processing → clear cytoplasm around a peripheral nucleus, myofibrils packed centrally","Glycogen washes out in processing → clear cytoplasm around a central nucleus, myofibrils pushed to the edge","Glycogen stains intensely → pale nucleus pushed to the edge by myofibrils"],"k":1,"figs":["img/14_heart_4.jpg"]},{"id":"14-40","q":"How do Purkinje fibre intercalated discs differ from typical ones?","o":["Desmosomes and gap junctions present; fasciae adherentes poorly developed","Tight junctions replace gap junctions; desmosomes well developed","Fasciae adherentes and desmosomes present; gap junctions absent"],"k":0}]},{"t":"Valves","qs":[{"id":"14-41","q":"What are heart valves made of?","o":["Fold of smooth muscle covered by endocardium — contracts actively","Fold of cardiac muscle covered by endothelium — contracts actively","Fold of dense connective tissue covered by endothelium — not muscular"],"k":2,"more":"<p>A passive flap that opens and closes with the pressure across it.<\/p>","figs":["img/14_heart_5.jpg"]},{"id":"14-42","q":"Which heart-wall layer do the valves belong to?","o":["Endocardium (folds of the lining); core continuous with the cardiac skeleton","Myocardium (extensions of the muscle); core continuous with the papillary muscles","Epicardium (folds of the serous layer); core continuous with the pericardium"],"k":0,"figs":["img/14_heart_5.jpg"]},{"id":"14-43","q":"Name the atrioventricular valves.","o":["Right: pulmonary<br>Left: aortic","Right: tricuspid<br>Left: bicuspid (mitral)","Right: bicuspid (mitral)<br>Left: tricuspid"],"k":1,"figs":["img/14_heart_2.jpg"]},{"id":"14-44","q":"What stops the AV valve cusps turning inside out into the atria?","o":["Papillary muscles contract → tense the chordae tendineae","The three cusps brace against one another like a tripod","Papillary muscles relax → slacken the chordae tendineae"],"k":0,"more":"<p>Rising ventricular pressure pushes the cusps shut.<\/p>","figs":["img/14_heart_2.jpg"]},{"id":"14-45","q":"Name the semilunar valves and where each sits.","o":["Pulmonary: right ventricle → aorta<br>Aortic: left ventricle → pulmonary trunk","Pulmonary: left ventricle → pulmonary trunk<br>Aortic: right ventricle → aorta","Pulmonary: right ventricle → pulmonary trunk<br>Aortic: left ventricle → aorta"],"k":2},{"id":"14-46","q":"With no muscular support, how do semilunar valves stay shut?","o":["Their three cusps brace against one another like a tripod","Smooth muscle in the cusps contracts during diastole","Papillary muscles tense chordae tendineae attached to each cusp"],"k":0,"figs":["img/14_heart_6.webp"]},{"id":"14-47","q":"Name the parts of a semilunar cusp and what lies behind it.","o":["Lunule at middle of free edge; nodule on either side<br>Sinus: bulge of vessel wall behind each cusp","Nodule at middle of free edge; lunule on either side<br>Sinus: bulge of vessel wall behind each cusp","Nodule at middle of free edge; lunule on either side<br>Chordae tendineae: cords behind each cusp"],"k":1}]},{"t":"Cardiac skeleton","qs":[{"id":"14-48","q":"What tissue forms the cardiac skeleton?","o":["Dense irregular connective tissue","Elastic connective tissue","Dense regular connective tissue"],"k":0,"figs":["img/14_heart_5.jpg"]},{"id":"14-49","q":"How is the cardiac skeleton arranged?","o":["Four cartilaginous rings around the four valves, joined by the left and right fibrous trigones","Four fibrous rings (annuli) around the four valves, joined by the anterior and posterior papillary muscles","Four fibrous rings (annuli) around the four valves, joined by the left and right fibrous trigones"],"k":2,"figs":["img/14_heart_6.webp"]},{"id":"14-50","q":"Into which structures does the cardiac skeleton extend?","o":["Valve cusps<br>Papillary muscles<br>Muscular part of the interventricular septum","Valve cusps<br>Chordae tendineae<br>Membranous part of the interventricular septum","Valve cusps<br>Purkinje fibres<br>Muscular part of the interventricular septum"],"k":1},{"id":"14-51","q":"What are the jobs of the cardiac skeleton?","o":["Anchors the coronary arteries<br>Insertion for skeletal muscle<br>Conducts the impulse from atria to ventricles","Anchors the valves<br>Insertion for atrial and ventricular muscle<br>Electrically insulates atria from ventricles","Anchors the valves<br>Generates the pacemaker impulse<br>Electrically couples atria to ventricles"],"k":1},{"id":"14-52","q":"What is the only electrical path from atria to ventricles?","o":["Gap junctions spread evenly across the whole cardiac skeleton","Purkinje fibres, which run through the fibrous trigones","AV bundle (of His), which pierces the cardiac skeleton"],"k":2,"more":"<p>The insulating skeleton forces the signal through the AV node.<\/p>","figs":["img/14_heart_6.webp"]}]},{"t":"Coronary supply","qs":[{"id":"14-53","q":"Where do the right and left coronary arteries arise?","o":["Aortic sinuses, just above the aortic valve","Aortic arch, beside the brachiocephalic trunk","Left ventricle, just below the aortic valve"],"k":0},{"id":"14-54","q":"When do the coronary arteries fill, and what drives it?","o":["During contraction — ventricular squeeze pushes blood directly into them","Between contractions — the pulmonary trunk recoils and pushes blood in","Between contractions — the stretched elastic aortic wall recoils and pushes blood in"],"k":2},{"id":"14-55","q":"What are the main branches of the left coronary artery?","o":["Anterior interventricular<br>Right marginal","Anterior interventricular<br>Circumflex","Circumflex<br>Posterior interventricular"],"k":1},{"id":"14-56","q":"What are the main branches of the right coronary artery?","o":["Left marginal<br>Usually the anterior interventricular","Right marginal<br>Usually the posterior interventricular","Anterior interventricular<br>Circumflex"],"k":1},{"id":"14-57","q":"What is a myocardial infarction?","o":["Coronary spasm briefly reduces flow without killing muscle","Thickened pericardium restricts venous inflow to the heart","Coronary thrombosis (clot) kills the muscle that artery supplies"],"k":2}]}]},{"n":27,"key":"hist","t":"The airway, from nose to bronchiole","sub":"H13","cp2":false,"secs":[{"t":"Tract divisions and nose","qs":[{"id":"27-0","q":"Anatomically, what makes up the upper and lower respiratory tract?","o":["Upper: nasal cavity, sinuses<br>Lower: pharynx, larynx, trachea, bronchi, lungs","Upper: nasal cavity, sinuses, pharynx, larynx<br>Lower: trachea, bronchi, lungs","Upper: nasal cavity, sinuses, pharynx<br>Lower: larynx, trachea, bronchi, lungs"],"k":2},{"id":"27-1","q":"What is the conducting portion of the respiratory tract, and what does it do?","o":["Nasal cavity → terminal bronchioles; only conditions and carries air","Nasal cavity → respiratory bronchioles; conditions air and exchanges some gas","Trachea → alveolar ducts; only conditions and carries air"],"k":0,"figs":["img/27_airway_7.webp"]},{"id":"27-2","q":"What is the respiratory portion, and what does it do?","o":["Bronchi, bronchioles, alveoli — warms and humidifies air","Terminal bronchioles, respiratory bronchioles, alveoli — exchanges gas","Respiratory bronchioles, alveolar ducts, alveoli — exchanges gas"],"k":2,"figs":["img/27_airway_7.webp"]},{"id":"27-3","q":"What is the last conducting segment of the airway?","o":["Alveolar duct","Respiratory bronchiole","Terminal bronchiole"],"k":2,"figs":["img/27_airway_7.webp"]},{"id":"27-4","q":"What lines the nasal vestibule?","o":["Non-keratinized stratified squamous epithelium with mucous glands and no hairs","Pseudostratified ciliated columnar epithelium with goblet cells and seromucous glands","Keratinized stratified squamous epithelium (skin) with sweat and sebaceous glands and vibrissae"],"k":2},{"id":"27-5","q":"What are vibrissae?","o":["Motile cilia of the nasal respiratory epithelium","Non-motile cilia of the olfactory neurons","Coarse filtering hairs of the nasal vestibule"],"k":2},{"id":"27-6","q":"What happens to the vestibule epithelium further into the nose?","o":["Becomes keratinized in a transition zone","Loses its keratin in a transition zone","Becomes olfactory epithelium directly"],"k":1},{"id":"27-7","q":"Which nasal surfaces carry olfactory epithelium, and which carry respiratory epithelium?","o":["Olfactory: middle concha and septum<br>Respiratory: superior and inferior conchae","Olfactory: superior concha and roof<br>Respiratory: middle and inferior conchae","Olfactory: inferior concha and floor<br>Respiratory: superior and middle conchae"],"k":1},{"id":"27-8","q":"How does the nasal cavity condition inhaled air?","o":["Secretions humidify<br>Capillary loops + large venous plexus warm<br>Mucus traps particles<br>Plasma cells add immunoglobulin A (IgA)","Secretions dry the air<br>Capillary loops + venous plexus cool<br>Cilia absorb particles<br>Plasma cells add immunoglobulin E (IgE)","Secretions humidify<br>Capillary loops + large arterial plexus warm<br>Keratin traps particles<br>Plasma cells add immunoglobulin G (IgG)"],"k":0}]},{"t":"Respiratory epithelium","qs":[{"id":"27-9","q":"What type of epithelium is respiratory epithelium, and on what?","o":["Pseudostratified ciliated columnar, on a thick basement membrane","Pseudostratified non-ciliated columnar, on a thin basement membrane","Stratified ciliated columnar, on a thick basement membrane"],"k":0,"figs":["img/27_airway_1.webp","img/27_airway_3.webp"]},{"id":"27-10","q":"Why is respiratory epithelium called <i>pseudo<\/i>stratified?","o":["Only basal cells touch the basement membrane, but cilia sit at different heights","All cells touch the basement membrane, but nuclei sit at different heights","Cells form several layers, but only the top layer touches the basement membrane"],"k":1},{"id":"27-11","q":"Name the five cell types of respiratory epithelium.","o":["Ciliated columnar<br>Goblet<br>Basal<br>Sustentacular<br>Olfactory neuron","Ciliated columnar<br>Goblet<br>Basal<br>Brush<br>Small granule (Kulchitsky)","Ciliated columnar<br>Paneth<br>Basal<br>Brush<br>Dust cell (macrophage)"],"k":1},{"id":"27-12","q":"What are the approximate proportions of the respiratory epithelial cells?","o":["Ciliated: ~60%<br>Goblet, basal: ~15% each<br>Small granule: ~10%","Ciliated, goblet, basal: ~30% each<br>Brush: ~3%<br>Small granule: few","Ciliated, goblet, basal: ~30% each<br>Small granule: ~3%<br>Brush: few"],"k":2},{"id":"27-13","q":"Which is the most numerous cell of respiratory epithelium?","o":["Goblet cell","Basal cell","Ciliated columnar cell"],"k":2},{"id":"27-14","q":"How many cilia does each ciliated cell have, and what do they do?","o":["250–300 motile cilia — sweep mucus toward the alveoli","20–30 motile cilia — sweep mucus toward the pharynx","250–300 motile cilia — sweep mucus toward the pharynx"],"k":2},{"id":"27-15","q":"What makes the dark line under the cilia of respiratory epithelium?","o":["Tight junctions","Basal bodies","Glycocalyx coat"],"k":1},{"id":"27-16","q":"How do goblet cells look?","o":["Apical nucleus; base full of zymogen granules","Basal nucleus; apex covered by thick blunt microvilli","Basal nucleus; apex full of mucin granules"],"k":2,"figs":["img/27_airway_1.webp"]},{"id":"27-17","q":"What is the role of the basal cells of respiratory epithelium?","o":["Mucus secretion","Stem cells","Chemosensation"],"k":1},{"id":"27-18","q":"Describe the brush cell of respiratory epithelium.","o":["Thick, blunt microvilli; chemosensory, in synaptic contact with afferent nerve endings","Basal nucleus with dense-core granules; endocrine, releasing calcitonin-like peptide","Long motile cilia; mechanosensory, in synaptic contact with efferent nerve endings"],"k":0},{"id":"27-19","q":"Small granule (Kulchitsky) cells belong to which system, and what do they contain?","o":["Diffuse neuroendocrine system (DNES) — dense-core granules of peptide hormone (calcitonin-like in bronchi)","Diffuse neuroendocrine system (DNES) — mucin granules of glycoprotein","Mucosa-associated lymphoid tissue (MALT) — lysosomal granules of hydrolase"],"k":0},{"id":"27-20","q":"What stain marks small granule (Kulchitsky) cells?","o":["Peptide-hormone immunostain","Alcian blue mucin stain","Periodic acid–Schiff (PAS)"],"k":0},{"id":"27-21","q":"Which lung cancer arises from small granule (Kulchitsky) cells?","o":["Squamous cell carcinoma","Large cell carcinoma","Small cell lung cancer"],"k":2}]},{"t":"Olfactory epithelium","qs":[{"id":"27-22","q":"How does olfactory epithelium differ from respiratory epithelium?","o":["Shorter pseudostratified; thick basement membrane; many goblet cells","Taller pseudostratified; thin basement membrane; no goblet cells","Taller pseudostratified; thick basement membrane; many goblet cells"],"k":1,"figs":["img/27_airway_1.webp"]},{"id":"27-23","q":"What cell perceives smell, and where are its nuclei in the epithelium?","o":["Bipolar olfactory neuron — nuclei form a middle row","Sustentacular cell — nuclei form a middle row","Multipolar olfactory neuron — nuclei form the basal row"],"k":0,"figs":["img/27_airway_1.webp"]},{"id":"27-24","q":"What does the dendrite of an olfactory neuron end in?","o":["Single primary cilium embedded in the basement membrane","Knob of short motile cilia (&ldquo;olfactory hairs&rdquo;) that sweep mucus","Knob of long non-motile cilia (&ldquo;olfactory hairs&rdquo;) carrying the receptors"],"k":2},{"id":"27-25","q":"Where do olfactory neuron axons go?","o":["Through the cribriform plate as the olfactory nerve","Through the optic canal as the olfactory nerve","Through the cribriform plate as the trigeminal nerve"],"k":0,"figs":["img/27_airway_1.webp"]},{"id":"27-26","q":"Describe the supporting (sustentacular) cells of olfactory epithelium.","o":["Microvilli and ion channels; nuclei nearest the surface","Motile cilia and mucin granules; nuclei nearest the basement membrane","Microvilli and ion channels; nuclei forming the middle row"],"k":0,"figs":["img/27_airway_1.webp"]},{"id":"27-27","q":"Why does smell lost in a cold come back?","o":["Basal stem cells on the basement membrane regenerate the olfactory neurons","Sustentacular cells divide and become olfactory neurons","Surviving neurons regrow their cilia; no new neurons form"],"k":0,"figs":["img/27_airway_1.webp"]},{"id":"27-28","q":"What is the giveaway of olfactory mucosa in the lamina propria?","o":["Serous von Ebner's glands","Mucous goblet cells","Serous Bowman's glands"],"k":2,"more":"<p>The lamina propria also holds nerve bundles and vessels.<\/p>","figs":["img/27_airway_1.webp"]},{"id":"27-29","q":"Is olfactory epithelium ciliated?","o":["Only non-motile neuronal cilia; no motile ciliated cells","Yes — mostly motile ciliated columnar cells","Yes — sustentacular cells carry motile cilia"],"k":0,"more":"<p>Some tables call it &ldquo;ciliated&rdquo; because of those neuronal cilia.<\/p>"}]},{"t":"Sinuses, pharynx, cilia","qs":[{"id":"27-30","q":"How does the lining of the sinuses and nasopharynx differ from nasal respiratory epithelium?","o":["Thinner, with few goblet cells and few, small glands","Thinner, with many goblet cells and large glands","Thicker, with many goblet cells and large glands"],"k":0},{"id":"27-31","q":"What muscle and structures are found in the pharynx and nasopharynx?","o":["Pharynx: skeletal muscle<br>Nasopharynx: pharyngeal tonsil, auditory tube opening","Pharynx: smooth muscle<br>Nasopharynx: pharyngeal tonsil, maxillary sinus opening","Pharynx: skeletal muscle<br>Nasopharynx: lingual tonsil, nasolacrimal duct opening"],"k":0},{"id":"27-32","q":"What goes wrong in primary ciliary dyskinesia?","o":["Thick, dehydrated mucus from a defective chloride channel blocks clearance","Normal cilia beat too fast → mucus is swept into the alveoli","Deformed cilia fail to beat together → mucus, dirt and bacteria build up"],"k":2},{"id":"27-33","q":"Where does mucus build up in primary ciliary dyskinesia, and what else is affected?","o":["Nasal cavity and sinuses only; fertility impaired in women only","Bronchi and lungs only; fertility impaired in men only","Nasal cavity, sinuses, middle ear, trachea, bronchi, lungs; fertility impaired in both sexes"],"k":2}]},{"t":"Larynx","qs":[{"id":"27-34","q":"Which laryngeal surfaces have non-keratinized stratified squamous epithelium, and why?","o":["Lingual surface of epiglottis + vocal folds — they take friction","Lingual surface of epiglottis + ventricle — they trap particles","Laryngeal surface of epiglottis + vestibular folds — they take friction"],"k":0,"figs":["img/27_airway_2.webp"]},{"id":"27-35","q":"What lines the rest of the larynx, including the vestibular (false) folds?","o":["Respiratory epithelium (starting on the lingual surface of the epiglottis)","Respiratory epithelium (starting on the laryngeal surface of the epiglottis)","Simple cuboidal epithelium (starting below the vocal folds)"],"k":1,"figs":["img/27_airway_2.webp"]},{"id":"27-36","q":"What cartilage is the epiglottis, and what else does it contain?","o":["Elastic cartilage — with perichondrium, seromucous glands, taste buds","Hyaline cartilage — with perichondrium, seromucous glands, taste buds","Fibrocartilage — without perichondrium, mucous glands only"],"k":0},{"id":"27-37","q":"What cartilage are the thyroid and cricoid?","o":["Elastic (may contain bone in adults)","Hyaline (may contain bone in adults)","Fibrocartilage (no perichondrium)"],"k":1},{"id":"27-38","q":"What is in the laryngeal lamina propria?","o":["Serous Bowman's glands, dense regular tissue, olfactory nerve bundles","Sweat and sebaceous glands, dense irregular tissue, hair follicles","Mixed seromucous glands, areolar tissue, mucosa-associated lymphoid tissue (MALT)"],"k":2,"figs":["img/27_airway_2.webp"]},{"id":"27-39","q":"What does each true vocal fold contain?","o":["Elastic vocal ligament over smooth muscle and seromucous glands","Elastic vocal ligament (top edge of conus elasticus) over the striated vocalis muscle","Elastic vestibular ligament over the smooth trachealis muscle"],"k":1,"figs":["img/27_airway_2.webp"]},{"id":"27-40","q":"What separates the true vocal fold from the vestibular fold above?","o":["The piriform recess (rising into a small saccule)","The ventricle (rising into a small saccule)","The epiglottis (rising into the vallecula)"],"k":1,"figs":["img/27_airway_2.webp"]},{"id":"27-41","q":"What is a singer's nodule?","o":["Fluid-filled cyst of the laryngeal saccule from voice overuse, covered by respiratory epithelium","Callus-like growth at the midpoint of the vocal fold from voice overuse, covered by stratified squamous epithelium","Malignant growth at the anterior end of the vocal fold from smoking, covered by keratinized squamous epithelium"],"k":1}]},{"t":"Trachea","qs":[{"id":"27-42","q":"List the layers of the tracheal wall, inside out.","o":["Mucosa → hyaline cartilage → submucosa → adventitia","Mucosa → submucosa → elastic cartilage → adventitia","Mucosa → submucosa → hyaline cartilage → adventitia"],"k":2,"figs":["img/27_airway_3.webp"]},{"id":"27-43","q":"What is the tracheal mucosa made of?","o":["Respiratory mucosa with lymphoid tissue, edged by an elastic membrane","Olfactory mucosa with Bowman's glands, edged by a collagen membrane","Stratified squamous mucosa with sebaceous glands, edged by smooth muscle"],"k":0,"figs":["img/27_airway_3.webp"]},{"id":"27-44","q":"What glands are in the tracheal submucosa, and what do they make?","o":["Sebaceous glands (some in lamina propria too) — oily sebum","Seromucous glands (some in lamina propria too) — watery mucus","Serous Bowman's glands (only in lamina propria) — watery fluid"],"k":1,"figs":["img/27_airway_3.webp"]},{"id":"27-45","q":"What is the tracheal cartilage like, and what does it do?","o":["Complete elastic rings without perichondrium — let the lumen collapse","C-shaped hyaline rings with perichondrium (may contain bone in adults) — hold the lumen open","C-shaped fibrocartilage rings (never calcify) — anchor the lungs"],"k":1,"figs":["img/27_airway_3.webp"]},{"id":"27-46","q":"What bridges the posterior gap of the tracheal cartilage rings?","o":["Trachealis muscle (smooth)","Elastic cartilage plates","Trachealis muscle (skeletal)"],"k":0,"figs":["img/27_airway_3.webp"]},{"id":"27-47","q":"What is in the tracheal adventitia?","o":["Smooth muscle, elastic membrane, perichondrium","Seromucous glands, MALT, hyaline cartilage","Vessels, nerves, lymphatics, fat"],"k":2,"figs":["img/27_airway_3.webp"]}]},{"t":"Bronchi","qs":[{"id":"27-48","q":"Name the bronchi in order from the carina.","o":["Primary (lobar) → secondary (main) → tertiary (segmental)","Primary (main) → tertiary (segmental) → secondary (lobar)","Primary (main) → secondary (lobar) → tertiary (segmental)"],"k":2,"figs":["img/27_airway_7.webp"]},{"id":"27-49","q":"What cartilage do primary bronchi have?","o":["Isolated plates of elastic cartilage","No cartilage — smooth muscle only","Trachea-like rings (complete in some sources, C-shaped in others)"],"k":2},{"id":"27-50","q":"What are the wall features of intrapulmonary bronchi?","o":["Flat respiratory epithelium, many goblet cells<br>Longitudinal smooth muscle in adventitia<br>No glands<br>No MALT<br>C-shaped hyaline cartilage rings","Folded respiratory epithelium, few goblet cells<br>Spiral skeletal muscle in submucosa<br>Sebaceous glands<br>MALT<br>Isolated elastic cartilage plates","Folded respiratory epithelium, few goblet cells<br>Spiral smooth muscle in lamina propria<br>Serous and mucous glands<br>MALT<br>Isolated hyaline cartilage plates"],"k":2,"figs":["img/27_airway_4.webp"]},{"id":"27-51","q":"What form does the cartilage take in intrapulmonary bronchi?","o":["C-shaped rings of hyaline cartilage","Isolated plates of elastic cartilage","Isolated plates of hyaline cartilage"],"k":2,"figs":["img/27_airway_4.webp"]},{"id":"27-52","q":"What lies against the adventitia of an intrapulmonary bronchus?","o":["Lung tissue and a branch of the pulmonary artery","Visceral pleura and a branch of the bronchial vein","Lung tissue and a branch of the pulmonary vein"],"k":0,"figs":["img/27_airway_4.webp"]},{"id":"27-53","q":"How does the bronchial wall change distally?","o":["Epithelium heightens; glands and goblet cells increase","Epithelium shortens; glands and goblet cells thin out","Epithelium shortens; cartilage rings become complete"],"k":1}]},{"t":"Bronchioles and club cells","qs":[{"id":"27-54","q":"What size are bronchioles, and what do they lack?","o":["&lt;5 mm across — no cartilage, many glands","&lt;1 mm across — no cartilage, no glands","&lt;1 mm across — cartilage plates, no glands"],"k":1,"figs":["img/27_airway_5.webp"]},{"id":"27-55","q":"What does a bronchiole wall have instead of cartilage?","o":["Folded mucosa with abundant seromucous glands","Folded mucosa with complete elastic cartilage rings","Folded mucosa with well-developed smooth muscle"],"k":2,"figs":["img/27_airway_5.webp"]},{"id":"27-56","q":"How does the epithelium change along the bronchioles?","o":["Ciliated low columnar → non-ciliated cuboidal; club cells take over","Ciliated low columnar → stratified squamous; brush cells take over","Pseudostratified columnar → simple squamous; type I cells take over"],"k":0,"figs":["img/27_airway_5.webp"]},{"id":"27-57","q":"What epithelium lines the terminal bronchiole?","o":["Simple cuboidal (some atlases say low columnar)","Stratified cuboidal (some atlases say stratified columnar)","Simple squamous (some atlases say flattened cuboidal)"],"k":0,"figs":["img/27_airway_6.webp"]},{"id":"27-58","q":"Which cells make up the terminal bronchiole epithelium?","o":["Mostly club cells; some ciliated cells; a few brush and granule cells","Mostly goblet cells; some ciliated cells; a few basal and brush cells","Mostly type I pneumocytes; some type II cells; a few club cells"],"k":0,"figs":["img/27_airway_6.webp"]},{"id":"27-59","q":"What surrounds the terminal bronchiole epithelium, and what is missing from its wall?","o":["Thick spiral skeletal muscle with goblet cells; no elastic fibres in the wall","1–2 layers of smooth muscle with elastic fibres; no alveoli opening from the wall","Isolated hyaline cartilage plates with seromucous glands; no smooth muscle in the wall"],"k":1,"figs":["img/27_airway_6.webp"]},{"id":"27-60","q":"Where are club (Clara) cells, and how do they look?","o":["Bronchi only — non-ciliated columnar, basal granules of peptide hormone","Trachea and primary bronchi — ciliated columnar, flat apices full of mucin","Terminal and respiratory bronchioles — non-ciliated cuboidal, dome-shaped apices full of granules"],"k":2,"figs":["img/27_airway_6.webp"]},{"id":"27-61","q":"What do club cells secrete?","o":["Calcitonin-like peptide hormones","Surfactant-like phospholipids and mucins","Hydrochloric acid and pepsinogen"],"k":1},{"id":"27-62","q":"How do club cells detoxify inhaled chemicals?","o":["Abundant smooth endoplasmic reticulum (SER)","Abundant rough endoplasmic reticulum (RER)","Abundant lysosomes that digest the chemicals"],"k":0},{"id":"27-63","q":"What immune defences do club cells add?","o":["IgG antibodies, interferon-γ, defensin-free mucus","IgA secretory component, antimicrobial peptides, cytokines","IgE production, histamine, leukotrienes"],"k":1},{"id":"27-64","q":"Besides secretion and defence, what other role do some club cells have?","o":["Stem cells","Phagocytes","Chemoreceptors"],"k":0}]},{"t":"Wall features down the tree","qs":[{"id":"27-65","q":"Hyaline cartilage: last seen where, and gone by where?","o":["Last in terminal bronchioles (plates) → gone by alveolar ducts","Last in bronchi (rings, then plates) → gone by bronchioles","Last in bronchioles (plates) → gone by respiratory bronchioles"],"k":1,"more":"<table><tr><th>Feature<\/th><th>Last seen<\/th><th>Gone by<\/th><\/tr><tr><td>Cartilage<\/td><td>Bronchi<\/td><td>Bronchioles<\/td><\/tr><tr><td>Glands<\/td><td>Bronchi<\/td><td>Bronchioles<\/td><\/tr><tr><td>Goblet cells<\/td><td>Larger bronchioles<\/td><td>Terminal bronchioles<\/td><\/tr><tr><td>Cilia<\/td><td>Respiratory bronchioles<\/td><td>Alveolar ducts<\/td><\/tr><tr><td>Smooth muscle<\/td><td>Alveolar ducts<\/td><td>Alveolar wall<\/td><\/tr><tr><td>Elastic fibres<\/td><td>Alveoli<\/td><td>Present throughout<\/td><\/tr><\/table>","figs":["img/27_airway_7.webp"]},{"id":"27-66","q":"Glands: last seen where, and gone by where?","o":["Last in bronchi → gone by bronchioles","Last in trachea → gone by bronchi","Last in respiratory bronchioles → gone by alveolar ducts"],"k":0,"figs":["img/27_airway_7.webp"]},{"id":"27-67","q":"Goblet cells: last seen where, and gone by where?","o":["Last in respiratory bronchioles → gone by alveolar ducts","Last in larger bronchioles → gone by terminal bronchioles","Last in terminal bronchioles → gone by respiratory bronchioles"],"k":1,"figs":["img/27_airway_7.webp"]},{"id":"27-68","q":"Cilia: last seen where, and gone by where?","o":["Last in alveolar ducts (a few) → gone by alveoli","Last in respiratory bronchioles (a few) → gone by alveolar ducts","Last in terminal bronchioles → gone by respiratory bronchioles"],"k":1,"figs":["img/27_airway_7.webp"]},{"id":"27-69","q":"Smooth muscle: last seen where, and gone by where?","o":["Last in alveolar ducts (ringing alveolar openings) → gone by the alveolar wall","Last in terminal bronchioles → gone by respiratory bronchioles","Last in respiratory bronchioles → gone by alveolar ducts"],"k":0,"figs":["img/27_airway_7.webp"]},{"id":"27-70","q":"Which airway wall component is present all the way to the alveoli?","o":["Hyaline cartilage","Smooth muscle","Elastic fibres"],"k":2,"figs":["img/27_airway_7.webp"]}]},{"t":"Asthma and smoking","qs":[{"id":"27-71","q":"What is asthma, and which cells are involved?","o":["Chronic fibrosis of the lung interstitium — fibroblasts, type II cells","Chronic inflammation of the alveolar walls — neutrophils, macrophages, B lymphocytes","Chronic inflammation of the bronchial tree — mast cells, eosinophils, T lymphocytes"],"k":2},{"id":"27-72","q":"What is the sequence of an acute asthmatic bronchospasm?","o":["Antigen → mast cells degranulate → bronchiolar smooth muscle contracts suddenly","Antigen → mast cells degranulate → bronchiolar smooth muscle relaxes suddenly","Antigen → eosinophils degranulate → tracheal cartilage collapses suddenly"],"k":0},{"id":"27-73","q":"Why do bronchioles suffer most in asthma?","o":["Most goblet cells and glands, so mucus plugs form first","Proportionally thickest muscle layer and no cartilage to hold them open","Proportionally thinnest muscle layer and complete cartilage rings that cannot flex"],"k":1,"figs":["img/27_airway_5.webp"]},{"id":"27-74","q":"What chronic wall changes does asthma cause?","o":["Smooth-muscle atrophy<br>Thinned basement membrane<br>Fewer goblet and basal cells<br>Loss of mucus<br>Ciliated hyperplasia","Smooth-muscle atrophy<br>Thickened basement membrane<br>More club cells<br>Alveolar wall destruction<br>Columnar metaplasia","Smooth-muscle hypertrophy<br>Thickened basement membrane<br>More goblet and basal cells<br>Mucus plugs<br>Squamous metaplasia"],"k":2},{"id":"27-75","q":"How do epinephrine and other sympathomimetics help in asthma?","o":["Increase goblet-cell mucus → clear the bronchioles","Stabilize mast cells → stop histamine release only","Relax bronchiolar smooth muscle → widen bronchioles"],"k":2},{"id":"27-76","q":"What happens to the bronchial lining of a chronic smoker?","o":["Ciliated columnar → simple cuboidal (cuboidal metaplasia) → can progress to adenocarcinoma only","Ciliated columnar → stratified squamous (squamous metaplasia) → can progress to precancerous dysplasia","Ciliated columnar → goblet-cell hyperplasia (columnar metaplasia) → cannot progress further"],"k":1},{"id":"27-77","q":"Why does squamous metaplasia in smokers impair clearance?","o":["Squamous cells withstand smoke but have no cilia, so mucus is not cleared","Squamous cells have motile cilia that beat in the wrong direction","Squamous cells lack goblet cells, so no mucus is made to trap particles"],"k":0}]}]},{"n":28,"key":"hist","t":"Where gas is exchanged: bronchioles to alveoli","sub":"H13","cp2":false,"secs":[{"t":"Respiratory bronchiole","qs":[{"id":"28-0","q":"What is the first segment of the respiratory portion, and where does it come from?","o":["Respiratory bronchiole — branches from the terminal bronchiole","Respiratory bronchiole — branches from the alveolar sac","Terminal bronchiole — branches from the respiratory bronchiole"],"k":0,"figs":["img/28_alveoli_1.webp"]},{"id":"28-1","q":"What lines a respiratory bronchiole?","o":["Pseudostratified ciliated columnar cells with goblet cells over cartilage plates (like a bronchus)","Stratified squamous cells over a thick layer of elastic cartilage (like the larynx)","Small cuboidal cells and club cells over some smooth muscle (like the terminal bronchiole)"],"k":2},{"id":"28-2","q":"What is the main difference between a respiratory and a terminal bronchiole?","o":["Goblet cells line the respiratory bronchiole's wall","Cartilage plates appear in the respiratory bronchiole's wall","Alveoli open from the respiratory bronchiole's wall"],"k":2,"more":"<p>Gas exchange begins the moment alveoli appear in the airway wall, so the openings are what you look for.<\/p>","figs":["img/28_alveoli_1.webp"]},{"id":"28-3","q":"What vessel runs alongside a respiratory bronchiole?","o":["A branch of the bronchial vein","A tributary of the pulmonary vein","A branch of the pulmonary artery"],"k":2}]},{"t":"Alveolar ducts and sacs","qs":[{"id":"28-4","q":"What makes up the wall of an alveolar duct?","o":["A continuous layer of cuboidal cells and club cells over thick smooth muscle","Almost entirely alveolar openings, each ringed by a little smooth muscle (pink knob between alveoli)","Almost entirely goblet cells, each ringed by a little elastic cartilage"],"k":1,"figs":["img/28_alveoli_1.webp"]},{"id":"28-5","q":"What is an alveolar sac?","o":["A cluster of alveoli around a shared space, at the end of an alveolar duct","A single alveolus at the end of a respiratory bronchiole","A dilated airway that gives rise to several alveolar ducts"],"k":0,"figs":["img/28_alveoli_1.webp"]},{"id":"28-6","q":"From the alveolar ducts on, what is the lining and supporting matrix?","o":["Simple cuboidal lining; hyaline cartilage and smooth muscle","Pseudostratified columnar lining; dense collagen and cartilage plates","Simple squamous lining; elastic and collagen (reticular) fibres"],"k":2},{"id":"28-7","q":"Where is smooth muscle found in the alveolar region?","o":["Only at the alveolar openings","Throughou
