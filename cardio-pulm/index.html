 → BH<sup>+<\/sup>"],"k":2},{"id":"21-9","q":"What makes an acid or base <b>strong<\/b>?","o":["Has a high pK<sub>a<\/sub> (e.g., acetic acid, ammonia)","Dissociates completely in water (e.g., HCl, NaOH)","Dissociates only partly in water (e.g., HCl, NaOH)"],"k":1},{"id":"21-10","q":"What makes an acid or base <b>weak<\/b>?","o":["Dissociates completely; equilibrium set by its pK<sub>a<\/sub>","Is dilute in water; strength set by its concentration","Dissociates only partly; equilibrium set by its pK<sub>a<\/sub>"],"k":2,"more":"<p>Examples: acetic acid, lactic acid, ammonia.<\/p>"},{"id":"21-11","q":"Lower pK<sub>a<\/sub> means what about an acid&rsquo;s strength?","o":["Stronger acid","Stronger base","Weaker acid"],"k":0},{"id":"21-12","q":"What are the pK<sub>a<\/sub> values of lactic acid and acetic acid?","o":["Lactic acid 6.1<br>Acetic acid 6.8","Lactic acid 3.9<br>Acetic acid 4.8","Lactic acid 4.8<br>Acetic acid 3.9"],"k":1,"more":"<p>Lactic acid has the lower pK<sub>a<\/sub>, so it is the stronger acid.<\/p>"}]},{"t":"Henderson–Hasselbalch and buffers","qs":[{"id":"21-13","q":"State the Henderson–Hasselbalch equation.","o":["pH = pK<sub>a<\/sub> + log([HA]/[A<sup>&minus;<\/sup>])","pK<sub>a<\/sub> = pH + log([A<sup>&minus;<\/sup>]/[HA])","pH = pK<sub>a<\/sub> + log([A<sup>&minus;<\/sup>]/[HA])"],"k":2,"more":"<p>It links pH to the ratio of a weak acid&rsquo;s two forms.<\/p>"},{"id":"21-14","q":"When pH = pK<sub>a<\/sub>, how do [A<sup>&minus;<\/sup>] and [HA] compare?","o":["Equal","[A<sup>&minus;<\/sup>] is ten times [HA]","[A<sup>&minus;<\/sup>] is twice [HA]"],"k":0,"figs":["img/21_acid_1.webp"]},{"id":"21-15","q":"Above its pK<sub>a<\/sub>, which form of a weak acid dominates, and how does it cross membranes?","o":["Uncharged HA; crosses easily","Charged A<sup>&minus;<\/sup>; crosses poorly","Charged A<sup>&minus;<\/sup>; crosses easily"],"k":1},{"id":"21-16","q":"Below its pK<sub>a<\/sub>, which form of a weak acid dominates, and how does it cross membranes?","o":["Charged A<sup>&minus;<\/sup>; crosses poorly","Uncharged HA; crosses poorly","Uncharged HA; crosses easily"],"k":2},{"id":"21-17","q":"Does the Henderson–Hasselbalch equation apply to strong acids?","o":["No — strong acids and bases only","Yes — strong acids only","No — weak acids and weak bases only"],"k":2,"more":"<p>Strong acids dissociate completely, so there is no equilibrium ratio to describe.<\/p>"},{"id":"21-18","q":"What is the pK<sub>a<\/sub> of aspirin?","o":["4.8 (a weak acid)","3.5 (a weak acid)","6.1 (a weak acid)"],"k":1},{"id":"21-19","q":"Why is aspirin absorbed from the stomach?","o":["Stomach pH ≈ 2 < pK<sub>a<\/sub> 3.5 → mostly charged → trapped in blood","Stomach pH ≈ 6 > pK<sub>a<\/sub> 3.5 → mostly uncharged → crosses into blood","Stomach pH ≈ 2 < pK<sub>a<\/sub> 3.5 → mostly uncharged → crosses into blood"],"k":2,"more":"<p>This is why drug absorption depends on pH.<\/p>"},{"id":"21-20","q":"What is a buffer?","o":["A weak acid mixed with its conjugate base","A strong acid mixed with a strong base","A strong acid mixed with its conjugate base"],"k":0},{"id":"21-21","q":"How does a buffer keep pH from moving?","o":["Acid neutralises added base; conjugate base neutralises added acid","It removes added H<sup>+<\/sup> by excreting it into urine","Conjugate base neutralises added base; acid neutralises added acid"],"k":0},{"id":"21-22","q":"At what pH is a buffer strongest, and why?","o":["pH = pK<sub>a<\/sub> — the two forms are equal","pH = 7 — H<sup>+<\/sup> and OH<sup>&minus;<\/sup> are equal","pH = pK<sub>a<\/sub> + 1 — the base form is ten times greater"],"k":0,"figs":["img/21_acid_1.webp"]},{"id":"21-23","q":"Over what range is a buffer useful?","o":["Within about ±1 pH unit of its pK<sub>a<\/sub>","Within about ±0.1 pH unit of its pK<sub>a<\/sub>","Within about ±3 pH units of its pK<sub>a<\/sub>"],"k":0,"more":"<p>The figure shows acetic acid (pK<sub>a<\/sub> 4.8) and its buffer region.<\/p>","figs":["img/21_acid_1.webp"]},{"id":"21-24","q":"What makes a buffer suited to hold a particular pH?","o":["Its pK<sub>a<\/sub> is far above that pH","Its pK<sub>a<\/sub> is close to that pH","Its pK<sub>a<\/sub> is far below that pH"],"k":1}]},{"t":"The body's buffers","qs":[{"id":"21-25","q":"What is the main buffer in blood and its pK<sub>a<\/sub>?","o":["Bicarbonate/CO<sub>2<\/sub>, pK<sub>a<\/sub> 6.1","Bicarbonate/CO<sub>2<\/sub>, pK<sub>a<\/sub> 6.8","Haemoglobin, pK<sub>a<\/sub> 7.8"],"k":0,"more":"<table><tr><th>Buffer<\/th><th>Where<\/th><th>pK<sub>a<\/sub><\/th><\/tr><tr><td>Bicarbonate/CO<sub>2<\/sub><\/td><td>Blood<\/td><td>6.1<\/td><\/tr><tr><td>Phosphate<\/td><td>Inside cells<\/td><td>6.8<\/td><\/tr><tr><td>Haemoglobin<\/td><td>Blood<\/td><td>7.8<\/td><\/tr><\/table><p>Plasma pH 7.4.<\/p>"},{"id":"21-26","q":"What is the main buffer inside cells and its pK<sub>a<\/sub>?","o":["Phosphate, pK<sub>a<\/sub> 6.1","Phosphate, pK<sub>a<\/sub> 6.8","Bicarbonate, pK<sub>a<\/sub> 6.1"],"k":1,"more":"<p>Intracellular pH is about 6.9.<\/p>"},{"id":"21-27","q":"What is the pK<sub>a<\/sub> of haemoglobin as a blood buffer?","o":["6.1","6.8","7.8"],"k":2},{"id":"21-28","q":"Why is bicarbonate the main blood buffer even though its pK<sub>a<\/sub> (6.1) is more than a unit below blood pH?","o":["Lungs and kidneys keep resetting both of its halves","It is the only buffer present in plasma","Carbonic anhydrase raises its effective pK<sub>a<\/sub> to 7.4"],"k":0},{"id":"21-29","q":"Write the bicarbonate buffer reaction.","o":["CO<sub>2<\/sub> + H<sub>2<\/sub>O ↔ H<sub>2<\/sub>CO<sub>3<\/sub> ↔ H<sup>+<\/sup> + HCO<sub>3<\/sub><sup>&minus;<\/sup>","CO<sub>2<\/sub> + H<sub>2<\/sub>O ↔ HCO<sub>3<\/sub><sup>&minus;<\/sup> ↔ H<sup>+<\/sup> + H<sub>2<\/sub>CO<sub>3<\/sub>","CO<sub>2<\/sub> + OH<sup>&minus;<\/sup> ↔ H<sub>2<\/sub>CO<sub>3<\/sub> ↔ H<sup>+<\/sup> + CO<sub>3<\/sub><sup>2&minus;<\/sup>"],"k":0},{"id":"21-30","q":"In the bicarbonate reaction, what does pushing it right vs pulling it left do?","o":["Right → generates base<br>Left → generates acid","Right → consumes acid<br>Left → generates acid","Right → generates acid<br>Left → consumes acid"],"k":2},{"id":"21-31","q":"Which organ controls the CO<sub>2<\/sub> side of the bicarbonate system, and how fast?","o":["Lungs; within minutes","Lungs; hours to days","Liver; within seconds"],"k":0},{"id":"21-32","q":"Which organ controls the HCO<sub>3<\/sub><sup>&minus;<\/sup> side of the bicarbonate system, and how fast?","o":["Kidneys; within minutes","Lungs; within minutes","Kidneys; hours to days"],"k":2},{"id":"21-33","q":"What does breathing faster do to blood pH?","o":["Blow off CO<sub>2<\/sub> → reaction pulled left → pH rises","Blow off CO<sub>2<\/sub> → reaction pushed right → pH falls","Retain CO<sub>2<\/sub> → reaction pushed right → pH falls"],"k":0},{"id":"21-34","q":"Write the Henderson–Hasselbalch equation for blood (bicarbonate system).","o":["pH = 6.8 + log([HCO<sub>3<\/sub><sup>&minus;<\/sup>] / (0.03 × PCO<sub>2<\/sub>))","pH = 6.1 + log([HCO<sub>3<\/sub><sup>&minus;<\/sup>] / (0.03 × PCO<sub>2<\/sub>))","pH = 6.1 + log((0.03 × PCO<sub>2<\/sub>) / [HCO<sub>3<\/sub><sup>&minus;<\/sup>])"],"k":1},{"id":"21-35","q":"How is dissolved CO<sub>2<\/sub> calculated from PCO<sub>2<\/sub>?","o":["Dissolved CO<sub>2<\/sub> = 0.03 × PCO<sub>2<\/sub>","Dissolved CO<sub>2<\/sub> = PCO<sub>2<\/sub> / 0.03","Dissolved CO<sub>2<\/sub> = 0.3 × PCO<sub>2<\/sub>"],"k":0},{"id":"21-36","q":"Calculate normal blood pH from HCO<sub>3<\/sub><sup>&minus;<\/sup> 24 and PCO<sub>2<\/sub> 40.","o":["40/(0.03 × 24) = 56 → log 56 = 1.7 → 6.1 + 1.7 = 7.8","24/(0.03 × 40) = 20 → log 20 = 1.3 → 6.8 + 1.3 = 8.1","24/(0.03 × 40) = 20 → log 20 = 1.3 → 6.1 + 1.3 = 7.4"],"k":2,"more":"<p>The acid-base map plots PCO<sub>2<\/sub> against HCO<sub>3<\/sub><sup>&minus;<\/sup>; each line is one pH. The orange ellipse is the normal range (around 24 and 40).<\/p>","figs":["img/21_acid_2.webp"]},{"id":"21-37","q":"Which pK<sub>a<\/sub> should you use for the bicarbonate system in blood?","o":["6.8","6.4","6.1"],"k":2,"more":"<p>Tables sometimes list 6.4 for carbonic acid/bicarbonate; use 6.1 for blood.<\/p>"},{"id":"21-38","q":"What are the kidneys&rsquo; three acid-base jobs?","o":["Secrete filtered HCO<sub>3<\/sub><sup>&minus;<\/sup><br>Make new H<sup>+<\/sup><br>Excrete ammonia gas (NH<sub>3<\/sub>)","Reabsorb filtered H<sup>+<\/sup><br>Make new CO<sub>2<\/sub><br>Excrete HCO<sub>3<\/sub><sup>&minus;<\/sup> as phosphate","Reabsorb filtered HCO<sub>3<\/sub><sup>&minus;<\/sup><br>Make new HCO<sub>3<\/sub><sup>&minus;<\/sup><br>Excrete H<sup>+<\/sup> as ammonium (NH<sub>4<\/sub><sup>+<\/sup>)"],"k":2},{"id":"21-39","q":"Which enzyme in the renal tubule cells is central to reabsorbing and making bicarbonate?","o":["Na<sup>+<\/sup>/K<sup>+<\/sup>-ATPase","Glutaminase","Carbonic anhydrase"],"k":2}]},{"t":"Naming the four disorders","qs":[{"id":"21-40","q":"How is an acid-base disorder named?","o":["CO<sub>2<\/sub> problem → respiratory; HCO<sub>3<\/sub><sup>&minus;<\/sup> problem → metabolic<br>pH low → alkalosis; pH high → acidosis","CO<sub>2<\/sub> problem → metabolic; HCO<sub>3<\/sub><sup>&minus;<\/sup> problem → respiratory<br>pH low → acidosis; pH high → alkalosis","CO<sub>2<\/sub> problem → respiratory; HCO<sub>3<\/sub><sup>&minus;<\/sup> problem → metabolic<br>pH low → acidosis; pH high → alkalosis"],"k":2,"more":"<p>Two questions, four answers.<\/p>"},{"id":"21-41","q":"What is the basic problem in respiratory acidosis?","o":["CO<sub>2<\/sub> blown off — breathing too much","CO<sub>2<\/sub> retained — not breathing enough","HCO<sub>3<\/sub><sup>&minus;<\/sup> lost — renal wasting"],"k":1},{"id":"21-42","q":"What are the causes of respiratory acidosis?","o":["Anxiety, high altitude, salicylate toxicity<br>Pulmonary embolism, pregnancy, fever<br>Low O<sub>2<\/sub> in inspired air<br>Mechanical over-ventilation","COPD, opioid overdose, respiratory failure<br>Asthma, myasthenia gravis, restrictive lung disease<br>Excess CO<sub>2<\/sub> in inspired air<br>Extra CO<sub>2<\/sub> production (malignant hyperthermia)","Diabetic ketoacidosis, lactic acidosis, renal failure<br>Diarrhoea, renal tubular acidosis<br>Methanol or ethylene glycol ingestion<br>Salicylate toxicity"],"k":1,"more":"<p>COPD = chronic obstructive pulmonary disease.<\/p>"},{"id":"21-43","q":"Which acid-base disorder does malignant hyperthermia cause, and why?","o":["Respiratory acidosis — extra CO<sub>2<\/sub> production","Metabolic alkalosis — loss of H<sup>+<\/sup> in sweat","Metabolic acidosis — extra lactic acid production"],"k":0},{"id":"21-44","q":"What is the basic problem in respiratory alkalosis?","o":["CO<sub>2<\/sub> blown off — breathing too much","HCO<sub>3<\/sub><sup>&minus;<\/sup> gained — excess antacid","CO<sub>2<\/sub> retained — not breathing enough"],"k":0},{"id":"21-45","q":"What are the causes of respiratory alkalosis?","o":["Vomiting, diuretics, antacid excess<br>Mineralocorticoid excess (hyperaldosteronism)<br>Hypokalaemia (via H<sup>+<\/sup> shift into cells)<br>Contraction of ECF volume<br>Bicarbonate (NaHCO<sub>3<\/sub>) infusion","Anxiety, high altitude, pain<br>Respiratory-centre stimulants (salicylates, analeptics)<br>Hypoxaemia (via peripheral chemoreceptors)<br>Pulmonary emboli<br>Excessive mechanical ventilation","Diarrhoea, renal failure, ketoacidosis<br>Respiratory-centre depressants (opioids, sedatives)<br>Hypoxaemia (via central chemoreceptors)<br>Pneumothorax<br>Insufficient mechanical ventilation"],"k":1},{"id":"21-46","q":"What is the basic problem in metabolic acidosis?","o":["Acid gained or bicarbonate lost","CO<sub>2<\/sub> retained or ventilation reduced","Acid lost or bicarbonate gained"],"k":0},{"id":"21-47","q":"What are the causes of metabolic acidosis?","o":["Ketoacidosis, lactic acidosis, renal failure, diarrhoea<br>Toxins: methanol, ethylene glycol, salicylate","COPD, opioid overdose, respiratory failure, asthma<br>Toxins: barbiturates, benzodiazepines","Vomiting, diuretics, antacid excess, hyperaldosteronism<br>Toxins: NaHCO<sub>3<\/sub> infusion, citrate"],"k":0},{"id":"21-48","q":"What is the basic problem in metabolic alkalosis?","o":["CO<sub>2<\/sub> retained or bicarbonate lost","Acid gained or bicarbonate lost","Acid lost or bicarbonate gained"],"k":2},{"id":"21-49","q":"What are the causes of metabolic alkalosis?","o":["Diarrhoea<br>Carbonic anhydrase inhibitors<br>Ammonium chloride (NH<sub>4<\/sub>Cl) infusion<br>Renal tubular acidosis","Vomiting<br>Diuretics<br>Bicarbonate (NaHCO<sub>3<\/sub>) infusion<br>Metabolism of ketoanions and other salts of metabolic acids","Vomiting<br>Diarrhoea<br>Ammonium chloride (NH<sub>4<\/sub>Cl) infusion<br>Ketoacidosis and lactic acidosis"],"k":1},{"id":"21-50","q":"What is the difference between acidaemia and acidosis?","o":["Acidosis = blood pH below 7.4<br>Acidaemia = the process pushing it there","Acidaemia = blood pH below 7.4<br>Acidosis = the process pushing it there","Acidaemia = a respiratory acid excess<br>Acidosis = a metabolic acid excess"],"k":1,"more":"<p>Likewise alkalaemia (pH above 7.4) vs alkalosis. They usually travel together.<\/p>","figs":["img/21_acid_2.webp"]},{"id":"21-51","q":"Can an acidosis and an alkalosis be present with a normal pH?","o":["Only if both are respiratory in origin","No — a normal pH rules out any disorder","Yes — they can run at the same time"],"k":2}]},{"t":"Reference values","qs":[{"id":"21-52","q":"What is the normal PCO<sub>2<\/sub>?","o":["22–28 mm Hg (reference 24)","33–44 mm Hg (reference 40)","45–55 mm Hg (reference 50)"],"k":1,"more":"<table><tr><th>Value<\/th><th>Range<\/th><th>Ref.<\/th><\/tr><tr><td>pH<\/td><td>7.35–7.45<\/td><td>7.40<\/td><\/tr><tr><td>PCO<sub>2<\/sub><\/td><td>33–44 mm Hg<\/td><td>40<\/td><\/tr><tr><td>PO<sub>2<\/sub><\/td><td>75–105 mm Hg<\/td><td><\/td><\/tr><tr><td>Na<sup>+<\/sup><\/td><td>135–145 mEq/L<\/td><td><\/td><\/tr><tr><td>HCO<sub>3<\/sub><sup>&minus;<\/sup><\/td><td>22–28 mEq/L<\/td><td>24<\/td><\/tr><tr><td>Cl<sup>&minus;<\/sup><\/td><td>98–106 mEq/L<\/td><td>100<\/td><\/tr><tr><td>Anion gap<\/td><td>8–16 mEq/L<\/td><td>12<\/td><\/tr><\/table>"},{"id":"21-53","q":"What is the normal plasma HCO<sub>3<\/sub><sup>&minus;<\/sup>?","o":["18–22 mEq/L (reference 20)","22–28 mEq/L (reference 24)","33–44 mEq/L (reference 40)"],"k":1},{"id":"21-54","q":"What is the normal arterial PO<sub>2<\/sub>?","o":["75–105 mm Hg","33–44 mm Hg","40–60 mm Hg"],"k":0},{"id":"21-55","q":"What is the normal plasma Na<sup>+<\/sup>?","o":["135–145 mEq/L","155–165 mEq/L","3.5–5.0 mEq/L"],"k":0},{"id":"21-56","q":"What is the normal plasma Cl<sup>&minus;<\/sup>?","o":["98–106 mEq/L (reference 100)","135–145 mEq/L (reference 140)","22–28 mEq/L (reference 24)"],"k":0}]},{"t":"Compensation","qs":[{"id":"21-57","q":"What is the general rule for how the body compensates an acid-base disorder?","o":["Moves the <i>other<\/i> variable in the <i>same<\/i> direction","Moves pH past normal in the <i>opposite<\/i> direction","Moves the <i>other<\/i> variable in the <i>opposite<\/i> direction"],"k":0,"figs":["img/21_acid_3.png"]},{"id":"21-58","q":"How is a metabolic acidosis compensated?","o":["Breathing slowly → retain CO<sub>2<\/sub> (hypoventilation)","Breathing hard → blow off CO<sub>2<\/sub> (Kussmaul respiration)","Breathing hard → retain CO<sub>2<\/sub> (Cheyne–Stokes respiration)"],"k":1},{"id":"21-59","q":"How is a respiratory acidosis compensated?","o":["Lungs blow off CO<sub>2<\/sub> within minutes","Kidney retains HCO<sub>3<\/sub><sup>&minus;<\/sup> over days","Kidney excretes HCO<sub>3<\/sub><sup>&minus;<\/sup> over days"],"k":1},{"id":"21-60","q":"Is compensation ever complete?","o":["Yes — but only for metabolic disorders","No — pulls pH towards normal, never past it","Yes — pH always returns exactly to 7.40"],"k":1,"more":"<p>So the pH still tells you which disorder is primary.<\/p>"},{"id":"21-61","q":"Which compensation is fast and which is slow?","o":["Respiratory (breathing) = fast, seconds<br>Renal = fast, minutes","Renal = fast, minutes<br>Respiratory (breathing) = slow, a day or more","Respiratory (breathing) = fast, minutes<br>Renal = slow, a day or more"],"k":2},{"id":"21-62","q":"Why does a respiratory disorder have an acute phase and a chronic phase?","o":["Lung compensation takes a day+ → acute: almost none; chronic: substantial","Chemoreceptors adapt within minutes → acute: substantial; chronic: none","Kidney compensation takes a day+ → acute: almost none; chronic: substantial"],"k":2,"more":"<p>That is why an acute respiratory problem can look uncompensated. On the map, each respiratory disorder has two shaded bands: acute and chronic.<\/p>","figs":["img/21_acid_3.png"]},{"id":"21-63","q":"What is the expected compensation for a respiratory acidosis?","o":["HCO<sub>3<\/sub><sup>&minus;<\/sup> up: acute +5–6, chronic +8–10 mEq/L per 10 mm Hg rise in PCO<sub>2<\/sub>","HCO<sub>3<\/sub><sup>&minus;<\/sup> up: acute +3–4, chronic +1–2 mEq/L per 10 mm Hg rise in PCO<sub>2<\/sub>","HCO<sub>3<\/sub><sup>&minus;<\/sup> up: acute +1–2, chronic +3–4 mEq/L per 10 mm Hg rise in PCO<sub>2<\/sub>"],"k":2},{"id":"21-64","q":"What is the expected compensation for a respiratory alkalosis?","o":["HCO<sub>3<\/sub><sup>&minus;<\/sup> down: acute &minus;1–2, chronic &minus;3–4 mEq/L per 10 mm Hg fall in PCO<sub>2<\/sub>","HCO<sub>3<\/sub><sup>&minus;<\/sup> down: acute &minus;1–2, chronic &minus;4–5 mEq/L per 10 mm Hg fall in PCO<sub>2<\/sub>","HCO<sub>3<\/sub><sup>&minus;<\/sup> down: acute &minus;4–5, chronic &minus;1–2 mEq/L per 10 mm Hg fall in PCO<sub>2<\/sub>"],"k":1},{"id":"21-65","q":"What is the expected compensation for a metabolic acidosis?","o":["Hyperventilation: PCO<sub>2<\/sub> &minus;3 mm Hg per 1 mEq/L fall in HCO<sub>3<\/sub><sup>&minus;<\/sup>","Hyperventilation: PCO<sub>2<\/sub> &minus;1.2 mm Hg per 1 mEq/L fall in HCO<sub>3<\/sub><sup>&minus;<\/sup>","Hyperventilation: PCO<sub>2<\/sub> &minus;0.6 mm Hg per 1 mEq/L fall in HCO<sub>3<\/sub><sup>&minus;<\/sup>"],"k":1},{"id":"21-66","q":"What is the expected compensation for a metabolic alkalosis?","o":["Hypoventilation: PCO<sub>2<\/sub> +0.6–0.75 mm Hg per 1 mEq/L rise in HCO<sub>3<\/sub><sup>&minus;<\/sup>; not past 55","Hypoventilation: PCO<sub>2<\/sub> +2–3 mm Hg per 1 mEq/L rise in HCO<sub>3<\/sub><sup>&minus;<\/sup>; no upper limit","Hypoventilation: PCO<sub>2<\/sub> +1.2 mm Hg per 1 mEq/L rise in HCO<sub>3<\/sub><sup>&minus;<\/sup>; not past 80"],"k":0},{"id":"21-67","q":"What does it mean if the compensation is bigger or smaller than expected?","o":["The compensation is complete","A second disorder is present","The disorder is chronic rather than acute"],"k":1,"more":"<p>The expected size also tells you whether a respiratory disorder is acute or chronic.<\/p>","hy":true},{"id":"21-68","q":"What is the diagnostic sequence for a blood gas?","o":["Primary problem from pH and HCO<sub>3<\/sub><sup>&minus;<\/sup> → split metabolic alkalosis by anion gap → check compensation is complete","Primary problem from pH and HCO<sub>3<\/sub><sup>&minus;<\/sup> → check compensation is expected size → split metabolic acidosis by anion gap","Primary problem from anion gap → check compensation is expected size → split metabolic acidosis by pH"],"k":1,"hy":true}]},{"t":"Worked blood gases","qs":[{"id":"21-69","q":"Emphysema, 3 hours breathless: pH 7.18, PCO<sub>2<\/sub> 58, HCO<sub>3<\/sub><sup>&minus;<\/sup> 26. Diagnosis?","o":["Acute metabolic acidosis","Chronic respiratory acidosis","Acute respiratory acidosis"],"k":2,"more":"<p>PCO<sub>2<\/sub> is up 18 but bicarbonate only 2: the kidney has not caught up.<\/p>"},{"id":"21-70","q":"COPD: pH 7.37, PCO<sub>2<\/sub> 52, HCO<sub>3<\/sub><sup>&minus;<\/sup> 29. Diagnosis?","o":["Acute respiratory acidosis without compensation","Respiratory alkalosis with renal compensation","Respiratory acidosis with renal compensation"],"k":2},{"id":"21-71","q":"Large aspirin dose, full rapid breathing: pH 7.57, PCO<sub>2<\/sub> 25, HCO<sub>3<\/sub><sup>&minus;<\/sup> 23. Diagnosis?","o":["Acute respiratory alkalosis","Acute respiratory acidosis","Chronic respiratory alkalosis"],"k":0},{"id":"21-72","q":"Bulimia: pH 7.52, HCO<sub>3<\/sub><sup>&minus;<\/sup> 39, PCO<sub>2<\/sub> 49, K<sup>+<\/sup> 2.6. Diagnosis?","o":["Metabolic alkalosis with partial respiratory compensation","Metabolic alkalosis with complete respiratory compensation","Metabolic acidosis with partial respiratory compensation"],"k":0,"more":"<p>Cause: lost stomach acid.<\/p>"},{"id":"21-73","q":"What acid-base disorder does hyperventilation syndrome (anxiety/panic) cause, and what symptoms?","o":["Metabolic acidosis; deep sighing Kussmaul breathing","Respiratory acidosis; drowsiness, flushed warm skin","Respiratory alkalosis; dizziness, tingling of lips and fingertips"],"k":2},{"id":"21-74","q":"Why does breathing into a paper bag help hyperventilation syndrome?","o":["Rebreathing exhaled air raises PCO<sub>2<\/sub> back to normal","Rebreathing exhaled air raises PO<sub>2<\/sub> back to normal","Rebreathing exhaled air lowers PCO<sub>2<\/sub> further"],"k":0}]},{"t":"Anion gap","qs":[{"id":"21-75","q":"What is the anion gap formula?","o":["[Na<sup>+<\/sup>] &minus; ([Cl<sup>&minus;<\/sup>] + [HCO<sub>3<\/sub><sup>&minus;<\/sup>])","[Na<sup>+<\/sup>] &minus; ([Cl<sup>&minus;<\/sup>] &minus; [HCO<sub>3<\/sub><sup>&minus;<\/sup>])","([Cl<sup>&minus;<\/sup>] + [HCO<sub>3<\/sub><sup>&minus;<\/sup>]) &minus; [Na<sup>+<\/sup>]"],"k":0,"figs":["img/21_acid_4.png"],"hy":true},{"id":"21-76","q":"What is the normal anion gap?","o":["18–24 mEq/L (20)","22–28 mEq/L (24)","8–16 mEq/L (12)"],"k":2},{"id":"21-77","q":"What does the anion gap actually represent?","o":["Unmeasured anions minus unmeasured cations","Total measured anions minus total cations","Unmeasured cations minus unmeasured anions"],"k":0,"more":"<p>Na<sup>+<\/sup> is the main measured cation; Cl<sup>&minus;<\/sup> and HCO<sub>3<\/sub><sup>&minus;<\/sup> the main measured anions.<\/p>","figs":["img/21_acid_4.png"]},{"id":"21-78","q":"Which unmeasured anions make up the anion gap?","o":["Lactate, phosphate, sulfate, ketones, albumin, any poison","Chloride, bicarbonate, sodium, potassium","Potassium, calcium, magnesium, γ-globulin"],"k":0},{"id":"21-79","q":"Which unmeasured cations are subtracted in the anion gap?","o":["K<sup>+<\/sup>, Ca<sup>2+<\/sup>, Mg<sup>2+<\/sup>, γ-globulin","Na<sup>+<\/sup>, Cl<sup>&minus;<\/sup>, HCO<sub>3<\/sub><sup>&minus;<\/sup>, albumin","H<sup>+<\/sup>, NH<sub>4<\/sub><sup>+<\/sup>, Na<sup>+<\/sup>, albumin"],"k":0},{"id":"21-80","q":"Which disorder does the anion gap split in two, and what question does it answer?","o":["Respiratory acidosis — is it acute or chronic?","Metabolic acidosis — was acid gained or base lost?","Metabolic alkalosis — was acid lost or base gained?"],"k":1,"hy":true},{"id":"21-81","q":"Why does adding an acid (ketones, lactate) widen the anion gap?","o":["It raises plasma Cl<sup>&minus;<\/sup>","Its anions are new measured anions","Its anions are new unmeasured anions"],"k":2,"hy":true},{"id":"21-82","q":"Why does losing bicarbonate (diarrhoea) leave the anion gap normal?","o":["Lactate rises to replace the lost HCO<sub>3<\/sub><sup>&minus;<\/sup>","K<sup>+<\/sup> rises to replace the lost HCO<sub>3<\/sub><sup>&minus;<\/sup>","Cl<sup>&minus;<\/sup> rises to replace the lost HCO<sub>3<\/sub><sup>&minus;<\/sup>"],"k":2,"hy":true},{"id":"21-83","q":"What chloride terms go with high-gap and normal-gap metabolic acidosis?","o":["High gap = normochloraemic<br>Normal gap = hyperchloraemic","High gap = hyperchloraemic<br>Normal gap = normochloraemic","High gap = hypochloraemic<br>Normal gap = normochloraemic"],"k":0},{"id":"21-84","q":"What causes a high-anion-gap metabolic acidosis?","o":["Diarrhoea, renal tubular acidosis, ureteral diversion<br>Acetazolamide, saline infusion","Ketoacidosis, lactic acidosis, renal failure<br>Methanol, ethylene glycol, salicylate","COPD, opioid overdose, myasthenia gravis<br>Barbiturates, benzodiazepines"],"k":1},{"id":"21-85","q":"What causes a normal-anion-gap metabolic acidosis?","o":["Methanol or ethylene glycol ingestion","Bicarbonate gain from the gut (vomiting) or kidney","Bicarbonate loss from the gut (diarrhoea) or kidney"],"k":2},{"id":"21-86","q":"What does <b>GOLD MARK<\/b> stand for (high-gap causes)?","o":["Glycols (ethylene, propylene)<br>5-Oxoproline<br>L-lactate<br>D-lactate<br>Metformin<br>Acetazolamide<br>Respiratory failure<br>Ketoacidosis","Glycols (ethylene, propylene)<br>Opioids<br>Lithium<br>D-lactate<br>Methanol<br>Ammonium chloride<br>Renal tubular acidosis<br>Ketoacidosis","Glycols (ethylene, propylene)<br>5-Oxoproline<br>L-lactate<br>D-lactate<br>Methanol<br>Aspirin<br>Renal failure<br>Ketoacidosis"],"k":2,"more":"<p>The newer mnemonic.<\/p>"},{"id":"21-87","q":"In GOLD MARK, what causes 5-oxoproline and D-lactate acidosis?","o":["5-Oxoproline: chronic aspirin use<br>D-lactate: liver failure","5-Oxoproline: chronic acetaminophen use<br>D-lactate: short bowel","5-Oxoproline: short bowel<br>D-lactate: chronic acetaminophen use"],"k":1},{"id":"21-88","q":"What does <b>MUDPILES<\/b> stand for (high-gap causes)?","o":["Methanol<br>Uraemia<br>Diuretics<br>Pancreatic fistula<br>Iron, isoniazid<br>Lactic acid<br>Ethanol, ethylene glycol<br>Saline infusion","Methanol<br>Uraemia<br>Diabetic ketoacidosis<br>Paraldehyde<br>Iron, isoniazid<br>Lactic acid<br>Ethanol, ethylene glycol<br>Salicylates","Metformin<br>Uraemia<br>Diabetic ketoacidosis<br>Propylene glycol<br>Insulin<br>Lithium<br>Ethanol, ethylene glycol<br>Sedatives"],"k":1,"more":"<p>The older mnemonic.<\/p>"},{"id":"21-89","q":"Diarrhoea: pH 7.31, PCO<sub>2<\/sub> 31, HCO<sub>3<\/sub><sup>&minus;<\/sup> 16, Na<sup>+<\/sup> 134, Cl<sup>&minus;<\/sup> 110. Gap and diagnosis?","o":["Gap 18 → high-gap metabolic acidosis with expected respiratory compensation","Gap 8 → normal-gap metabolic acidosis with a superimposed respiratory acidosis","Gap 8 → normal-gap metabolic acidosis with expected respiratory compensation"],"k":2,"more":"<p>134 &minus; (110 + 16) = 8. PCO<sub>2<\/sub> is down about 10, as expected.<\/p>"},{"id":"21-90","q":"6 days of diarrhoea: pH 7.12, PCO<sub>2<\/sub> 16, HCO<sub>3<\/sub><sup>&minus;<\/sup> 5, Na<sup>+<\/sup> 137, Cl<sup>&minus;<\/sup> 118. Gap and diagnosis?","o":["Gap 4 → hyperchloraemic respiratory acidosis","Gap 14 → hypochloraemic metabolic alkalosis","Gap 14 → hyperchloraemic metabolic acidosis"],"k":2},{"id":"21-91","q":"Diabetic ketoacidosis (DKA), stopped insulin: pH 7.26, PCO<sub>2<\/sub> 19, HCO<sub>3<\/sub><sup>&minus;<\/sup> 8, Na<sup>+<\/sup> 136, Cl<sup>&minus;<\/sup> 101. Gap and diagnosis?","o":["Gap 27 → high-gap metabolic acidosis with respiratory compensation","Gap 35 → high-gap metabolic acidosis without respiratory compensation","Gap 12 → normal-gap metabolic acidosis with respiratory compensation"],"k":0}]},{"t":"Hidden and mixed disorders","qs":[{"id":"21-92","q":"Depressed 16-year-old, possible ingestion, vomited ×3: pH 7.40, PCO<sub>2<\/sub> 40, HCO<sub>3<\/sub><sup>&minus;<\/sup> 24, Na<sup>+<\/sup> 144, Cl<sup>&minus;<\/sup> 100. What does the gap show?","o":["Gap 4 → hidden metabolic alkalosis only","Gap 20 → hidden high-gap metabolic acidosis","Gap 20 → hidden normal-gap metabolic acidosis"],"k":1,"hy":true},{"id":"21-93","q":"In that 16-year-old with a gap of 20, why is the pH normal?","o":["Vomiting added a metabolic alkalosis → mixed disorder","Respiratory compensation brought pH fully back to normal","Vomiting added a metabolic acidosis → single disorder"],"k":0,"more":"<p>It is a second disorder, not compensation, because compensation never brings pH all the way back.<\/p>"},{"id":"21-94","q":"Should you calculate the anion gap when pH, PCO<sub>2<\/sub> and bicarbonate are all normal?","o":["Yes — a normal blood gas does not rule out a disorder","No — the gap is only needed when pH is low","No — a normal blood gas rules out a disorder"],"k":0,"more":"<p>A high gap with a normal pH means a metabolic acidosis is being cancelled by a second process.<\/p>","hy":true}]},{"t":"Aspirin vs ethylene glycol","qs":[{"id":"21-95","q":"What acid-base disorders does aspirin (salicylate) poisoning cause?","o":["Respiratory alkalosis + metabolic alkalosis","Respiratory acidosis + normal-gap metabolic acidosis","Respiratory alkalosis + high-gap metabolic acidosis"],"k":2},{"id":"21-96","q":"Why does salicylate cause a respiratory alkalosis?","o":["Stimulates the respiratory centre directly","Causes pain and anxiety that drive breathing","Raises plasma HCO<sub>3<\/sub><sup>&minus;<\/sup> directly"],"k":0},{"id":"21-97","q":"What three acids create the high gap in salicylate poisoning?","o":["Acetic acid<br>Lactic acid (stimulates oxidative phosphorylation → aerobic metabolism)<br>Formic acid (methanol breakdown rises)","Salicylic acid<br>Pyruvic acid (uncouples glycolysis → aerobic metabolism)<br>Glycolic acid (glycol breakdown rises)","Salicylic acid<br>Lactic acid (uncouples oxidative phosphorylation → anaerobic metabolism)<br>Ketones (fatty-acid breakdown rises)"],"k":2},{"id":"21-98","q":"How is salicylate poisoning treated?","o":["Fomepizole + alkalinise urine with sodium bicarbonate","Activated charcoal + alkalinise urine with sodium bicarbonate","Activated charcoal + acidify urine with ammonium chloride"],"k":1,"more":"<p>Alkalinising the urine speeds salicylate excretion.<\/p>"},{"id":"21-99","q":"How is ethylene glycol metabolised?","o":["Alcohol dehydrogenase → glycolaldehyde → glycolic → glyoxylic → oxalic acid","Aldehyde dehydrogenase → glycolaldehyde → oxalic → glyoxylic → glycolic acid","Alcohol dehydrogenase → acetaldehyde → acetic acid → acetyl-CoA"],"k":0},{"id":"21-100","q":"What lab findings does ethylene glycol poisoning give?","o":["Normal anion gap<br>Calcium oxalate crystals in urine<br>Low serum potassium","High anion gap<br>Calcium oxalate crystals in urine<br>Low serum calcium","Normal anion gap<br>Uric acid crystals in urine<br>High serum calcium"],"k":1,"more":"<p>Glycolate can read falsely as lactate.<\/p>"},{"id":"21-101","q":"How is ethylene glycol poisoning treated?","o":["Fomepizole (blocks alcohol dehydrogenase)","Fomepizole (blocks aldehyde dehydrogenase)","Disulfiram (blocks alcohol dehydrogenase)"],"k":0,"more":"<p>Ethanol, which competes for the enzyme, was used before fomepizole.<\/p>"},{"id":"21-102","q":"Which tests tell aspirin poisoning from ethylene glycol poisoning?","o":["Arterial PCO<sub>2<\/sub>, serum chloride, urine ketones","Serum salicylate level, serum calcium, urine crystals","Serum osmolality, serum potassium, urine glucose"],"k":1}]}]},{"n":16,"key":"bio","t":"What fats actually are","sub":"Primer 10","cp2":false,"secs":[{"t":"What a lipid is","qs":[{"id":"16-0","q":"What property defines lipids as a group?","o":["Insoluble in water; soluble in nonpolar solvents (chloroform, ether)","Insoluble in both water and nonpolar solvents (chloroform, ether)","Soluble in water; insoluble in nonpolar solvents (chloroform, ether)"],"k":0},{"id":"16-1","q":"What are the four jobs of lipids?","o":["Store energy<br>Build membranes<br>Carry signals<br>Insulate","Store energy<br>Build membranes<br>Catalyse reactions<br>Insulate","Store energy<br>Build cytoskeleton<br>Carry oxygen<br>Insulate"],"k":0},{"id":"16-2","q":"What is the difference between a nonpolar and a polar molecule?","o":["Nonpolar: dissolves in water<br>Polar: dissolves only in chloroform","Nonpolar: electrons shared unequally<br>Polar: electrons shared equally, no charged poles","Nonpolar: electrons shared equally, no charged poles<br>Polar: electrons shared unequally"],"k":2}]},{"t":"Fatty acid structure","qs":[{"id":"16-3","q":"What is the structure of a fatty acid?","o":["Long hydrocarbon tail + alcohol (hydroxyl) group at each end","Short hydrocarbon tail + phosphate group at one end","Long hydrocarbon tail + acid (carboxyl) group at one end"],"k":2,"more":"<p>The tail is greasy and hates water; the acid end tolerates it. Almost every lipid in this block is built from fatty acids.<\/p>"},{"id":"16-4","q":"How long are natural fatty acid chains, and what two features do almost all share?","o":["4–36 carbons; unbranched, even number of carbons","12–24 carbons; branched, even number of carbons","2–10 carbons; unbranched, odd number of carbons"],"k":0},{"id":"16-5","q":"What is a saturated fatty acid, and what are its properties?","o":["No double bonds → straight, packs loosely, liquid at room temperature (butter)","No double bonds → kinked, packs loosely, liquid at room temperature (olive oil)","No double bonds → straight, packs tightly, solid at room temperature (butter)"],"k":2},{"id":"16-6","q":"What is an unsaturated fatty acid?","o":["One or more double bonds in the chain","One or more branches in the chain","One or more triple bonds in the chain"],"k":0},{"id":"16-7","q":"Which form of double bond is natural in fatty acids, and what does it do to the chain?","o":["<i>Cis<\/i>; keeps it straight","<i>Cis<\/i>; puts a kink in it","<i>Trans<\/i>; puts a kink in it"],"k":1},{"id":"16-8","q":"Why are unsaturated fats (e.g., olive oil) liquid at room temperature?","o":["<i>Trans<\/i> double bonds → straight → pack tightly → liquid","<i>Cis<\/i> double bonds → straight → pack tightly → liquid","<i>Cis<\/i> double bonds → kinks → can&rsquo;t pack → liquid"],"k":2},{"id":"16-9","q":"What does a <i>trans<\/i> double bond do to a fatty acid chain?","o":["Puts a sharp kink in it, like a <i>cis<\/i> one","Makes it branch at the double bond","Leaves it almost straight, like a saturated one"],"k":2},{"id":"16-10","q":"How does melting point vary with chain length and unsaturation?","o":["Rises with chain length; rises with unsaturation","Falls with chain length; rises with unsaturation","Rises with chain length; falls with unsaturation"],"k":2,"more":"<p>More <i>cis<\/i> bonds mean more kinks.<\/p>"},{"id":"16-11","q":"Which fats are risk factors for coronary artery disease?","o":["Monounsaturated and <i>cis<\/i> fats","Omega-3 and omega-6 fats","Saturated and <i>trans<\/i> fats"],"k":2}]},{"t":"Naming fatty acids","qs":[{"id":"16-12","q":"How are fatty acid carbons numbered and named?","o":["C1 = carboxyl carbon<br>C2 = β-carbon<br>C3 = α-carbon<br>Far methyl carbon = ω-carbon","C1 = methyl carbon<br>C2 = α-carbon<br>C3 = β-carbon<br>Far carboxyl carbon = ω-carbon","C1 = carboxyl carbon<br>C2 = α-carbon<br>C3 = β-carbon<br>Far methyl carbon = ω-carbon"],"k":2,"figs":["img/16_lipids_1.webp"]},{"id":"16-13","q":"What does fatty acid shorthand such as 16:0 mean?","o":["Number of carbons : number of double bonds","Number of carbons : number of branches","Number of double bonds : number of carbons"],"k":0,"more":"<p>Palmitic acid is 16:0.<\/p>","figs":["img/16_lipids_1.webp"]},{"id":"16-14","q":"How is the position of a double bond written, using oleic acid as the example?","o":["Δ counted from the carboxyl end: oleic = 18:9Δ1","ω counted from the carboxyl end: oleic = 18:1ω9","Δ counted from the carboxyl end: oleic = 18:1Δ9"],"k":2}]},{"t":"Fatty acid classes","qs":[{"id":"16-15","q":"Name two saturated fatty acids with their shorthand.","o":["Palmitic 18:0<br>Linoleic 16:0","Palmitic 16:1<br>Stearic 18:1","Palmitic 16:0<br>Stearic 18:0"],"k":2},{"id":"16-16","q":"What is a monounsaturated fatty acid? Give two examples.","o":["Two double bonds: linoleic 18:2, linolenic 18:3","One double bond: palmitic 16:0, stearic 18:0","One double bond: palmitoleic 16:1, oleic 18:1"],"k":2},{"id":"16-17","q":"What is a polyunsaturated fatty acid (PUFA)? Give three examples.","o":["Two or more double bonds: linoleic 18:3, linolenic 18:2, arachidonic 20:5","Two or more branches: linoleic 18:2, linolenic 18:3, arachidonic 20:4","Two or more double bonds: linoleic 18:2, linolenic 18:3, arachidonic 20:4"],"k":2,"more":"<table><tr><th>Type<\/th><th>Double bonds<\/th><th>Examples<\/th><\/tr><tr><td>Saturated<\/td><td>none<\/td><td>palmitic 16:0, stearic 18:0<\/td><\/tr><tr><td>Monounsaturated<\/td><td>one<\/td><td>palmitoleic 16:1, oleic 18:1<\/td><\/tr><tr><td>PUFA<\/td><td>two or more<\/td><td>linoleic 18:2, linolenic 18:3, arachidonic 20:4<\/td><\/tr><\/table>"},{"id":"16-18","q":"How are fatty acids classified by length?","o":["Short &lt;4 C<br>Medium 4–8<br>Long 10–16<br>Very long &gt;16","Short &lt;6 C<br>Medium 6–12<br>Long 14–22<br>Very long &gt;36","Short &lt;6 C<br>Medium 6–12<br>Long 14–22<br>Very long &gt;22"],"k":2,"more":"<p>In fatty acid oxidation, &ldquo;very long&rdquo; is usually drawn at over 20 carbons.<\/p>"},{"id":"16-19","q":"Which tissue makes medium-chain fatty acids, and why does it matter?","o":["Liver; adults store them easily in adipose","Lactating breast; infants digest them easily","Lactating breast; infants cannot absorb them"],"k":1},{"id":"16-20","q":"Where do fatty acid chains of up to 34 carbons occur?","o":["Central nervous system, especially myelin","Skeletal muscle, especially cell membranes","Adipose tissue, especially brown fat"],"k":0}]},{"t":"Triacylglycerol","qs":[{"id":"16-21","q":"What is a triacylglycerol (TAG)?","o":["Three fatty acids on a sphingosine backbone","Three fatty acids on a glycerol backbone","Two fatty acids on a glycerol backbone"],"k":1,"more":"<p>Simply fat as you would recognise it.<\/p>"},{"id":"16-22","q":"What is the role of triacylglycerol?","o":["Body&rsquo;s storage form of fat; holds most fatty acids","Body&rsquo;s precursor for steroid hormones and bile salts","Body&rsquo;s main membrane lipid; forms the bilayer"],"k":0},{"id":"16-23","q":"Why is fat a better energy store than glycogen?","o":["Same energy per gram as carbohydrate/protein; stored dry (glycogen carries water)","&gt;2× energy per gram vs carbohydrate/protein; stored with water (glycogen stored dry)","&gt;2× energy per gram vs carbohydrate/protein; stored dry (glycogen carries water)"],"k":2},{"id":"16-24","q":"What bond joins each fatty acid to glycerol in TAG, and how is it broken?","o":["Ester bond; hydrolysis by a lipase","Amide bond; hydrolysis by a lipase","Ester bond; hydrolysis by a protease"],"k":0},{"id":"16-25","q":"Why is TAG even less water-soluble than free fatty acids?","o":["Charged phosphate groups are added in the ester bonds","Charged carboxyl groups are used up in the ester bonds","Charged amino groups are used up in the amide bonds"],"k":1},{"id":"16-26","q":"Why do fats and oils float?","o":["TAG is more dense than water","TAG traps air bubbles between its chains","TAG is less dense than water"],"k":2}]},{"t":"Glycerophospholipids","qs":[{"id":"16-27","q":"How does a phospholipid differ from a TAG?","o":["All three fatty acids replaced by phosphate groups","One fatty acid replaced by a sugar head group","One fatty acid replaced by a phosphate-containing head group"],"k":2,"more":"<p>Now one end loves water and the other hates it.<\/p>"},{"id":"16-28","q":"What do phospholipids form in water, and how are they arranged?","o":["A micelle: tails outward, heads inward → every membrane","A bilayer: tails inward, heads outward → every membrane","A bilayer: heads inward, tails outward → every membrane"],"k":1},{"id":"16-29","q":"What is the structure of a glycerophospholipid?","o":["Two fatty acids amide-linked to C1 and C2 of sphingosine; C3 phosphate carries polar head group","Two fatty acids ester-linked to C2 and C3 of L-glycerol 1-phosphate; C1 phosphate carries polar head group","Two fatty acids ester-linked to C1 and C2 of L-glycerol 3-phosphate; C3 phosphate carries polar head group"],"k":2,"figs":["img/16_lipids_2.webp"]},{"id":"16-30","q":"In a glycerophospholipid, which carbon usually holds the unsaturated fatty acid?","o":["C2","C3","C1"],"k":0},{"id":"16-31","q":"What is the charge of a glycerophospholipid head group at body pH?","o":["Uncharged","Charged","Nonpolar"],"k":1},{"id":"16-32","q":"What is phosphatidic acid?","o":["Glycerophospholipid with no head group; parent of all the others","Glycerophospholipid with a choline head group; parent of all the others","Sphingolipid with no head group; parent of all the others"],"k":0,"figs":["img/16_lipids_2.webp"]},{"id":"16-33","q":"What are the three most abundant phospholipids in humans?","o":["Phosphatidylcholine (PC)<br>Phosphatidylethanolamine (PE)<br>Phosphatidylserine (PS)","Phosphatidylglycerol (PG)<br>Phosphatidylserine (PS)<br>Platelet-activating factor (PAF)","Phosphatidylinositol (PI)<br>Phosphatidylethanolamine (PE)<br>Phosphatidic acid (PA)"],"k":0,"figs":["img/16_lipids_2.webp"]},{"id":"16-34","q":"What is lecithin?","o":["Phosphatidylethanolamine (PE)","Phosphatidylcholine (PC)","Phosphatidylserine (PS)"],"k":1,"figs":["img/16_lipids_2.webp"]}]},{"t":"Other phospholipids","qs":[{"id":"16-35","q":"What is the structure of cardiolipin?","o":["Two phosphatidylcholines joined through a sphingosine","Two phosphatidic acids joined through a glycerol","One phosphatidic acid joined to an inositol"],"k":1},{"id":"16-36","q":"Where is cardiolipin found?","o":["Inner mitochondrial membrane (and bacteria)","Lysosomal membrane (and peroxisomes)","Outer plasma membrane (and red cells)"],"k":0,"more":"<p>It is an acidic phospholipid.<\/p>"},{"id":"16-37","q":"In which diseases do anti-cardiolipin antibodies appear?","o":["Antiphospholipid syndrome<br>Syphilis<br>Systemic lupus erythematosus","Antiphospholipid syndrome<br>Tuberculosis<br>Rheumatoid arthritis","Graves' disease<br>Lyme disease<br>Systemic lupus erythematosus"],"k":0},{"id":"16-38","q":"What is phosphatidylinositol and what does it do?","o":["Choline head group; main structural lipid with no signalling role","Inositol backbone in place of glycerol; storage lipid in adipose","Inositol head group; membrane lipid that also works in cell signalling"],"k":2},{"id":"16-39","q":"What is the structure of platelet-activating factor (PAF)?","o":["C1: ether-linked saturated chain<br>C2: acetyl ester<br>C3: phosphoinositol","C1: ether-linked saturated chain<br>C2: acetyl ester<br>C3: phosphocholine","C1: ester-linked saturated chain<br>C2: acetyl ester<br>C3: phosphocholine"],"k":1},{"id":"16-40","q":"What does platelet-activating factor (PAF) do?","o":["Activates inflammatory cells<br>Mediates surfactant secretion, lung expansion, gas exchange<br>Platelets aggregate and release serotonin","Inhibits inflammatory cells<br>Mediates wound healing, chronic fibrosis, tolerance<br>Platelets disaggregate and take up serotonin","Activates inflammatory cells<br>Mediates hypersensitivity, acute inflammation, anaphylaxis<br>Platelets aggregate and release serotonin"],"k":2}]},{"t":"Sphingolipids","qs":[{"id":"16-41","q":"What backbone do sphingolipids use instead of glycerol?","o":["Sphingosine, a long-chain amino alcohol","Ceramide, a long-chain fatty alcohol","Sphingosine, a short-chain amino acid"],"k":0},{"id":"16-42","q":"What bond joins a fatty acid to sphingosine, and what does it form?","o":["Amide bond → ceramide","Ester bond → ceramide","Ether bond → cerebroside"],"k":0},{"id":"16-43","q":"What is ceramide?","o":["Sphingosine + phosphocholine; parent of every sphingolipid","Sphingosine + fatty acid (amide); parent of every sphingolipid","Glycerol + fatty acid (amide); parent of every glycerophospholipid"],"k":1},{"id":"16-44","q":"How does a polar head group attach to ceramide?","o":["Glycosidic or amide bond","Glycosidic or phosphodiester bond","Amide or peptide bond"],"k":1},{"id":"16-45","q":"What is sphingomyelin?","o":["Ceramide + phosphoethanolamine head; a minor sphingophospholipid in humans","Glycerol + phosphocholine head; the main glycerophospholipid in humans","Ceramide + phosphocholine head; the only significant sphingophospholipid in humans"],"k":2},{"id":"16-46","q":"Where is sphingomyelin important?","o":["Lung surfactant (key lipid); sits alongside phosphatidylglycerol","Myelin sheath (key lipid); sits alongside cholesterol in membranes","Inner mitochondrial membrane (key lipid); sits alongside cardiolipin"],"k":1},{"id":"16-47","q":"What is myelin made of?","o":["50% lipid, 50% protein","76% lipid, 18% protein","18% lipid, 76% protein"],"k":1},{"id":"16-48","q":"Which three bond types keep lipid classes apart (glycerol, sphingosine, PAF C1)?","o":["Ester → glycerol (TAG, glycerophospholipids)<br>Ether → sphingosine (ceramide, all sphingolipids)<br>Amide → C1 of PAF","Ester → glycerol (TAG, glycerophospholipids)<br>Amide → sphingosine (ceramide, all sphingolipids)<br>Ether → C1 of PAF","Amide → glycerol (TAG, glycerophospholipids)<br>Ester → sphingosine (ceramide, all sphingolipids)<br>Ether → C1 of PAF"],"k":1}]},{"t":"Cholesterol and lipid classes","qs":[{"id":"16-49","q":"What is the structure of cholesterol?","o":["Flexible three-ring structure (not a chain)","Rigid four-ring structure (not a chain)","Rigid six-ring structure (not a chain)"],"k":1},{"id":"16-50","q":"What does cholesterol do in membranes?","o":["Forms the bilayer core alone; has no effect on fluidity","Wedges between phospholipids; regulates fluidity","Spans the membrane as a channel; regulates ion flow"],"k":1},{"id":"16-51","q":"What is cholesterol the starting material for?","o":["Eicosanoids and prostaglandins","Steroid hormones and bile salts","Phospholipids and sphingolipids"],"k":1},{"id":"16-52","q":"Which lipids are storage lipids, and what are their properties?","o":["TAG and cholesteryl esters; neutral, in lipid droplets (above all adipose)","Phospholipids and cholesterol; amphipathic, in membranes (above all myelin)","TAG and cholesteryl esters; amphipathic, in membranes (above all adipose)"],"k":0},{"id":"16-53","q":"Which lipids are membrane lipids, and what property do they share?","o":["Phospholipids, cholesterol, TAG; fully nonpolar","Phospholipids, cholesterol, glycolipids; amphipathic","TAG, cholesteryl esters, glycolipids; neutral"],"k":1},{"id":"16-54","q":"What does amphipathic mean, and why does it matter for membranes?","o":["Both polar and nonpolar parts → lets them form a bilayer","Only nonpolar parts → lets them form lipid droplets","Both acidic and basic parts → lets them buffer pH"],"k":0}]}]},{"n":17,"key":"bio","t":"Getting fat out of food","sub":"Lecture 24","cp2":false,"secs":[{"t":"The problem with fat","qs":[{"id":"17-0","q":"Why is fat hard to digest?","o":["Lipases are water-soluble, fat is not → enzyme works only at droplet surface","Lipases are water-soluble, fat is too → enzyme is diluted throughout the lumen","Lipases are fat-soluble, fat is not → enzyme works only inside the droplet"],"k":0,"more":"<p>One big droplet has very little surface.<\/p>"},{"id":"17-1","q":"How much fat does an adult eat daily, and what is most of it?","o":["60–150 g/day; about 50% cholesterol","300–500 g/day; &gt;90% triacylglycerol (TAG)","60–150 g/day; &gt;90% triacylglycerol (TAG)"],"k":2},{"id":"17-2","q":"Besides TAG, what lipids are in the diet?","o":["Phospholipid, cholesterol, lipoprotein, bile acid","Phospholipid, cholesterol, cholesteryl ester, free fatty acid","Cholesterol, steroid hormones, glycolipid, eicosanoids"],"k":1},{"id":"17-3","q":"Which enzymes digest each dietary lipid class?","o":["TAG → lipases<br>Phospholipids → phospholipases A1, A2, C, D<br>Cholesteryl esters → cholesterol esterase","TAG → phospholipases<br>Phospholipids → lipases A1, A2, C, D<br>Cholesteryl esters → cholesterol esterase","TAG → lipases<br>Phospholipids → cholesterol esterase<br>Cholesteryl esters → phospholipase A2"],"k":0},{"id":"17-4","q":"How much energy does fat hold per gram, and what share of stored energy?","o":["9.3 kcal/g; about 84% of the body&rsquo;s stored energy","9.3 kcal/g; about 15% of the body&rsquo;s stored energy","4.1 kcal/g; about 50% of the body&rsquo;s stored energy"],"k":0}]},{"t":"Lingual and gastric lipase","qs":[{"id":"17-5","q":"Which lipases digest a little fat before the duodenum?","o":["Lingual lipase (mouth)<br>Gastric lipase (stomach)","Lingual lipase (mouth)<br>Pancreatic lipase (stomach)","Gastric lipase (mouth)<br>Phospholipase A2 (stomach)"],"k":0},{"id":"17-6","q":"At what pH do lingual and gastric lipase work?","o":["pH 1–2 (strongly acidic)","pH 8–9 (alkaline only)","pH 4–6 (acid-stable)"],"k":2},{"id":"17-7","q":"What substrate do lingual and gastric lipase prefer?","o":["TAG with long-chain fatty acids (&gt;16 C: olive oil, lard, fish oil)","Cholesteryl esters with medium-chain fatty acids (&lt;12 C: milk, butter)","TAG with short- and medium-chain fatty acids (&lt;12 C: milk, butter, coconut oil)"],"k":2},{"id":"17-8","q":"What do lingual and gastric lipase produce from TAG?","o":["Diacylglycerol + fatty acid","Lysophospholipid + fatty acid","Glycerol + three fatty acids"],"k":0,"more":"<p>They also remove a long unsaturated fatty acid from position 3.<\/p>"},{"id":"17-9","q":"When do lingual and gastric lipase matter most?","o":["Newborns (milk fat)<br>Cystic fibrosis (pancreatic lipase lacking)","Elderly (low stomach acid)<br>Cystic fibrosis (bile salts lacking)","Adults (high-fat meals)<br>Gallstones (bile flow blocked)"],"k":0}]},{"t":"Bile and its hormones","qs":[{"id":"17-10","q":"Where does digestion of the bulk of dietary fat begin?","o":["Jejunum","Stomach","Duodenum"],"k":2},{"id":"17-11","q":"Where are bile salts made and stored?","o":["Made by pancreas; stored in gallbladder","Made by gallbladder; stored in liver","Made by liver; stored in gallbladder"],"k":2},{"id":"17-12","q":"How do bile salts act on fat?","o":["Detergents → break one large droplet into thousands of tiny ones (emulsification)","Enzymes → hydrolyse the ester bonds of TAG into fatty acids","Detergents → fuse thousands of tiny droplets into one large one (coalescence)"],"k":0,"more":"<p>One end greasy, one end water-friendly.<\/p>"},{"id":"17-13","q":"Where does emulsification happen, and what helps it?","o":["Stomach; churning by gastric contraction","Gallbladder; concentration of bile","Duodenum; mechanical mixing of peristalsis"],"k":2},{"id":"17-14","q":"Do bile salts digest fat? What does emulsification achieve?","o":["Yes — release fatty acids and activate colipase","Yes — hydrolyse TAG directly at the droplet surface","No — multiplies surface area so the enzyme can work"],"k":2},{"id":"17-15","q":"Which enzyme actually digests dietary fat?","o":["Pancreatic lipase","Gastric lipase","Lipoprotein lipase"],"k":0},{"id":"17-16","q":"What triggers cholecystokinin (CCK) release?","o":["Acid chyme entering the stomach and duodenum","Lipids and partly digested protein reaching lower duodenum and jejunum","Carbohydrate reaching the ileum and colon"],"k":1},{"id":"17-17","q":"What does cholecystokinin (CCK) do?","o":["Gallbladder relaxes → stores bile<br>Pancreas releases bicarbonate","Gallbladder contracts → releases bile<br>Pancreas releases digestive enzymes","Gallbladder contracts → releases bile<br>Stomach increases acid secretion"],"k":1},{"id":"17-18","q":"What triggers secretin release?","o":["Distension of the stomach","Acid chyme entering the intestine","Lipids reaching the lower duodenum"],"k":1},{"id":"17-19","q":"What does secretin do?","o":["Pancreas and liver release a bicarbonate-rich fluid","Pancreas releases an enzyme-rich fluid","Gallbladder contracts and releases bile"],"k":0}]},{"t":"Pancreatic lipase and partners","qs":[{"id":"17-20","q":"Which fatty acids does pancreatic lipase remove, and what is left?","o":["Positions 1 and 3 → 2-monoacylglycerol","Position 2 only → 1,3-diacylglycerol","Positions 2 and 3 → 1-monoacylglycerol"],"k":0},{"id":"17-21","q":"What happens to some 2-monoacylglycerol after pancreatic lipase?","o":["Isomerase → 1-monoacylglycerol → lipase finishes it to glycerol","Mutase → 1-monoacylglycerol → colipase finishes it to glycerol","Kinase → 2-monoacylglycerol phosphate → stored as phospholipid"],"k":0},{"id":"17-22","q":"What partner protein does pancreatic lipase need?","o":["Colipase","Enteropeptidase","Trypsin"],"k":0},{"id":"17-23","q":"How is colipase activated?","o":["Secreted as procolipase; activated by trypsin","Secreted as procolipase; activated by pepsin","Secreted active; activated further by bile salts"],"k":0},{"id":"17-24","q":"What does colipase do for pancreatic lipase?","o":["Hydrolyses the fatty acid at position 2","Keeps the pH right and stops lipase denaturing","Emulsifies the fat droplet in place of bile"],"k":1,"more":"<p>Textbooks add that it anchors lipase to the droplet surface, where bile salts would otherwise block it.<\/p>"},{"id":"17-25","q":"What does phospholipase A2 do, and what activates it?","o":["Removes fatty acid from C1 → lysophospholipid; activated by trypsin","Removes fatty acid from C2 → lysophospholipid; activated by trypsin","Removes fatty acid from C2 → lysophospholipid; activated by bile salts"],"k":1},{"id":"17-26","q":"What does cholesterol esterase do?","o":["Cholesteryl ester → cholesterol + fatty acid","Cholesterol + fatty acid → cholesteryl ester","Cholesteryl ester → bile salt + fatty acid"],"k":0},{"id":"17-27","q":"How does orlistat work?","o":["Irreversibly binds pancreatic lipase active site (also inhibits gastric lipase)","Blocks the NPC1L1 transporter at the brush border (also inhibits ACAT)","Reversibly binds bile salts in the lumen (also blocks cholesterol uptake)"],"k":0,"more":"<p>Because so much rides on lipase, blocking it causes weight loss.<\/p>"},{"id":"17-28","q":"What fraction of dietary fat is lost in stool on orlistat?","o":["About a tenth","About a half","About a third"],"k":2},{"id":"17-29","q":"What is olestra, and why does it give no calories?","o":["3 fatty acids on glycerol; cannot be absorbed","6–8 fatty acids on glucose; absorbed but not oxidised","6–8 fatty acids on sucrose; cannot be hydrolysed"],"k":2},{"id":"17-30","q":"What is Salatrim (Benefat)?","o":["Designer fat of medium chains only; about twice the calories of ordinary fat","Lipase inhibitor added to fat; about a third fewer calories absorbed","Designer fat of mixed long and short chains; about half the calories of ordinary fat"],"k":2}]},{"t":"Micelles and absorption","qs":[{"id":"17-31","q":"What goes into mixed micelles?","o":["Free fatty acids, monoacylglycerol, lysophospholipid, cholesterol<br>+ bile salts + fat-soluble vitamins","Free fatty acids, glycerol, chylomicrons, cholesterol<br>+ bile salts + fat-soluble vitamins","Free fatty acids, monoacylglycerol, lysophospholipid, cholesterol<br>+ colipase + water-soluble vitamins"],"k":0},{"id":"17-32","q":"How are mixed micelles organised, and why does it matter?","o":["Water-loving parts inside, hydrophobic parts outside → stick to fat droplets","Hydrophobic and water-loving parts mixed evenly → dissolve in the membrane","Hydrophobic parts inside, water-loving parts outside → dissolve in lumen"],"k":2},{"id":"17-33","q":"What job do micelles do?","o":["Package digestion products into chylomicrons","Carry TAG intact into the lacteals","Ferry digestion products across the watery layer to the brush border"],"k":2},{"id":"17-34","q":"Where is the main site of fat absorption?","o":["Duodenum","Stomach","Jejunum"],"k":2},{"id":"17-35","q":"How are short- and medium-chain fatty acids absorbed?","o":["Without micelles → into lymph → thoracic duct → blood (in chylomicrons)","In micelles → straight into blood → portal circulation → liver (in VLDL)","Without micelles → straight into blood → portal circulation → liver (not chylomicrons)"],"k":2},{"id":"17-36","q":"Why are medium-chain fats used to feed patients with fat malabsorption?","o":["They need more bile salts, which the patients have in excess","They are absorbed without micelles, straight into portal blood","They are absorbed in micelles, then packed into chylomicrons"],"k":1},{"id":"17-37","q":"How well is cholesterol absorbed, and which drug reduces it?","o":["Poorly, even from micelles; orlistat","Well, mostly without micelles; ezetimibe","Poorly, even from micelles; ezetimibe"],"k":2}]},{"t":"Reassembly and chylomicrons","qs":[{"id":"17-38","q":"Where in the intestinal cell are absorbed lipids reassembled?","o":["Mitochondria","Endoplasmic reticulum","Golgi apparatus"],"k":1,"figs":["img/17_digest_1.webp"]},{"id":"17-39","q":"How is a long-chain fatty acid activated in the intestinal cell?","o":["Fatty acid + ATP + CoA → fatty acyl-CoA + ADP","Fatty acid + GTP + CoA → fatty acyl-CoA + GDP","Fatty acid + ATP + CoA → fatty acyl-CoA + AMP"],"k":2,"figs":["img/17_digest_1.webp"]},{"id":"17-40","q":"How is TAG rebuilt from 2-monoacylglycerol?","o":["Adds two acyl-CoAs","Adds three acyl-CoAs","Adds one acyl-CoA"],"k":0,"figs":["img/17_digest_1.webp"]},{"id":"17-41","q":"What happens to lysophospholipid in the intestinal cell?","o":["Converted to cholesteryl ester","Packed unchanged into micelles","Re-esterified to phospholipid"],"k":2,"figs":["img/17_digest_1.webp"]},{"id":"17-42","q":"Which enzyme esterifies cholesterol in the intestinal cell?","o":["Acyl-CoA:cholesterol acyltransferase (ACAT)","Cholesterol esterase","Lecithin:cholesterol acyltransferase (LCAT)"],"k":0,"figs":["img/17_digest_1.webp"]},{"id":"17-43","q":"Into what particle is rebuilt TAG packaged, and with which main protein?","o":["Chylomicron; apolipoprotein A-I (apo A-I)","VLDL; apolipoprotein B-100 (apo B-100)","Chylomicron; apolipoprotein B-48 (apo B-48)"],"k":2,"figs":["img/17_digest_1.webp"]},{"id":"17-44","q":"Why do chylomicrons enter lymph rather than blood capillaries?","o":["Blood capillaries lack apo B-48 receptors","Too water-soluble to cross capillary walls","Too big for blood capillaries"],"k":2,"figs":["img/17_digest_1.webp"]},{"id":"17-45","q":"What route do chylomicrons take to reach the blood?","o":["Lacteals → portal vein → liver → bloodstream","Lacteals → lymphatics → right lymphatic duct → liver","Lacteals → lymphatics → thoracic duct → bloodstream"],"k":2},{"id":"17-46","q":"Which apolipoproteins does a nascent chylomicron pick up in blood to mature?","o":["Apo B-100 and apo A-I","Apo A-I and apo E","Apo C-II and apo E"],"k":2},{"id":"17-47","q":"Which enzyme releases chylomicron fatty acids to the tissues?","o":["Lipoprotein lipase","Hepatic lipase","Pancreatic lipase"],"k":0},{"id":"17-48","q":"Why does serum look milky after a fatty meal?","o":["Lipaemia (chylomicrons); clears within a few hours","Haemolysis (free haemoglobin); clears within a few hours","Jaundice (bilirubin); clears within a few hours"],"k":0}]},{"t":"Steatorrhoea","qs":[{"id":"17-49","q":"What happens to fat when bile is blocked (gallstones, biliary obstruction)?","o":["Emulsified normally → absorbed as chylomicrons → no change in stool","Poorly emulsified → absorbed straight into portal blood → fatty liver","Poorly emulsified → passes undigested → steatorrhoea"],"k":2,"hy":true},{"id":"17-50","q":"Which vitamins are lost when fat absorption is blocked, and why?","o":["B<sub>12<\/sub>, C, K — they are bound to bile salts","A, D, E, K — they ride along with dietary fat","B, C, folate — they ride along with dietary fat"],"k":1,"hy":true},{"id":"17-51","q":"What is steatorrhoea?","o":["Frothy, foul-smelling, floating stool with too much fat (normal &lt;6%)","Pale, hard, sinking stool with too little fat (normal &gt;6%)","Watery, odourless, sinking stool with too much fat (normal &lt;20%)"],"k":0},{"id":"17-52","q":"What causes maldigestion steatorrhoea, and what fat is in the stool?","o":["Too little bile (liver disease, blocked flow) or pancreatic insufficiency; triacylglycerol","Too little bile (liver disease, blocked flow) or pancreatic insufficiency; fatty acids","Bacterial/parasitic infection, Crohn&rsquo;s, coeliac disease; triacylglycerol"],"k":0},{"id":"17-53","q":"What causes malabsorption steatorrhoea, and what fat is in the stool?","o":["Bacterial/parasitic infection, Crohn&rsquo;s, coeliac disease; triacylglycerol","Too little bile (liver disease, blocked flow) or pancreatic insufficiency; fatty acids","Bacterial/parasitic infection, Crohn&rsquo;s, coeliac disease; fatty acids"],"k":2},{"id":"17-54","q":"In cholestasis, which fat-soluble vitamin is singled out as poorly absorbed?","o":["Vitamin K (with the other fat-soluble vitamins)","Vitamin C (with the other water-soluble vitamins)","Folate (with the other water-soluble vitamins)"],"k":0,"more":"<p>Cholestasis = bile flow blocked, e.g., by a gallstone.<\/p>","hy":true},{"id":"17-55","q":"In cholestasis, is octanoic acid (C8) still absorbed? Why?","o":["Yes — long-chain, absorbed by lingual lipase","Yes — medium-chain, doesn&rsquo;t need micelles","No — medium-chain, needs chylomicrons"],"k":1,"hy":true}]},{"t":"Bile and bile acids","qs":[{"id":"17-56","q":"Who secretes bile, and how much does the gallbladder concentrate it?","o":["Gallbladder epithelium; liver concentrates 10–20-fold","Hepatocytes; gallbladder concentrates 10–20-fold","Hepatocytes; gallbladder concentrates 2–3-fold"],"k":1},{"id":"17-57","q":"What are the main components of bile?","o":["Bile salts 85%<br>Free cholesterol 10%<br>Phospholipid 5% (mainly lecithin)","Bile salts 50%<br>Free cholesterol 40%<br>Phospholipid 10% (mainly sphingomyelin)","Free cholesterol 85%<br>Bile salts 10%<br>Phospholipid 5% (mainly lecithin)"],"k":0,"more":"<p>Textbooks name bile salts and lecithin as the two main organic components.<\/p>"},{"id":"17-58","q":"Besides cholesterol, what is excreted through bile?","o":["Bilirubin, steroids, many drugs","Glucose, amino acids, urea","Albumin, iron, vitamin B<sub>12<\/sub>"],"k":0},{"id":"17-59","q":"From what, and where, are bile acids made?","o":["From fatty acids, in the intestine","From bilirubin, in the liver","From cholesterol, in the liver"],"k":2},{"id":"17-60","q":"What are the primary bile acids?","o":["Deoxycholic acid<br>Lithocholic acid","Glycocholic acid<br>Taurocholic acid","Cholic acid<br>Chenodeoxycholic acid"],"k":2},{"id":"17-61","q":"What are bile acids conjugated with?","o":["Glutamine or cysteine","Glycine or taurine","Alanine or serine"],"k":1},{"id":"17-62","q":"Why are conjugated bile acids present as bile salts in the gut?","o":["pK<sub>a<\/sub> ≈ 6–7 → half-ionised, paired with Ca<sup>2+<\/sup>","pK<sub>a<\/sub> ≈ 2–4 → deprotonated, paired with Na<sup>+<\/sup>/K<sup>+<\/sup>","pK<sub>a<\/sub> ≈ 2–4 → protonated, paired with Cl<sup>−<\/sup>"],"k":1,"more":"<p>Bile salts are better detergents than the acids.<\/p>"},{"id":"17-63","q":"What are the secondary bile acids, and how are they made?","o":["Glycocholic and taurocholic acid; the liver conjugates them with amino acids","Deoxycholic and lithocholic acid; the liver adds a hydroxyl and conjugates them","Deoxycholic and lithocholic acid; gut bacteria deconjugate and remove a hydroxyl"],"k":2},{"id":"17-64","q":"What are the four jobs of bile salts?","o":["Excrete excess cholesterol<br>Keep cholesterol dissolved in bile (with phospholipid)<br>Emulsify dietary TAG<br>Absorb fat-soluble vitamins","Synthesise cholesterol<br>Keep cholesterol dissolved in bile (with phospholipid)<br>Hydrolyse dietary TAG<br>Absorb fat-soluble vitamins","Excrete excess cholesterol<br>Keep cholesterol dissolved in bile (with phospholipid)<br>Emulsify dietary TAG<br>Absorb water-soluble vitamins"],"k":0}]},{"t":"Enterohepatic circulation","qs":[{"id":"17-65","q":"What is the enterohepatic circulation?","o":["Bile salts reabsorbed in ileum → portal blood → liver → bile again","Bile salts reabsorbed in ileum → lacteals → chylomicrons → liver","Bile salts reabsorbed in colon → systemic blood → kidney → urine"],"k":0},{"id":"17-66","q":"What fraction of bile salts is reabsorbed, where, and how?","o":["95–98%; ileum; Na<sup>+<\/sup>-coupled cotransporter","50–60%; jejunum; passive diffusion","95–98%; duodenum; H<sup>+<\/sup>-coupled cotransporter"],"k":0},{"id":"17-67","q":"How many times a day does each bile salt molecule recycle?","o":["About 2","About 10","About 30"],"k":1},{"id":"17-68","q":"How much new bile acid does the liver make daily, and to replace what?","o":["30–50 g/day, replacing the 50% lost in stool","0.05 g/day, replacing the 2–5% lost in urine","3–5 g/day, replacing the 2–5% lost in stool"],"k":2,"more":"<p>Textbooks put daily synthesis nearer 0.5 g.<\/p>"},{"id":"17-69","q":"What is cholestyramine?","o":["Positively charged, unabsorbed resin that binds pancreatic lipase in the gut → inactivated","Positively charged, unabsorbed resin that binds bile acids in the gut → excreted","Negatively charged, absorbed resin that binds cholesterol in the blood → excreted"],"k":1},{"id":"17-70","q":"How does cholestyramine lower LDL?","o":["Less feedback inhibition → liver turns more cholesterol into bile acid → less hepatic cholesterol → more LDL receptors → serum LDL falls","Less feedback inhibition → liver turns more cholesterol into bile acid → less hepatic cholesterol → fewer LDL receptors → serum LDL falls","Less feedback inhibition → liver turns more bile acid into cholesterol → more hepatic cholesterol → more LDL receptors → serum LDL falls"],"k":0,"more":"<p>LDL = low-density lipoprotein. Used to treat high cholesterol.<\/p>"}]},{"t":"Gallstones","qs":[{"id":"17-71","q":"Why do cholesterol gallstones (cholelithiasis) form?","o":["More cholesterol enters bile than bile salts + phospholipid can keep dissolved","More phospholipid enters bile than bile salts + cholesterol can keep dissolved","More bile salts enter bile than cholesterol + phospholipid can keep dissolved"],"k":0},{"id":"17-72","q":"What causes too few bile acids, leading to gallstones?","o":["Severe jejunal disease (not reabsorbed)<br>Biliary obstruction (loop broken)<br>Chronic haemolysis (not made)<br>Excessive feedback inhibition of synthesis","Severe colonic disease (not reabsorbed)<br>Biliary obstruction (loop broken)<br>Severe kidney disease (not made)<br>Reduced feedback inhibition of synthesis","Severe ileal disease (not reabsorbed)<br>Biliary obstruction (loop broken)<br>Severe liver disease (not made)<br>Excessive feedback inhibition of synthesis"],"k":2},{"id":"17-73","q":"What causes too much biliary cholesterol, leading to gallstones?","o":["Obesity, acute high calorie/fat intake<br>Androgens, steroids, menopause<br>Hypothyroidism<br>Bile acid resins (cholestyramine)","Obesity, acute high calorie/fat intake<br>Oral contraceptives, steroids, pregnancy<br>Diabetes mellitus<br>Fibrates (gemfibrozil)","Weight loss, low calorie/fat intake<br>Oral contraceptives, steroids, pregnancy<br>Diabetes mellitus<br>Statins (atorvastatin)"],"k":1},{"id":"17-74","q":"What are most gallstones made of?","o":["Calcium oxalate (about 10% are pigment stones)","Bilirubin pigment (about 10% are cholesterol stones)","Cholesterol (about 10% are pigment stones)"],"k":2},{"id":"17-75","q":"What are pigment gallstones, and what is their main risk factor?","o":["Bile salts + some cholesterol and phospholipid; obesity","Bile pigment + some cholesterol and calcium salts; oral contraceptives","Bile pigment + some cholesterol and calcium salts; chronic haemolysis"],"k":2},{"id":"17-76","q":"Which imaging finds gallstones best?","o":["Chest X-ray","Ultrasound","Barium swallow"],"k":1},{"id":"17-77","q":"What are the &ldquo;5 F&rsquo;s&rdquo; of the classic gallstone patient?","o":["Fat, fifty, fertile, female, febrile","Fat, forty, fertile, female, flatulent","Fat, forty, fasting, female, flatulent"],"k":1},{"id":"17-78","q":"What are the symptoms of gallstones?","o":["Steady upper abdominal pain → down the medial left arm; sweating, breathlessness","Colicky lower abdominal pain → into the groin or left shoulder; diarrhoea","Steady upper abdominal pain → between shoulder blades or under right shoulder; nausea, vomiting"],"k":2},{"id":"17-79","q":"Why are women affected by gallstones more often?","o":["Oestrogen raises biliary cholesterol; progesterone causes bile stasis","Oestrogen lowers bile salt synthesis; progesterone raises bilirubin","Progesterone raises biliary cholesterol; oestrogen causes bile stasis"],"k":0},{"id":"17-80","q":"What is the treatment for gallstones, and what is its consequence?","o":["Cholecystectomy; bile no longer released with meals → fatty food tolerated less well","Ursodeoxycholic acid; stones recur after stopping → lifelong treatment","Cholecystectomy; bile no longer made by the liver → fat-soluble vitamin deficiency"],"k":0},{"id":"17-81","q":"Which oral drugs can dissolve gallstones, and what is the side effect?","o":["Chenodeoxycholic or ursodeoxycholic acid (mostly-pigment stones); jaundice","Chenodeoxycholic or ursodeoxycholic acid (mostly-cholesterol stones); diarrhoea","Cholestyramine or colestipol (mostly-cholesterol stones); diarrhoea"],"k":1}]}]},{"n":18,"key":"bio","t":"Making fat: the fed state","sub":"Lecture 25","cp2":false,"secs":[{"t":"Fat synthesis: the setting","qs":[{"id":"18-0","q":"In what metabolic state, and under which hormone, does fatty acid synthesis run?","o":["Fasting state; high glucagon","Fed state; high insulin","Fed state; high glucagon"],"k":1,"more":"<p>After a meal there is more fuel than needed, so the surplus is stored. Knowing it is a fed, high-insulin process predicts most of its regulation.<\/p>"},{"id":"18-1","q":"In which cell compartment are fatty acids synthesised?","o":["Cytosol","Peroxisome","Mitochondrial matrix"],"k":0},{"id":"18-2","q":"In which tissues does fatty acid synthesis mainly occur?","o":["Adipose tissue and red cells (less in liver)","Liver and lactating mammary gland (less in adipose tissue)","Skeletal muscle and heart (less in liver)"],"k":1},{"id":"18-3","q":"What two-carbon unit are fatty acids built from?","o":["Acetyl-CoA","Malonyl-CoA","Succinyl-CoA"],"k":0},{"id":"18-4","q":"Why do natural fatty acids have an even number of carbons?","o":["Every fatty acid starts from a three-carbon propionyl primer","Odd-carbon chains are rapidly converted to ketone bodies","The chain is assembled two carbons at a time"],"k":2},{"id":"18-5","q":"From what fuel, and from what precursor, is the acetyl-CoA for fat synthesis made?","o":["Protein; from ketogenic amino acids in the cytosol","Fat; from β-oxidation inside the mitochondrion","Carbohydrate; from pyruvate inside the mitochondrion"],"k":2}]},{"t":"Getting acetyl-CoA out: citrate","qs":[{"id":"18-6","q":"Why must acetyl-CoA leave the mitochondrion as citrate for fat synthesis?","o":["Acetyl-CoA is unstable in the cytosol and must be carried as citrate to the ER","Acetyl-CoA cannot cross the outer mitochondrial membrane; fat is built in the matrix","Acetyl-CoA cannot cross the inner mitochondrial membrane; fat is built in the cytosol"],"k":2,"figs":["img/18_synth_1.webp"]},{"id":"18-7","q":"How is acetyl-CoA moved from the mitochondrion to the cytosol for fat synthesis?","o":["Citrate lyase (citrate → acetyl-CoA + OAA) → acetyl-CoA exported → ATP-citrate synthase rejoins it to citrate","Citrate synthase (acetyl-CoA + OAA → citrate) → citrate exported → ATP-citrate lyase splits it back to acetyl-CoA + OAA","Citrate synthase (acetyl-CoA + OAA → citrate) → citrate exported → aconitase splits it back to acetyl-CoA + OAA"],"k":1,"more":"<p>Oxaloacetate = OAA. The cytosolic split by ATP-citrate lyase spends an ATP.<\/p>","figs":["img/18_synth_1.webp"]},{"id":"18-8","q":"Which cytosolic enzyme splits exported citrate back into acetyl-CoA and oxaloacetate, and what does it spend?","o":["ATP-citrate lyase; one ATP","ATP-citrate lyase; one GTP","Citrate synthase; one ATP"],"k":0},{"id":"18-9","q":"Why does citrate leave the mitochondrion only when the cell is well fuelled?","o":["High ATP and NADH activate isocitrate dehydrogenase → cycle speeds up → excess citrate leaks out","Low ATP and NADH inhibit citrate synthase → citric acid cycle stalls → citrate spills into the cytosol","High ATP and NADH inhibit isocitrate dehydrogenase → citric acid cycle backs up → citrate accumulates and spills into the cytosol"],"k":2,"figs":["img/18_synth_1.webp"]},{"id":"18-10","q":"How does insulin feed the citrate route to fat synthesis \"from the top\"?","o":["Activates PFK-2 → fructose 2,6-bisphosphate → speeds glycolysis at PFK-1","Activates PFK-1 directly by phosphorylation → speeds glycolysis at hexokinase","Activates pyruvate carboxylase → more oxaloacetate → more citrate"],"k":0,"more":"<p>PFK = phosphofructokinase. More glycolysis → more pyruvate → more acetyl-CoA and citrate.<\/p>"},{"id":"18-11","q":"Besides fatty acids, what can acetyl-CoA become?","o":["Citric acid cycle fuel<br>Glucose (→ glycogen, ribose, lactose)<br>Cholesterol (when glucagon is high)","Citric acid cycle fuel<br>Cholesterol (→ bile acids, vitamin D, steroid hormones)<br>Ketone bodies (when insulin is low)","Glycine<br>Cholesterol (→ bile acids, vitamin D, steroid hormones)<br>Ketone bodies (when insulin is high)"],"k":1}]},{"t":"Acetyl-CoA carboxylase: the committed step","qs":[{"id":"18-12","q":"What is the rate-limiting (first committed) step of fatty acid synthesis?","o":["Malonyl-CoA → palmitate, by fatty acid synthase","Acetyl-CoA → malonyl-CoA, by malonyl transacylase","Acetyl-CoA → malonyl-CoA, by acetyl-CoA carboxylase (ACC)"],"k":2,"figs":["img/18_synth_2.webp"],"hy":true},{"id":"18-13","q":"What prosthetic group does acetyl-CoA carboxylase use, and what does it add?","o":["Biotin; removes CO<sub>2<\/sub>","Thiamine pyrophosphate; adds CO<sub>2<\/sub>","Biotin; adds CO<sub>2<\/sub>"],"k":2,"figs":["img/18_synth_2.webp"]},{"id":"18-14","q":"What are the two steps of the acetyl-CoA carboxylase reaction, and what energy does it spend?","o":["CO<sub>2<\/sub> attached to biotin → handed on to acetyl-CoA; spends 1 ATP","CO<sub>2<\/sub> attached to acetyl-CoA → handed on to biotin; spends 1 GTP","CO<sub>2<\/sub> attached to biotin → handed on to acetyl-CoA; spends 2 ATP"],"k":0,"figs":["img/18_synth_2.webp"]},{"id":"18-15","q":"Name the two other biotin-dependent carboxylases worth remembering.","o":["PEP carboxykinase<br>α-Ketoglutarate dehydrogenase","Pyruvate carboxylase<br>Propionyl-CoA carboxylase","Pyruvate carboxylase<br>Methylmalonyl-CoA mutase"],"k":1,"more":"<p>Biotin is a water-soluble vitamin that carries CO<sub>2<\/sub> for carboxylases.<\/p>"},{"id":"18-16","q":"What two jobs make malonyl-CoA the hinge of fat metabolism?","o":["Building block for fat synthesis<br>Activates the enzyme that lets fat be burned","Building block for ketone bodies<br>Blocks the enzyme that lets fat be stored","Building block for fat synthesis<br>Blocks the enzyme that lets fat be burned"],"k":2,"more":"<p>One molecule says \"store, do not burn\" — exactly what you want after a meal.<\/p>"}]},{"t":"Regulating acetyl-CoA carboxylase","qs":[{"id":"18-17","q":"Which hormone activates acetyl-CoA carboxylase, and why does that make sense?","o":["Adrenaline; fuel is needed, so mobilise it","Glucagon; fuel is plentiful, so store it","Insulin; fuel is plentiful, so store it"],"k":2,"figs":["img/18_synth_2.webp"],"hy":true},{"id":"18-18","q":"Which hormones inhibit acetyl-CoA carboxylase?","o":["Insulin and glucagon (fuel scarce → stop storing)","Glucagon and adrenaline (fuel scarce → stop storing)","Insulin and adrenaline (fuel plentiful → stop storing)"],"k":1,"figs":["img/18_synth_2.webp"],"hy":true},{"id":"18-19","q":"Which metabolite allosterically activates acetyl-CoA carboxylase?","o":["Malonyl-CoA (accumulates when energy is plentiful)","Citrate (accumulates when energy is plentiful)","AMP (accumulates when energy is plentiful)"],"k":1,"figs":["img/18_synth_2.webp"],"hy":true},{"id":"18-20","q":"Which end product inhibits acetyl-CoA carboxylase by feedback?","o":["Malonyl-CoA","Palmitoyl-CoA","Acetyl-CoA"],"k":1,"figs":["img/18_synth_2.webp"],"hy":true},{"id":"18-21","q":"Besides hormones and palmitoyl-CoA, what else inhibits acetyl-CoA carboxylase?","o":["High NADPH (high energy)<br>Polyunsaturated fatty acids (PUFA)","High AMP (low energy)<br>Polyunsaturated fatty acids (PUFA)","High ATP (high energy)<br>Saturated fatty acids"],"k":1,"figs":["img/18_synth_2.webp"],"hy":true},{"id":"18-22","q":"A question set a couple of hours after a big sugary meal is testing which enzyme and activator?","o":["Hormone-sensitive lipase, activated by cAMP (and adrenaline)","Acetyl-CoA carboxylase, activated by citrate (and insulin)","Acetyl-CoA carboxylase, activated by palmitoyl-CoA (and glucagon)"],"k":1,"more":"<p>Glucagon, adrenaline, AMP acting through AMPK, palmitoyl-CoA and PUFA all switch it off.<\/p>","hy":true},{"id":"18-23","q":"What is the structure of inactive acetyl-CoA carboxylase?","o":["Small four-subunit protomer","Small two-subunit heterodimer","Long polymeric filament"],"k":0},{"id":"18-24","q":"How does citrate activate acetyl-CoA carboxylase structurally?","o":["Phosphorylates protomers into active dimers","Depolymerises filaments into active protomers","Polymerises protomers into active filaments"],"k":2},{"id":"18-25","q":"How does palmitoyl-CoA inhibit acetyl-CoA carboxylase structurally?","o":["Promotes depolymerisation of the filaments","Promotes polymerisation of the protomers","Locks protomers into inactive filaments"],"k":0},{"id":"18-26","q":"Which kinase phosphorylates and inactivates acetyl-CoA carboxylase?","o":["Protein kinase A (PKA)","Insulin receptor tyrosine kinase","AMP-activated protein kinase (AMPK)"],"k":2,"more":"<p>Phosphorylation depolymerises the enzyme. AMPK is switched on by high AMP and, through its own upstream kinases, by glucagon and adrenaline.<\/p>"},{"id":"18-27","q":"How does insulin reactivate phosphorylated acetyl-CoA carboxylase?","o":["Lowers cAMP and activates a protein phosphatase → dephosphorylation","Raises cAMP and activates protein kinase A → dephosphorylation","Raises citrate and inhibits protein phosphatase → polymerisation"],"k":0},{"id":"18-28","q":"Besides dephosphorylating rate-limiting enzymes, what does insulin induce or raise (and via which signalling)?","o":["Represses glucokinase; raises GLUT4 in liver — via PI3-kinase and protein kinase C","Induces glucokinase; raises GLUT4 in muscle and fat — via PI3-kinase and protein kinase B","Induces hexokinase; raises GLUT2 in muscle and fat — via adenylyl cyclase and protein kinase A"],"k":1},{"id":"18-29","q":"Which diets increase vs decrease the amount of acetyl-CoA carboxylase over days?","o":["↑ High-calorie, high-carbohydrate, low-fat diet<br>↓ Fasting or high-fat diet","↑ Fasting or high-fat diet<br>↓ High-calorie, high-carbohydrate, low-fat diet","↑ High-fat, low-carbohydrate diet<br>↓ High-carbohydrate diet"],"k":0},{"id":"18-30","q":"What induces and what represses fatty acid synthase?","o":["Induced: insulin, feeding<br>Repressed: PUFA, fasting","Induced: PUFA, fasting<br>Repressed: insulin, feeding","Induced: insulin, PUFA<br>Repressed: feeding, glucose"],"k":0},{"id":"18-31","q":"What induces ATP-citrate lyase?","o":["Cortisol and glucagon","Glucose and insulin","Fasting and glucagon"],"k":1}]},{"t":"Fatty acid synthase","qs":[{"id":"18-32","q":"What is the product of fatty acid synthase?","o":["Palmitate (16:0)","Myristate (14:0)","Stearate (18:0)"],"k":0},{"id":"18-33","q":"What reducing power does fatty acid synthase use?","o":["NADP<sup>+<\/sup>","FADH<sub>2<\/sub>","NADPH"],"k":2},{"id":"18-34","q":"What is the quaternary structure of fatty acid synthase?","o":["Dimer of identical chains lying head to tail","Tetramer of different subunits arranged head to head","Dimer of identical chains lying head to head"],"k":0},{"id":"18-35","q":"How many enzyme activities does each fatty acid synthase chain carry, plus what carrier?","o":["Seven activities + an acyl carrier protein (ACP)","Five activities + an acyl carrier protein (ACP)","Six activities + biotin carboxyl carrier protein"],"k":0},{"id":"18-36","q":"Name the seven enzyme activities of fatty acid synthase.","o":["Acetyl transacylase<br>Malonyl transacylase<br>3-Ketoacyl synthase<br>3-Ketoacyl reductase<br>Dehydratase<br>Enoyl reductase<br>Acetyl-CoA carboxylase","Acetyl transacylase<br>Malonyl transacylase<br>3-Ketoacyl synthase<br>3-Ketoacyl reductase<br>Isomerase<br>Δ9 desaturase<br>Thioesterase","Acetyl transacylase<br
